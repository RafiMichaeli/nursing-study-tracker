<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבחן תרגול 1 - סיעוד המבוגר חלק ב</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:#182234; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --teal:#2dd4bf; --teal-d:#0d9488;
  --coral:#fb7185; --amber:#fbbf24; --ok:#34d399;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Rubik,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65;
     -webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:16px}

header{background:linear-gradient(180deg,#132033,#0f172a);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:.9rem}
.tagline{font-family:var(--mono);color:var(--teal);font-size:.78rem;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:6px}

.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-family:var(--mono);font-size:.8rem;color:var(--dim);min-width:92px}
.cell b{display:block;color:var(--txt);font-size:1.15rem;line-height:1.25;letter-spacing:-.02em}
.cell.ok b{color:var(--ok)} .cell.bad b{color:var(--coral)} .cell.t b{color:var(--teal)}

.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal));
  width:0;transition:width .3s ease}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
select,button{font-family:inherit;font-size:.88rem;background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--teal-d)}
button.primary{background:var(--teal-d);border-color:var(--teal-d);color:#04201c;font-weight:700}
button.primary:hover{background:var(--teal)}
.grow{flex:1}

.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;
   padding:18px 20px;margin-bottom:14px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--mono);color:var(--teal);font-size:.82rem;font-weight:700}
.chip{font-size:.72rem;background:#0b3b38;color:var(--teal);border:1px solid #115e59;
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.qtext{font-size:1.02rem;margin:0 0 14px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#141d2e;border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-d);background:#16233a}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;min-width:1.4em}
.opt.sel{border-color:var(--teal);background:#122c2b}
.opt.right{border-color:var(--ok);background:#0d2a20}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--coral);background:#2c1420}
.opt.wrong .k{color:var(--coral)}
.opt.lock{cursor:default}
.exp{margin-top:12px;border-inline-start:3px solid var(--teal-d);background:#101a2b;
  border-radius:0 10px 10px 0;padding:11px 14px;font-size:.92rem;color:#cbd5e1;display:none}
.exp.show{display:block}
.exp b{color:var(--teal);font-family:var(--mono);font-size:.78rem;display:block;margin-bottom:4px;
  letter-spacing:.05em;text-transform:uppercase}
.verdict{font-family:var(--mono);font-size:.8rem;margin-top:10px;display:none}
.verdict.show{display:block}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--coral)}

.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  margin-bottom:16px;display:none}
.sumbox.show{display:block}
.sumbox h2{margin:0 0 12px;font-size:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:.8rem;font-family:var(--mono)}
td.n{font-family:var(--mono)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-family:var(--mono);font-size:.8rem}
.pill.g{background:#0d2a20;color:var(--ok)} .pill.a{background:#2e2410;color:var(--amber)}
.pill.r{background:#2c1420;color:var(--coral)}
.score{font-family:var(--mono);font-size:2.4rem;line-height:1;letter-spacing:-.03em}

footer{color:var(--dim);font-size:.8rem;text-align:center;padding:22px 0 34px}
@media(max-width:520px){.wrap{padding:12px}.cell{min-width:74px}h1{font-size:1.15rem}}
@media print{body{background:#fff;color:#000}.toolbar,.bar{display:none}
  .q,.sumbox,header{border-color:#bbb;background:#fff;color:#000}
  .exp{display:block!important;background:#f5f5f5;color:#000}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="tagline">סיעוד המבוגר · חלק ב' · מבחן תרגול</div>
  <h1>מבחן תרגול 1 — תרחישים קליניים</h1>
  <div class="sub">80 שאלות בסגנון בחינה: רובן תרחישים קליניים קצרים — מה העדיפות הסיעודית, מה הממצא המדאיג.</div>
  <div class="readout">
    <div class="cell t">שאלה<b id="rPos">0/80</b></div>
    <div class="cell ok">נכונות<b id="rOk">0</b></div>
    <div class="cell bad">שגויות<b id="rBad">0</b></div>
    <div class="cell">ציון<b id="rPct">—</b></div>
  </div>
  <div class="bar"><i id="rBar"></i></div>
</header>

<div class="toolbar">
  <select id="filter"><option value="">כל הנושאים (80 שאלות)</option></select>
  <span class="grow"></span>
  <button id="btnSum" class="primary">סיכום וציון</button>
  <button id="btnReveal">הצג את כל התשובות</button>
  <button id="btnReset">איפוס</button>
</div>

<div class="sumbox" id="sumbox"></div>
<div id="quiz"></div>

<footer>נבנה מהסילבוס ומהמצגות של הקורס · ברונר וסודארת' מהדורה 15 · 80 שאלות</footer>
</div>

<script>
const DATA = [{"t":"נוירולוגיה","q":"בן 68 הגיע למלר\"ד. בן משפחה מדווח שלפני 90 דקות פתאום 'נפלה לו הפנים' והיד הימנית נחלשה. ל\"ד 168/92, סוכר 112. CT מוח ללא ממצא דימומי. מה הפעולה הבאה בעדיפות הגבוהה ביותר?","o":["הערכת התאמה למתן tPA והפעלת צוות השבץ","מתן אספירין 300 מ\"ג פומי מיידית","מתן נוזלים IV להעלאת פרפוזיה מוחית","הורדה מהירה של ל\"ד מתחת ל-140/90"],"a":0,"e":"חלון הזמן ל-tPA הוא עד 4.5 שעות מתחילת התסמינים, ו-CT ללא דימום הוא התנאי המרכזי. מתן אספירין לפני החלטה על tPA מהווה התווית נגד יחסית, ואין להוריד ל\"ד אגרסיבית בשבץ איסכמי (היעד לפני tPA הוא מתחת ל-185/110)."},{"t":"נוירולוגיה","q":"מטופלת לאחר שבץ איסכמי בהמיספרה שמאלית, ערנית ומשתפת פעולה. בת המשפחה מבקשת להשקות אותה מים כי היא מתלוננת על יובש בפה. מה תגובת האחות?","o":["לאפשר שתייה איטית בקשית בישיבה זקופה","לתת קרח מרוסק בלבד ללא הגבלה","להסביר שיש להשאיר בצום עד לביצוע אומדן בליעה","להתחיל הזנה דרך זונדה באופן מיידי"],"a":2,"e":"דיספגיה שכיחה מאוד לאחר שבץ ומהווה גורם סיכון מרכזי לדלקת ריאות שאיפה. לפי חוזר מנהל הסיעוד 193/2022, יש לבצע אומדן בליעה ראשוני לפני התחלת הזנה או שתייה. שימוש בקשית דווקא מגביר סיכון לשאיפה."},{"t":"נוירולוגיה","q":"בת 47 מגיעה עם כאב ראש שמתארת כ'החזק ביותר בחיי' שהופיע פתאום תוך שניות, בחילה, הקאות ונוקשות עורף. מה האבחנה הסבירה ביותר?","o":["דימום תת-עכבישי ממפרצת (SAH)","דלקת קרום המוח וירלית","מיגרנה עם אאורה","כאב ראש מקבצי (Cluster)"],"a":0,"e":"כאב ראש רעמי (thunderclap) בשיא עוצמתו תוך שניות, עם גירוי מנינגיאלי, אופייני ל-SAH. הגורם השכיח הוא קרע במפרצת בהסתעפויות מעגל וויליס. מיגרנה מתפתחת בהדרגה, ובמנינגיטיס יש בדרך כלל חום וכאב ראש שמתפתח על פני שעות."},{"t":"נוירולוגיה","q":"מטופל ביום ה-7 לאשפוזו לאחר דימום תת-עכבישי. עד כה היה יציב, וכעת האחות מבחינה בבלבול חדש וחולשה בגפה שמאל. מה הסיבוך הסביר ביותר?","o":["דימום חוזר מיידי מהמפרצת","עווית כלי דם מוחית (Vasospasm)","היפונתרמיה מ-SIADH בלבד","התקף אפילפטי מוקדי"],"a":1,"e":"עווית כלי דם מוחית מתרחשת אופיינית בין היום ה-4 ל-14 לאחר SAH, וגורמת לאיסכמיה משנית עם גירעון נוירולוגי חדש. שינוי ברמת ההכרה הוא הסימן המוקדם ביותר להידרדרות ומחייב דיווח מיידי."},{"t":"נוירולוגיה","q":"בן 74 עם פרפור פרוזדורים עבר TIA שחלף תוך 40 דקות. הוא שואל למה הוא צריך טיפול אם 'הכל עבר'. מה ההסבר הנכון?","o":["TIA אינו מצריך טיפול, רק מעקב שנתי","הטיפול נדרש רק אם יופיע TIA נוסף","TIA מהווה סימן אזהרה לשבץ, בעיקר ב-90 הימים הראשונים","הסיכון לשבץ אחרי TIA זהה לאוכלוסייה הכללית"],"a":2,"e":"TIA הוא גירעון נוירולוגי שנפתר תוך 24 שעות ללא מוות של רקמת עצב, אך מהווה מנבא חזק לשבץ, במיוחד בתוך 90 הימים הראשונים. בפרפור פרוזדורים הטיפול המונע הוא נוגד קרישה (DOAC או קומדין), ולא נוגד טסיות בלבד."},{"t":"נוירולוגיה","q":"מטופל מפרכס במחלקה בפרכוס טוני-קלוני כללי. מה הפעולה הסיעודית הנכונה?","o":["להחדיר מרית מרופדת בין השיניים למניעת נשיכת לשון","להפנות את המטופל על צידו ולהרחיק חפצים מסוכנים","לקבע את הגפיים כדי למנוע פציעה","להרים את המטופל למיטה ולקשור חגורות בטיחות"],"a":1,"e":"אין להחדיר דבר לפה ואין לרסן את התנועות - שתי הפעולות גורמות לפציעה. הטיפול הוא הגנתי: הנחה על הרצפה אם אפשר, הפניה על הצד להגנה על נתיב האוויר, ריפוד הראש, הרחקת חפצים, ותיעוד משך ואופי הפרכוס."},{"t":"נוירולוגיה","q":"מטופלת מפרכסת ברציפות מעל 5 דקות ללא חזרה להכרה בין הפרכוסים. מה נכון?","o":["מדובר במצב חירום רפואי; ניתן דיאזפאם או לוראזפאם IV באיטיות","יש להמתין 20 דקות נוספות לפני התערבות תרופתית","הטיפול הראשוני הוא העמסת פניטואין פומי","מדובר בתופעה שכיחה ולא מסוכנת בחולי אפילפסיה"],"a":0,"e":"Status epilepticus מוגדר כפרכוס ממושך או פרכוסים חוזרים ללא התאוששות ביניהם, והוא מצב חירום רפואי. המטרות: הפסקת הפרכוס מהר ככל האפשר, הבטחת נתיב אוויר וחמצון מספק. הטיפול הראשון הוא בנזודיאזפינים IV באיטיות, עם ניטור נשימתי ולבבי רציף."},{"t":"נוירולוגיה","q":"בן 21, סטודנט המתגורר במעונות, מגיע עם חום 39.4, כאב ראש עז, פוטופוביה ונוקשות עורף. בבדיקה: כיפוף הצוואר גורם לכיפוף אוטומטי של הברכיים. איזה סימן זה, ומה אמצעי הזהירות הנדרש?","o":["סימן קרניג; בידוד מגע","סימן בבינסקי; בידוד נשימתי (אוויר)","סימן ברודזינסקי; בידוד טיפתי","סימן לרמיט; ללא צורך בבידוד"],"a":2,"e":"סימן ברודזינסקי הוא כיפוף לא רצוני של הירכיים והברכיים בעת כיפוף הצוואר; סימן קרניג הוא חוסר יכולת ליישר את הברך כשהירך מכופפת. בחשד למנינגיטיס חיידקית (מנינגוקוקלית) נדרש בידוד טיפתי עד 24 שעות של טיפול אנטיביוטי יעיל."},{"t":"נוירולוגיה","q":"מטופל עם חשד לאנצפליטיס הרפטית: חום, בלבול, הזיות ריח והתקף מוקדי. PCR ל-CSF נשלח. מה נכון לגבי הטיפול?","o":["להמתין לתשובת ה-PCR לפני התחלת טיפול","הטיפול הוא תומך בלבד; אין טיפול אנטי-ויראלי","לתת אנטיביוטיקה רחבת טווח בלבד","להתחיל acyclovir IV מיד עם עליית החשד"],"a":3,"e":"אנצפליטיס הרפטית פוגעת בעיקר באונות הקדמיות והטמפורליות וגורמת לנמק. Acyclovir IV הוא הטיפול המומלץ ויש להתחילו ברגע שנשקלת האבחנה, מבלי להמתין ל-PCR, למשך 14-21 יום. עיכוב בטיפול מעלה תמותה ונכות משמעותית."},{"t":"נוירולוגיה","q":"מטופלת עם טרשת נפוצה מספרת שהעייפות שלה מחמירה מאוד בימי הקיץ ואחרי מקלחת חמה. מה ההדרכה הנכונה?","o":["חשיפה לחום משפרת הולכה עצבית ומומלצת","להפסיק כל פעילות גופנית לחלוטין","להימנע מחום ולחות, ולתזמן פעילות לפני שיא העייפות","להגביר את מינון הסטרואידים בימים חמים"],"a":2,"e":"עייפות היא התסמין השכיח והמשבית ביותר ב-MS ומופיעה בכ-90% מהחולים; חום ולחות מחמירים אותה (תופעת Uhthoff). ההדרכה: הימנעות מחום, מנוחות קצרות ותכופות, ותזמון פעילות ממש לפני העייפות. פעילות מתונה כמו שחייה או אופניים נייחים מומלצת - מאמץ מפרך אינו מומלץ."},{"t":"נוירולוגיה","q":"בת 34 מתלוננת על צניחת עפעפיים וראייה כפולה שמחמירות לקראת סוף היום ומשתפרות לאחר מנוחה. מה הממצא הצפוי בבדיקה?","o":["שיפור של לפחות 2 מ\"מ בפטוזיס לאחר הנחת קרח על העפעף","החמרה בפטוזיס לאחר מנוחה ממושכת","היעדר רפלקסים גידיים עמוקים בגפיים התחתונות","סימן לרמיט חיובי בכיפוף הצוואר"],"a":0,"e":"מיאסטניה גרביס נגרמת מנוגדנים לקולטני אצטילכולין בצומת הנוירו-שרירית: חולשה שמחמירה במאמץ חוזר ומשתפרת במנוחה. בדיקת הקרח (שיפור ≥2 מ\"מ בפטוזיס) ובדיקת טנסילון מסייעות באבחון. הסיכון המסכן חיים הוא חולשה נשימתית ובולברית."},{"t":"נוירולוגיה","q":"מטופל עם תסמונת גיאן-ברה שהחלה כחולשה והיפורפלקסיה בגפיים תחתונות ומתקדמת כלפי מעלה. מה הניטור החשוב ביותר?","o":["מדידת היקף שוק לזיהוי DVT בלבד","בדיקת רמות אשלגן פעמיים ביום","מדידת קיבולת חיונית ותפקוד נשימתי בצורה תכופה","ניטור לחץ תוך גולגולתי"],"a":2,"e":"ב-GBS הדמיאלינציה עולה מהפריפריה כלפי מעלה ועלולה להגיע לשרירי הנשימה. ירידה בקיבולת החיונית היא הסימן המקדים לאי ספיקה נשימתית והמצב מהווה חירום רפואי שעשוי לחייב הנשמה. בניקור מותני: חלבון מוגבר עם ספירת תאים לבנים תקינה."},{"t":"נוירולוגיה","q":"מטופלת עם התקף מיגרנה חריף. מלבד הטיפול התרופתי, איזו התערבות סיעודית מתאימה?","o":["סביבה מוארת וגירוי חושי להסחת דעת","הליכה נמרצת במסדרון להסחת דעת","סביבה שקטה וחשוכה, קומפרסים קרים לאזור הכואב","שילוב מיידי של טריפטן יחד עם תכשיר ארגוטמין"],"a":2,"e":"מנוחה בסביבה שקטה וחשוכה מקלה על פוטופוביה ופונופוביה, יחד עם קומפרסים קרים והרמת הראש. אין לשלב טריפטנים ותכשירי ארגוט - שניהם מכווצי כלי דם והשילוב מסוכן. הדרכה חשובה: יומן כאבי ראש לזיהוי טריגרים, כולל מזונות המכילים טירמין."},{"t":"נוירולוגיה","q":"אחות מעריכה מטופל לאחר חבלת ראש. הוא פוקח עיניים לגירוי כאב (2), משמיע מילים ללא הקשר (3), ומושך את הגפה כתגובה לכאב (4). מה ציון ה-GCS ומה משמעותו?","o":["6 - פצוע ראש קשה","9 - פצוע ראש בינוני","12 - פצוע ראש קל","15 - הכרה מלאה"],"a":1,"e":"GCS = 2+3+4 = 9. ציון 8-12 מוגדר כפגיעת ראש בינונית (13-15 קלה, מתחת ל-8 קשה, עם שקילת הגנה על נתיב האוויר). שינוי ברמת ההכרה הוא המדד הרגיש ביותר לתפקוד נוירולוגי והסימן המוקדם ביותר להידרדרות."},{"t":"נוירולוגיה","q":"מטופל עם מורסה מוחית מקבל קורטיקוסטרואידים להפחתת בצקת. מה הניטור המעבדתי הנדרש?","o":["רמות גלוקוז ואשלגן בדם","רמות סידן וזרחן","תפקודי קרישה בלבד","רמות מגנזיום ואלבומין"],"a":0,"e":"קורטיקוסטרואידים מעלים גלוקוז בדם ומורידים אשלגן, ולכן נדרש מעקב צמוד אחריהם. בנוסף נדרשת הערכה נוירולוגית מתמשכת, מניעת פציעות ממצב מנטלי לקוי או פרכוסים, וטיפול אנטיביוטי ממושך (4-8 שבועות לפחות)."},{"t":"נוירולוגיה","q":"לאחר פרוצדורה נוירוכירורגית במטופל עם חשד למחלת קרויצפלד-יעקב (CJD), מה נכון לגבי טיפול בציוד?","o":["סטריליזציה סטנדרטית באוטוקלייב רגיל מספיקה","די בניגוב באלכוהול 70%","נדרשות פרוצדורות מיוחדות לדנטורציה של חלבון; שיטות סטנדרטיות אינן יעילות","הציוד נחשב נקי כי המחלה אינה מדבקת כלל"],"a":2,"e":"CJD נגרמת מפריונים - חלבונים בעלי קיפול חריג. שיטות סטריליזציה סטנדרטיות אינן יעילות לטיהור פריונים, ולכן נדרשות פרוצדורות המכוונות לדנטורציה של חלבון. הרקמות בסיכון הגבוה ביותר הן מוח, חוט שדרה, יותרת המוח ורקמת עין. הטיפול במחלה עצמה תומך ופליאטיבי בלבד."},{"t":"אורולוגיה","q":"בת 24 עם צריבה במתן שתן, תכיפות ודחיפות, ללא חום וללא כאב מותני. מה ההדרכה המתאימה למניעת הישנות?","o":["הימנעות מוחלטת משתייה בערב","אמבטיות ארוכות מדי יום","שטיפות אינטימיות יומיות עם סבון מחטא","שתייה מרובה, מתן שתן לאחר יחסי מין, וניגוב מקדימה לאחור"],"a":3,"e":"ציסטיטיס לא מסובכת שכיחה בנשים (60%) בשל שופכה קצרה. ההדרכה: הידרציה מספקת, מתן שתן לאחר יחסי מין, ניגוב מקדימה לאחור, מקלחת ולא אמבטיה, והימנעות משטיפות אינטימיות שפוגעות בפלורה התקינה. היעדר חום וכאב מותני מבדיל מפיאלונפריטיס."},{"t":"אורולוגיה","q":"בת 62 מגיעה עם חום 39, צמרמורות, כאב במותן ימין ורגישות בהקשה על אזור הכליה. מה סדר הפעולות הנכון?","o":["מתן אנטיביוטיקה ואז לקיחת תרביות אם לא יהיה שיפור","מתן משתנים להגברת פינוי החיידקים","לקיחת תרבית שתן ותרביות דם, ולאחר מכן התחלת אנטיביוטיקה","הפניה מיידית לניתוח"],"a":2,"e":"בפיאלונפריטיס חריפה יש לקחת תרבית שתן ותרביות דם לפני התחלת האנטיביוטיקה, כדי לאפשר זיהוי המחולל והתאמת הטיפול. בנוסף: הידרציה, משככי כאב ומורידי חום, ומעקב אחר תפקודי כליות. הימנעות מתרופות נפרוטוקסיות."},{"t":"אורולוגיה","q":"מטופל מאושפז עם קטטר קבוע ביום ה-6. מה ההתערבות היעילה ביותר למניעת CAUTI?","o":["החלפת הקטטר כל 48 שעות באופן שגרתי","הערכה יומית של הצורך בקטטר והוצאתו בהקדם האפשרי","מתן אנטיביוטיקה מניעתית לכל מטופל עם קטטר","שטיפת שלפוחית יומית עם תמיסת חיטוי"],"a":1,"e":"לאחר יומיים מתחילה התיישבות חיידקים, והסיכון עולה עם כל יום נוסף. ההתערבות היעילה ביותר היא הוצאת הקטטר בהקדם. בנוסף: טכניקה אספטית, היגיינת ידיים, שמירה על מערכת סגורה, שקית מתחת לגובה השלפוחית וריקון קבוע. אין לתת אנטיביוטיקה מניעתית לבקטריוריה אסימפטומטית."},{"t":"אורולוגיה","q":"בן 41 מגיע עם כאב עז וגלי בצד ימין המקרין למפשעה, חוסר שקט, בחילות והמטוריה. מה בדיקת הבחירה ומה ההתערבות הסיעודית החשובה?","o":["US בטן; הגבלת נוזלים","צילום בטן; צום מוחלט","NCCT (CT ללא חומר ניגוד); סינון השתן ואיזון כאב","ציסטוסקופיה דחופה; מנוחה מוחלטת"],"a":2,"e":"NCCT הוא בדיקת הבחירה לזיהוי אבנים בדרכי השתן. הכאב הקוליקי העז מקרין לירך ולאיברי המין. ההתערבות הסיעודית: איזון כאב (אופיאטים/NSAIDs), הידרציה, סינון השתן לאיסוף האבן לאנליזה, ומעקב אחר סימני חסימה או זיהום."},{"t":"אורולוגיה","q":"מטופל לאחר TURP עם קטטר 3 דרכים ושטיפה מתמדת. השתן הפך לאדום בהיר עם קרישים והמטופל מתלונן על התכווצויות. מה הפעולה הראשונה?","o":["הפסקת השטיפה ודיווח לרופא","הוצאת הקטטר מיידית","הגברת קצב השטיפה ובדיקת חסימת הקטטר, ודיווח","מתן משתן להגברת תפוקת השתן"],"a":2,"e":"לאחר TURP הדימום תחת שטיפה מתמדת אמור להתבהר תוך 24-48 שעות. שתן אדום בהיר עם קרישים והתכווצויות מחשידים לחסימה - יש להגביר את קצב השטיפה, לוודא שהקטטר אינו חסום ולדווח. הפסקת השטיפה תחמיר את החסימה."},{"t":"אורולוגיה","q":"בשעות שלאחר TURP המטופל הופך מבולבל וחסר שקט, ובבדיקות: נתרן 118. מה הסיבה הסבירה?","o":["תגובה לחומר הרדמה בלבד","אי ספיקת כליות חריפה","זיהום בדרכי השתן","תסמונת TURP - ספיגת נוזל השטיפה עם היפונתרמיה"],"a":3,"e":"תסמונת TURP נגרמת מספיגת כמות גדולה של נוזל השטיפה דרך הסינוסים הוורידיים הפתוחים, וגורמת להיפונתרמיה מדילול והיפרוולמיה. התסמינים: בלבול, חוסר שקט, בחילות, ברדיקרדיה ויתר לחץ דם. מחייב זיהוי מוקדם ודיווח דחוף."},{"t":"אורולוגיה","q":"בן 70 עם סרטן ערמונית מתחיל טיפול הורמונלי. איך תסבירי לו את מנגנון הפעולה?","o":["הטיפול מעלה את רמת הטסטוסטרון ובכך מדכא את הגידול","הטיפול מפחית את ייצור הטסטוסטרון, שמזין את תאי הגידול","הטיפול הורס ישירות את תאי הגידול כמו כימותרפיה","הטיפול משפר את זרימת השתן בלבד וללא השפעה על הגידול"],"a":1,"e":"סרטן הערמונית תלוי אנדרוגנים. הטיפול ההורמונלי (אגוניסטים/אנטגוניסטים ל-LHRH, אנטי-אנדרוגנים) מפחית את ייצור הטסטוסטרון באשכים ובכך מאט את שגשוג הגידול. תופעות לוואי: גלי חום, ירידה בליבידו, אוסטאופורוזיס ושינויים מטבוליים."},{"t":"אורולוגיה","q":"בת 68 מדווחת על איבוד שתן בכמויות קטנות בעת שיעול, התעטשות והתעמלות, ללא דחיפות. איזה סוג בריחת שתן, ומה הטיפול הראשוני?","o":["Urge incontinence; טיפול אנטיכולינרגי","Stress incontinence; חיזוק שרירי רצפת האגן","Overflow incontinence; צנטור לסירוגין","Functional incontinence; התאמת סביבה בלבד"],"a":1,"e":"בריחת שתן מסוג סטרס נובעת מחולשת מנגנון הסגירה ומתבטאת באיבוד שתן בעת עליית לחץ תוך בטני. הטיפול הראשוני הוא שמרני: תרגילי קגל (כיווץ 3-5 שניות והרפיה, מספר סטים ביום), ירידה במשקל בהשמנה, ויומן השתנה. תרופות אנטיכולינרגיות מיועדות ל-urge ולא לסטרס."},{"t":"אורולוגיה","q":"מטופל מקבל הזלפת BCG תוך-שלפוחיתית לסרטן שלפוחית השתן שטחי. מה ההדרכה החשובה ביותר לאחר הטיפול?","o":["הימנעות מוחלטת משתייה למשך 24 שעות","שימוש בשירותים נפרדים וניקוי האסלה, ושמירת התמיסה בשלפוחית לפי ההנחיה","עידוד השתנה מיידית לאחר ההזלפה","הימנעות ממתן שתן במשך 6 שעות"],"a":1,"e":"BCG הוא חומר ביולוגי חי המוזלף לשלפוחית ומוחזק בה למשך הזמן שנקבע. לאחר מכן ההדרכה כוללת שימוש בשירותים נפרדים, ישיבה בעת מתן שתן, חיטוי האסלה למשך 24 שעות ושטיפה כפולה. מדובר בפעולת סיעוד לאחות מוסמכת במערך אורולוגי (חוזר מנהל האחיות 228/2024)."},{"t":"אורתופדיה","q":"בן 22, 36 שעות לאחר שבר בעצם הירך, מפתח פתאום קוצר נשימה, בלבול ופריחה פטכיאלית בבית השחי. מה האבחנה הסבירה?","o":["תסמונת מדור","תסחיף שומני (Fat Embolism)","זיהום בפצע הניתוחי","תגובה אלרגית למשככי כאבים"],"a":1,"e":"תסחיף שומני הוא הסיבוך המסוכן ביותר של שברים בעצמות ארוכות ומופיע לרוב תוך 24-72 שעות. השילוב הקלאסי: קוצר נשימה, בלבול ופריחה פטכיאלית. כל אירוע של קוצר נשימה סביב שבר בעצם ארוכה הוא תסחיף שומני עד שהוכח אחרת."},{"t":"אורתופדיה","q":"מטופל עם גבס לאחר שבר בשוק מתלונן על כאב עז שאינו מגיב למורפיום ומחמיר מאוד במתיחה פסיבית של האצבעות. מה הפעולה הנכונה?","o":["דיווח דחוף - חשד לתסמונת מדור; הכנה לפאסיוטומיה","הרמת הגפה מעל גובה הלב והמתנה לבוקר","מתן מנת מורפיום נוספת והמתנה","הנחת שקית קרח על הגבס"],"a":0,"e":"תסמונת מדור היא מצב מסכן גפה. הסימן המוקדם והרגיש ביותר הוא כאב לא פרופורציונלי שמחמיר במתיחה פסיבית. 5 ה-P: Pain, Pallor, Paresthesia, Paralysis, Pulselessness - היעדר דופק הוא סימן מאוחר. אין להרים את הגפה מעל גובה הלב (מחמיר איסכמיה); הטיפול הוא פאסיוטומיה דחופה."},{"t":"אורתופדיה","q":"מטופלת ביום הראשון לאחר החלפת מפרק ירך מלאה (THA). איזו תנוחה יש למנוע?","o":["כיפוף ירך מעל 90 מעלות, אדוקציה מעבר לקו האמצע וסיבוב פנימי","אבדוקציה של הגפה עם כרית בין הרגליים","שכיבה על הגב עם הרגליים ישרות","ניוד מוקדם עם הליכון ביום הראשון"],"a":0,"e":"התנוחות המסכנות בפריקת התותב הן כיפוף ירך מעל 90 מעלות, הצלבת רגליים (אדוקציה מעבר לקו האמצע) וסיבוב פנימי. ההדרכה כוללת כרית אבדוקציה, כיסא גבוה, מושב אסלה מוגבה, והימנעות מהתכופפות. ניוד מוקדם דווקא מומלץ."},{"t":"אורתופדיה","q":"בת 66 עם T Score של 2.9- בבדיקת DEXA מתחילה טיפול בביספוספונטים. מה ההדרכה למתן התרופה הפומית?","o":["ליטול עם ארוחה שמנה ולשכב 30 דקות","ליטול עם תוסף סידן באותה כוס","ליטול לפני השינה עם חלב","ליטול בבוקר בצום עם כוס מים מלאה ולהישאר זקוף 30 דקות לפחות"],"a":3,"e":"T Score מתחת ל-2.5- מגדיר אוסטאופורוזיס. ביספוספונטים מעכבים אוסטאוקלאסטים; לספיגה ומניעת דלקת ושט יש ליטול בבוקר בצום עם מים בלבד, ולהישאר בישיבה או עמידה 30 דקות. אין ליטול יחד עם סידן, חלב או תרופות אחרות. בנוסף: תרגילי נשיאת משקל וצריכת סידן וויטמין D."},{"t":"אורתופדיה","q":"בן 55 מגיע עם כאב עז, אודם וחום מקומי בבוהן, ורמת חומצה אורית 9.2. מה הטיפול בהתקף החריף וההדרכה התזונתית?","o":["קולכיצין או NSAIDs; הגבלת מזונות עתירי פורינים ואלכוהול","אלופורינול במינון גבוה; הגברת צריכת בשר","סטרואידים בלבד; ללא שינוי תזונתי","אנטיביוטיקה; הגברת צריכת חלבון"],"a":0,"e":"בהתקף שיגדון חריף המפרק השכיח הוא ה-metatarsophalangeal של הבוהן. קולכיצין מקל תוך 24-48 שעות, לצד NSAIDs כמו אינדומטצין. אלופורינול (מעכב קסנטין אוקסידאז) מיועד למניעה ולא להתקף החריף. ההדרכה: הגבלת בשרים, פירות ים (סרדינים, מקרל, צדפות) ואלכוהול, ושתייה מרובה."},{"t":"אורתופדיה","q":"מטופלת בת 58 מתלוננת על נוקשות בוקר שנמשכת שעה וחצי, ומעורבות סימטרית של מפרקי כף היד הפרוקסימליים. מה מבדיל זאת מאוסטאוארתריטיס?","o":["ב-OA הנוקשות נמשכת מעל שעה והמעורבות סימטרית","ב-RA אין מעורבות של מדדי דלקת","אין הבדל קליני בין השתיים","ב-RA הנוקשות ממושכת והמעורבות סימטרית; ב-OA הנוקשות קצרה והמעורבות אסימטרית"],"a":3,"e":"ב-RA מדובר בדלקת אוטואימונית של הקרום הסינוביאלי: נוקשות בוקר מעל 30-60 דקות, מעורבות סימטרית של מפרקים קטנים, מדדי דלקת מוגברים (ESR, CRP) ונוגדנים (RF, Anti-CCP). ב-OA מדובר בפירוק סחוס: הנוקשות קצרה, המעורבות אסימטרית והכאב מחמיר במאמץ ומוקל במנוחה."},{"t":"אורתופדיה","q":"מטופל סוכרתי עם כיב בכף הרגל שאינו מחלים, כאב מקומי, נפיחות וחום. CRP מוגבר. מה הטיפול הצפוי?","o":["טיפול אנטיביוטי ממושך, ולעיתים ניקוז כירורגי","חבישות מקומיות בלבד למשך שבוע","מנוחה במיטה ללא טיפול תרופתי","מתן NSAIDs בלבד"],"a":0,"e":"אוסטאומיאליטיס שכיחה בכיבים סוכרתיים שאינם מחלימים. הטיפול מחייב אנטיביוטיקה ממושכת (לרוב IV), ובמקרה של אבצס - ניקוז כירורגי; במקרים קשים עלולה להידרש קטיעה. CRP שימושי במיוחד בזיהומי עצם ומפרק ולמעקב אחר התגובה לטיפול."},{"t":"אורתופדיה","q":"מטופל לאחר קטיעה טרנס-טיביאלית מדווח על תחושת כאב בכף הרגל שנקטעה. מה תגובת האחות?","o":["להסביר שמדובר בדמיון ולהרגיע","להכיר בכאב כאמיתי (כאבי פאנטום), לשקול משככי כאבים ו-TENS","להפסיק כל משכך כאבים כי אין מקור אנטומי","להפנות מיידית לייעוץ פסיכיאטרי בלבד"],"a":1,"e":"כ-70% מהמטופלים לאחר קטיעת גפה חווים כאבי פאנטום - כאב אמיתי שיש להתייחס אליו ברצינות. משככי כאבים יכולים לסייע נקודתית, וכן TENS. חשוב לזהות גם תחושת גפה שאינה כואבת. בנוסף: בקרות דימום תכופות, חוסם עורקים זמין ליד המיטה, ומעורבות מוקדמת של פיזיותרפיה."},{"t":"אורתופדיה","q":"מטופל מרותק במתיחה אורתופדית. מה מתוך הבאים נכון בטיפול הסיעודי?","o":["להסיר את המשקולות בכל שינוי תנוחה","להשאיר את המשקולות מונחות על הרצפה בלילה","לוודא שהמשקולות תלויות חופשית ולבצע אומדן וסקולרי לפחות פעם במשמרת","לבצע אומדן נוירווסקולרי פעם ביומיים"],"a":2,"e":"המשקולות במתיחה חייבות להיות תלויות חופשית ורציפות כדי לשמר את כוח המתיחה. הטיפול הסיעודי כולל: אומדן וסקולרי ונוירולוגי לפחות פעם במשמרת, מעקב אחר פצעי לחץ וגזירות, טיפול באתרי החדרת המסמר, טיפול אנטיקואגולנטי בזמן הריתוק, ותמיכה פסיכולוגית."},{"t":"נפרולוגיה","q":"בן 78 עם CKD מגיע לאחר יומיים של הקאות ושלשולים. קריאטינין עלה מ-1.2 ל-2.4. מה סוג הפגיעה הכלייתית והטיפול?","o":["Post-renal; החדרת קטטר","Intra-renal מגלומרולונפריטיס; סטרואידים","Pre-renal מהיפוולמיה; החזרת נפח והפסקת תרופות נפרוטוקסיות","פגיעה כרונית בלבד; אין צורך בהתערבות"],"a":2,"e":"עלייה של 50% לפחות בקריאטינין מהערך הבסיסי מגדירה AKI. בהיפוולמיה מדובר ב-AKI טרום-כלייתי מירידה בפרפוזיה. הטיפול: החזרת נפח מחזור הדם, הפסקת תרופות נפרוטוקסיות (NSAIDs הם הבעייתיות ביותר), והימנעות מחומר ניגוד. ללא זיהוי מוקדם, ההיפופרפוזיה מובילה לנמק צינורי חריף."},{"t":"נפרולוגיה","q":"מטופל בשלב האוליגורי של AKI עם אשלגן 6.8 ושינויי ECG. מה עדיפות הטיפול?","o":["הגבלת נוזלים בלבד","מתן תוסף אשלגן פומי","טיפול דחוף בהיפרקלמיה, שקילת דיאליזה","עידוד תזונה עשירה בפירות יבשים"],"a":2,"e":"היפרקלמיה היא הסיבוך המסכן חיים המיידי בשלב האוליגורי של AKI, בשל הפרעות קצב. הטיפול כולל התייצבות ממברנת שריר הלב ודחיקת אשלגן לתאים, לצד סילוקו מהגוף; דיאליזה נשקלת בהיפרקלמיה עמידה. בשלב זה נדרשת גם הגבלת נוזלים ומעקב מדויק אחר תפוקת השתן."},{"t":"נפרולוגיה","q":"מטופלת עם eGFR של 22 מ\"ל/דקה. באיזה שלב CKD היא נמצאת ומה המשמעות?","o":["שלב 2 - אין צורך בהתערבות","שלב 4 - ירידה חמורה; הכנה לטיפול כלייתי חליפי ומניעת סיבוכים","שלב 5 - חובה להתחיל דיאליזה מיידית","שלב 1 - תפקוד תקין"],"a":1,"e":"שלב 4 מוגדר כ-eGFR של 15-29 מ\"ל/דקה. בשלב זה מתחילה ההכנה לטיפול כלייתי חליפי - הסבר על אפשרויות (המודיאליזה, דיאליזה פריטוניאלית, השתלה), הכנת גישה כלי דם, תיקון אנמיה, איזון זרחן וסידן, ואיזון לחץ דם וסוכרת. שלב 5 הוא eGFR מתחת ל-15."},{"t":"נפרולוגיה","q":"מטופל עם CKD מתקדם שואל מה מותר לו לאכול. מה ההדרכה התזונתית הנכונה?","o":["דיאטה עשירה באשלגן וזרחן","דיאטה עתירת חלבון ללא הגבלה","דיאטה ללא כל הגבלה","דיאטה דלת נתרן, אשלגן וזרחן, עם הגבלת נוזלים לפי ההוראה"],"a":3,"e":"בהתקדמות CKD יש הגבלת נתרן (1-3 גרם ליום), אשלגן וזרחן, והגבלת נוזלים לפי תפוקת השתן. אנמיה מטופלת ב-EPO ובברזל. חשוב לשקול את המטופל בכל יום באותם תנאים - עלייה של ק\"ג אחד שווה לליטר נוזלים - ולעקוב אחר בצקות, צפצופים וקוצר נשימה."},{"t":"נפרולוגיה","q":"מטופל עם פיסטולה עורקית-ורידית ביד שמאל מאושפז במחלקה פנימית. מה נכון?","o":["ניתן לקחת בדיקות דם מהפיסטולה כדי לחסוך דקירות","יש לחבוש את היד בחוזקה כדי למנוע דימום","אין למדוד ל\"ד, לקחת דם או לתת עירוי ביד הפיסטולה; יש לבדוק thrill ו-bruit","מומלץ לענוד שעון על אותה יד לניטור"],"a":2,"e":"הפיסטולה היא קו החיים של מטופל הדיאליזה. אסור למדוד לחץ דם, לקחת דם או לתת עירוי בגפה זו, ואין לענוד שעון או תכשיטים לוחצים. יש לוודא תקינות באמצעות מישוש רטט (thrill) והאזנה לאוושה (bruit) לפחות פעם במשמרת, ולדווח על ירידה בזרימה."},{"t":"נפרולוגיה","q":"במהלך המודיאליזה המטופל מפתח ירידה חדה בלחץ הדם, בחילות והתכווצויות שרירים. מה הפעולה הנכונה?","o":["האצת קצב האולטרה-פילטרציה","מתן תרופות אנטי-היפרטנסיביות","הפסקת ניטור לחץ הדם","הפחתת קצב הוצאת הנוזלים ודיווח, לפי הפרוטוקול"],"a":3,"e":"היפוטנשן תוך-דיאליטי נובע לרוב מהוצאת נוזלים מהירה מדי (UF). ההתערבות: הפחתת קצב האולטרה-פילטרציה, מתן נוזלים לפי הצורך ודיווח. חשוב לזכור שתרופות רבות מתפנות דרך הסליל בדיאליזה, ולכן עדיף לתת אותן לאחר סיום הטיפול."},{"t":"נפרולוגיה","q":"מטופלת בדיאליזה פריטוניאלית ביתית מדווחת שהנוזל שיצא היה עכור, ויש לה כאב בטן ורגישות. מה המשמעות?","o":["ממצא תקין לאחר שהייה ארוכה","חשד לפריטוניטיס - יש לפנות מיידית לטיפול","סימן ליעילות טיפול גבוהה","תוצאה של תמיסה עם ריכוז דקסטרוז נמוך"],"a":1,"e":"נוזל דיאליזט עכור עם כאב בטן ורגישות (עם או בלי ריבאונד) הם הסימנים הקלאסיים לפריטוניטיס - הסיבוך השכיח והמסוכן ביותר בדיאליזה פריטוניאלית. יש לפנות מיידית, לשלוח את הנוזל לתרבית ולהתחיל טיפול אנטיביוטי. ההדרכה המרכזית היא טכניקה אספטית קפדנית בשחלוף."},{"t":"נפרולוגיה","q":"מטופל עם בצקות נרחבות, פרוטאינוריה של 5 גרם ליממה, אלבומין נמוך והיפרליפידמיה. מה האבחנה?","o":["נפרוסקלרוזיס","גלומרולונפריטיס חריפה לאחר זיהום סטרפטוקוקלי","מחלת כליה פוליציסטית","תסמונת נפרוטית"],"a":3,"e":"תסמונת נפרוטית מוגדרת בפרוטאינוריה מעל 3.5 גרם ליממה, היפואלבומינמיה, בצקות והיפרליפידמיה (עקב ייצור מוגבר של ליפופרוטאינים במסלול משותף לאלבומין). סיבוך חשוב הוא נטייה לתרומבואמבוליזם, במיוחד בווריד הכלייתי. הטיפול כולל סטרואידים, מעכבי ACE ומעקב אחר תפקודי כליות."},{"t":"המטולוגיה","q":"מטופלת עם אנמיה מחוסר ברזל מתחילה טיפול בברזל פומי. מה ההדרכה הנכונה?","o":["ליטול עם תה או קפה לשיפור הספיגה","להפסיק את הטיפול ברגע שההמוגלובין תקין","ליטול יחד עם תוסף סידן","ליטול בין הארוחות עם מקור לוויטמין C; לצפות להשחרת הצואה"],"a":3,"e":"ברזל נספג טוב יותר בקיבה ריקה ובנוכחות ויטמין C, בעוד תה, קפה, סידן ותרופות המפחיתות חומציות מפחיתים ספיגה. יש להדריך שהצואה תשחיר (תופעה צפויה) ולצפות לעצירות. את הטיפול ממשיכים גם לאחר תיקון ההמוגלובין, כדי למלא את מאגרי הברזל, ותמיד יש לברר את מקור איבוד הדם."},{"t":"המטולוגיה","q":"בן 72 עם MCV מוגבר, אנמיה, פרסטזיות בכפות הרגליים ושינויים קוגניטיביים. מה האבחנה הסבירה?","o":["אנמיה מחוסר ברזל","פוליציטמיה ורה","תלסמיה מינור","אנמיה מגלובלסטית מחוסר B12 (Pernicious anemia)"],"a":3,"e":"חוסר B12 גורם לאנמיה מקרוציטית מפגיעה בסינתזת DNA, ולסימנים נוירולוגיים מהרס מיאלין: פרסטזיות, שינויי אישיות, ואף פסיכוזה. ב-Pernicious anemia החוסר נובע מהיעדר Intrinsic Factor על רקע אוטואימוני, שכיח יותר בגיל מבוגר ומעלה סיכון לסרטן קיבה. חשוב: חוסר בחומצה פולית מתקן את האנמיה אך לא את הפגיעה הנוירולוגית."},{"t":"המטולוגיה","q":"מטופל עם מחלת חרמש מגיע במשבר כאב חריף. מה שילוב הטיפול הנכון?","o":["הגבלת נוזלים, חשיפה לקור ואספירין","מנוחה בלבד ללא משככי כאבים","הידרציה, שיכוך כאב באופיאטים וחמצן; הימנעות מקור ומהתייבשות","עירוי דם דחוף בכל משבר"],"a":2,"e":"כאב הוא הסימן השכיח ביותר במחלת חרמש. הטיפול מבוסס על הידרציה, שיכוך כאב יעיל (לרוב אופיאטים) וחמצן לפי הצורך. יש להימנע מקור ומהתייבשות שמעודדים סיקול. סיבוכים כוללים אוטמי עצם, אוסטאומיאליטיס, פריאפיזם ו-splenic sequestration. מניעת זיהומים - חיסונים ואנטיביוטיקה פרופילקטית."},{"t":"המטולוגיה","q":"מטופל אונקולוגי עם ספירת נויטרופילים של 400. מה מבין הפעולות הבאות אסורה?","o":["מדידת חום אקסילרית או אוראלית","מדידת חום רקטלית","היגיינת ידיים קפדנית של הצוות והמבקרים","דיאטה נויטרופנית עם ירקות מבושלים"],"a":1,"e":"בספירת נויטרופילים מתחת ל-1000 (ובפרט מתחת ל-500) קיים סיכון משמעותי לזיהום. אין למדוד חום רקטלית ואין לתת נרות או לבצע פעולות פולשניות ברקטום בשל סיכון לחדירת חיידקים דרך הרירית. חום בנויטרופניה הוא מצב חירום המחייב תרביות ואנטיביוטיקה רחבת טווח באופן מיידי."},{"t":"המטולוגיה","q":"מטופלת עם ITP וטסיות 18,000. איזו הדרכה מתאימה?","o":["הזרקות תוך שריריות מותרות ללא הגבלה","פעילות ספורט מגע מומלצת לחיזוק","נטילת אספירין למניעת קרישים","שימוש במברשת שיניים רכה, גילוח במכונה חשמלית והימנעות מ-NSAIDs"],"a":3,"e":"בטרומבוציטופניה חמורה יש לנקוט אמצעי זהירות לדימום: מברשת שיניים רכה, מכונת גילוח חשמלית, הימנעות מאספירין ומ-NSAIDs, מניעת עצירות ומאמץ, והימנעות מהזרקות IM ומספורט מגע. יש לעקוב אחר פטכיות, אכימוזות, דימום מהחניכיים ומהאף, ודימום ב-GI או תוך מוחי. הטיפול: סטרואידים, IVIG, אימונוסופרסיה."},{"t":"המטולוגיה","q":"מטופל שמקבל הפרין 6 ימים - ספירת הטסיות ירדה מ-240,000 ל-105,000. מה החשד ומה הפעולה?","o":["תגובה צפויה; להמשיך את הטיפול","דילול מנוזלים; להאט עירויים","זיהום; להוסיף אנטיביוטיקה","HIT; להפסיק מיד את כל תוצרי ההפרין"],"a":3,"e":"ירידה של כ-50% בספירת הטסיות תחת הפרין מעלה חשד ל-HIT. המנגנון הוא יצירת קומפלקס של נוגדנים עם PF4, שדווקא מגביר קרישיות ומסכן בתרומבוזה ולא רק בדימום. יש להפסיק מיידית חשיפה לכל תוצרי ההפרין ולעבור לנוגד קרישה חלופי."},{"t":"המטולוגיה","q":"מטופלת ספטית עם דימום מכל אתרי הדקירה יחד עם סימני קרישה בכלי דם קטנים. בבדיקות: PT מאורך, פיברינוגן נמוך, D-dimer גבוה. מה האבחנה והטיפול העיקרי?","o":["המופיליה A; מתן פקטור VIII","מחלת פון-וילברנד; מתן דסמופרסין","DIC; זיהוי וטיפול בגורם הראשוני, ומתן מוצרי דם לפי הצורך","ITP; מתן סטרואידים"],"a":2,"e":"DIC היא הפעלה בלתי מבוקרת של מערכת הקרישה - קרישה בכלי דם קטנים במקביל לצריכת גורמי קרישה וטסיות, ולכן דימום. הטיפול המרכזי הוא זיהוי וטיפול בגורם הראשוני (ספסיס, סיבוכים מיילדותיים, ממאירות), לצד תמיכה במוצרי דם: FFP, קריופרציפיטט וטסיות."},{"t":"המטולוגיה","q":"10 דקות לאחר תחילת עירוי מנת דם, המטופל מפתח חום, צמרמורת, כאב מותני וקוצר נשימה. מה הפעולה הראשונה?","o":["להאט את קצב העירוי ולהמשיך במעקב","לתת אנטיפירטיקה ולהמשיך","להפסיק מיידית את העירוי, לשמור על קו ורידי עם סליין ולדווח","להחליף את הסט ולהמשיך עם אותה מנה"],"a":2,"e":"מדובר בחשד לתגובה המוליטית חריפה מאי-התאמת ABO - התגובה הקטלנית והשכיחה, שנובעת לרוב מטעות אנוש בזיהוי. הפעולה הראשונה היא הפסקה מיידית של העירוי, שמירה על גישה ורידית עם סליין, דיווח לרופא ולבנק הדם, ושליחת המנה והדגימות לבירור. יש לנטר תפוקת שתן וסימני DIC."},{"t":"אונקולוגיה","q":"מטופל עם לימפומה אגרסיבית 48 שעות לאחר תחילת כימותרפיה: אשלגן 6.4, חומצה אורית גבוהה, זרחן גבוה וסידן נמוך. מה האבחנה והטיפול המונע?","o":["תסמונת תמס השאת (TLS); הידרציה מרובה ואלופורינול","היפרקלצמיה ממאירה; ביספוספונטים","SIADH; הגבלת נוזלים","תסמונת וריד נבוב עליון; קרינה"],"a":0,"e":"TLS נגרמת מפירוק מהיר של תאי גידול לאחר טיפול אגרסיבי, בעיקר בלימפומות ולוקמיות. הממצאים: היפרקלמיה, היפראוריצמיה, היפרפוספטמיה והיפוקלצמיה, עם סיכון לאי ספיקת כליות ולהפרעות קצב. המניעה: הידרציה מרובה, אלופורינול או רסבוריקאז, ומעקב אלקטרוליטים ותפקודי כליות תכוף."},{"t":"אונקולוגיה","q":"מטופל עם סרטן ריאה מגיע עם בצקת בפנים ובגפיים העליונות, גודש ורידי צוואר וקוצר נשימה שמחמיר בשכיבה. מה ההדרכה הסיעודית?","o":["הרמת ראש המיטה, הימנעות מלבוש לוחץ ומענידת שרשראות","שכיבה שטוחה ולבוש הדוק לתמיכה","הגבלת חמצן","עידוד פעילות גופנית מאומצת"],"a":0,"e":"תסמונת וריד נבוב עליון (SVCS) נגרמת מלחץ של גידול או בלוטות לימפה על הווריד, ומפריעה לחזרה הוורידית מהראש והגפיים העליונות. זהו מצב חירום אונקולוגי. הטיפול: קרינה במינון גבוה או סטנט, סטרואידים, והדרכה להרמת ראש המיטה ולהימנעות מלבוש ומתכשיטים לוחצים סביב הצוואר."},{"t":"אונקולוגיה","q":"מטופלת עם סרטן שד גרורתי מתלוננת על כאב גב חדש שמחמיר בשיעול ובהתעטשות, וכעת גם חולשה ברגליים. מה הפעולה?","o":["מתן משכך כאבים והמתנה לבוקר","הפניה לבדיקת שגרה בעוד שבוע","עיסוי ופיזיותרפיה","דיווח דחוף - חשד ללחץ על חוט השדרה; סטרואידים והדמיה"],"a":3,"e":"Spinal Cord Compression הוא מצב חירום אונקולוגי. כאב גב הוא הסימן הראשון והמוקדם ביותר, ולאחריו מופיעים חולשה מוטורית, שינויי תחושה ורפלקסים לא תקינים, ובשלב מאוחר הפרעות בסוגרים. עיכוב באבחון עלול לגרום לנזק נוירולוגי בלתי הפיך. הטיפול: דקסמתזון, הדמיה דחופה, קרינה או ניתוח."},{"t":"אונקולוגיה","q":"מטופל עם גרורות לעצמות מפתח סידן 13.2, בלבול, בחילות ועצירות. מה הטיפול?","o":["תוספי סידן וויטמין D","מתן משתני תיאזיד להגברת ההפרשה","הגבלת נוזלים","הידרציה עם סליין ומתן ביספוספונטים; הימנעות ממשתני תיאזיד"],"a":3,"e":"היפרקלצמיה ממאירה נובעת מהרס עצם מוגבר. הטיפול: הידרציה אגרסיבית עם סליין להגברת הפרשת הסידן בשתן, וביספוספונטים לעיכוב אוסטאוקלאסטים. אין לתת משתני תיאזיד כי הם אוגרים סידן. התסמינים תלויים ברמת הסידן: בלבול, חולשה, בחילות, עצירות, ובמצב חמור - הפרעות קצב וקומה."},{"t":"אונקולוגיה","q":"במהלך מתן כימותרפיה וזיקנטית המטופל מתלונן על צריבה באתר העירוי, ונצפית נפיחות מקומית. מה הפעולה הראשונה?","o":["להפסיק מיידית את העירוי ולפעול לפי פרוטוקול אקסטרא-וזציה","להאיץ את קצב העירוי כדי לסיים מהר","לשטוף בסליין דרך אותו קו ולהמשיך","להניח קומפרס חם ולהמשיך את העירוי"],"a":0,"e":"אקסטרא-וזציה של חומר וזיקנטי עלולה לגרום לנזק בלתי הפיך לרקמות. הפעולה הראשונה: הפסקה מיידית של העירוי ללא שליפת המחט, שאיבת שארית החומר, מתן אנטידוט לפי סוג התרופה, סימון האזור, תיעוד ודיווח. חומרת הנזק תלויה בסוג החומר ובכמות שדלפה."},{"t":"אונקולוגיה","q":"מטופל מפתח מוקוזיטיס כואב לאחר כימותרפיה. איזו הדרכה נכונה?","o":["שטיפות פה בסליין או בתמיסת סודה לשתייה, והיגיינת פה קפדנית","שטיפות פה עם מי פה המכילים אלכוהול","הימנעות מוחלטת מצחצוח שיניים","שימוש במברשת שיניים קשה להסרת שאריות"],"a":0,"e":"מוקוזיטיס נובעת מפגיעה בתאי הרירית המתחלקים מהר, ומופיעה כאודם, בצקת ובמקרים חמורים כיבים כואבים. המניעה והטיפול: היגיינת פה קפדנית עם מברשת רכה, שטיפות בסליין או בסודה לשתייה, והימנעות ממי פה המכילים אלכוהול, ממזון חם, חריף וחומצי. יש לעקוב אחר יכולת האכילה ומצב תזונתי."},{"t":"אונקולוגיה","q":"מטופל בטיפול פליאטיבי בסוף החיים סובל מקוצר נשימה מטריד. מה הגישה הנכונה?","o":["הימנעות מכל טיפול תרופתי כדי לא לקצר חיים","מתן אופיואידים במינון נמוך, מיצוב בישיבה, אוורור והרגעה","הנשמה מכנית בכל מקרה","הגברת מתן נוזלים IV"],"a":1,"e":"בטיפול תומך בסוף החיים המטרה היא איזון תסמינים ומזעור סבל. אופיואידים במינון נמוך יעילים לקוצר נשימה, לצד מיצוב בישיבה, אוורור, מטליות לחות והיגיינת פה. אין להכריח את המטופל לאכול או לשתות; הידרציה והזנה מלאכותית לרוב אינן מומלצות בשלב זה."},{"t":"מערכת חיסון","q":"מטופלת פיתחה תוך דקות ממתן אנטיביוטיקה IV אורטיקריה מפושטת, נפיחות בשפתיים, צפצופים וירידה בלחץ הדם. מה הפעולה הראשונה?","o":["מתן אנטיהיסטמין IV","מתן נוזלים בלבד והמתנה","מתן סטרואידים פומיים","הפסקת החשיפה לאלרגן ומתן אדרנלין IM"],"a":3,"e":"באנפילקסיס הפעולה הראשונה היא הפסקת החשיפה לאלרגן והזרקת אדרנלין IM (בירך) ללא דיחוי, לצד קריאה לעזרה. אדרנלין מכווץ כלי דם, מגביר את התכווצות שריר הלב ומרחיב את דרכי הנשימה. אנטיהיסטמינים וסטרואידים הם טיפול משני ואינם תחליף. חוזר מנהל האחיות 204/2023 מגדיר את תפקיד האחות בתגובה אנפילקטית."},{"t":"מערכת חיסון","q":"מטופל שהתאושש מתגובה אנפילקטית מבקש להשתחרר מיד. מה ההדרכה?","o":["ניתן להשתחרר מיד; אין סיכון נוסף","אין צורך במזרק אדרנלין אישי לאחר אירוע ראשון","יש להישאר באשפוז שבוע לפחות","יש להישאר במעקב מספר שעות בשל אפשרות לתגובה דו-פאזית, ולקבל מרשם למזרק אישי"],"a":3,"e":"לאחר היעלמות הסימנים יש לעקוב אחר המטופל מספר שעות (2-6) בשל אפשרות לתגובה דו-פאזית. כל אדם שלקה בתגובה אנפילקטית זקוק למזרק אדרנלין אישי, להדרכה מעשית על השימוש בו, לזיהוי האלרגן ולהימנעות ממנו. יש להגן על המזרק מאור ומחום ולהחליפו כשהתמיסה עכורה או פג תוקפה."},{"t":"מערכת חיסון","q":"מטופלת עם SLE שואלת מה יכול לגרום להתלקחות. מה ההדרכה?","o":["הימנעות מחשיפה ל-UV, מעישון וממתח; שימוש בהגנה מהשמש","חשיפה לשמש מומלצת לחיזוק ויטמין D ללא הגבלה","הפסקת התרופות בתקופות של רגיעה","הימנעות מכל פעילות גופנית"],"a":0,"e":"ב-SLE טריגרים סביבתיים כוללים קרינת UV (שמש ומנורות), עישון (כולל פסיבי), זיהומים ומתח. ההדרכה: הגנה מהשמש, הפסקת עישון, ואי הפסקת תרופות באופן עצמאי. פעילות גופנית מתונה של 15-30 דקות דווקא מומלצת. הסיבוך המשמעותי הוא נפריטיס לופואידית - סיבת מוות מרכזית במבוגרים עם SLE."},{"t":"מערכת חיסון","q":"מטופלת עם RA מתחילה מתוטרקסט. מה ההדרכה הנכונה?","o":["ניתן לשתות אלכוהול ללא הגבלה","אין צורך במעקב תפקודי כבד","להפסיק את התרופה עם השיפור הראשון","להימנע מאלכוהול, ליטול חומצה פולית, למנוע הריון ולבצע מעקב מעבדה"],"a":3,"e":"מתוטרקסט הוא ה-DMARD הראשון ב-RA. ההדרכה: הימנעות מאלכוהול (רעילות כבדית), נטילת חומצה פולית להפחתת תופעות לוואי, מניעת הריון והפסקת התרופה 3 חודשים לפני כניסה להריון, ומעקב מעבדה קבוע (תפקודי כבד, CBC, תפקודי כליות). לפני התחלת ביולוגיים יש לשלול שחפת לטנטית."},{"t":"מערכת חיסון","q":"מטופל עם HIV וספירת CD4 של 140. איזו מסקנה קלינית נכונה?","o":["המטופל בשלב AIDS ובסיכון לזיהומים אופורטוניסטיים; נדרש טיפול מונע ל-PCP","המטופל בשלב אסימפטומטי ואינו זקוק להתערבות","הטיפול האנטי-רטרוויראלי מיותר בשלב זה","אין קשר בין CD4 לסיכון לזיהומים"],"a":0,"e":"ספירת CD4 מתחת ל-200 תאים למ\"מ מעוקב (או הופעת מחלה אופורטוניסטית) מגדירה שלב AIDS. בשלב זה נדרש טיפול מונע לדלקת ריאות מסוג Pneumocystis. מתחת ל-100 עולה הסיכון ל-CMV ולטוקסופלזמוזיס, ומתחת ל-50 לזיהומים קשים במיוחד. הטיפול האנטי-רטרוויראלי (ART) חיוני בכל שלב."},{"t":"מערכת חיסון","q":"אחות נדקרה במחט מזוהמת בדם של מטופל HIV חיובי. מה נכון?","o":["יש להתחיל טיפול רק אם יופיעו תסמינים","יש להמתין לתוצאות בדיקות סרולוגיה לפני כל התערבות","הסיכון הוא 30% ולכן הטיפול חסר תועלת","יש להתחיל טיפול מניעתי בהקדם האפשרי ולא יאוחר מ-72 שעות"],"a":3,"e":"הסיכון להדבקה מדקירת מחט הוא נמוך (בסדר גודל של 0.3%), אך טיפול מניעתי (PEP) יעיל ויש להתחילו בהקדם האפשרי ולא יאוחר מ-72 שעות מהחשיפה. יש לדווח מיידית, לקחת בדיקות בסיס ולעקוב. חשוב לדעת גם: במצב U=U (עומס נגיפי בלתי מדיד) אין העברה ביחסי מין."},{"t":"עור וכוויות","q":"בן 68 מגיע עם פריחה שלפוחיתית כואבת לאורך דרמטום אחד בבית החזה, שהחלה 48 שעות קודם עם צריבה מקומית. מה נכון?","o":["הטיפול האנטי-ויראלי אינו יעיל אחרי 24 שעות","המחלה אינה מדבקת כלל","יש להתחיל טיפול אנטי-ויראלי (עדיפות תוך 72 שעות מהופעת הפריחה)","מדובר בזיהום חיידקי הדורש אנטיביוטיקה"],"a":2,"e":"שלבקת חוגרת נגרמת מהתעוררות נגיף ה-VZV הרדום בגנגליונים, ומתבטאת בפריחה שלפוחיתית כואבת בדרמטום אחד, לרוב עם כאב מקדים. הטיפול האנטי-ויראלי יעיל במיוחד כשמתחיל תוך 72 שעות. הנוזל בשלפוחיות מדבק ועלול לגרום לאבעבועות רוח במי שאינו מחוסן. מעורבות עינית מחייבת הפניה דחופה."},{"t":"עור וכוויות","q":"מטופלת עם אודם, נפיחות, חום מקומי וכאב בשוק, ללא גבול חד. מה הסימן שמחייב הערכה דחופה?","o":["התפשטות מהירה של האודם, חום גבוה או הופעת פסים אדומים","גרד קל באזור","קילוף עור קל לאחר ההחלמה","יובש בעור סביב האזור"],"a":0,"e":"צלוליטיס מתפתחת לרוב דרך פצע או סדק בעור, לרוב מ-Staphylococcus aureus או סטרפטוקוק, ואינה מדבקת מאדם לאדם. סימני האזהרה: התפשטות מהירה, חום גבוה, פסים לימפטיים, שלפוחיות או נמק - המחשידים להתפשטות מערכתית. גורמי סיכון: סוכרת, בצקת כרונית/לימפאדמה ודיכוי חיסוני."},{"t":"עור וכוויות","q":"מטופל שהחל לפני שבועיים טיפול תרופתי חדש מגיע עם שלפוחיות מפושטות, ניתוק שכבות העור ומעורבות ריריות הפה והעיניים. מה הפעולה החשובה ביותר?","o":["המשך התרופה עם תוספת אנטיהיסטמין","הפסקה מיידית של התרופה החשודה, וטיפול תומך במאזן נוזלים ובפצעים","מריחת סטרואיד מקומי בלבד","המתנה של שבוע לראות אם התופעה חולפת"],"a":1,"e":"מדובר ב-Stevens-Johnson Syndrome או ב-Toxic Epidermal Necrolysis - תגובה תרופתית קשה (NSAIDs, סולפונאמידים, נוגדי פרכוסים). הפעולה הקריטית היא הפסקה מיידית של התרופה החשודה. הטיפול תומך ודומה לטיפול בכוויה: מאזן נוזלים, טיפול בפצעים, מניעת זיהום והערכה עינית למניעת נזק לראייה. יש לתעד ולדווח על הרגישות."},{"t":"עור וכוויות","q":"מטופל מראה לאחות שומה בגב שהשתנתה: אסימטרית, בעלת גבולות לא סדירים, מספר גוונים וקוטר 8 מ\"מ. מה הפעולה?","o":["מעקב בעוד שנה","הפניה לרופא עור להערכה וביופסיה","מריחת משחת סטרואידים","הסרה עצמית בבית"],"a":1,"e":"כלל ה-ABCDE מסייע באיתור מלנומה: Asymmetry, Border לא סדיר, Color עם מספר גוונים, Diameter מעל 6 מ\"מ, ו-Evolution - שינוי לאורך זמן. מלנומה פחות שכיחה מ-BCC ומ-SCC אך המסוכנת ביותר בשל פוטנציאל גרורתי גבוה. אבחון מוקדם מציל חיים; תפקיד האחות הוא זיהוי, תיעוד והפניה."},{"t":"עור וכוויות","q":"בן 50 במשקל 90 ק\"ג הגיע עם כוויות חשמל בשטח של 30% TBSA. לפי הנוסחה הנלמדת לכוויות חשמל (4 מ\"ל), כמה נוזלים יש לתת ב-8 השעות הראשונות?","o":["10,800 מ\"ל","5,400 מ\"ל","2,700 מ\"ל","21,600 מ\"ל"],"a":1,"e":"החישוב: 4 מ\"ל × 90 ק\"ג × 30% = 10,800 מ\"ל לכל 24 השעות. מחצית ניתנת ב-8 השעות הראשונות מרגע הפגיעה (5,400 מ\"ל) והמחצית השנייה ב-16 השעות הבאות. שימו לב: לפי נוסחת ה-ABA שנלמדה, בכוויות חום וכימיות משתמשים ב-2 מ\"ל, ובכוויות חשמל ב-4 מ\"ל. הנוסחה היא כלי עזר בלבד - הכמות מותאמת לתגובת המטופל."},{"t":"עור וכוויות","q":"מהו המדד העיקרי להערכת יעילות החייאת הנוזלים בנפגע כוויות תרמיות?","o":["ירידה במשקל הגוף","תפוקת שתן של 0.5-1 מ\"ל/ק\"ג/שעה","היעלמות הכאב באזור הכוויה","עלייה ברמת ההמטוקריט"],"a":1,"e":"תפוקת השתן היא המדד העיקרי לתגובה להחייאת נוזלים: 0.5-1 מ\"ל/ק\"ג/שעה בכוויות חום וכימיות, ו-75-100 מ\"ל/שעה בכוויות חשמל (בשל סיכון למיוגלובינוריה). בנוסף עוקבים אחר קצב לב ולחץ דם. יש להימנע גם מהחייאת חסר וגם מהחייאת יתר."},{"t":"אף אוזן גרון","q":"מטופל מגיע עם דימום פעיל מהאף. מה ההדרכה הנכונה לעצירת דימום קדמי?","o":["הטיית הראש לאחור ולחיצה על גשר האף","הכנסת צמר גפן יבש והמתנה","הטיית הראש והגוף קדימה ולחיצה רציפה על החוטם למשך כ-20 דקות","שכיבה על הגב עם קרח על העורף"],"a":2,"e":"בדימום אף יש להשעין את הגוף קדימה ולהוריד את הראש כדי למנוע בליעה או שאיפה של דם, וללחוץ על החלק הרך של האף ברציפות כ-20 דקות. קומפרסים קרים לאף ולפנים מסייעים. הטיית הראש לאחור גורמת לבליעת דם, לבחילה ולסיכון אספירציה. דימום אחורי מסוכן יותר ומחייב הערכה רפואית."},{"t":"אף אוזן גרון","q":"מטופל לאחר טראומת ראש מדווח על נזלת מימית צלולה מהאף. איזו בדיקה מסייעת ומה המשמעות?","o":["טימפנומטריה; חשד לפגיעה באוזן התיכונה","בדיקת תרבית; חשד לסינוסיטיס חיידקית","Halo test; חשד לדלף CSF משבר בבסיס הגולגולת","אין צורך בבירור; מדובר בנזלת אלרגית"],"a":2,"e":"הפרשה מימית צלולה מהאף לאחר טראומה מחשידה לדלף CSF כתוצאה משבר בבסיס הגולגולת. ה-Halo test וזיהוי גלוקוז בהפרשה מסייעים לאבחנה. מדובר במצב המחייב הערכה רפואית בשל הסיכון למנינגיטיס, ואין לבצע טמפונדה או החדרת זונדה דרך האף."},{"t":"אף אוזן גרון","q":"מטופל מתלונן על ירידה בשמיעה באוזן אחת. בבדיקה: תעלת שמע חסומה בצרומן. איזה סוג ירידת שמיעה צפוי?","o":["הולכתית (Conductive)","תחושתית-עצבית (Sensorineural)","מרכזית","מעורבת עם פגיעה בעצב השמיעה"],"a":0,"e":"חסימת התעלה החיצונית או נקב בעור התוף גורמים לירידת שמיעה הולכתית - הבעיה היא בהעברת גלי הקול לאוזן הפנימית. ירידה תחושתית-עצבית נובעת מפגיעה בשבלול או בעצב השמיעה. הצרומן פועל כמו אטם אוזניים; במישוש, משיכת האפרכסת או לחיצה על הטראגוס כואבות באוטיטיס חיצונית."},{"t":"אף אוזן גרון","q":"מטופל עם טרכאוסטומיה חדשה - הקנולה נשלפה בטעות. מה נכון?","o":["להמתין להגעת רופא ללא כל פעולה","החזרת קנולה לטראכיאה היא פעולה מצילת חיים ברמת אחות מוסמכת; יש לפעול מיידית","לסגור את הפתח בחבישה אטומה","לבצע אינטובציה דרך הפה בלבד"],"a":1,"e":"לפי חוזר מנהל האחיות 217/2024, החזרת קנולה לטראכיאה במטופל עם פיום קנה היא פעולה מצילת חיים ברמת אחות מוסמכת. יש להחזיק ציוד חירום ליד המיטה (קנולה חלופית באותו גודל ובגודל קטן יותר, מרחיב, אמבו). דימום דרך הקנולה מחייב לחץ ישיר וניתוח דחוף - חשד לפגיעה בעורק."},{"t":"עיניים","q":"בת 63 מגיעה עם כאב עיני עז, כאב ראש, בחילות, ראיית הילות סביב אורות ואישון חצי מורחב. מה האבחנה והפעולה?","o":["קטרקט; ניתוח אלקטיבי","גלאוקומה סגורת זווית חריפה; מצב חירום עיני הדורש טיפול מיידי","דלקת לחמית; טיפות אנטיביוטיות","טעות רפרקציה; התאמת משקפיים"],"a":1,"e":"גלאוקומה סגורת זווית חריפה היא חירום עיני: חסימה פתאומית של ניקוז ה-Aqueous humor גורמת לעלייה חדה ב-IOP, עם כאב עז, כאב ראש, בחילות והקאות, ראיית הילות ואישון חצי מורחב. הטיפול מיידי להורדת הלחץ, ולאחר מכן Laser iridotomy. עיכוב עלול לגרום לעיוורון בלתי הפיך."},{"t":"עיניים","q":"מטופל מדווח על הבזקי אור, ריבוי גופיפים צפים ו'וילון' שיורד על שדה הראייה. מה נכון?","o":["חשד להיפרדות רשתית - הפניה דחופה לרופא עיניים","מדובר בתופעה שפירה של הגיל","יש להמתין שבוע ולראות אם התופעה חולפת","הטיפול הוא טיפות סטרואידיות בלבד"],"a":0,"e":"הבזקי אור, גופיפים צפים ותחושת וילון או צל בשדה הראייה הם התסמינים הקלאסיים להיפרדות רשתית - מצב חירום עיני המחייב הפניה דחופה. לאחר ניתוח עם הזרקת גז יש להקפיד על התנוחה שנקבעה, כדי שהבועה תישאר מעל אזור ההיפרדות ותפעיל לחץ רציף להצמדת הרשתית."},{"t":"עיניים","q":"מטופלת ביום שלאחר ניתוח קטרקט. איזו הדרכה נכונה?","o":["להתכופף ולהרים משאות ככל שנוח לה","להפסיק את הטיפות ברגע שהראייה משתפרת","לשפשף את העין להסרת הפרשות","להימנע מהתכופפות, ממאמץ ומהרמת משאות; מגן עין בלילה ודיווח על כאב עז"],"a":3,"e":"לאחר ניתוח קטרקט יש להימנע מהתכופפות, ממאמץ ומהרמת משאות המעלים לחץ תוך עיני, ולהשתמש במגן עין בלילה. הטיפול כולל טיפות סטרואידיות או NSAIDs ואנטיביוטיקה מקומית לפי ההוראה. כאב עז, ירידה פתאומית בראייה או הפרשה מוגלתית מחייבים דיווח מיידי - חשד לאנדופתלמיטיס."},{"t":"עיניים","q":"מטופל עם דלקת לחמית זיהומית חריפה שואל מתי יוכל לחזור לעבודה. מה ההדרכה?","o":["חזרה מיידית ללא הגבלה","היגיינת ידיים קפדנית, הימנעות משיתוף מגבות, וחזרה לפי הנחיית הרופא","אין צורך בהיגיינה מיוחדת - המחלה אינה מדבקת","יש להישאר בבידוד מלא חודש"],"a":1,"e":"דלקת לחמית ויראלית מדבקת מאוד ומתפשטת במגע ישיר ובחפצים משותפים. ההדרכה: היגיינת ידיים קפדנית, שימוש במגבת אישית, הימנעות משפשוף העיניים ומשיתוף כריות ואיפור, ואי שימוש בעדשות מגע עד להחלמה. החזרה לעבודה או ללימודים היא לפי הנחיית הרופא."},{"t":"שד","q":"מטופלת לאחר כריתת שד עם דיסקציה של בלוטות לימפה אקסילריות (ALND). מה ההדרכה למניעת לימפאדמה?","o":["הימנעות ממדידת ל\"ד, מהזרקות ומלקיחת דם ביד המנותחת; עידוד תרגילי תנועה","הימנעות מכל תנועה של היד למשך חודש","הרמת משאות כבדים לחיזוק היד","חבישה הדוקה של היד באופן קבוע"],"a":0,"e":"לאחר ALND יש סיכון ללימפאדמה - הצטברות נוזל לימפה עשיר בחלבונים. ההדרכה: הימנעות ממדידת ל\"ד, הזרקות, עירויים ולקיחת דם בגפה המנותחת, הימנעות מפציעות ומכוויות בגפה, וזיהוי מוקדם של סימני צלוליטיס. דווקא חשוב לעודד תנועתיות ותרגילים (טיפוס על קיר, שימוש ברצועה) לשיפור זרימת הדם והלימפה."},{"t":"שד","q":"בת 47 שואלת מתי לבצע ממוגרפיה ומה מקומה של בדיקת השד העצמית. מה נכון?","o":["ממוגרפיה היא בדיקת הבחירה לסקר; בדיקה עצמית מסייעת במודעות לשינויים אך אינה תחליף","בדיקה עצמית מחליפה את הממוגרפיה","אין צורך בממוגרפיה מתחת לגיל 60","בדיקה עצמית מספיקה עד גיל 55"],"a":0,"e":"ממוגרפיה היא בדיקת הסקר ובדיקת הבחירה לגילוי מוקדם של סרטן השד. הקרינה נמוכה וממוקדת והכאב קצר וסביר. בדיקת שד עצמית מקדמת מודעות לגוף ולשינויים, אך אין לה סטנדרטיזציה והיא אינה מחליפה סקר. כל שינוי חדש - גוש, שינוי בעור או הפרשה מהפטמה - מחייב הפניה להמשך בירור."},{"t":"שד","q":"מטופלת עם סרטן שד HER2 חיובי מתחילה טיפול ביולוגי ממוקד מטרה. מה הניטור החשוב?","o":["בדיקת ראייה חודשית","ניטור רמות סוכר בלבד","בדיקת צפיפות עצם שבועית","הערכת תפקוד לבבי לפני הטיפול ובמהלכו"],"a":3,"e":"טיפול ביולוגי המכוון ל-HER2 עלול לגרום לפגיעה בתפקוד הלב, ולכן נדרשת הערכה לבבית (אקו לב) לפני הטיפול ובמהלכו. חשוב להבדיל: מעכבי ארומטאז (אנאסטרוזול, לטראזול, אקזמסטן) קשורים לאובדן מסת עצם, וטמוקסיפן מעלה סיכון לאירועים תרומבואמבוליים ולסרטן רירית הרחם."}];
const KEYS = ["א","ב","ג","ד"];
const state = {};           // idx -> chosen option index
const quiz = document.getElementById('quiz');

function render(){
  quiz.innerHTML = '';
  const f = document.getElementById('filter').value;
  DATA.forEach((item, i) => {
    if (f && item.t !== f) return;
    const card = document.createElement('div');
    card.className = 'q';
    card.dataset.i = i;
    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = '<span class="num">שאלה ' + (i+1) + '</span><span class="chip">' + item.t + '</span>';
    card.appendChild(head);
    const qt = document.createElement('p');
    qt.className = 'qtext';
    qt.textContent = item.q;
    card.appendChild(qt);
    const ul = document.createElement('ul');
    ul.className = 'opts';
    item.o.forEach((txt, j) => {
      const li = document.createElement('li');
      li.className = 'opt';
      li.dataset.j = j;
      li.innerHTML = '<span class="k">' + KEYS[j] + '.</span><span></span>';
      li.lastChild.textContent = txt;
      li.addEventListener('click', () => choose(i, j));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const v = document.createElement('div'); v.className = 'verdict'; card.appendChild(v);
    const ex = document.createElement('div');
    ex.className = 'exp';
    ex.innerHTML = '<b>הסבר</b>';
    const p = document.createElement('span'); p.textContent = item.e; ex.appendChild(p);
    card.appendChild(ex);
    quiz.appendChild(card);
    if (state[i] !== undefined) paint(card, i);
  });
  stats();
}

function choose(i, j){
  if (state[i] !== undefined) return;      // one attempt per question
  state[i] = j;
  const card = quiz.querySelector('.q[data-i="'+i+'"]');
  paint(card, i);
  stats();
}

function paint(card, i){
  const item = DATA[i], pick = state[i];
  card.querySelectorAll('.opt').forEach(li => {
    const j = +li.dataset.j;
    li.classList.add('lock');
    if (j === item.a) li.classList.add('right');
    else if (j === pick) li.classList.add('wrong');
  });
  const v = card.querySelector('.verdict');
  const ok = pick === item.a;
  v.className = 'verdict show ' + (ok ? 'y' : 'n');
  v.textContent = ok ? '✓ תשובה נכונה' : '✗ תשובה שגויה — הנכונה: ' + KEYS[item.a];
  card.querySelector('.exp').classList.add('show');
}

function stats(){
  const done = Object.keys(state).length;
  let ok = 0;
  for (const k in state) if (state[k] === DATA[k].a) ok++;
  const bad = done - ok;
  document.getElementById('rPos').textContent = done + '/' + DATA.length;
  document.getElementById('rOk').textContent = ok;
  document.getElementById('rBad').textContent = bad;
  document.getElementById('rPct').textContent = done ? Math.round(ok/done*100) : '—';
  document.getElementById('rBar').style.width = (done/DATA.length*100) + '%';
}

function summary(){
  const box = document.getElementById('sumbox');
  const by = {};
  DATA.forEach((item, i) => {
    const b = by[item.t] || (by[item.t] = {n:0, done:0, ok:0});
    b.n++;
    if (state[i] !== undefined){ b.done++; if (state[i] === item.a) b.ok++; }
  });
  const done = Object.keys(state).length;
  let ok = 0; for (const k in state) if (state[k] === DATA[k].a) ok++;
  const pct = DATA.length ? Math.round(ok/DATA.length*100) : 0;
  const cls = pct >= 80 ? 'g' : (pct >= 60 ? 'a' : 'r');
  let h = '<h2>סיכום ביצועים</h2>';
  h += '<div class="score"><span class="pill '+cls+'">' + pct + '</span></div>';
  h += '<p style="color:var(--dim);font-size:.88rem;margin:10px 0 16px">' +
       ok + ' תשובות נכונות מתוך ' + DATA.length + ' · נענו ' + done +
       ' · ציון עובר בקורס: 60</p>';
  h += '<table><tr><th>נושא</th><th>נענו</th><th>נכונות</th><th>אחוז</th></tr>';
  Object.keys(by).forEach(t => {
    const b = by[t];
    const p = b.done ? Math.round(b.ok/b.done*100) : null;
    const c = p === null ? '' : (p >= 80 ? 'g' : (p >= 60 ? 'a' : 'r'));
    h += '<tr><td>' + t + '</td><td class="n">' + b.done + '/' + b.n + '</td>' +
         '<td class="n">' + b.ok + '</td><td class="n">' +
         (p === null ? '<span style="color:var(--dim)">—</span>'
                     : '<span class="pill ' + c + '">' + p + '%</span>') + '</td></tr>';
  });
  h += '</table>';
  box.innerHTML = h;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btnSum').addEventListener('click', summary);
document.getElementById('btnReset').addEventListener('click', () => {
  for (const k in state) delete state[k];
  document.getElementById('sumbox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('btnReveal').addEventListener('click', () => {
  quiz.querySelectorAll('.q').forEach(card => {
    const i = +card.dataset.i;
    if (state[i] === undefined){
      card.querySelectorAll('.opt').forEach(li => {
        li.classList.add('lock');
        if (+li.dataset.j === DATA[i].a) li.classList.add('right');
      });
      card.querySelector('.exp').classList.add('show');
    }
  });
});
document.getElementById('filter').addEventListener('change', render);

(function init(){
  const sel = document.getElementById('filter');
  const counts = {};
  DATA.forEach(d => counts[d.t] = (counts[d.t] || 0) + 1);
  Object.keys(counts).forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t + ' (' + counts[t] + ')';
    sel.appendChild(o);
  });
  render();
})();
</script>
</body>
</html>
