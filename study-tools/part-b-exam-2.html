<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבחן תרגול 2 - סיעוד המבוגר חלק ב</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:#182234; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --teal:#2dd4bf; --teal-d:#0d9488;
  --coral:#fb7185; --amber:#fbbf24; --ok:#34d399;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Rubik,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65;
     -webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:16px}

header{background:linear-gradient(180deg,#132033,#0f172a);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:.9rem}
.tagline{font-family:var(--mono);color:var(--teal);font-size:.78rem;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:6px}

.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-family:var(--mono);font-size:.8rem;color:var(--dim);min-width:92px}
.cell b{display:block;color:var(--txt);font-size:1.15rem;line-height:1.25;letter-spacing:-.02em}
.cell.ok b{color:var(--ok)} .cell.bad b{color:var(--coral)} .cell.t b{color:var(--teal)}

.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal));
  width:0;transition:width .3s ease}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
select,button{font-family:inherit;font-size:.88rem;background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--teal-d)}
button.primary{background:var(--teal-d);border-color:var(--teal-d);color:#04201c;font-weight:700}
button.primary:hover{background:var(--teal)}
.grow{flex:1}

.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;
   padding:18px 20px;margin-bottom:14px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--mono);color:var(--teal);font-size:.82rem;font-weight:700}
.chip{font-size:.72rem;background:#0b3b38;color:var(--teal);border:1px solid #115e59;
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.qtext{font-size:1.02rem;margin:0 0 14px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#141d2e;border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-d);background:#16233a}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;min-width:1.4em}
.opt.sel{border-color:var(--teal);background:#122c2b}
.opt.right{border-color:var(--ok);background:#0d2a20}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--coral);background:#2c1420}
.opt.wrong .k{color:var(--coral)}
.opt.lock{cursor:default}
.exp{margin-top:12px;border-inline-start:3px solid var(--teal-d);background:#101a2b;
  border-radius:0 10px 10px 0;padding:11px 14px;font-size:.92rem;color:#cbd5e1;display:none}
.exp.show{display:block}
.exp b{color:var(--teal);font-family:var(--mono);font-size:.78rem;display:block;margin-bottom:4px;
  letter-spacing:.05em;text-transform:uppercase}
.verdict{font-family:var(--mono);font-size:.8rem;margin-top:10px;display:none}
.verdict.show{display:block}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--coral)}

.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  margin-bottom:16px;display:none}
.sumbox.show{display:block}
.sumbox h2{margin:0 0 12px;font-size:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:.8rem;font-family:var(--mono)}
td.n{font-family:var(--mono)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-family:var(--mono);font-size:.8rem}
.pill.g{background:#0d2a20;color:var(--ok)} .pill.a{background:#2e2410;color:var(--amber)}
.pill.r{background:#2c1420;color:var(--coral)}
.score{font-family:var(--mono);font-size:2.4rem;line-height:1;letter-spacing:-.03em}

footer{color:var(--dim);font-size:.8rem;text-align:center;padding:22px 0 34px}
@media(max-width:520px){.wrap{padding:12px}.cell{min-width:74px}h1{font-size:1.15rem}}
@media print{body{background:#fff;color:#000}.toolbar,.bar{display:none}
  .q,.sumbox,header{border-color:#bbb;background:#fff;color:#000}
  .exp{display:block!important;background:#f5f5f5;color:#000}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="tagline">סיעוד המבוגר · חלק ב' · מבחן תרגול</div>
  <h1>מבחן תרגול 2 — ידע ישיר</h1>
  <div class="sub">80 שאלות ידע: פתופיזיולוגיה, סימנים, אבחון, טיפול ותרופות — לשינון ולכיסוי רחב.</div>
  <div class="readout">
    <div class="cell t">שאלה<b id="rPos">0/80</b></div>
    <div class="cell ok">נכונות<b id="rOk">0</b></div>
    <div class="cell bad">שגויות<b id="rBad">0</b></div>
    <div class="cell">ציון<b id="rPct">—</b></div>
  </div>
  <div class="bar"><i id="rBar"></i></div>
</header>

<div class="toolbar">
  <select id="filter"><option value="">כל הנושאים (80 שאלות)</option></select>
  <span class="grow"></span>
  <button id="btnSum" class="primary">סיכום וציון</button>
  <button id="btnReveal">הצג את כל התשובות</button>
  <button id="btnReset">איפוס</button>
</div>

<div class="sumbox" id="sumbox"></div>
<div id="quiz"></div>

<footer>נבנה מהסילבוס ומהמצגות של הקורס · ברונר וסודארת' מהדורה 15 · 80 שאלות</footer>
</div>

<script>
const DATA = [{"t":"נוירולוגיה","q":"איזו אונה במוח אחראית על פרשנות ויזואלית וזיכרון ראייה?","o":["אונה אוקסיפיטלית","אונה טמפורלית","אונה פרונטלית","אונה פריאטלית"],"a":0,"e":"האונה האוקסיפיטלית אחראית על פרשנות ויזואלית וזיכרון ראייה. האונה הטמפורלית - קליטה שמיעתית, זיכרון קול והבנת שפה ומוזיקה. האונה הפריאטלית - עיבוד תחושתי. האונה הפרונטלית - תפקודים ניהוליים, שיפוט והתנהגות, וכן אזור ברוקה לדיבור."},{"t":"נוירולוגיה","q":"מהו התפקיד העיקרי של המדולה אובלונגטה (Medulla) בגזע המוח?","o":["יצירת נוזל מוחי-שדרתי","עיבוד רפלקסים חזותיים ושמיעתיים בלבד","ויסות תפקודים חיוניים כמו נשימה ולחץ דם","קואורדינציה של תנועות עדינות"],"a":2,"e":"גזע המוח מורכב ממוח אמצעי (מזנצפלון), פונס ומדולה. המדולה מווסתת תפקודים חיוניים - נשימה, קצב לב ולחץ דם. הפונס מקשר בין המוח הקטן לשאר המוח ומכיל גרעיני עצבים גולגולתיים ללעיסה, בליעה, שמיעה ויציבה. המוח האמצעי מכיל גרעינים דופמינרגיים לשליטה מוטורית ורפלקסים חזותיים ושמיעתיים."},{"t":"נוירולוגיה","q":"מהו המראה התקין של נוזל מוחי-שדרתי (CSF), ואיזה ממצא מחשיד לדימום?","o":["צלול וחסר צבע תקין; CSF ורוד או דמי מחשיד לדימום","צהבהב ועכור תקין; CSF צלול מחשיד לדימום","חלבי ולבן תקין; CSF צהוב מחשיד לדימום","דמי קל תקין; CSF צלול מחשיד לזיהום"],"a":0,"e":"CSF תקין הוא צלול וחסר צבע, ומיוצר במקלעת הכורואידית של החדרים. CSF ורוד, מוכתם בדם או דמי בגלוי מחשיד לדימום. סיבוכים נדירים אך חמורים של ניקור מותני: הרניאציה, המטומה אפידורלית שדרתית ומנינגיטיס. סיבוכים שכיחים יותר: כאב ראש, בעיות זמניות במתן שתן, עלייה קלה בטמפרטורה, כאב גב ונוקשות עורף."},{"t":"נוירולוגיה","q":"מהו החלוקה השכיחה בין סוגי השבץ המוחי, ומהו אזור הפנומברה?","o":["50% איסכמי, 50% דימומי; הפנומברה היא מרכז האוטם","כ-87% איסכמי, כ-13% דימומי; הפנומברה היא רקמה בסיכון סביב האוטם","כ-13% איסכמי, כ-87% דימומי; הפנומברה היא רקמה מתה","רק שבץ איסכמי קיים; אין פנומברה"],"a":1,"e":"כ-87% מהשבצים הם איסכמיים וכ-13% דימומיים. אזור הפנומברה הוא הרקמה שסביב ליבת האוטם - עדיין חיה אך בסיכון גבוה, והצלתה היא המטרה של טיפול תרומבוליטי ואנדווסקולרי מהיר. סוגי השבץ האיסכמי: עורק גדול (20%), קרדיו-אמבולי (הקשור בעיקר לפרפור פרוזדורים), לקונרי, קריפטוגני (30%) ואחרים."},{"t":"נוירולוגיה","q":"מהו הגורם השכיח ביותר לדימום תוך מוחי ראשוני בגילאי 40-70?","o":["טראומה קלה","אנגיופתיה אמילואידית מוחית","יתר לחץ דם","גידול מוחי"],"a":2,"e":"יתר לחץ דם הוא הגורם השכיח ביותר לדימום תוך מוחי ראשוני בגילאי 40-70 ואחראי לרוב הדימומים התוך מוחיים, מקרע ספונטני של כלי דם קטנים. אנגיופתיה אמילואידית מוחית שכיחה יותר בגיל מבוגר יותר. גורמי סיכון נוספים: מין זכר, גנטיקה, תזונה עתירת שומן וצריכת אלכוהול מופרזת."},{"t":"נוירולוגיה","q":"מהו המאפיין של התקף היעדרות (Absence)?","o":["התכווצות טונית-קלונית של כל הגוף עם אובדן הכרה ממושך","אפיזודות קצרות של בהייה וניתוק, ללא אובדן הכרה מלא","חולשה חד צדדית הנמשכת שעות","כאב ראש עז עם הקאות בלבד"],"a":1,"e":"התקף היעדרות מתבטא באפיזודות פשוטות של בהייה וניתוק, ללא אובדן הכרה מלא וללא שלב פוסט-איקטלי ממושך. לעומתו, בהתקף טוני-קלוני כללי (גראנד מאל) יש אובדן הכרה פתאומי, שלב טוני של התקשחות ואחריו שלב קלוני של עוויתות, ואז שלב פוסט-איקטלי עם בלבול, כאב ראש, שרירים כואבים ועייפות."},{"t":"נוירולוגיה","q":"איזה מעקב מיוחד נדרש במטופלים הנוטלים תרופות נוגדות פרכוסים לאורך זמן?","o":["הערכת בריאות העצם עקב סיכון לאובדן מסת עצם","בדיקת שמיעה שנתית","ספירת טסיות יומית","בדיקת שדה ראייה שבועית"],"a":0,"e":"שימוש ארוך טווח בתרופות נוגדות פרכוסים קשור לאובדן עצם, ולכן יש להעריך את בריאות העצם. בנוסף נדרש מעקב אחר רמות התרופה בדם (הרמה עשויה להשתנות במחלה), ובנשים - התייחסות לאינטראקציה עם אמצעי מניעה וטיפולי פוריות, ולעלייה בעירור נוירונלי הקשור לרמות הורמונים."},{"t":"נוירולוגיה","q":"מה מאפיין את ממצאי ה-CSF במנינגיטיס חיידקית לעומת וירוסית?","o":["בחיידקית: חלבון נמוך וגלוקוז גבוה","בוירוסית: גלוקוז נמוך מאוד וצביעת גראם חיובית","בחיידקית: חלבון גבוה, גלוקוז נמוך ורוב נויטרופילים","אין הבדל בין השתיים"],"a":2,"e":"במנינגיטיס חיידקית ה-CSF עכור עם חלבון גבוה, גלוקוז נמוך (החיידקים צורכים אותו) ורוב נויטרופילים; בוירוסית - חלבון תקין או מעט מוגבר, גלוקוז תקין ורוב לימפוציטים. תרביות וצביעת גראם מאפשרות זיהוי מהיר של החיידק ותחילת טיפול מתאים. חיסון הוא ההגנה הטובה ביותר נגד מנינגיטיס חיידקית."},{"t":"נוירולוגיה","q":"מהו הסוג השכיח ביותר של טרשת נפוצה, ומהו שיעורו?","o":["Primary Progressive - כ-85%","Progressive Relapsing - כ-50%","Secondary Progressive - כ-85%","Relapsing-Remitting (RRMS) - כ-85%"],"a":3,"e":"RRMS הוא הסוג השכיח - כ-85% מהמקרים, ומאופיין בהחמרות והפוגות עם החלמה מלאה יחסית בין ההתקפים. MS היא מחלה דמיאלינית מתקדמת של מערכת העצבים המרכזית, מאובחנת לרוב בגילאי 20-50, ופוגעת בנשים פי שלושה יותר מגברים. גורמי סיכון: מחסור בוויטמין D, עישון, השמנת יתר וזיהום בנגיף אפשטיין-בר."},{"t":"נוירולוגיה","q":"מהו סימן Lhermitte?","o":["התפשטות האצבעות בגירוי כף הרגל","כיפוף לא רצוני של הברכיים בעת כיפוף הצוואר","תחושות דמויות הלם חשמלי היורדות בגב בעת כיפוף הצוואר","שיפור בפטוזיס לאחר הנחת קרח"],"a":2,"e":"סימן Lhermitte הוא תחושה דמוית הלם חשמלי היורדת לאורך עמוד השדרה והגפיים בעת כיפוף הצוואר, ואופייני לטרשת נפוצה. כיפוף הברכיים בכיפוף הצוואר הוא סימן ברודזינסקי (גירוי מנינגיאלי), התפשטות האצבעות בגירוי כף הרגל היא בבינסקי (סימן פתולוגי), ובדיקת הקרח מיועדת למיאסטניה גרביס."},{"t":"נוירולוגיה","q":"אילו טיפולים מקובלים במיאסטניה גרביס?","o":["מעכבי כולין-אסטראז, קורטיקוסטרואידים, IVIG, פלזמפרזיס ותימקטומיה","רק פיזיותרפיה ומנוחה","נוגדי פרכוסים בלבד","טיפול תרומבוליטי"],"a":0,"e":"הטיפול במיאסטניה גרביס משלב מעכבי כולין-אסטראז לשיפור סימפטומטי, קורטיקוסטרואידים ומדכאי חיסון להפחתת ייצור הנוגדנים, IVIG ופלזמפרזיס להשפעה מהירה (נמשכת כ-28 ימים), ותימקטומיה - במיוחד בנוכחות תימומה. כ-85% מהחולים מציגים נוגדנים לקולטני אצטילכולין."},{"t":"נוירולוגיה","q":"מהו הממצא האופייני בניקור מותני בתסמונת גיאן-ברה (GBS)?","o":["גלוקוז נמוך מאוד וצביעת גראם חיובית","חלבון נמוך עם ספירת תאים לבנים גבוהה","חלבון מוגבר עם ספירת תאים לבנים תקינה","CSF דמי"],"a":2,"e":"ב-GBS מופיעה דיסוציאציה אלבומינו-ציטולוגית: חלבון מוגבר ב-CSF עם ספירת תאים לבנים תקינה. המחלה היא פולינוירופתיה חריפה בתיווך חיסוני שבה המערכת החיסונית תוקפת את המיאלין של העצבים ההיקפיים, ומתבטאת בחולשה והיפורפלקסיה שמתחילות בגפיים התחתונות ומתקדמות כלפי מעלה. רוב המטופלים חווים החלמה מלאה."},{"t":"נוירולוגיה","q":"מה מאפיין כאב ראש מקבצי (Cluster)?","o":["כאב דו צדדי עמום הנמשך ימים","כאב שמופיע רק בעת מאמץ פיזי","התקפים חד צדדיים עזים סביב העין, הנמשכים 15 דקות עד 3 שעות, עם דמעת וגודש באף","כאב הקשור תמיד לרגישות בקרקפת בגיל מבוגר"],"a":2,"e":"כאב ראש מקבצי מתאפיין בהתקפים חד צדדיים עזים סביב העין או הרקה, הנמשכים 15 דקות עד 3 שעות, ומלווים בדמעת, גודש באף וחוסר שקט. כאב ראש מסוג מתח מאופיין בתחושה קבועה ויציבה של לחץ. רגישות בקרקפת עם עייפות, ירידה במשקל וחום בגיל מבוגר מחשידה לדלקת עורק הרקה (GCA)."},{"t":"נוירולוגיה","q":"מהו הגידול המוחי הראשוני האגרסיבי ביותר, ומה האתגר העיקרי בטיפול בגידולי מוח?","o":["אוליגודנדרוגליומה; אין אתגר מיוחד","גליובלסטומה; התפשטות ברקמת המוח ונטייה לחזור גם לאחר טיפול מוצלח","אפנדימומה; אין אפשרות לניתוח","מנינגיומה; פרוגנוזה גרועה תמיד"],"a":1,"e":"גליובלסטומה (דרגה IV) היא הגידול הראשוני האגרסיבי ביותר. הגידולים מדורגים I-IV: דרגות I-II הן איטיות עם פרוגנוזה טובה יותר. האתגר העיקרי הוא התפשטות הגידול ברקמת המוח ונטייתו לחזור גם לאחר הסרה מקסימלית. גידולים משניים (גרורתיים) שכיחים יותר מראשוניים ומגיעים בעיקר מריאה, שד ומלנומה."},{"t":"נוירולוגיה","q":"מהי ההגדרה של מוות מוחי?","o":["הפסקה בלתי הפיכה של כל תפקודי המוח, כולל גזע המוח","מצב וגטטיבי מתמשך עם שימור רפלקסים","תרדמת עמוקה שממנה ניתן להתאושש","היעדר תגובה לגירוי כאב בלבד"],"a":0,"e":"מוות מוחי מוגדר כהפסקה בלתי הפיכה של כל תפקודי המוח, כולל גזע המוח, ומהווה קביעת מוות לכל דבר. גזע המוח הוא האיבר האחראי על ההכרה ועל התפקודים החיוניים. הקביעה מתבצעת בתהליך מוסדר, ויש לה משמעות מרכזית בהיבטים של המשך טיפול ותרומת איברים."},{"t":"נוירולוגיה","q":"אילו שינויים נחשבים חלק נורמלי מהזדקנות מערכת העצבים?","o":["שינוי במצב המנטלי ובלבול","אובדן מוחלט של הזיכרון והשפה","האטה בהולכה עצבית ובזמן התגובה, וירידה במספר הנוירונים והסינפסות","הופעת רפלקסים פתולוגיים"],"a":2,"e":"בהזדקנות תקינה יש אובדן נוירונים, ירידה במספר הסינפסות והנוירוטרנסמיטרים, האטה בהולכה עצבית ובזמן תגובה, ירידה במשקל המוח וגדילת החדרים, וקהות בתחושה המישושית. עם זאת - יכולות הזיכרון, השפה והשיפוט נשארות שלמות, ושינוי במצב המנטלי לעולם אינו נחשב חלק נורמלי מההזדקנות ומחייב בירור."},{"t":"אורולוגיה","q":"מטופל עם משקל סגולי נמוך מאוד בשתן ותפוקת שתן מרובה. איזו אבחנה עולה?","o":["התייבשות","אבנים בדרכי השתן","זיהום בדרכי השתן","Diabetes Insipidus"],"a":3,"e":"משקל סגולי נמוך מעיד על שתן מדולל. ב-Diabetes Insipidus יש חוסר ב-ADH ולכן שתן מרובה ומדולל. משקל סגולי גבוה מעיד על שתן מרוכז, ואופייני להתייבשות ולמצבים של אגירת נוזלים. צפיפות המים היא 1.000, והשוואה בו-זמנית של אוסמולריות הסרום והשתן מסייעת בהערכת מאזן הנוזלים."},{"t":"אורולוגיה","q":"מה מתאר המונח Hesitancy?","o":["מוגלה בשתן","קושי וכאב בעת ההשתנה","היסוס והתחלה איטית של זרם השתן","השתנה בתדירות גבוהה"],"a":2,"e":"Hesitancy הוא היסוס לפני ההשתנה, ונובע מלחץ שופכתי, BPH או חסימה חיצונית. Pyuria - מוגלה או תאי דם לבנים בשתן. Dysuria - קושי וכאב בעת ההשתנה (חסימה, זיהום, טראומה, אבנים). Frequency - השתנה בתדירות גבוהה (שתייה מרובה, זיהום, הריון, גידול)."},{"t":"אורולוגיה","q":"מהי ציסטוסקופיה?","o":["בדיקת הדמיה לא פולשנית של הכליות","בדיקה אבחנתית וטיפולית של השופכה והשלפוחית","מדידת לחץ שריר השלפוחית במילוי וריקון","בדיקה של הערמונית דרך הרקטום"],"a":1,"e":"ציסטוסקופיה היא בדיקה אבחנתית וגם טיפולית, המאפשרת הסתכלות ישירה על השופכה, הפרוסטטה והשלפוחית, לקיחת ביופסיה ואף כריתת גידולים. אורודינמיקה מודדת לחץ שריר השלפוחית במילוי וריקון. TRUS היא אולטרסאונד טרנס-רקטלי המסייע באבחון סרטן הערמונית ולקיחת ביופסיה."},{"t":"אורולוגיה","q":"אילו אבני שתן אינן נראות בצילום רנטגן רגיל (שקופות)?","o":["אבני סידן אוקסלט","אבני סטרוביט","אבני חומצה אורית","אבני פוספט"],"a":2,"e":"אבני חומצה אורית הן רדיו-לוצנטיות (שקופות) ואינן נראות בצילום רגיל, ולכן NCCT הוא בדיקת הבחירה. אבני סטרוביט (אמוניה-מגנזיום-פוספט) מהוות כ-15% מהאבנים וקשורות לזיהומים. אבני ציסטין מהוות כ-3% ומתגלות לרוב בילדות. בטיפול באבני חומצה אורית ניתן ציטרט להבססת השתן."},{"t":"אורולוגיה","q":"מתי לא ניתן לבצע ריסוק אבנים חוץ גופי (ESWL)?","o":["כאשר האבן קטנה מ-5 מ\"מ","כאשר המטופל צעיר","כשקיימת חסימה דיסטלית למיקום האבן","כשהאבן ממוקמת בגביעי הכליה"],"a":2,"e":"ריסוק חוץ גופי אינו מתאים כשיש חסימה דיסטלית למיקום האבן, שכן הפירורים לא יוכלו להתפנות. בסוף הפעולה נהוג להשאיר סטנט לשמירה על השופכן פתוח. שיטות נוספות: URS (אורטרוסקופיה) לאבנים בשופכן ובשלפוחית, ו-PCNL דרך נקב בכליה לאבנים גדולות בגביעים ובאגן הכליה."},{"t":"אורולוגיה","q":"מהו מנגנון הפעולה של חוסמי אלפא (כמו Omnic, Xatral) ב-BPH?","o":["הקטנת נפח הערמונית על ידי חסימת הורמונים","הפחתת ייצור השתן בכליה","הגברת התכווצות שריר הדטרוזור","הרפיית השריר החלק בצוואר השלפוחית ובערמונית"],"a":3,"e":"חוסמי אלפא מרפים את השריר החלק בצוואר השלפוחית ובערמונית ובכך משפרים את זרימת השתן, ללא הקטנת נפח הערמונית. יש להיזהר בשילוב עם חוסמי ביתא, חוסמי תעלות סידן ותרופות אחרות המורידות לחץ דם, בשל סיכון ליתר לחץ דם תנוחתי. מעכבי 5-אלפא רדוקטאז הם אלה שמקטינים את נפח הבלוטה."},{"t":"אורולוגיה","q":"מה נכון לגבי בדיקת PSA?","o":["ערך מוגבר מאבחן סרטן ערמונית בוודאות","הערך עשוי לעלות גם מ-BPH, פרוסטטיטיס, מגע מיני או נוכחות קטטר","הבדיקה מבוצעת רק לאחר אבחון גרורות","ערך תקין שולל לחלוטין סרטן"],"a":1,"e":"PSA קיים בנורמה בכמות קטנה בסרום, וערכו עשוי לעלות ממגוון סיבות שאינן ממאירות: BPH, דלקת בערמונית, מגע מיני, נוכחות קטטר או בדיקה רקטלית. לכן PSA אינו מאבחן בפני עצמו, ומשולב עם בדיקה רקטלית (DRE), TRUS וביופסיה. סרטן הערמונית הוא גורם התמותה השני בגברים מסרטן, אחרי סרטן ריאות."},{"t":"אורולוגיה","q":"אילו סמנים גידוליים נבדקים בחשד לסרטן אשך?","o":["PSA ו-CEA","AFP ו-Beta-HCG","CA-125 ו-CA 19-9","BRCA1 ו-BRCA2"],"a":1,"e":"בסרטן אשך נבדקים AFP (Alpha Fetoprotein) ו-Beta-HCG, יחד עם LDH. המחלה שכיחה בגילאי 19-35, וגורם סיכון מרכזי הוא אשך טמיר. סמינומה רגישה מאוד לקרינה, ואילו סוגים לא-סמינומטיים (כמו Embryonal) אגרסיביים יותר ושולחים גרורות מוקדם. הטיפול הראשוני הוא כירורגי, ואחוזי ההחלמה גבוהים - כ-95%."},{"t":"אורולוגיה","q":"מהו Ileal Conduit?","o":["חיבור ישיר של השופכנים לדופן הבטן ללא מעי","יצירת תעלה מקטע מעי דק שאליה מחוברים השופכנים, עם סטומה לניקוז השתן","החדרת קטטר קבוע דרך השופכה","יצירת שלפוחית חדשה מהרקטום"],"a":1,"e":"Ileal Conduit הוא סוג של הסטת שתן לאחר כריתת שלפוחית רדיקלית: קטע מעי דק משמש כתעלה שאליה מחוברים השופכנים, והשתן מנוקז לסטומה בדופן הבטן ונאסף בשקית. בשיטת Cutaneous ureterostomy השופכנים מחוברים ישירות לדופן הבטן. ההדרכה כוללת דיווח על ירידה בכמות השתן מהסטומה, טיפול בעור סביב הסטומה והימנעות ממאכלים הגורמים לגזים."},{"t":"אורתופדיה","q":"איזו בדיקת מעבדה שימושית באבחון מחלת פאג'ט, בהחלמה לאחר שבר ובגידולי עצם מסוימים?","o":["Creatine Kinase (CK)","Alkaline Phosphatase (ALP)","Troponin","Amylase"],"a":1,"e":"ALP עולה במצבים של פעילות אוסטאובלסטית מוגברת: מחלת פאג'ט פעילה, החלמה לאחר שבר וגידולי עצם מסוימים (עולה גם בפיברוזיס של כבד). CK הוא המדד העיקרי לפגיעה בשריר (רבדומיוליזה, מיופתיה). LDH לא ספציפי ועולה בנזק שרירי ובתהליכים נמקיים. CRP שימושי בזיהומים חריפים כמו אוסטאומיאליטיס וזיהום מפרק."},{"t":"אורתופדיה","q":"מדוע נדרשים לפחות שני מנחים בצילום רנטגן אורתופדי?","o":["כי הצילום דו-ממדי ומבנים עלולים להסתיר זה את זה (Superimposition)","כדי להקטין את מינון הקרינה","כדי לזהות רקמות רכות בלבד","כדי לחסוך בזמן הבדיקה"],"a":0,"e":"צילום רנטגן הוא הטלה דו-ממדית של מבנה תלת-ממדי, ולכן מבנים עלולים להסתיר זה את זה. לכן במרבית המקרים נדרשים שני מנחים בהפרש של 90 מעלות (AP ו-LAT). בפענוח משתמשים בשיטת ABCS: Alignment, Bone, Cartilage, Soft Tissue."},{"t":"אורתופדיה","q":"מהו שבר תלישה (Avulsion Fracture)?","o":["שבר שבו גיד או רצועה תולשים פיסת עצם מהמקום אליו הם מחוברים","שבר עם פגיעה חלקית בקורטקס בצד אחד בלבד","שבר קטן מעומס חוזר באזור ספציפי","שבר באזור עצם שנחלשה ממחלה"],"a":0,"e":"שבר תלישה מתרחש כשגיד או רצועה תולשים פיסת עצם מאתר החיבור, לרוב בפציעות ספורט דמויות נקע. שבר Green Stick הוא שבר חלקי בצד אחד של העצם מכיפוף. שבר מאמץ נובע מעומס חוזר (למשל בפיבולה). שבר פתולוגי מתרחש בעצם שנחלשה מגידול, גרורות, מחלת פאג'ט או היפרפאראתירואידיזם, ומצריך בירור כשמופיע ללא טראומה משמעותית."},{"t":"אורתופדיה","q":"מתי מועדף קיבוע חיצוני (External Fixation) על פני ORIF?","o":["בכל שבר סגור פשוט","בשברים בילדים בלבד","בשברים ללא כל תזוזה","בשברים פתוחים עם נזק נרחב לרקמות הרכות או צורך בהארכת גפה"],"a":3,"e":"קיבוע חיצוני מאפשר להשיג יציבות מהר בשברים פתוחים ומורכבים עם נזק לרקמות הרכות, וכן משמש להארכת וסיבוב גפיים (מכשירי איליזרוב). החיסרון: מסורבל ונוטה לזיהומים באתרי החדרת המסמרים, ולכן נדרש טיפול יומי באתרים ומעקב. ORIF כולל רדוקציה פתוחה וקיבוע בברגים, פלטות או מסרגות."},{"t":"אורתופדיה","q":"מה משמעות המונח Valgus?","o":["עיוות שבו החלק הדיסטלי סוטה החוצה מקו האמצע","עיוות שבו החלק הדיסטלי סוטה לכיוון קו האמצע","קיצור של הגפה","נוקשות במפרק"],"a":0,"e":"Valgus הוא עיוות שבו החלק הדיסטלי סוטה החוצה מקו האמצע (למשל Hallux Valgus, Genu Valgum - ברכיים נוגעות), ו-Varus הוא סטייה פנימה לכיוון קו האמצע (Genu Varum - רגליים קשתיות, Cubitus Varus במרפק). העיוות נובע משינוי במבנה האנטומי של העצם או בזווית בין המשטחים המפרקיים."},{"t":"אורתופדיה","q":"מה מאפיין הליכת טרנדלנבורג (Trendelenburg Gait)?","o":["הרמת הגפה בקשת החוצה כדי לפצות על קושי בכיפוף","גרירת קצה כף הרגל עקב Drop Foot","הצלבת הרגליים בהליכה","הטיית האגן לצד אחד עקב חולשת שרירי האבדוקטורים של הירך"],"a":3,"e":"הליכת טרנדלנבורג מאופיינת בהטיית האגן לצד אחד עקב חולשת שרירי האבדוקטורים של הירך; בבעיה דו צדדית מתקבלת הליכת ברווז. Drop Foot גורם להרמת הרגל גבוה יותר וגרירת הבוהן, ומופיע בפריצות דיסק חמורות. Scissoring Gait (הצלבה) אופיינית ל-CP, ו-Circumduction Gait היא הרמת הגפה בקשת החוצה."},{"t":"אורתופדיה","q":"מהי הסיבה לתסמונת התעלה הקרפלית (CTS)?","o":["לחץ על העצב החציוני (Median) במעברו בתעלה הקרפלית","דלקת בגיד אכילס","קרע ברצועה הצולבת הקדמית","דלקת בבורסה של המרפק"],"a":0,"e":"CTS נובעת מלחץ על העצב החציוני במעברו בתעלה הקרפלית, ומתבטאת בכאבים והירדמות של האזור המעוצבב, לרוב בשעות הלילה. הסיכון גובר עם הגיל ועם פעילויות חוזרניות. תסמונות נוספות בגפה העליונה: בורסיטיס, כיווץ דופויטרן וגנגליון; בגפה התחתונה: Hallux Valgus, פאסייטיס פלנטרית ו-Hammer toe."},{"t":"אורתופדיה","q":"מהו סוג גידול העצם הראשוני הממאיר השכיח ביותר, והיכן הוא מופיע בעיקר?","o":["מיאלומה נפוצה; גולגולת בלבד","אוסטאוסרקומה; ירך דיסטלית, שוק פרוקסימלית וזרוע פרוקסימלית","כונדרומה; אצבעות בלבד","סרקומה ע\"ש יואינג; רק במבוגרים מעל 70"],"a":1,"e":"אוסטאוסרקומה היא גידול העצם הראשוני הממאיר השכיח, ומופיעה בעיקר בירך דיסטלית, שוק פרוקסימלית וזרוע פרוקסימלית, לרוב בצעירים או על רקע מחלת פאג'ט. שיעור הריפוי 60-80% בשילוב ניתוח וכימותרפיה. גידולים משניים (גרורות) שכיחים יותר - בעיקר משד, ריאה וערמונית, לעצמות הירך, החוליות, האגן והצלעות."},{"t":"אורתופדיה","q":"אילו ביטויים סיסטמיים אופייניים למחלת פאג'ט של העצם?","o":["ירידה ברמת ALP וחום גבוה","סוכרת ואי ספיקת כליות בלבד","חרשות מפגיעה בעצמות השמיעה, כאב ועיוות גפה, ו-ALP מוגבר","היעדר כל תסמין"],"a":2,"e":"מחלת פאג'ט מאופיינת בספיגת עצם בתהליך לא תקין ולאחריה החלפה של מח עצם תקין ברקמה לא תקינה. הבעיה העיקרית היא כאב ועיוות גפה, ולעיתים חרשות (פגיעה בעצמות השמיעה) ואי ספיקת לב בעומס גבוה. ALP מוגבר בסרום במחלה פעילה. הטיפול: ביספוספונטים או קלציטונין, והתאמת אמצעי עזר לניידות."},{"t":"נפרולוגיה","q":"מהו קצב הסינון הגלומרולרי (GFR) התקין?","o":["כ-25 מ\"ל/דקה/1.73 מ\"ר","כ-60 מ\"ל/דקה/1.73 מ\"ר","כ-125 מ\"ל/דקה/1.73 מ\"ר","כ-250 מ\"ל/דקה/1.73 מ\"ר"],"a":2,"e":"GFR תקין הוא כ-125 מ\"ל/דקה/1.73 מ\"ר. מדד זה קשה לחישוב ישיר ולכן נעשה שימוש ב-eGFR המחושב מקריאטינין בדם. כל כליה מכילה כמיליון נפרונים שהם יחידת התפקוד הבסיסית; כ-80-85% מהם הם נפרונים קורטיקליים. תפקוד תקין דורש מספר מספיק של נפרונים - פחות מ-20% מעיד על פגיעה משמעותית."},{"t":"נפרולוגיה","q":"איזה שלב בייצור ויטמין D מתרחש בכליה?","o":["הייצור הראשוני בעור בחשיפה לשמש","ספיגתו במעי","הפיכתו לצורה הפעילה (הידרוקסילציה סופית)","אחסונו בכבד"],"a":2,"e":"ויטמין D מיוצר בעור או נספג במעי, עובר עיבוד בכבד, והשלב האחרון - הפיכתו לצורה הפעילה - מתרחש בכליה. לכן ב-CKD יש פגיעה במשק הסידן והזרחן. תפקידים אנדוקריניים נוספים של הכליה: ייצור אריתרופויאטין (EPO) לגירוי ייצור כדוריות אדומות, והפרשת רנין להפעלת מערכת RAAS ובקרה על לחץ הדם."},{"t":"נפרולוגיה","q":"מהו טווח ה-eGFR המגדיר שלב 5 (מחלת כליות סופנית)?","o":["15-29 מ\"ל/דקה","מתחת ל-15 מ\"ל/דקה","30-59 מ\"ל/דקה","60-89 מ\"ל/דקה"],"a":1,"e":"שלב 5 (ESKD) מוגדר כ-eGFR מתחת ל-15 מ\"ל/דקה. שלב 4: 15-29, שלב 3: 30-59, שלב 2: 60-89 עם עדות לנזק כלייתי, שלב 1: מעל 90 עם עדות לנזק. CKD מוגדרת כתמונה של פגיעה כלייתית מעל 3 חודשים רצופים. גורמי הסיכון המובילים: סוכרת ויתר לחץ דם."},{"t":"נפרולוגיה","q":"מתי מופיעה גלומרולונפריטיס חריפה לאחר זיהום סטרפטוקוקלי?","o":["תוך 24 שעות מהזיהום","רק במקביל לזיהום הפעיל","שנה לאחר הזיהום","10-20 ימים לאחר זיהום גרוני או עורי"],"a":3,"e":"גלומרולונפריטיס חריפה לאחר זיהום מופיעה 10-20 ימים לאחר זיהום פרינגיאלי או עורי, ובמדינות מערביות נגרמת בעיקר על ידי סטרפטוקוק מקבוצה A. הביטויים: המטוריה (מיקרוסקופית או מקרוסקופית), פרוטאינוריה, בצקות ויתר לחץ דם, וירידה ב-GFR. הנוגדנים מופיעים בדם לאחר הזיהום ומסייעים באבחנה."},{"t":"נפרולוגיה","q":"אילו תהליכים פיזיקליים עומדים בבסיס ההמודיאליזה?","o":["הובלה אקטיבית בלבד","פגוציטוזיס בלבד","דיפוזיה, אוסמוזה ואולטרה-פילטרציה דרך ממברנה חצי חדירה","אידוי וקונדנסציה"],"a":2,"e":"בהמודיאליזה עוברים רעלים ומומסים מהדם דרך ממברנה חצי חדירה אל נוזל הדיאליזה בדיפוזיה, מים עוברים באוסמוזה, ועודפי נוזלים מוסרים באולטרה-פילטרציה בלחץ. קצב הדיפוזיה תלוי בשטח הפנים של הממברנה ובמפל הריכוזים. כל טיפול נמשך כ-4 שעות, ונוזל הדיאליזה דומה בהרכבו לפלסמה."},{"t":"נפרולוגיה","q":"מהו היתרון העיקרי של דיאליזה פריטוניאלית מחזורית לילית (CCPD) על פני CAPD?","o":["אינה דורשת קטטר כלל","מבוצעת רק בבית חולים","אינה דורשת תמיסות דיאליזט","פחות זיהומים בחלל הפריטוניאלי בשל החיבור למכונה, וחופש בשעות היום"],"a":3,"e":"ב-CCPD השחלופים מתבצעים אוטומטית בלילה באמצעות מכונה, מה שמפחית את מספר החיבורים והניתוקים ובכך את הסיכון לזיהומים, ומשאיר את שעות היום פנויות. דיאליזה פריטוניאלית היא הצורה השכיחה של דיאליזה ביתית - קלה ללמידה וניידת. התוויות נגד: הידבקויות, מחלה דלקתית או איסכמית של מערכת העיכול, וחוסר יכולת פיזית או מנטלית לבצע את הטיפול."},{"t":"נפרולוגיה","q":"מהו הסימן הראשון האופייני לסרטן הכליה, ומהו גורם הסיכון המשמעותי?","o":["כאב מותני עז; צריכת מלח","המטוריה ללא כאבים; עישון","בצקות בגפיים; חוסר פעילות","חום גבוה; זיהומים חוזרים"],"a":1,"e":"המטוריה ללא כאבים היא הסימן הראשון האופייני לסרטן הכליה ומחייבת בירור. עישון הוא אחד מגורמי הסיכון המשמעותיים, לצד יתר לחץ דם וחשיפה לחומרים תעשייתיים כמו אסבסט. ממצאים נוספים: מישוש גוש בבטן, ESR מוגבר, ולעיתים אנמיה או אריתרוציטוזיס (לא ביחד). הטיפול הנבחר במחלה מקומית הוא כריתה רדיקלית."},{"t":"נפרולוגיה","q":"מהי צורת התורשה של מחלת כליה פוליציסטית (PKD) במבוגרים?","o":["אוטוזומלי רצסיבי","אינה תורשתית","מקושר X","אוטוזומלי דומיננטי"],"a":3,"e":"PKD במבוגרים עוברת בתורשה אוטוזומלית דומיננטית - הגן אינו ממוקם על כרומוזומי המין ולכן השכיחות שווה בין המינים. הביטויים: המטוריה, כאב המקרין לגב ולחלק התחתון של הבטן, יתר לחץ דם, וזיהומים חוזרים. שיטת האבחון המועדפת היא אולטרסאונד. המחלה מתקדמת בהדרגה לאי ספיקת כליות."},{"t":"המטולוגיה","q":"מה מאפיין אנמיה מיקרוציטית היפוכרומית?","o":["MCV גבוה ו-MCH גבוה","MCV נמוך עם B12 נמוך","MCV תקין וספירת רטיקולוציטים גבוהה","MCV נמוך ו-MCH נמוך, אופייני לחוסר ברזל ולתלסמיה"],"a":3,"e":"אנמיה מיקרוציטית היפוכרומית מאופיינת ב-MCV נמוך (תאים קטנים) ו-MCH או MCHC נמוכים (תוכן המוגלובין נמוך), ואופיינית לחוסר ברזל ולתלסמיה. אנמיה מקרוציטית (MCV גבוה) אופיינית לחוסר B12 ולחומצה פולית. Anisocytosis מתאר כדוריות בגדלים שונים (RDW מוגבר)."},{"t":"המטולוגיה","q":"מה צפוי במדדי הברזל באנמיה מחוסר ברזל?","o":["פריטין גבוה ו-TIBC נמוך","פריטין גבוה ו-TIBC גבוה","פריטין נמוך ו-TIBC נמוך","פריטין נמוך ו-TIBC (טרנספרין) גבוה"],"a":3,"e":"בחוסר ברזל מאגרי הברזל (פריטין) נמוכים, והגוף מגיב בייצור מוגבר של טרנספרין ולכן TIBC גבוה. פריטין הוא חלבון האחסון ומשמש כמדד למאגרים, אך עולה גם כחלבון פאזה חריפה בדלקת. מקורות איבוד ברזל: דימום GI, וסת מוגבר, הריון והנקה, בדיקות דם תכופות וחסר תזונתי - ותמיד יש לברר את המקור."},{"t":"המטולוגיה","q":"מה ההבדל העיקרי בין תלסמיה מייג'ור למינור?","o":["שתיהן מחייבות השתלת מח עצם","תלסמיה מינור חמורה יותר ומחייבת עירויים","תלסמיה מינור היא מחלה קלה שלרוב אינה דורשת טיפול; מייג'ור מחייבת עירויים","אין הבדל קליני"],"a":2,"e":"תלסמיה מינור היא צורה הטרוזיגוטית קלה שלרוב אינה דורשת טיפול. תלסמיה מייג'ור (Cooley anemia) היא הומוזיגוטית וגורמת לאנמיה קשה, עיכוב גדילה והתפתחות ושינויים במבנה השלד (עצמות פנים) עקב היפרפלזיה של מח העצם. הטיפול כולל עירויים חוזרים - ולכן סיכון להמוכרומטוזיס - וטיפול תומך בחומצה פולית ומניעת אוסטאופורוזיס."},{"t":"המטולוגיה","q":"מהי המשמעות של חסר G6PD?","o":["פגיעה בייצור המוגלובין","חסר אנזים המסייע בפינוי מטבוליטים מ-RBC, וגורם להמוליזה בחשיפה לטריגרים","עודף טסיות","פגיעה בייצור גורמי קרישה"],"a":1,"e":"G6PD מסייע בפינוי מטבוליטים מחמצנים מתוך הכדורית האדומה. בחסר האנזים, חשיפה לטריגרים (תרופות מסוימות כמו סולפונאמידים, נפטלן, פול ובנזן, וכן זיהומים) גורמת להמוליזה חריפה. שכיח בדרום מזרח אסיה, ארצות ערב ואפריקה. בהמוליזה: המוגלובין יורד, רטיקולוציטים ובילירובין עולים, והפטוגלובין יורד."},{"t":"המטולוגיה","q":"איזו לוקמיה קשורה לכרומוזום פילדלפיה?","o":["Acute Myeloid Leukemia (AML)","Acute Lymphocytic Leukemia (ALL)","Chronic Lymphocytic Leukemia (CLL)","Chronic Myeloid Leukemia (CML)"],"a":3,"e":"CML קשורה לכרומוזום פילדלפיה, ובבדיקה כרומוזומלית מאותר השינוי האופייני. המחלה מתקדמת בשלבים: כרוני, מואץ (Accelerated - התקדמות השינויים הכרומוזומליים, חולשה, הזעת יתר) ומשבר בלסטי. AML שכיחה מעל גיל 55 עם שיא סביב גיל 70. CLL היא לרוב אסימפטומטית ומתגלה במקרה עם לימפוציטוזיס, וכ-10% עוברות טרנספורמציה ל-Richter עם פרוגנוזה גרועה."},{"t":"המטולוגיה","q":"אילו ממצאים אופייניים למיאלומה נפוצה?","o":["עלייה בהמטוקריט ובכדוריות אדומות","טסיות גבוהות מאוד וקרישיות יתר בלבד","MCV נמוך וחוסר ברזל","חלבון מונוקלונלי (M-Protein), נגעים בעצם, היפרקלצמיה ופגיעה כלייתית"],"a":3,"e":"במיאלומה נפוצה מיוצר חלבון מונוקלונלי (M-Protein) תוך דיכוי שאר הנוגדנים. הביטויים: מעורבות עצם בכ-70% (כאבים, שברים פתולוגיים, היפרקלצמיה, ולעיתים לחץ על חוט השדרה), פגיעה כלייתית מהסננת Ig ומאמילואיד עם עליית קריאטינין, אנמיה וזיהומים חוזרים. בביופסיית מח עצם: ריבוי תאי פלזמה. הטיפול כולל ביספוספונטים לדיכוי אוסטאוקלאסטים."},{"t":"המטולוגיה","q":"מהו החסר בהמופיליה A?","o":["חסר בפקטור IX","חסר ב-vWF בלבד","חסר בפקטור VIII","חסר בוויטמין K"],"a":2,"e":"המופיליה A נגרמת מחסר בפקטור VIII, מרכיב הכרחי במסלול האינטרינזי, ומהווה כ-80% ממקרי ההמופיליה. חומרת המחלה מדורגת לפי רמת הפקטור; ברמה מתחת ל-5% מדובר במחלה קשה עם דימומים למפרקים, לשרירים ולמערכות פנימיות. במחלת פון-וילברנד הפגיעה היא ב-vWF וגורמת בעיקר לדימום בעור ובריריות (אף, וסת מוגבר, המטומות)."},{"t":"המטולוגיה","q":"מהו הסיבוך השכיח ביותר לאחר השתלת תאי גזע אלוגנאית (HSCT)?","o":["פוליציטמיה","היפרקלצמיה","מחלת שתל נגד מאכסן (GVHD)","המופיליה נרכשת"],"a":2,"e":"GVHD הוא הסיבוך השכיח ביותר, ומופיע ב-30-50% מההשתלות מתורם זר. הוא פוגע בעור, בריריות, בעיניים, בכבד וברקמת החיבור, ומופיע בטווח של 3-12 חודשים בצורתו הכרונית. סיבוכים נוספים: זיהומים, דימומים, כשל שתל וחסימה סינוסואידלית כבדית. סימני קליטת השתל (Engraftment) הם עלייה בספירות הדם."},{"t":"אונקולוגיה","q":"מהי המשמעות של Anaplasia?","o":["תאים ממאירים שאיבדו את המראה והתמיינות התא המקורי","החלפת סוג תא אחד בסוג אחר","עלייה במספר התאים ברקמה תקינה","גדילה מוגברת בגודל התא"],"a":0,"e":"Anaplasia מתארת תאים ממאירים שאיבדו את המראה והמבנה התקין של תא המקור; ככל שהתאים שונים יותר מהמקור - הסרטן אגרסיבי יותר. Hyperplasia היא עלייה במספר התאים, Metaplasia היא החלפת סוג תא בסוג אחר, ו-Dysplasia היא צמיחה לא מסודרת - שלושתן שינויים שעשויים להיות הפיכים או טרום-ממאירים."},{"t":"אונקולוגיה","q":"מה ההבדל בין Staging ל-Grading בגידול סרטני?","o":["Staging מתאר את התפשטות הגידול (TNM); Grading את מידת ההתמיינות התאית","Staging מתאר את מידת ההתמיינות; Grading את התפשטות הגידול","שניהם מתארים את אותו דבר","Grading נקבע רק לאחר ניתוח"],"a":0,"e":"Staging מתאר את היקף המחלה לפי TNM - גודל הגידול (T), מעורבות בלוטות לימפה (N) וגרורות מרוחקות (M). Grading (דרגה 1-4) מתאר את מידת ההתמיינות של תאי הסרטן - עד כמה הם דומים לתא המקור. שני המדדים יחד קובעים את הפרוגנוזה ואת תוכנית הטיפול."},{"t":"אונקולוגיה","q":"מטופל מקבל קרינה חיצונית. מה נכון?","o":["המטופל רדיואקטיבי ומהווה סכנה לסביבתו","בני משפחה אינם רשאים לבקר כלל","יש לבודד את המטופל למשך כל תקופת הטיפול","המטופל אינו רדיואקטיבי ואינו מהווה סכנה לסביבתו"],"a":3,"e":"בקרינה חיצונית מקור הקרינה נמצא מחוץ לגוף, ולכן המטופל אינו רדיואקטיבי ואינו מהווה סכנה לסביבתו. לעומת זאת, בברכיתרפיה (קרינה פנימית - זרעים, מחטים או חוטים) יש להקפיד על עקרונות זמן, מרחק ומיגון, ואין לשבץ אנשי צוות בהריון לטיפול במטופלים אלה."},{"t":"אונקולוגיה","q":"איזו הדרכה נכונה לטיפול בעור באזור המוקרן?","o":["שימוש בפלסטרים ותחבושות דביקות על האזור","שפשוף נמרץ להסרת קשקשים","חשיפה לשמש ישירה להאצת הריפוי","הימנעות מפלסטרים דביקים ומגירויים לעור באזור המוקרן"],"a":3,"e":"תופעות עוריות מהקרינה כוללות אודם, צריבה, גרד וגירוי, ומופיעות לרוב מספר ימים לאחר תחילת הטיפול. ההדרכה: הימנעות מפלסטרים ותחבושות דביקות, מסבונים מגרים, מבישום, מחשיפה לשמש ומחום או קור קיצוני, ושימוש בתכשירים לפי הנחיית הצוות. תופעה סיסטמית שכיחה היא עייפות ותשישות."},{"t":"אונקולוגיה","q":"מה ההבדל בין טיפול Adjuvant ל-Neoadjuvant?","o":["Adjuvant ניתן לאחר הניתוח או הקרינה כטיפול משלים; Neoadjuvant ניתן לפני, לצמצום הגידול","Adjuvant ניתן לפני הניתוח; Neoadjuvant לאחריו","שניהם ניתנים רק במחלה גרורתית","אין הבדל ביניהם"],"a":0,"e":"טיפול Adjuvant ניתן לאחר הניתוח או הקרינה כטיפול משלים, כדי להרוג תאים שייתכן ונשארו בגוף ולהפחית את הסיכון לחזרת המחלה. טיפול Neoadjuvant ניתן לפני הניתוח כדי לכווץ את הגידול ולאפשר גישה ניתוחית או ניתוח משמר. בסרטן השד, למשל, טיפול נאו-אדג'ובנטי עשוי לאפשר ניתוח משמר שד במקום כריתה מלאה."},{"t":"אונקולוגיה","q":"מהו מנגנון הפעולה של Bevacizumab (Avastin)?","o":["עיכוב אנגיוגנזה על ידי חסימת VEGF","הרס ישיר של DNA כמו כימותרפיה","חסימת קולטני אסטרוגן","דיכוי מח העצם"],"a":0,"e":"Bevacizumab הוא נוגדן חד-שבטי המכוון ל-VEGF ומעכב אנגיוגנזה - יצירת כלי דם חדשים שמזינים את הגידול. זהו טיפול ממוקד מטרה (targeted therapy), שנחשב פחות רעיל מכימותרפיה כי הוא פוגע פחות בתאים תקינים. תופעות לוואי אופייניות לטיפולים ממוקדי מטרה כוללות יתר לחץ דם, פגיעה בריפוי פצעים, רעילות עורית ופרוטאינוריה."},{"t":"אונקולוגיה","q":"מהי המטרה העיקרית של טיפול פליאטיבי (תומך)?","o":["ריפוי המחלה בכל מחיר","הקלה בתסמינים ובסבל ושיפור איכות החיים","הארכת חיים בלבד ללא התייחסות לתסמינים","הפסקת כל טיפול רפואי"],"a":1,"e":"טיפול פליאטיבי מטרתו הקלה בתסמינים ובסבל ושיפור איכות החיים, והוא ניתן לצד טיפולים מאריכי חיים ולא רק בסופם. הוא מבוצע על ידי צוות רב-מקצועי (רופא, אחות, עובדת סוציאלית, מלווה רוחנית ועוד). בישראל, חוק החולה הנוטה למות מסדיר את ההיבטים המשפטיים, וטופס הנחיות מקדימות כולל גם מינוי מיופה כוח לטיפול רפואי."},{"t":"מערכת חיסון","q":"אילו תאים הם 'המגיבים הראשונים' בתגובה הדלקתית?","o":["לימפוציטים מסוג B","אאוזינופילים","תאי פלזמה","נויטרופילים"],"a":3,"e":"נויטרופילים הם המגיבים הראשונים ומתחילים את התהליך הדלקתי באמצעות פגוציטוזיס. מקרופאגים בולעים ומפרקים ביתר יעילות ומציגים אנטיגן ללימפוציטים. תאי T מסוג CD4 (Helper) מתאמים את התגובה, תאי T ציטוטוקסיים הורסים תאים מזוהמים, ותאי B מייצרים נוגדנים (חיסון הומורלי). אאוזינופילים מעורבים בתגובות אלרגיות ובזיהומים טפיליים."},{"t":"מערכת חיסון","q":"לאיזה סוג רגישות יתר שייכת תגובה אנפילקטית?","o":["Type IV - מאוחרת, מתווכת תאי T","Type II - ציטוטוקסית","Type III - קומפלקסים חיסוניים","Type I - מיידית, מתווכת IgE"],"a":3,"e":"אנפילקסיס היא רגישות יתר מסוג I - תגובה מיידית (תוך שניות עד דקות) המתווכת על ידי IgE ושחרור היסטמין וציטוקינים מתאי מאסט. Type II ציטוטוקסית - למשל תגובה למנת דם לא מתאימה ואנמיה המוליטית. Type III - קומפלקסים חיסוניים, כמו ב-SLE. Type IV מאוחרת ומתווכת תאי T - למשל דרמטיטיס מגע ומבחן מנטו."},{"t":"מערכת חיסון","q":"מהו התהליך הפתופיזיולוגי המרכזי בדלקת מפרקים שגרונית (RA)?","o":["דלקת אוטואימונית של הקרום הסינוביאלי עם יצירת פאנוס והרס סחוס ועצם","פירוק סחוס משחיקה מכנית","שקיעת קריסטלים של חומצה אורית במפרק","זיהום חיידקי במפרק"],"a":0,"e":"ב-RA נוצרים קומפלקסים של אנטיגן-נוגדן המפעילים תגובה דלקתית כרונית בקרום הסינוביאלי, עד יצירת פאנוס שהורס סחוס ועצם וגורם לחוסר יציבות ולדפורמציות. פירוק סחוס משחיקה מכנית אופייני ל-OA, שקיעת קריסטלים - לשיגדון, וזיהום - לארתריטיס ספטית. ב-RA מופיעים גם RF ו-Anti-CCP וסיבוכים סיסטמיים כמו וסקוליטיס ותסמונת שגרן."},{"t":"מערכת חיסון","q":"מה מאפיין את תסמונת שגרן (Sjögren)?","o":["התקשות העור ופגיעה בוושט","פריחה פרפרית בפנים","כאבים כרוניים מפושטים ללא סימני דלקת","יובש בריריות - עיניים ופה - ולעיתים סימנים ראומטיים נוספים"],"a":3,"e":"תסמונת שגרן מאופיינת ביובש ריריות - עיניים ופה - עם סכנה לפגיעה קשה בראייה, ולעיתים מלווה בסימנים ראומטיים ובנוירופתיה. סקלרודרמה מאופיינת בהתקשות העור, פנים כמסכה ופגיעה בתנועתיות הוושט (CREST). פיברומיאלגיה - כאבים כרוניים מפושטים בשרירים ובמפרקים ללא סימני דלקת. פריחה פרפרית אופיינית ל-SLE."},{"t":"מערכת חיסון","q":"מהו הסיכון המרכזי בדלקת עורק הרקה (Giant Cell Arteritis)?","o":["אובדן ראייה","אי ספיקת כליות","אי ספיקת לב","שברים פתולוגיים"],"a":0,"e":"GCA היא דלקת של כלי דם גדולים, במיוחד עורק הרקה, ומתבטאת בכאבי ראש (כ-60%), רגישות בקרקפת, כאב בלעיסה, וסימנים כלליים כמו חום, עייפות וירידה במשקל, עם ESR מוגבר מאוד. הסיכון המרכזי הוא אובדן ראייה בלתי הפיך, ולכן זהו מצב חירום המחייב התחלת סטרואידים מיידית. לעיתים מלווה בפולימיאלגיה ראומטיקה עם נוקשות בוקר מעל 45 דקות בצוואר, בכתפיים ובאגן."},{"t":"מערכת חיסון","q":"איזו מחלה מאופיינת בדלקת כרונית של עמוד השדרה, שכיחה יותר בגברים, ומתחילה בגילאי 20-30?","o":["אוסטאוארתריטיס","שיגדון","פיברומיאלגיה","Ankylosing Spondylitis"],"a":3,"e":"Ankylosing Spondylitis שייכת לקבוצת ה-Spondyloarthropathies: דלקת כרונית של עמוד השדרה והרקמות מסביב, מתחילה בגילאי 20-30 ושכיחה יותר בגברים, עם כאב גב דלקתי ונוקשות בוקר. קבוצה זו כוללת גם ארתריטיס פסוריאטית וארתריטיס תגובתית (המתפתחת לאחר זיהום). הטיפול כולל NSAIDs, פיזיותרפיה ולעיתים טיפולים ביולוגיים."},{"t":"עור וכוויות","q":"מה מטרת בדיקת הדיאסקופיה (Diascopy) בבדיקת נגע עורי?","o":["זיהוי אלרגיה מיידית","הערכת עומק הנגע במיקרוסקופ","לחיצה על הנגע בזכוכית כדי לבדוק אם האודם נעלם - הבחנה בין כלי דם לדימום","זיהוי פטריות באור UV"],"a":2,"e":"בדיאסקופיה לוחצים על הנגע בזכוכית: אודם שנעלם בלחיצה מקורו בהתרחבות כלי דם, ואודם שאינו נעלם מעיד על דימום לתוך העור (פורפורה/פטכיות). בדיקת מנורת Wood משתמשת באור UV לזיהוי שינויי פיגמנט ופלואורסנציה אופיינית. Skin Prick Test מזהה אלרגיה מיידית (Type I, IgE) ונקרא תוך דקות, ו-Patch Test נקרא לאחר 48-96 שעות ומזהה רגישות מאוחרת."},{"t":"עור וכוויות","q":"מה מאפיין פסוריאזיס מסוג Plaque?","o":["רבדים אדומים מכוסי קשקש כסוף, בעיקר במרפקים, בברכיים, בקרקפת ובגב התחתון","שלפוחיות מלאות מוגלה על כפות הידיים","נגעים טבעתיים אדומים עם קילוף היקפי","שלפוחיות לאורך דרמטום"],"a":0,"e":"Plaque Psoriasis הוא הסוג השכיח: רבדים אדומים מכוסי קשקש, בעיקר במרפקים, בברכיים, בקרקפת ובגב התחתון. סוגים נוספים: Inverse (בקפלי העור), Pustular (שלפוחיות מוגלתיות) ו-Erythrodermic (מעורבות רוב שטח הגוף). המחלה כרונית עם תקופות החמרה והטבה, ומעורבת בה פעילות יתר של מערכת החיסון. נגעים טבעתיים עם קילוף אופייניים ל-Tinea corporis."},{"t":"עור וכוויות","q":"מהי הטטרדה האטופית?","o":["פסוריאזיס, ויטיליגו, אלופציה ודלקת מפרקים","דרמטיטיס אטופית, אסתמה, נזלת אלרגית ואלרגיה למזון","אקנה, רוזציאה, סבוריאה וגרד","גרדת, כינמת, פשפשי מיטה וטינאה"],"a":1,"e":"הטטרדה האטופית כוללת דרמטיטיס אטופית (אקזמה), אסתמה, נזלת אלרגית ואלרגיה למזון, ומשקפת תגובת יתר חיסונית מסוג Th2. אופייני מהלך של מעבר ממחלה עורית לאסתמה ולנזלת אלרגית, בעיקר בילדים עם רקע אטופי. הביטויים: אודם, גרד והפרשה, ובגרד כרוני - ליכניפיקציה. הטיפול מתמקד בשיקום מחסום העור והרטבה קבועה."},{"t":"עור וכוויות","q":"מה נכון לגבי הטיפול בגרדת (Scabies)?","o":["מספיק לטפל במטופל בלבד","יש לטפל בכל בני הבית ובמגעים הקרובים, ולכבס מצעים ובגדים","הטיפול הוא אנטיביוטיקה פומית","אין צורך בטיפול; התופעה חולפת מעצמה"],"a":1,"e":"גרדת נגרמת מטפיל החופר מחילות בעור וגורמת לגרד עז, במיוחד בלילה, עם נגעים אופייניים בין האצבעות ובקפלי העור. הטיפול הוא מקומי (למשל פרמתרין) וחייב לכלול את כל בני הבית והמגעים הקרובים - גם אם אינם סימפטומטיים - לצד כביסת מצעים, מגבות ובגדים בחום גבוה. כינת ערווה בילדים מהווה Red Flag המחייב בירור."},{"t":"עור וכוויות","q":"מה מאפיין כוויה בעובי מלא (דרגה III)?","o":["אודם ללא שלפוחיות, כואבת מאוד","עור יבש, לבן או חרוך, ללא כאב עקב הרס קצות העצבים","שלפוחיות, עור לח ואדום, כואבת מאוד","מעורבות שריר ועצם עם דימום פעיל"],"a":1,"e":"כוויה בעובי מלא (דרגה III) פוגעת בכל שכבות העור: העור יבש, לבן, חום או שחור וקשיח (eschar), ואינה כואבת בשל הרס קצות העצבים. דרגה I - אודם יבש ללא שלפוחיות, כואבת, מחלימה כשבוע ללא צלקות. דרגה II - שלפוחיות, עור לח ואדום, כאב עז ורגישות לאוויר קר. דרגה IV - מעבר לעור, לשריר, לגיד ולעצם."},{"t":"עור וכוויות","q":"אילו סימנים מחשידים לפגיעת שאיפה בנפגע כוויות?","o":["כוויות בגפיים בלבד","אירוע בחלל סגור, כוויות בפנים או בצוואר, צרידות, שיעור פנים חרוך וליחה מכוסה פיח","תפוקת שתן מוגברת","היעדר כאב באזור הכוויה"],"a":1,"e":"הסימנים לפגיעת שאיפה: אירוע שהתרחש בחלל סגור, כוויות בפנים או בצוואר, צרידות ושינויים בקול, שיעול יבש וסטרידור, שערות פנים חרוכות, ליחה דמית או מכוסה פיח, ואודם ושלפוחיות ברירית הפה. האבחון כולל גזים בדם עורקי ורמת carboxyhemoglobin וברונכוסקופיה. מתן חמצן 100% מקצר את זמן מחצית החיים של קרבוקסיהמוגלובין מ-4 שעות ל-45 דקות; יש לשקול אינטובציה מוקדמת."},{"t":"אף אוזן גרון","q":"מהו תפקידה העיקרי של החצוצרה (Eustachian Tube)?","o":["העברת גלי קול לאוזן הפנימית","ייצור צרומן","השוואת לחצים בין האוזן התיכונה לאוויר החיצוני","שמירה על שיווי משקל"],"a":2,"e":"החצוצרה מקשרת בין האוזן התיכונה לאף-לוע ותפקידה לאזן לחצים. האוזן התיכונה מתפקדת כחדר סגור שבו הלחץ נשמר; כשהחצוצרה אינה מתפקדת מצטברות הפרשות ומתפתחת אוטיטיס מדיה. בקרע של עור התוף המטופל חש כאב חד ולאחריו הקלה, עקב השוואת הלחצים. שיווי המשקל מתבצע בתעלות החצי-מעגליות באוזן הפנימית."},{"t":"אף אוזן גרון","q":"מה מבדיל בין מחלת מנייר ל-BPPV?","o":["במנייר ההתקף חולף תוך 20 שניות במנוחה","ב-BPPV יש תמיד ירידת שמיעה","ב-BPPV הסחרחורת קצרה ותלוית תנוחה; במנייר יש התקפים ממושכים עם טיניטוס וירידת שמיעה","במנייר אין כל תסמין שמיעתי"],"a":2,"e":"ב-BPPV הסחרחורת מופעלת על ידי שינוי תנוחת הראש ונמשכת שניות ספורות (עד כ-20 שניות במנוחה מוחלטת), ללא ירידת שמיעה. מחלת מנייר מאופיינת בהתקפי ורטיגו ממושכים המלווים בטיניטוס, בתחושת מלאות באוזן ובירידת שמיעה מתקדמת. הטיפול במנייר כולל תזונה דלת נתרן, משתנים ותרופות מדכאות וסטיבולריות."},{"t":"אף אוזן גרון","q":"מהו הטיפול בקו הראשון בדום נשימה חסימתי בשינה (OSA)?","o":["שינוי אורחות חיים - ירידה במשקל והפסקת עישון - ולאחר מכן CPAP","ניתוח בלוע באופן מיידי","טרכאוסטומיה","טיפול אנטיביוטי ממושך"],"a":0,"e":"הטיפול ב-OSA מתחיל בשינוי אורחות חיים - ירידה במשקל, הפסקת עישון והימנעות מאלכוהול לפני השינה - ולאחר מכן CPAP. שאלון STOP-BANG משמש להערכת סיכון (3 תשובות חיוביות ומעלה = סיכון גבוה). האבחנה מחייבת בדיקה אובייקטיבית - מעבדת שינה ביתית או PSG מלאה - ואינה אבחנה קלינית בלבד. המטופל האופייני: גבר, מעשן, מבוגר ועם השמנת יתר."},{"t":"אף אוזן גרון","q":"מה מומלץ לגבי משך השימוש בתרסיסי אף מכווצי כלי דם (כמו Oxymetazoline)?","o":["ניתן להשתמש ללא הגבלת זמן","עד 72 שעות בלבד, ולאחר מכן להפסיק או לעבור לסטרואידים אינטרה-נזאליים","לפחות חודש רצוף","רק בשילוב עם אנטיביוטיקה"],"a":1,"e":"תרסיסי אף מכווצי כלי דם מומלצים לשימוש של עד 72 שעות בלבד, בשל תופעת ה-Rhinitis Medicamentosa - גודש חוזר (rebound) לאחר שימוש ממושך. לאחר מכן יש להפסיק או לעבור לסטרואידים אינטרה-נזאליים (פלוטיקזון, מומטזון). ברינוסינוסיטיס רוב המקרים ויראליים, והטיפול כולל שטיפות אף בסליין; אנטיביוטיקה שמורה למיעוט המקרים החיידקיים."},{"t":"עיניים","q":"מדוע פגיעה בקרנית עלולה לגרום לבצקת בקרנית?","o":["כי הקרנית עשירה בכלי דם","כי שכבת האנדותל אינה מתחדשת ואחראית על שאיבת נוזלים מהסטרומה","כי הקרנית מכילה מלנוציטים","כי הקרנית מחוברת ישירות לעצב הראייה"],"a":1,"e":"הקרנית היא רקמה שקופה וחסרת כלי דם. שכבת האנדותל שלה אינה מתחדשת ותפקידה לשמור על שקיפות באמצעות שאיבת נוזלים מהסטרומה; פגיעה בה גורמת לבצקת ולירידה בשקיפות. בקרטוקונוס ניתן לבצע DSEK - השתלה המשאירה את ממברנת דסמט ואת שכבת האנדותל."},{"t":"עיניים","q":"במטופל עם COPD או בלוק לבבי - איזו קבוצת טיפות לגלאוקומה מחייבת זהירות מיוחדת?","o":["חוסמי ביתא (כמו Timolol)","פרוסטגלנדינים","מעכבי קרבוניק אנהידראז מקומיים","דמעות מלאכותיות"],"a":0,"e":"חוסמי ביתא מקומיים (Timolol) נספגים סיסטמית ועלולים לגרום לברונכוספזם ולברדיקרדיה, ולכן יש להיזהר במטופלים עם COPD, אסתמה או בלוק לבבי. הדרכה חשובה: לחיצה על פינת העין (occlusion) לאחר הטפטוף להפחתת ספיגה סיסטמית. מטרת הטיפול היא הורדת ה-IOP בכ-30%, ומתחילים בעין אחת כשהשנייה משמשת ביקורת."},{"t":"עיניים","q":"מה ההבדל בין AMD יבש לרטוב?","o":["ביבש ההידרדרות מהירה מאוד; ברטוב איטית","אין הבדל ביניהם","ביבש נפגעת הראייה ההיקפית בלבד","ברטוב יש ניאווסקולריזציה ופגיעה מהירה בראייה המרכזית; ביבש ההידרדרות איטית"],"a":3,"e":"ניוון מקולרי גילי פוגע בראייה המרכזית ולא בהיקפית. הצורה היבשה מתקדמת לאט, ואילו הצורה הרטובה (Neovascular/Exudative) מאופיינת בצמיחת כלי דם חדשים ובדליפה, וגורמת לפגיעה מהירה בראייה המרכזית. בצורה הרטובה הטיפול מתמקד בהאטת ההתקדמות (הזרקות אנטי-VEGF). מטופלים מודרכים לבדוק את עצמם בלוח אמסלר, עין אחת בכל פעם, ולדווח על קווים גליים או משבצות חסרות."},{"t":"עיניים","q":"מהי פרסביופיה (Presbyopia)?","o":["קוצר ראייה מגיל צעיר","ירידה ביכולת האקומודציה עם הגיל, הגורמת לקושי בראייה מקרוב","עקמת בקרנית","ראייה כפולה"],"a":1,"e":"פרסביופיה היא ירידה ביכולת האקומודציה (התמקדות על עצמים קרובים) עם הגיל, בשל התקשות העדשה. Myopia היא קוצר ראייה (התמונה נופלת לפני הרשתית), Hyperopia היא רוחק ראייה, ו-Astigmatism הוא עיוות מאי-סדירות בעקמומיות הקרנית. חוזק העדשה הנדרש לתיקון טעות תשבורת נמדד בדיופטרים."},{"t":"שד","q":"מה מאפיין פיברואדנומה בשד?","o":["גוש חלק, נייד וגמיש, שכיח בגילאי הפריון","גוש קשיח, מקובע ולא סדיר, לרוב ללא כאב","נגע עורי אדום עם קילוף","הפרשה דמית מהפטמה"],"a":0,"e":"פיברואדנומה היא גידול שפיר האופייני לגילאי הפריון: גוש חלק, נייד וגמיש. ציסטות שכיחות בגילאי 30-55 וקשורות כנראה לאסטרוגן, ולעיתים ניתן לשאוב מהן נוזל. גוש קשיח, מקובע ולא סדיר מחשיד לממאירות. הפרשה דמית מהפטמה עשויה להעיד על Intraductal papilloma ומחייבת בירור."},{"t":"שד","q":"מה מאפיין סרטן שד דלקתי (IBC)?","o":["אודם, חום ומראה של קליפת תפוז (peau d'orange); מצב אגרסיבי הדורש טיפול מיידי","גוש קטן ללא כל שינוי בעור","מחלה שפירה שאינה דורשת טיפול","נגע מוגבל לצינורית ללא פלישה"],"a":0,"e":"סרטן שד דלקתי מתבטא באודם, חום ובצקת עם מראה קליפת תפוז (peau d'orange), ומהווה מצב אגרסיבי הדורש טיפול מיידי - לעיתים מטעים כדלקת. DCIS הוא סרטן לא פולשני המוגבל לצינורית, LCIS הוא ממצא לובולרי in situ המהווה סמן סיכון, וסרטן פולשני חודר מעבר לדופן הצינורית או האונה."},{"t":"שד","q":"מהו היתרון של ביופסיית בלוטת הזקיף (Sentinel Lymph Node Biopsy) על פני ALND?","o":["מבוצעת רק לאחר כימותרפיה","מסירה יותר בלוטות ולכן מדויקת יותר","אינה דורשת הרדמה כלל","מאפשרת הערכת מעורבות בלוטות עם סיכון נמוך יותר ללימפאדמה"],"a":3,"e":"ביופסיית בלוטת הזקיף מזהה את הבלוטה הראשונה שאליה מתנקזת הלימפה מהגידול, באמצעות איזוטופ רדיואקטיבי או צבע - ולכן אינה מבוצעת בהריון. אם היא נקייה, ניתן להימנע מ-ALND ומהסיכון המשמעותי ללימפאדמה, לצלוליטיס ולשינויים תחושתיים. אפשרויות שחזור השד כוללות שתלי סיליקון או שחזור עצמוני כמו DIEP ו-Latissimus Dorsi."}];
const KEYS = ["א","ב","ג","ד"];
const state = {};           // idx -> chosen option index
const quiz = document.getElementById('quiz');

function render(){
  quiz.innerHTML = '';
  const f = document.getElementById('filter').value;
  DATA.forEach((item, i) => {
    if (f && item.t !== f) return;
    const card = document.createElement('div');
    card.className = 'q';
    card.dataset.i = i;
    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = '<span class="num">שאלה ' + (i+1) + '</span><span class="chip">' + item.t + '</span>';
    card.appendChild(head);
    const qt = document.createElement('p');
    qt.className = 'qtext';
    qt.textContent = item.q;
    card.appendChild(qt);
    const ul = document.createElement('ul');
    ul.className = 'opts';
    item.o.forEach((txt, j) => {
      const li = document.createElement('li');
      li.className = 'opt';
      li.dataset.j = j;
      li.innerHTML = '<span class="k">' + KEYS[j] + '.</span><span></span>';
      li.lastChild.textContent = txt;
      li.addEventListener('click', () => choose(i, j));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const v = document.createElement('div'); v.className = 'verdict'; card.appendChild(v);
    const ex = document.createElement('div');
    ex.className = 'exp';
    ex.innerHTML = '<b>הסבר</b>';
    const p = document.createElement('span'); p.textContent = item.e; ex.appendChild(p);
    card.appendChild(ex);
    quiz.appendChild(card);
    if (state[i] !== undefined) paint(card, i);
  });
  stats();
}

function choose(i, j){
  if (state[i] !== undefined) return;      // one attempt per question
  state[i] = j;
  const card = quiz.querySelector('.q[data-i="'+i+'"]');
  paint(card, i);
  stats();
}

function paint(card, i){
  const item = DATA[i], pick = state[i];
  card.querySelectorAll('.opt').forEach(li => {
    const j = +li.dataset.j;
    li.classList.add('lock');
    if (j === item.a) li.classList.add('right');
    else if (j === pick) li.classList.add('wrong');
  });
  const v = card.querySelector('.verdict');
  const ok = pick === item.a;
  v.className = 'verdict show ' + (ok ? 'y' : 'n');
  v.textContent = ok ? '✓ תשובה נכונה' : '✗ תשובה שגויה — הנכונה: ' + KEYS[item.a];
  card.querySelector('.exp').classList.add('show');
}

function stats(){
  const done = Object.keys(state).length;
  let ok = 0;
  for (const k in state) if (state[k] === DATA[k].a) ok++;
  const bad = done - ok;
  document.getElementById('rPos').textContent = done + '/' + DATA.length;
  document.getElementById('rOk').textContent = ok;
  document.getElementById('rBad').textContent = bad;
  document.getElementById('rPct').textContent = done ? Math.round(ok/done*100) : '—';
  document.getElementById('rBar').style.width = (done/DATA.length*100) + '%';
}

function summary(){
  const box = document.getElementById('sumbox');
  const by = {};
  DATA.forEach((item, i) => {
    const b = by[item.t] || (by[item.t] = {n:0, done:0, ok:0});
    b.n++;
    if (state[i] !== undefined){ b.done++; if (state[i] === item.a) b.ok++; }
  });
  const done = Object.keys(state).length;
  let ok = 0; for (const k in state) if (state[k] === DATA[k].a) ok++;
  const pct = DATA.length ? Math.round(ok/DATA.length*100) : 0;
  const cls = pct >= 80 ? 'g' : (pct >= 60 ? 'a' : 'r');
  let h = '<h2>סיכום ביצועים</h2>';
  h += '<div class="score"><span class="pill '+cls+'">' + pct + '</span></div>';
  h += '<p style="color:var(--dim);font-size:.88rem;margin:10px 0 16px">' +
       ok + ' תשובות נכונות מתוך ' + DATA.length + ' · נענו ' + done +
       ' · ציון עובר בקורס: 60</p>';
  h += '<table><tr><th>נושא</th><th>נענו</th><th>נכונות</th><th>אחוז</th></tr>';
  Object.keys(by).forEach(t => {
    const b = by[t];
    const p = b.done ? Math.round(b.ok/b.done*100) : null;
    const c = p === null ? '' : (p >= 80 ? 'g' : (p >= 60 ? 'a' : 'r'));
    h += '<tr><td>' + t + '</td><td class="n">' + b.done + '/' + b.n + '</td>' +
         '<td class="n">' + b.ok + '</td><td class="n">' +
         (p === null ? '<span style="color:var(--dim)">—</span>'
                     : '<span class="pill ' + c + '">' + p + '%</span>') + '</td></tr>';
  });
  h += '</table>';
  box.innerHTML = h;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btnSum').addEventListener('click', summary);
document.getElementById('btnReset').addEventListener('click', () => {
  for (const k in state) delete state[k];
  document.getElementById('sumbox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('btnReveal').addEventListener('click', () => {
  quiz.querySelectorAll('.q').forEach(card => {
    const i = +card.dataset.i;
    if (state[i] === undefined){
      card.querySelectorAll('.opt').forEach(li => {
        li.classList.add('lock');
        if (+li.dataset.j === DATA[i].a) li.classList.add('right');
      });
      card.querySelector('.exp').classList.add('show');
    }
  });
});
document.getElementById('filter').addEventListener('change', render);

(function init(){
  const sel = document.getElementById('filter');
  const counts = {};
  DATA.forEach(d => counts[d.t] = (counts[d.t] || 0) + 1);
  Object.keys(counts).forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t + ' (' + counts[t] + ')';
    sel.appendChild(o);
  });
  render();
})();
</script>
</body>
</html>
