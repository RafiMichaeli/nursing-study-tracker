<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבחן תרגול 4 - סיעוד המבוגר חלק ב</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>%F0%9F%A9%BA</text></svg>">
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:#182234; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --teal:#2dd4bf; --teal-d:#0d9488;
  --coral:#fb7185; --amber:#fbbf24; --ok:#34d399;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Rubik,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65;
     -webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:16px}

header{background:linear-gradient(180deg,#132033,#0f172a);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:.9rem}
.tagline{font-family:var(--mono);color:var(--teal);font-size:.78rem;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:6px}

.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-family:var(--mono);font-size:.8rem;color:var(--dim);min-width:92px}
.cell b{display:block;color:var(--txt);font-size:1.15rem;line-height:1.25;letter-spacing:-.02em}
.cell.ok b{color:var(--ok)} .cell.bad b{color:var(--coral)} .cell.t b{color:var(--teal)}

.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal));
  width:0;transition:width .3s ease}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
select,button{font-family:inherit;font-size:.88rem;background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--teal-d)}
button.primary{background:var(--teal-d);border-color:var(--teal-d);color:#04201c;font-weight:700}
button.primary:hover{background:var(--teal)}
.grow{flex:1}

.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;
   padding:18px 20px;margin-bottom:14px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--mono);color:var(--teal);font-size:.82rem;font-weight:700}
.chip{font-size:.72rem;background:#0b3b38;color:var(--teal);border:1px solid #115e59;
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.qtext{font-size:1.02rem;margin:0 0 14px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#141d2e;border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-d);background:#16233a}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;min-width:1.4em}
.opt.sel{border-color:var(--teal);background:#122c2b}
.opt.right{border-color:var(--ok);background:#0d2a20}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--coral);background:#2c1420}
.opt.wrong .k{color:var(--coral)}
.opt.lock{cursor:default}
.exp{margin-top:12px;border-inline-start:3px solid var(--teal-d);background:#101a2b;
  border-radius:0 10px 10px 0;padding:11px 14px;font-size:.92rem;color:#cbd5e1;display:none}
.exp.show{display:block}
.exp b{color:var(--teal);font-family:var(--mono);font-size:.78rem;display:block;margin-bottom:4px;
  letter-spacing:.05em;text-transform:uppercase}
.verdict{font-family:var(--mono);font-size:.8rem;margin-top:10px;display:none}
.verdict.show{display:block}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--coral)}

.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  margin-bottom:16px;display:none}
.sumbox.show{display:block}
.sumbox h2{margin:0 0 12px;font-size:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:.8rem;font-family:var(--mono)}
td.n{font-family:var(--mono)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-family:var(--mono);font-size:.8rem}
.pill.g{background:#0d2a20;color:var(--ok)} .pill.a{background:#2e2410;color:var(--amber)}
.pill.r{background:#2c1420;color:var(--coral)}
.score{font-family:var(--mono);font-size:2.4rem;line-height:1;letter-spacing:-.03em}

footer{color:var(--dim);font-size:.8rem;text-align:center;padding:22px 0 34px}
@media(max-width:520px){.wrap{padding:12px}.cell{min-width:74px}h1{font-size:1.15rem}}
@media print{body{background:#fff;color:#000}.toolbar,.bar{display:none}
  .q,.sumbox,header{border-color:#bbb;background:#fff;color:#000}
  .exp{display:block!important;background:#f5f5f5;color:#000}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="tagline">סיעוד המבוגר · חלק ב' · מבחן תרגול</div>
  <h1>מבחן תרגול 4 — מעורב</h1>
  <div class="sub">80 שאלות חדשות בסגנון בחינה: כ-70% תרחישים קליניים וכ-30% שאלות ידע ישיר, ללא חפיפה למבחנים 1-3.</div>
  <div class="readout">
    <div class="cell t">שאלה<b id="rPos">0/80</b></div>
    <div class="cell ok">נכונות<b id="rOk">0</b></div>
    <div class="cell bad">שגויות<b id="rBad">0</b></div>
    <div class="cell">ציון<b id="rPct">—</b></div>
  </div>
  <div class="bar"><i id="rBar"></i></div>
</header>

<div class="toolbar">
  <select id="filter"><option value="">כל הנושאים (80 שאלות)</option></select>
  <span class="grow"></span>
  <button id="btnSum" class="primary">סיכום וציון</button>
  <button id="btnReveal">הצג את כל התשובות</button>
  <button id="btnReset">איפוס</button>
</div>

<div class="sumbox" id="sumbox"></div>
<div id="quiz"></div>

<footer>נבנה מהסילבוס ומהמצגות של הקורס · ברונר וסודארת' מהדורה 15 · 80 שאלות</footer>
</div>

<script>
const DATA = [
{t:"נוירולוגיה",q:"מטופל ביום ה-5 לאחר דימום תת-עכבישי. נתרן בדם 121, תפוקת שתן 4.5 ליטר ביממה, ירידה במשקל, CVP נמוך ונטייה לצניחת לחץ דם. מה ההסבר הסביר ומה הטיפול?",o:["SIADH — יש להגביל נוזלים ל-800 מ״ל ליממה","Cerebral Salt Wasting — יש להחזיר נוזלים ונתרן (סליין, ולעיתים סליין היפרטוני)","סוכרת אינסיפידוס מרכזית — יש לתת דסמופרסין","עומס נוזלים — יש לתת furosemide"],a:1,e:"שני המצבים גורמים להיפונתרמיה לאחר SAH, אך ההבחנה ביניהם קריטית. ב-SIADH המטופל נורמו/היפרוולמי עם תפוקת שתן נמוכה, וב-Cerebral Salt Wasting יש איבוד נתרן ראשוני בכליה עם תת-נפח: פוליאוריה, ירידה במשקל ו-CVP נמוך. הטיפול הפוך — החזרת נוזלים ונתרן; הגבלת נוזלים תחמיר את התת-נפח ותגביר את הסיכון לאיסכמיה מואחרת."},
{t:"נוירולוגיה",q:"מטופל 6 שעות לאחר קרניוטומיה. האחות מבחינה שהאישון הימני מורחב ואינו מגיב לאור, רמת הערנות יורדת, לחץ הדם 198/72 והדופק 46. מה המשמעות ומה הפעולה?",o:["תגובה צפויה לאחר ניתוח מוח — יש להמשיך בניטור שגרתי","השפעת משככי כאבים — יש להפחית את מינון המורפין ולהעריך מחדש בעוד שעה","התקף פרכוסי מוקדי — יש לתת בנזודיאזפין","עלייה חדה בלחץ התוך-גולגולתי עם חשד להרניאציה — דיווח מיידי, הרמת ראש המיטה לכ-30 מעלות בקו ישר והכנה למתן מניטול"],a:3,e:"יתר לחץ דם עם לחץ דופק מתרחב, ברדיקרדיה ודיכוי נשימתי הם שלישיית קושינג — תגובה מאוחרת ומסוכנת לעליית ICP. אישון מורחב חד-צדדי שאינו מגיב מעיד על לחץ על עצב III בהרניאציה אונקלית. זהו מצב חירום המחייב דיווח מיידי, מיקום ראש נייטרלי ומוגבה וטיפול להורדת ICP."},
{t:"נוירולוגיה",q:"מטופל 4 שעות לאחר Carotid Endarterectomy מתלונן על לחץ בצוואר, קולו צרוד והוא מתקשה לבלוע. בבדיקה נפיחות מתגברת בצד הניתוח. מה הפעולה הנכונה?",o:["להרגיע, לתת לגימות מים קרים ולעקוב בהמשך המשמרת","להניח חבישה לוחצת על הצוואר","להושיב, להניח קרח ולהעריך מחדש בעוד שעה","לדווח מיידית — חשד להמטומה לוחצת המסכנת את נתיב האוויר, ולהיערך לפתיחת הפצע ולאבטחת נתיב אוויר"],a:3,e:"נפיחות מתגברת בצוואר, צרידות וקושי בבליעה לאחר אנדארטרקטומיה מחשידים להמטומה לוחצת. הלחץ עלול לחסום את נתיב האוויר תוך דקות. חבישה לוחצת רק תחמיר את הלחץ. הפעולה היא דיווח מיידי, הערכת נתיב אוויר והיערכות לפינוי ההמטומה."},
{t:"נוירולוגיה",q:"מטופל עם מחלת פרקינסון ׳נתקע׳ בפתח הדלת ואינו מצליח להתחיל בצעד (Freezing). מה ההתערבות הסיעודית המתאימה?",o:["למשוך אותו בזרוע כדי ׳להתניע׳ את ההליכה","להושיב אותו בכיסא גלגלים בכל מעבר בין חדרים","להנחות אותו להתנדנד מצד לצד, להרים ברך כמו בצעידה במקום או לפסוע מעל קו מדומה על הרצפה","לבקש ממנו למהר ולצעוד מהר יותר"],a:2,e:"קפיאה בהליכה שכיחה במעברי מפתן ובפניות. רמזים חושיים וקצביים (קו על הרצפה, ספירה, מוזיקה, הרמת ברך) עוקפים את המעגלים הפגועים ומאפשרים להתחיל תנועה. משיכה בזרוע מסכנת בנפילה, והאצה מחמירה את הקפיאה."},
{t:"נוירולוגיה",q:"מטופלת עם פרקינסון הנוטלת Levodopa/Carbidopa מדווחת שכשעה לאחר ארוחת צהריים בשרית התרופה ׳פחות עובדת׳. מה ההסבר וההמלצה?",o:["חלבון מהמזון מתחרה עם הלבודופה על הספיגה במעי ועל המעבר דרך מחסום הדם-מוח — יש לתאם את מועדי התרופה ביחס לארוחות ולפזר את צריכת החלבון לאורך היום","יש להפסיק את התרופה ליום ולחדשה למחרת","יש ליטול את התרופה דווקא עם ארוחה עתירת חלבון כדי לשפר ספיגה","מדובר בתופעת לוואי של קרבידופה ואין קשר למזון"],a:0,e:"לבודופה היא חומצת אמינו נייטרלית גדולה המתחרה עם חומצות אמינו מהמזון על אותם נשאים. ארוחה עתירת חלבון סמוך למתן מפחיתה את זמינות התרופה ומחמירה תנודות on-off. הפתרון הוא תזמון (לרוב כ-30-60 דקות לפני הארוחה, לפי הנחיה) ופיזור החלבון."},
{t:"נוירולוגיה",q:"מטופלת עם מיאסטניה גרביס נטלה מינון נוסף של Pyridostigmine בשל חולשה. כעת: החמרה בחולשה, ריור מוגבר, הזעה, כאבי בטן ושלשול ואישונים מכווצים. מה המצב ומה הפעולה?",o:["משבר כולינרגי — יש להפסיק את התרופה, לנטר נתיב אוויר ויכולת נשימה ולהכין אטרופין","משבר מיאסטני — יש להעלות שוב את מינון הפירידוסטיגמין","תגובה אלרגית — יש לתת אדרנלין","התייבשות — יש לתת נוזלים ולהמשיך בטיפול"],a:0,e:"עודף מעכבי כולינאסטראז גורם לתסמינים מוסקריניים: מיוזיס, ריור, דמעת, הזעה, כאבי בטן, שלשול וברדיקרדיה — לצד החמרה בחולשה. במשבר מיאסטני, לעומת זאת, האישונים תקינים או מורחבים ואין תסמינים מוסקריניים. בשני המצבים העדיפות היא נתיב אוויר ויכולת נשימה."},
{t:"נוירולוגיה",q:"מטופל הגיע לפני שעתיים עם שבץ מוחי איסכמי; הוא ערני והמשפחה מבקשת להשקות אותו. מה נכון?",o:["לאפשר שתייה חופשית בישיבה זקופה","להשאיר בצום עד לביצוע סקר בליעה מובנה, ורק לאחר ממצא תקין להתחיל בנוזלים לפי ההמלצה","לתת נוזלים סמיכים ללא סקר, כיוון שהם בטוחים תמיד","להכניס זונדה לכל מטופל לאחר שבץ"],a:1,e:"דיספגיה שכיחה מאוד בשלב החריף של שבץ והיא גורם סיכון מרכזי לדלקת ריאות מאספירציה. לכן כל מטופל נשאר בצום (כולל תרופות פומיות) עד לסקר בליעה מובנה. ערנות ותקשורת תקינה אינן שוללות אספירציה שקטה."},
{t:"נוירולוגיה",q:"מטופלת לאחר שבץ בהמיספרה הימנית אוכלת רק מהצד הימני של המגש ומתנגשת במשקופים בצד שמאל. מה ההתערבות המתאימה?",o:["להציב מיד את כל הפריטים בצד שמאל וללא ליווי, כדי לאלץ אותה להסתכל","לפנות אליה אך ורק מהצד הפגוע כדי לעורר אותו","בשלב הראשון להציב פריטים בשדה הראייה השמור ולהבטיח בטיחות, ובמקביל ללמד סריקה יזומה של הסביבה לכיוון הפגוע ולהעביר בהדרגה פריטים לצד זה","להימנע מכל שינוי בסידור הסביבה"],a:2,e:"מדובר בהמיאנופסיה הומונימית שמאלית ו/או הזנחה חד-צדדית לאחר שבץ ימני. בשלב הראשון מתמקדים בבטיחות ובתפקוד — הצבת פריטים בשדה השמור — ובהמשך משלבים אימון סריקה והפניית תשומת לב לצד המוזנח, בליווי ובהדרגה."},
{t:"נוירולוגיה",q:"מטופל במשקל 80 ק״ג מתאים לטיפול תרומבוליטי ב-tPA בשבץ איסכמי. כיצד יינתן המינון?",o:["90 מ״ג בבולוס יחיד","48 מ״ג בעירוי במשך 30 דקות","72 מ״ג בסך הכול (0.9 מ״ג לק״ג): 10% מהמינון — 7.2 מ״ג — בבולוס תוך דקה, והיתרה בעירוי במשך שעה","0.9 מ״ג לק״ג בעירוי רציף במשך 24 שעות ללא בולוס"],a:2,e:"המינון הוא 0.9 מ״ג לק״ג, עד מקסימום 90 מ״ג. עשרה אחוזים ניתנים כבולוס תוך כדקה והיתרה בעירוי על פני שעה. חישוב מדויק קריטי: מינון יתר מעלה משמעותית את הסיכון לדימום תוך מוחי."},
{t:"נוירולוגיה",q:"מטופלת לאחר דימום תת-עכבישי מקבלת Nimodipine כל 4 שעות. מה מטרת הטיפול ומה חשוב לנטר?",o:["מניעת פרכוסים; יש לנטר רמות תרופה בדם","הורדת לחץ תוך גולגולתי; יש לנטר תפוקת שתן","מניעת ואזוספאזם ונזק איסכמי מאוחר; יש למדוד לחץ דם לפני כל מנה בשל הסיכון לתת-לחץ דם","מניעת דימום חוזר; יש לנטר תפקודי קרישה"],a:2,e:"נימודיפין הוא חוסם תעלות סידן המפחית את התחלואה האיסכמית הנובעת מוואזוספאזם לאחר SAH, ולכן ניתן באופן שגרתי למשך כ-21 יום. תופעת הלוואי המשמעותית היא ירידת לחץ דם, ולכן מודדים לחץ דם לפני כל מנה ומדווחים לפי הסף שנקבע."},
{t:"נוירולוגיה",q:"מטופל עם ALS משתעל בזמן שתיית מים, קולו ׳רטוב׳ לאחר בליעה והוא איבד 4 ק״ג בחודשיים. הכרתו ושיפוטו שמורים לחלוטין. מה נכון?",o:["הירידה הקוגניטיבית מסבירה את הקושי — יש להאכיל בכפית","יש להגביל נוזלים כדי למנוע שאיפה","אין קשר בין ALS לבליעה; מדובר בזיהום נשימתי","יש לדווח, להפנות להערכת בליעה ולשוחח כבר בשלב מוקדם על אפשרות של PEG ועל הנחיות מקדימות, תוך שיתוף מלא של המטופל בהחלטה"],a:3,e:"ב-ALS הפגיעה היא מוטורית; הקוגניציה נשמרת ברוב המקרים והמטופל שותף מלא להחלטות. חולשת שרירי הבליעה גורמת לדיספגיה, ירידה במשקל ואספירציות. דיון מוקדם ב-PEG ובתמיכה נשימתית מתבצע כל עוד המטופל יכול לבטא את רצונו."},
{t:"נוירולוגיה",q:"מה מעריך סולם NIHSS?",o:["את עומק ההכרה בלבד, בדומה ל-GCS","את הסיכון לדימום לאחר טיפול תרומבוליטי בלבד","את רמת העצמאות התפקודית לאחר השחרור","את חומרת החסר הנוירולוגי בשבץ: רמת הכרה, שדות ראייה, תנועות עיניים, כוח בגפיים, תחושה, קואורדינציה, שפה, דיסארתריה והזנחה"],a:3,e:"NIHSS הוא כלי מובנה ומהיר לכימות חומרת השבץ. הוא משמש לקבלת החלטות טיפוליות, למעקב אחר שינוי במצב הנוירולוגי ולתקשורת בין אנשי צוות. ציון גבוה יותר מעיד על חסר חמור יותר."},
{t:"נוירולוגיה",q:"מה משמעות תנוחת Decerebrate לעומת תנוחת Decorticate?",o:["שתיהן שוות בחומרתן ומעידות על פגיעה במערכת העצבים ההיקפית","Decorticate חמורה יותר ומעידה תמיד על פגיעה בגזע המוח","Decerebrate — יישור והפניה פנימה של הגפיים; היא מעידה על פגיעה עמוקה יותר בגזע המוח ומבשרת פרוגנוזה גרועה יותר מ-Decorticate (כיפוף הגפיים העליונות אל החזה)","Decerebrate מופיעה רק בהרעלות תרופתיות"],a:2,e:"תנוחת קורטיקציה (כיפוף) מעידה על פגיעה בהמיספרות או מעל הגרעינים האדומים; תנוחת דצרברציה (יישור, פרונציה ולעיתים קשתיות) מעידה על פגיעה נמוכה יותר בגזע המוח. מעבר מקורטיקציה לדצרברציה הוא סימן להחמרה ומחייב דיווח מיידי."},
{t:"נוירולוגיה",q:"מה מאפיין נוירלגיה טריגמינלית, ומהו הטיפול התרופתי המקובל בקו ראשון?",o:["כאב עמום ומתמשך בכל הפנים; טיפול באופיאטים","חולשה של שרירי הפנים עם נפילת זווית הפה; טיפול בסטרואידים","התקפי כאב חדים וקצרים כמו מכת חשמל באזור עצב הטריגמינוס, המופעלים ממגע קל, צחצוח שיניים, לעיסה או רוח; טיפול ב-Carbamazepine","כאב ראש חד-צדדי עם דמעת וגודש באף; טיפול בחמצן בזרימה גבוהה"],a:2,e:"הכאב בטריגמינל נוירלגיה הוא פרוקסיזמלי, חד וקצר מאוד, ומופעל מגירויים שגרתיים באזורי טריגר. Carbamazepine הוא קו ראשון. בהדרכה חשוב להימנע מגירויים מיותרים (רוח קרה, מזון חם או קר מדי) ולוודא צריכת מזון והיגיינת פה מספקת למרות הכאב."},
{t:"נוירולוגיה",q:"מה נכון לגבי מחלת הנטינגטון?",o:["תורשה אוטוזומלית דומיננטית; מתבטאת בתנועות כוריאה בלתי רצוניות, בירידה קוגניטיבית ובשינויים התנהגותיים ונפשיים","תורשה רצסיבית בתאחיזה ל-X, ולכן מופיעה כמעט רק בגברים","מחלה נרכשת הנגרמת מזיהום ויראלי של הגרעינים הבזאליים","מחלה דמיאלינטיבית של מערכת העצבים המרכזית"],a:0,e:"הנטינגטון נגרמת מהרחבת חזרות CAG ועוברת בתורשה אוטוזומלית דומיננטית — לכל צאצא סיכון של 50%. הטריאדה הקלינית היא הפרעת תנועה (כוריאה), דמנציה מתקדמת והפרעות נפשיות. הטיפול סימפטומטי, והיבטי הייעוץ הגנטי והתמיכה במשפחה מרכזיים."},
{t:"נוירולוגיה",q:"מהו כאב ראש לאחר ניקור מותני, וכיצד מטפלים בו?",o:["נובע מזיהום; הטיפול באנטיביוטיקה","נובע מעלייה בלחץ התוך-גולגולתי; הטיפול במניטול","מופיע רק בילדים ואינו מצריך טיפול","נובע מדליפת CSF דרך חור הדקירה; מחמיר בישיבה ובעמידה ומשתפר בשכיבה. הטיפול: שכיבה, הידרציה, משככי כאבים וקפאין, ובמקרים עיקשים Blood Patch"],a:3,e:"ירידה בלחץ ה-CSF גורמת למתיחה של מבנים רגישים לכאב. המאפיין המבחין הוא תלות בתנוחה — הקלה בשכיבה והחמרה בזקיפות. רוב המקרים חולפים תוך ימים; בכאב ממושך מבצעים הזרקת דם עצמי אפידורלית (Blood Patch)."},
{t:"אורולוגיה",q:"בן 74, יומיים לאחר ניתוח אורתופדי, לא הטיל שתן 9 שעות. בטנו התחתונה תפוחה והוא חסר מנוחה. בסריקת שלפוחית: 900 מ״ל. מה הפעולה הנכונה?",o:["לעודד שתייה מרובה ולהמתין שעתיים נוספות","לצנתר ולנקז את השלפוחית, ולאחר מכן לעקוב אחר דיורזה פוסט-חסימתית, לחץ דם, אלקטרוליטים והמטוריה","לתת furosemide כדי לעודד מתן שתן","לנקז 200 מ״ל בלבד, לסגור את הקטטר לשעה ולחזור על כך לסירוגין"],a:1,e:"אצירת שתן חריפה לאחר ניתוח שכיחה, בעיקר בגברים עם BPH ולאחר אופיאטים והרדמה. הטיפול הוא ניקוז השלפוחית בצנתור. הספרות העדכנית אינה תומכת בניקוז מדורג; מנקזים את השלפוחית ועוקבים אחר דיורזה פוסט-חסימתית והמטוריה ex vacuo. משתן במצב של חסימה יחמיר את המצב."},
{t:"אורולוגיה",q:"מטופלת עם נפרוסטומיה מדווחת שבשעתיים האחרונות אין כלל תפוקה בשקית, ויש לה כאב גובר במותן. מה נכון?",o:["לשטוף את הנפרוסטומיה בכוח עם 50 מ״ל סליין","לסגור את הצינור ולהמתין לבוקר","לבדוק קיפול, סתימה או לחץ על הצינור ואת תנוחת המטופלת, ולדווח לרופא — חסימה מחייבת התערבות; שטיפה, אם תבוצע, רק בהוראה, בעדינות ובנפח קטן (כ-5 מ״ל)","למשוך מעט את הצינור החוצה כדי לשחרר את החסימה"],a:2,e:"הפסקת תפוקה מנפרוסטומיה עם כאב מותני מחשידה לחסימה או לתזוזת הצינור, ומסכנת בפיילונפריטיס ובנזק כלייתי. אין לסגור נפרוסטומיה, אין למשוך את הצינור ואין לשטוף בנפח גדול או בלחץ — אגן הכליה קטן ושטיפה נמרצת עלולה לגרום לרפלוקס ולספסיס."},
{t:"אורולוגיה",q:"בן 66 עם תעוקת חזה הנוטל Isosorbide mononitrate מספר שקיבל מחבר טבליות Sildenafil לשיפור התפקוד המיני. מה ההדרכה?",o:["ניתן ליטול בתנאי שההפרש בין התרופות הוא שעה","אין מניעה — התרופות פועלות במנגנונים שונים","מותר רק אם לחץ הדם מעל 140/90","השילוב אסור — שתיהן מרחיבות כלי דם ועלולות לגרום לצניחת לחץ דם קשה ומסכנת חיים; יש להפנות לרופא לבירור חלופות, ואין ליטול תרופות של אדם אחר"],a:3,e:"מעכבי PDE-5 מעצימים את השפעת הניטראטים על הרחבת כלי הדם ועלולים לגרום לתת-לחץ דם חמור. זו התוויית נגד מוחלטת. בנוסף, נטילת תרופת מרשם שנרשמה לאדם אחר מסוכנת בפני עצמה, וחשוב לברר גורמים כלי-דמיים ותרופתיים לתפקוד המיני."},
{t:"אורולוגיה",q:"מטופלת בת 70 עם בריחת שתן מסוג דחיפות קיבלה טיפול אנטי-כולינרגי. מה כוללת ההדרכה?",o:["לצפות ליובש בפה ולעצירות, לדווח על קושי בהתרוקנות או על אצירת שתן, ולנקוט זהירות במטופלים עם גלאוקומה סגורת זווית; במקביל להמשיך באימון שלפוחית, ביומן מתן שתן ובתרגילי רצפת אגן","להפסיק כל שתייה אחרי הצהריים","התרופה פועלת מיד ולכן אין צורך באימון שלפוחית","להרבות בקפאין כדי ׳לאמן׳ את השלפוחית"],a:0,e:"אנטי-כולינרגים מפחיתים התכווצויות לא רצוניות של הדטרוזור, אך גורמים ליובש בפה, עצירות, טשטוש ראייה ולעיתים בלבול בקשישים, ואסורים בגלאוקומה סגורת זווית. הטיפול ההתנהגותי — אימון שלפוחית, תרגילי רצפת אגן והפחתת קפאין ואלכוהול — נותר הבסיס ומשולב עם התרופה."},
{t:"אורולוגיה",q:"מטופל שוחרר לאחר URS עם דלי (סטנט JJ). הוא מתקשר ומדווח על שתן ורדרד, תחושת דחיפות וכאב קל במותן. מה ההדרכה?",o:["לחזור מיד למיון — מדובר בסיבוך חמור","להפסיק לשתות כדי להפחית את הדימום","אלה תסמינים צפויים בנוכחות דלי; יש להרבות בשתייה ולפנות בדחיפות אם מופיעים חום וצמרמורות, קרישים החוסמים מתן שתן, כאב בלתי נשלט או הפסקה במתן שתן","לשטוף את השלפוחית בבית באמצעות מזרק"],a:2,e:"דלי גורם באופן אופייני לדחיפות, תכיפות, אי נוחות במותן בזמן מתן שתן והמטוריה קלה ומשתנה. ההדרכה מתמקדת בהרגעה, בשתייה מרובה ובזיהוי דגלים אדומים — חום, ספסיס, חסימה או דימום משמעותי."},
{t:"אורולוגיה",q:"בן 19 מגיע עם כאב פתאומי וחד באשך שמאל ובחילות. בבדיקה: האשך מורם וממוקם אופקית ורפלקס קרמסטרי נעדר. מה נכון?",o:["חשד לפיתול אשך — מצב חירום כירורגי; יש להפנות מיידית להערכה ולחדר ניתוח, שכן חלון הזמן לשימור האשך הוא כ-6 שעות","חשד לאפידידימיטיס — אנטיביוטיקה ומעקב במרפאה","מדובר בהידרוצלה — מעקב בלבד","להניח קרח, לתת משככי כאבים ולשוב למחרת"],a:0,e:"פיתול אשך חוסם את אספקת הדם וגורם לנמק. הסימנים המבחינים הם הופעה פתאומית, אשך מורם ואופקי והיעדר רפלקס קרמסטרי; באפידידימיטיס הכאב מופיע בהדרגה ולעיתים מוקל בהרמת האשך. כל עיכוב מקטין את הסיכוי לשמר את האשך."},
{t:"אורולוגיה",q:"מהו היתרון העיקרי של ציסטוסטומיה על-חיקית (סופרה-פובית) על פני קטטר דרך השופכה בשימוש ממושך?",o:["אינה דורשת החלפה כלל","פחות טראומה ופגיעה בשופכה, פחות אי-נוחות ושיעור נמוך יותר של סיבוכים אורתרליים, וכן נוחות רבה יותר בתפקוד המיני ובניידות","אינה מחייבת מעקב אחר תפוקת שתן","מונעת לחלוטין זיהומים בדרכי השתן"],a:1,e:"בצנתור ממושך דרך השופכה קיים סיכון לדלקת, היצרות, פגיעה ברקמה ולחץ על הרקמות. קטטר על-חיקי עוקף את השופכה, נוח יותר למטופל ומקל על טיפול עצמי. הוא אינו מונע זיהום ודורש החלפה תקופתית ומעקב אחר אתר היציאה."},
{t:"אורולוגיה",q:"מהי ההמלצה המרכזית למניעת הישנות של אבני סידן-אוקסלט?",o:["להגביל סידן בתזונה באופן ניכר","לשתות בעיקר בשעות הבוקר","להעשיר את התזונה במינונים גבוהים של ויטמין C","לשתות כ-2.5-3 ליטר ליממה כך שתפוקת השתן תעלה על 2 ליטר, להפחית נתרן, חלבון מן החי ומזונות עתירי אוקסלט — אך לא להגביל סידן תזונתי"],a:3,e:"הידרציה מספקת היא ההתערבות היעילה ביותר: היא מדללת את השתן ומונעת גיבוש גבישים. הגבלת סידן תזונתי היא טעות נפוצה — היא דווקא מעלה ספיגת אוקסלט במעי ואת הסיכון לאבנים. מינונים גבוהים של ויטמין C מתפרקים לאוקסלט ואינם מומלצים."},
{t:"אורולוגיה",q:"מה נכון לגבי מטופל לאחר בניית שלפוחית חלופית מהמעי (Neobladder)?",o:["תחושת מילוי השלפוחית נשמרת באופן תקין","הוא יזדקק לשקית איסטומה קבועה על דופן הבטן","אין תחושת דחיפות תקינה; ההתרוקנות מתבצעת לפי לוח זמנים קבוע, בעזרת הרפיית רצפת האגן ולחץ בטני, ולעיתים נדרש צנתור עצמי לסירוגין","אסור לו לשתות יותר מליטר ביממה"],a:2,e:"בשלפוחית חלופית מהמעי אין עצבוב תחושתי כשל שלפוחית, ולכן המטופל אינו חש דחיפות. ההדרכה כוללת מתן שתן לפי שעון (כולל קימה בלילה), תרגול רצפת אגן, זיהוי שארית ולעיתים צנתור עצמי. ייתכנו גם ייצור ריר והפרעות מטבוליות הדורשות מעקב."},
{t:"אורתופדיה",q:"מטופל עם גבס סינתטי על האמה מתלונן על גרד מתחת לגבס, ומספר שהחדיר מסרגה כדי לגרד. מה ההדרכה?",o:["אין בעיה כל עוד המסרגה נקייה","אסור להחדיר חפצים מתחת לגבס — סיכון לפציעה, לזיהום ולכיב לחץ שאינם נראים; ניתן להפנות אוויר קר ממייבש שיער אל פתח הגבס ולהיוועץ ברופא לגבי טיפול נגד גרד","יש לשפוך מים קרים לתוך הגבס כדי להקל","יש להסיר את הגבס בבית ולחדשו למחרת"],a:1,e:"שריטה מתחת לגבס עלולה לגרום לפצע שלא ניתן לראותו ולזהותו מוקדם, ובמיוחד בסוכרתיים או בפגיעה תחושתית להתפתחות זיהום עמוק. ההדרכה כוללת גם שמירה על הגבס יבש, הרמת הגפה, תרגול אצבעות ודיווח על כאב גובר, נימול, ריח רע או הפרשה."},
{t:"אורתופדיה",q:"מטופל ביום ה-3 לאחר קטיעה מתחת לברך שוכב כל היום עם כרית מתחת לגדם ויושב שעות רבות. מה נכון?",o:["זו תנוחה מומלצת להפחתת בצקת לאורך כל היממה","יש להרים את הגדם על כרית לפחות 12 שעות ביממה","יש להימנע מכרית מתחת לברך ומישיבה ממושכת — סיכון לקונטרקטורה בכיפוף; יש לעודד שכיבה על הבטן מספר פעמים ביום ויישור מלא של הברך","אין חשיבות לתנוחה בשלב זה"],a:2,e:"קונטרקטורה בכיפוף הברך או הירך עלולה להתפתח תוך ימים ולמנוע התאמת תותבת. הרמה על כרית מותרת לזמן קצר ומוגבל ב-24 השעות הראשונות להפחתת בצקת, ולאחר מכן נמנעת. שכיבה על הבטן, יישור פעיל וחבישת הגדם מעצבות אותו ומכינות אותו לתותבת."},
{t:"אורתופדיה",q:"מטופלת ביום השני לאחר החלפת מפרק ברך מלאה חוששת להזיז את הרגל בגלל כאב. מה ההתערבות הנכונה?",o:["לאפשר מנוחה מלאה עד להסרת התפרים","לקבע את הברך בגבס למשך שבוע","לעודד תרגול רק לאחר שהכאב חולף לחלוטין","לתת משכך כאבים לפני הפיזיותרפיה ולעודד תרגילים איזומטריים לארבע-ראשי, כיפוף ויישור לפי הפרוטוקול וניוד מוקדם — למניעת הידבקויות, הגבלת טווח תנועה, DVT וסיבוכים נשימתיים"],a:3,e:"השגת טווח תנועה בשבועות הראשונים קובעת את התוצאה התפקודית לטווח ארוך. שליטה טובה בכאב היא תנאי מקדים לשיתוף פעולה בתרגול, ולכן נותנים משכך כאבים כשעה לפני הפיזיותרפיה. חוסר תנועה מגביר את הסיכון לתסחיף ריאתי ולנוקשות המפרק."},
{t:"אורתופדיה",q:"בן 64 עם היסטוריה של גאוט מגיע עם ברך אדומה, חמה ונפוחה מאוד, חום 38.7 וקושי בכל תנועה. מה הפעולה החשובה ביותר?",o:["לתת קולכיצין ולשחרר לביתו","להניח קרח ולהמליץ על מנוחה","להתחיל קורטיקוסטרואידים במינון גבוה","לדווח ולהיערך לניקור מפרק (ארתרוצנטזיס) עם משלוח נוזל לתרבית, לספירת תאים ולבדיקת גבישים — יש לשלול דלקת מפרק ספטית לפני שמייחסים את התמונה לגאוט"],a:3,e:"דלקת מפרק ספטית היא מצב חירום: היא הורסת סחוס תוך ימים ועלולה לגרום לספסיס. גאוט וזיהום נראים דומים מאוד, ואף יכולים להופיע יחד. רק ניקור המפרק מבדיל ביניהם. מתן סטרואידים לפני שלילת זיהום עלול להחמיר את המצב."},
{t:"אורתופדיה",q:"אחות מדריכה מטופל עם איסור דריכה על רגל ימין בשימוש בקביים. מה נכון?",o:["הליכה בשלוש נקודות: שתי הקביים והרגל הפגועה מתקדמות יחד, ולאחר מכן הרגל הבריאה; המשקל נתמך על כפות הידיים ולא על בית השחי","יש לתמוך את משקל הגוף על בית השחי כדי להקל על הידיים","בעלייה במדרגות יש להוביל עם הרגל הפגועה","יש להשתמש בקב אחד בלבד, בצד הפגוע"],a:0,e:"לחץ ממושך בבית השחי עלול לגרום לשיתוק רדיאלי (crutch palsy), ולכן המשקל נישא על הידיים ונשמר מרווח של 2-3 אצבעות מתחת לבית השחי. כלל העזר לעלייה וירידה: עולים עם הרגל הבריאה, יורדים עם הקביים והרגל הפגועה. קב בודד, כשמותר, נאחז בצד הבריא."},
{t:"אורתופדיה",q:"בת 63 נפלה מגובה עמידה ושברה את שורש כף היד. מה נכון בנוסף לטיפול בשבר עצמו?",o:["מדובר בשבר טראומטי רגיל ואין צורך בבירור נוסף","יש להמליץ על מנוחה במיטה למשך חודש","יש להפנות לבירור אוסטאופורוזיס (בדיקת DEXA), להעריך סיכון לנפילות ולשקול סידן, ויטמין D וטיפול תרופתי — שבר משברירות בגיל זה הוא דגל אדום","יש להתחיל ביספוספונטים לכל מטופלת מעל גיל 60 ללא בדיקה"],a:2,e:"שבר משברירות הוא שבר הנגרם מכוח שלא היה אמור לשבור עצם בריאה — נפילה מגובה עמידה או פחות. הוא מנבא חזק לשברים נוספים, ובראשם שבר צוואר ירך. זו הזדמנות קלינית לבירור ולטיפול מונע: DEXA, הערכת נפילות, בדיקת ראייה ותרופות והתאמת סביבה."},
{t:"אורתופדיה",q:"מה ההבדל בין CRP ל-ESR במעקב אחר תהליך דלקתי או זיהומי בעצם?",o:["שניהם ספציפיים לזיהום בעצם בלבד","ESR עולה ויורד במהירות ולכן מתאים למעקב יומי","CRP עולה ויורד מהר יחסית ולכן שימושי למעקב אחר תגובה לטיפול, בעוד ESR משתנה לאט ומשקף תהליך ממושך; שניהם רגישים אך אינם ספציפיים","ערך CRP תקין שולל בוודאות זיהום בעצם"],a:2,e:"שני המדדים הם סמני דלקת כלליים ועולים גם במצבים לא זיהומיים — טראומה, ניתוח, מחלות ראומטיות וממאירות. CRP מגיב תוך שעות ויורד מהר עם השיפור, ולכן נוח למעקב; ESR מפגר אחרי התמונה הקלינית. הפרשנות תמיד בהקשר הקליני ולא כבדיקה עצמאית."},
{t:"אורתופדיה",q:"מה כוללת ההדרכה למניעת אוסטאופורוזיס?",o:["פעילות גופנית נושאת משקל (הליכה, ריקוד, אימוני התנגדות), צריכה מספקת של סידן וויטמין D, הפסקת עישון, צמצום אלכוהול ומניעת נפילות בבית","מנוחה והימנעות ממאמץ כדי לא לשבור עצם","שחייה היא הפעילות היעילה ביותר להעלאת צפיפות העצם","תוספי סידן מיותרים בכל גיל אם התזונה מגוונת"],a:0,e:"עצם מגיבה לעומס מכני, ולכן דווקא פעילות נושאת משקל ואימוני התנגדות מעודדים בנייה. שחייה מצוינת לכושר אך אינה נושאת משקל ולכן תרומתה לצפיפות העצם מוגבלת. מניעת נפילות חשובה לא פחות מהטיפול התרופתי, שכן היא מונעת את השבר עצמו."},
{t:"אורתופדיה",q:"מה מעכב איחוי של שבר?",o:["גיל צעיר וקיבוע יציב","עישון, זיהום, אספקת דם ירודה, תזונה לקויה, סוכרת, טיפול בקורטיקוסטרואידים וחוסר יציבות במקום השבר","העמסה מבוקרת על הגפה בהתאם להוראה","אספקת דם עשירה לאזור השבר"],a:1,e:"איחוי דורש אספקת דם, יציבות מכנית וסביבה מטבולית תקינה. עישון הוא מהגורמים המשמעותיים ביותר — הניקוטין גורם לכיווץ כלי דם ופוגע בבנייה. תזוזה חוזרת במוקד השבר וזיהום מונעים גישור עצמי ועלולים להוביל לאי-איחוי (nonunion)."},
{t:"נפרולוגיה",q:"מטופל בדיאליזה ראשונה בחייו מפתח לקראת סוף הטיפול כאב ראש, בחילה, חוסר שקט ובלבול קל. מה ההסבר ומה הפעולה?",o:["תגובה אלרגית לממברנה — יש לתת אנטיהיסטמין","תסמונת חוסר שיווי משקל (Disequilibrium) עקב פינוי מהיר של אוריאה ומעבר נוזלים לתוך תאי המוח; יש לדווח ולשקול האטה או קיצור של הטיפול, ולבצע את הדיאליזות הראשונות קצרות ואיטיות","היפוגליקמיה — יש לתת גלוקוז ולהמשיך","עומס נוזלים — יש להגביר אולטרה-פילטרציה"],a:1,e:"בדיאליזות הראשונות, כשרמת האוריאה בדם גבוהה מאוד, פינוי מהיר יוצר הפרש אוסמוטי בין הדם למוח ומושך מים לרקמת המוח. התמונה נעה מכאב ראש ובחילה ועד פרכוסים וירידה בהכרה. המניעה היא טיפולים קצרים ואיטיים בתחילת הדרך."},
{t:"נפרולוגיה",q:"מטופל עם CKD שלב 4 וזרחן 6.6 קיבל מרשם ל-Calcium Carbonate כקושר זרחן. מתי עליו ליטול את התרופה?",o:["על קיבה ריקה, שעה לפני האוכל","לפני השינה בלבד","יחד עם הארוחות או מיד לפניהן, כדי לקשור את הזרחן שבמזון בתוך מערכת העיכול","פעם בשבוע, ללא קשר לארוחות"],a:2,e:"קושרי זרחן פועלים מקומית במעי: הם נקשרים לזרחן מהמזון ומונעים את ספיגתו. אם ניטלים בנפרד מהארוחה אין להם מה לקשור והם מאבדים את יעילותם. בהדרכה חשוב גם להגביל מזונות עתירי זרחן — מוצרי חלב, קולה כהה, אגוזים ומזון מעובד עם תוספי פוספט."},
{t:"נפרולוגיה",q:"מטופלת בדיאליזה פריטוניאלית מדווחת שהנוזל שיצא היה צלול, ללא כאב וללא חום, אך הנפח שיצא קטן בכ-400 מ״ל מהנפח שהוכנס. מה נכון?",o:["חשד לפריטוניטיס — יש לשלוח תרבית ולהתחיל אנטיביוטיקה","יש להזריק מיד הפרין לתוך שקית הנוזל","יש להפסיק לצמיתות את הדיאליזה הפריטוניאלית","חשד לכשל ניקוז: יש לבדוק קיפולים בסט, לשנות תנוחה, לוודא ששקית הניקוז נמוכה מגובה הבטן ולטפל בעצירות — גורם שכיח מאוד לחסימת ניקוז"],a:3,e:"נוזל צלול, ללא כאב וללא חום, שולל פריטוניטיס (שבה הנוזל עכור וכואב). הגורמים השכיחים לכשל ניקוז הם עצירות עם מעי מלא הלוחץ על הצנתר, קיפול הסט, תזוזת הצנתר או פיברין. הבירור הסיעודי מתחיל בפעולות פשוטות לפני התערבות פולשנית."},
{t:"נפרולוגיה",q:"מטופל עם CKD שלב 4 מיועד ל-CT עם חומר ניגוד יודי. מה כוללת ההכנה?",o:["הידרציה לפי הוראה לפני הבדיקה ואחריה, השהיית תרופות נפרוטוקסיות ו-Metformin לפי הנחיה, שימוש בנפח מזערי של חומר ניגוד ומעקב קריאטינין לאחר מכן","הגבלת נוזלים לפני הבדיקה","מתן furosemide לפני הבדיקה כדי ׳לשטוף׳ את חומר הניגוד","אין צורך בהכנה מיוחדת, גם במחלת כליות מתקדמת"],a:0,e:"נפרופתיה מחומר ניגוד היא פגיעה כלייתית חריפה המופיעה בדרך כלל 48-72 שעות לאחר החשיפה. ההגנה היעילה ביותר היא הידרציה. משתנים ותרופות נפרוטוקסיות (NSAIDs, אמינוגליקוזידים) מגבירים את הסיכון, ומטפורמין מושהה בשל סיכון לחמצת לקטית אם התפקוד הכלייתי יידרדר."},
{t:"נפרולוגיה",q:"מהן ההתערבויות הסיעודיות לאחר ביופסיית כליה?",o:["ניוד מוקדם והליכה במסדרון תוך שעה","מנוחה בשכיבה על הגב למשך מספר שעות, ניטור סימנים חיוניים, הערכת כאב מותני והסתכלות על צבע השתן; הימנעות ממאמץ ומהרמת משאות כשבועיים","הגבלת שתייה קפדנית למשך 24 שעות","הנחת חבישה לוחצת על הבטן למשך יממה"],a:1,e:"הסיבוך העיקרי הוא דימום — הכליה היא איבר עתיר כלי דם. לכן נדרשת מנוחה, ניטור צמוד של דופק ולחץ דם, בדיקת המוגלובין והשוואת צבע השתן בין מתן למתן. החמרה בכאב מותני, ירידה בלחץ הדם או המטוריה גסה מתמשכת מחייבות דיווח מיידי."},
{t:"נפרולוגיה",q:"מטופלת עם CKD ואנמיה מקבלת אריתרופויאטין. מה חשוב במעקב?",o:["אין צורך לנטר לחץ דם","יש לשאוף להמוגלובין תקין לחלוטין, מעל 13, בכל מקרה","ניטור לחץ דם בשל סיכון ליתר לחץ דם, בדיקת מאגרי ברזל והשלמתם — בלעדיהם הטיפול אינו יעיל — ויעד המוגלובין מתון ולא נורמליזציה מלאה, בשל סיכון לאירועים תרומבוטיים","הטיפול מייתר לחלוטין מתן ברזל"],a:2,e:"הכליה החולה אינה מייצרת מספיק אריתרופויאטין. טיפול תחליפי דורש מצע — ברזל זמין — ולכן בודקים פריטין ורוויית טרנספרין ומשלימים ברזל, לעיתים תוך ורידי. נורמליזציה מלאה של ההמוגלובין נקשרה לעלייה בשבץ ובאירועים לבביים, ולכן היעד מתון."},
{t:"נפרולוגיה",q:"מהו המנגנון של יתר-פעילות משנית של בלוטות יותרת התריס (Secondary Hyperparathyroidism) ב-CKD?",o:["עודף של ויטמין D פעיל בדם","הפרשת יתר של הורמון גדילה","אי ספיקת הכליות גורמת להיפרקלצמיה ראשונית","ירידה בהפרשת זרחן והפחתה בייצור ויטמין D פעיל בכליה מובילות לירידת הסידן בדם, וזו מגרה הפרשה מתמשכת של PTH עם פירוק עצם — אוסטאודיסטרופיה כלייתית"],a:3,e:"הכליה הפגועה אינה מפרישה זרחן ואינה מבצעת הידרוקסילציה של ויטמין D למרכיב הפעיל. התוצאה היא היפרפוספטמיה והיפוקלצמיה, המגרות את בלוטות יותרת התריס. PTH מוגבר כרוני שואב סידן מהעצם, גורם לכאבי עצמות, לשברים ולהסתיידויות בכלי דם וברקמות רכות."},
{t:"נפרולוגיה",q:"מדוע מתפתחת חמצת מטבולית ב-CKD, ומה הביטוי הקליני?",o:["הכליה הפגועה אינה מפרישה מספיק יוני מימן ואינה מייצרת מספיק ביקרבונט; קלינית — ביקרבונט נמוך, נשימות עמוקות ומהירות (Kussmaul), עייפות, בחילה ופירוק מוגבר של שריר ועצם","הכליה מפרישה יותר מדי יוני מימן","מדובר באלקלוזיס נשימתית משנית","ביקרבונט מצטבר בדם בשל ירידה בפינוי הכלייתי"],a:0,e:"הכליה אחראית על הפרשת חומצות קבועות ועל ייצור ביקרבונט מחדש. באי ספיקה מתקדמת שתי הפונקציות נפגעות ומצטברת חמצת. הגוף מפצה בהיפרוונטילציה (נשימות קוסמאול). חמצת כרונית מחמירה מחלת עצם, גורמת לפירוק שריר ותורמת להיפרקלמיה."},
{t:"המטולוגיה",q:"מטופל בן 80 עם אי ספיקת לב מקבל מנת דם. כעבור שעה: קוצר נשימה, גודש ורידי צוואר, לחץ דם 178/92, חרחורים בבסיסי הריאות וירידה בסטורציה. מה המצב ומה הפעולה?",o:["תגובה אנפילקטית — יש לתת אדרנלין","עומס נוזלים במחזור הדם (TACO) — יש להפסיק או להאט מאוד את העירוי, להושיב את המטופל, לתת חמצן ולדווח; צפוי טיפול במשתן","TRALI — אין כל קשר לעומס נוזלים","תגובת חום לא המוליטית — יש לתת פרצטמול ולהמשיך בעירוי"],a:1,e:"TACO הוא עומס נפחי ומתאפיין ביתר לחץ דם, גודש ורידי, בצקת ריאות ותגובה טובה למשתן. הוא שכיח בקשישים, בילדים ובחולי לב וכליה, ולכן מעבירים מנות דם לאוכלוסיות אלה באיטיות. ב-TRALI, לעומת זאת, יש דווקא תת-לחץ דם וחום, והוא אינו מגיב למשתן."},
{t:"המטולוגיה",q:"חמש דקות לאחר תחילת עירוי דם המטופל מדווח על כאב עז בגב התחתון ובחזה, מתאר ׳תחושת אסון׳, והשתן הופך כהה. מה סדר הפעולות?",o:["להאט את קצב העירוי ולהמשיך במעקב צמוד","להמשיך בעירוי ולתת נוזלים דרך אותו סט","להפסיק מיד את העירוי, לנתק את סט הדם ולשמור אותו, לשטוף את הווריד בסליין דרך סט חדש, לנטר סימנים חיוניים ותפוקת שתן, לדווח מיד ולשלוח את המנה ודגימות לבנק הדם ולמעבדה","להחליף את מנת הדם למנה אחרת ולהמשיך"],a:2,e:"התמונה אופיינית לתגובה המוליטית חריפה מאי-התאמת ABO — מצב מסכן חיים העלול להתקדם ל-DIC ולאי ספיקת כליות. חובה להפסיק מיידית ולהחליף את הסט כולו, כי גם כמות קטנה של דם שנותרה בעירוי מסוכנת. שמירת המנה חיונית לבירור."},
{t:"המטולוגיה",q:"מטופל אונקולוגי עם ספירת נויטרופילים מוחלטת (ANC) של 300 מפתח חום של 38.6. מה העדיפות?",o:["לתת פרצטמול ולעקוב שעתיים לפני כל פעולה אחרת","להמתין לתוצאות התרביות לפני מתן אנטיביוטיקה","לבודד את המטופל ולהמתין לביקור הרופא בבוקר","לקחת תרביות דם ולהתחיל אנטיביוטיקה רחבת טווח בהקדם האפשרי — בתוך שעה מהופעת החום"],a:3,e:"נויטרופניה עם חום היא מצב חירום אונקולוגי: ללא נויטרופילים אין תגובה דלקתית, הזיהום עלול להתפשט תוך שעות ולעיתים החום הוא הסימן היחיד. לקיחת תרביות אינה מעכבת את האנטיביוטיקה. הורדת חום ללא טיפול אנטיביוטי מסתירה את התמונה ומסכנת חיים."},
{t:"המטולוגיה",q:"מטופלת לפני כריתת טחול מתוכננת. מה ההדרכה המרכזית?",o:["אין צורך בחיסונים לפני או אחרי הניתוח","מתן חיסונים כנגד חיידקים עטופי קפסולה (פנאומוקוק, מנינגוקוק, המופילוס אינפלואנזה B), רצוי כשבועיים לפני הניתוח; לכל החיים — התייחסות לכל חום כאירוע חירום ונשיאת מידע רפואי","יש להימנע מחיסונים בשל דיכוי חיסוני","הסיכון לזיהום פוחת משמעותית לאחר הניתוח"],a:1,e:"הטחול מסלק חיידקים עטופי קפסולה מהדם. בהיעדרו קיים סיכון ל-OPSI — זיהום קטלני ומהיר במיוחד. לכן מחסנים מראש, מדריכים לפנות מיד בכל חום, ולעיתים ממליצים על אנטיביוטיקה מונעת ועל טיפול אנטיביוטי בהישג יד לנסיעות."},
{t:"המטולוגיה",q:"מטופלת עם טסיות 12,000, אנמיה המוליטית עם סכיסטוציטים במשטח, חום, בלבול וקריאטינין עולה. מה הטיפול המרכזי?",o:["פלזמהפרזיס (החלפת פלזמה) בדחיפות; ככלל נמנעים מעירוי טסיות, העלול להחמיר את התהליך התרומבוטי","עירוי טסיות במינון גבוה","הפרין במינון טיפולי","אנטיביוטיקה רחבת טווח בלבד"],a:0,e:"זוהי תמונה של TTP — חמשת המרכיבים הקלאסיים: תרומבוציטופניה, אנמיה המוליטית מיקרואנגיופתית, חום, מעורבות נוירולוגית ופגיעה כלייתית. פלזמהפרזיס דחופה משנה את הפרוגנוזה באופן דרמטי. מתן טסיות נחשב ׳דלק למדורה׳ ושמור למצבי דימום מסכן חיים בלבד."},
{t:"המטולוגיה",q:"מהן ההתערבויות הסיעודיות לאחר ביופסיית מח עצם מכנף הכסל האחורית?",o:["להשכיב את המטופל על הבטן למשך 6 שעות","לתת אספירין להקלה על הכאב","להרשות רחצה במקלחת מיד לאחר הפעולה","הנחת חבישה לוחצת ושכיבה על הגב או על הצד מעל אתר הדקירה במשך כ-30-60 דקות, מעקב אחר דימום והמטומה, משכך כאבים שאינו אספירין והדרכה לדווח על דימום, כאב גובר או חום"],a:3,e:"הסיבוך השכיח הוא דימום מקומי, במיוחד בתרומבוציטופניה, ולחץ ישיר הוא האמצעי היעיל ביותר. אספירין ו-NSAIDs פוגעים בתפקוד הטסיות ולכן נמנעים מהם. ההדרכה כוללת שמירה על אתר הדקירה יבש למשך כ-24 שעות והימנעות ממאמץ באותו יום."},
{t:"המטולוגיה",q:"מהו הטיפול העיקרי בהמוכרומטוזיס תורשתית, ומה ההדרכה התזונתית?",o:["הקזות דם (פלבוטומיה) סדרתיות; יש להימנע מתוספי ברזל, ממינונים גבוהים של ויטמין C המגביר ספיגת ברזל, מאלכוהול וממאכלי ים נאים","עירויי דם סדרתיים","נטילת תוספי ברזל פומיים","דיאליזה קבועה"],a:0,e:"בהמוכרומטוזיס נספג ברזל בעודף ומצטבר בכבד, בלב, בלבלב ובמפרקים. הקזות דם מסלקות ברזל ביעילות. אלכוהול מחמיר את הנזק הכבדי, ומאכלי ים נאים מסוכנים בשל זיהומי Vibrio המשגשגים בסביבה עתירת ברזל. ויטמין C במינון גבוה מגביר את ספיגת הברזל."},
{t:"המטולוגיה",q:"מה נכון לגבי מחלת פון-וילברנד?",o:["מחלה נדירה ביותר המופיעה רק בגברים","הפרעת הקרישה התורשתית השכיחה ביותר; הפגם בפקטור פון-וילברנד פוגע בהיצמדות הטסיות ובייצוב פקטור VIII. הביטוי האופייני: דימומים מהריריות, חבורות, דימום ממושך לאחר פעולות ומחזור ממושך. טיפול ב-Desmopressin ובתכשירים מכילי vWF","נגרמת מחוסר בפקטור IX","מטופלת בעירויי טסיות בלבד"],a:1,e:"בניגוד להמופיליה, שבה בולטים דימומים למפרקים ולשרירים, בפון-וילברנד בולטים דימומי ריריות — חניכיים, אף ומחזור כבד — ושני המינים נפגעים. הדסמופרסין משחרר vWF מהמאגרים באנדותל. יש להימנע מאספירין ומ-NSAIDs."},
{t:"אונקולוגיה",q:"מטופלת עם שתל רדיואקטיבי (ברכיתרפיה) מאושפזת במחלקה. מה נכון בטיפול הסיעודי?",o:["אין מגבלות — הקרינה אינה יוצאת מהחדר","לפעול לפי עקרונות זמן, מרחק ומיגון: לצמצם את משך השהייה בחדר, לשמור מרחק, להשתמש במיגון ובמד קרינה אישי, למנוע כניסת נשים בהריון וילדים, ואם השתל נושר — לא לגעת בו בידיים אלא באמצעות מלקחיים ולהניחו במיכל עופרת","להחזיק את המטופלת בבידוד מוחלט ללא כל מגע אנושי עד לשחרור","להשליך שתל שנשר לפח האשפה הרגיל"],a:1,e:"בשתל סגור (Sealed source) הקרינה יוצאת מגוף המטופלת ומחייבת הגנה על הצוות, אך המטופלת עצמה אינה ׳מזוהמת׳ והפרשותיה בטוחות. שלושת העקרונות — זמן, מרחק ומיגון — הם הבסיס. שתל שנשר מטופל אך ורק בכלי ומונח במיכל עופרת ייעודי, ומדווחים לפיזיקאי הקרינה."},
{t:"אונקולוגיה",q:"מטופל המקבל Pembrolizumab מדווח על 7 יציאות שלשוליות ביממה מזה שלושה ימים, עם כאבי בטן. מה נכון?",o:["תופעה צפויה — לתת לופרמיד ולהמשיך בטיפול כרגיל","מדובר בהרעלת מזון — לעקוב בבית","חשד לקוליטיס אימונית (irAE) — יש לדווח בדחיפות, להשהות את הטיפול ולצפות לטיפול בקורטיקוסטרואידים; שלשול בדרגה גבוהה עלול להסתבך בנקב מעי","יש להגביר את מינון התרופה כדי לשפר את התגובה"],a:2,e:"מעכבי נקודות בקרה חיסונית משחררים את בלם מערכת החיסון, ולכן תופעות הלוואי הן אוטואימוניות ויכולות לערב כל מערכת — מעי, בלוטת התריס, כבד, ריאות ועור. הטיפול שונה מהותית מכימותרפיה: השהיית התרופה ומתן סטרואידים, ולא טיפול סימפטומטי בלבד."},
{t:"אונקולוגיה",q:"מטופלת המקבלת Paclitaxel מדווחת על נימול ועקצוץ בקצות האצבעות ובכפות הרגליים ועל נפילת חפצים מידיה. מה נכון?",o:["יש לדווח לרופא — נוירופתיה פריפרית מטקסנים, שעשויה לחייב שינוי מינון או דחיית טיפול; ובמקביל הדרכה בטיחותית: בדיקת טמפרטורת המים ביד שאינה פגועה או במדחום, נעליים סגורות ומותאמות, תאורה טובה, פינוי מכשולים ומניעת נפילות וכוויות","תופעה חולפת שאינה מצריכה דיווח","מדובר בחוסר סידן — יש לתת תוסף","יש להפסיק לחלוטין ומיד את כל הטיפול על דעת האחות"],a:0,e:"CIPN היא תופעת לוואי מצטברת ותלוית מינון של טקסנים ופלטינום, ולעיתים אינה הפיכה. זיהוי מוקדם ודיווח מאפשרים התאמת מינון לפני שהנזק קבוע. ההיבט הסיעודי המרכזי הוא בטיחות — פגיעה בתחושה מסכנת בכוויות, בפצעים שאינם מורגשים ובנפילות."},
{t:"אונקולוגיה",q:"בעת שימוש בפורט להזרקת כימותרפיה אין החזר דם, והזרקת סליין נתקלת בהתנגדות. מה נכון?",o:["להפעיל לחץ חזק עם מזרק 3 מ״ל כדי לפתוח את החסימה","להתחיל את מתן הכימותרפיה כל עוד המטופל אינו מתלונן על כאב","לשלוף את הפורט","לא להפעיל כוח — סיכון לקרע בצנתר ולאקסטרווזציה; לוודא מיקום נכון של המחט, לשנות את תנוחת המטופל, לבדוק קיפול ולדווח. ייתכן צורך בהדמיה או בטיפול תרומבוליטי לפי פרוטוקול"],a:3,e:"היעדר החזר דם עשוי לנבוע ממחט שאינה במקום, מקריש, ממעטפת פיברין או מתזוזת הצנתר. הזרקה בכוח — ובמיוחד במזרק קטן, היוצר לחץ גבוה — עלולה לקרוע את הצנתר. מתן ציטוטוקסי ללא ודאות שהמערכת תקינה הוא סיכון גבוה לאקסטרווזציה ולנמק רקמה."},
{t:"אונקולוגיה",q:"מטופל עתיד לקבל פרוטוקול כימותרפי בעל פוטנציאל אמטוגני גבוה. מה נכון לגבי מניעת בחילות והקאות?",o:["לתת תרופה נגד בחילה רק כאשר המטופל מקיא בפועל","מתן פרה-מדיקציה לפני הטיפול, לרוב בשילוב של חוסם קולטני 5-HT3 (כמו Ondansetron), חוסם NK-1 (Aprepitant) וקורטיקוסטרואיד (Dexamethasone); יש להיערך גם לבחילה מאוחרת בימים שלאחר הטיפול","מטוקלופרמיד לבדו מספיק בכל המקרים","בחילה מאוחרת אינה קיימת בפרוטוקולים אלה"],a:1,e:"מניעה יעילה יותר מטיפול: בחילה שלא נמנעה עלולה להתקבע כבחילה אנטיציפטורית מותנית, שקשה מאוד לטפל בה. לכן ניתנת פרה-מדיקציה משולבת לפני הטיפול, וההדרכה כוללת המשך תרופות בבית לכיסוי הבחילה המאוחרת, ארוחות קטנות ותכופות והימנעות מריחות חזקים."},
{t:"אונקולוגיה",q:"מה ההבדל בין תרופות המסתיימות בסיומת mab- לבין אלה המסתיימות בסיומת nib-?",o:["mab- הן נוגדנים חד-שבטיים הניתנים בעירוי או בהזרקה ופועלות על מטרה מחוץ לתא או על קרום התא; nib- הן מעכבי טירוזין-קינאז, מולקולות קטנות הניתנות לרוב פומית ופועלות בתוך התא","mab- ניתנות פומית ו-nib- בעירוי","אין הבדל מהותי — מדובר בשמות מסחריים בלבד","שתיהן סוגים של כימותרפיה ציטוטוקסית קלאסית"],a:0,e:"הסיומת מעידה על סוג המולקולה. נוגדנים חד-שבטיים הם חלבונים גדולים שאינם נספגים במעי ולכן ניתנים פרנטרלית, ותופעות הלוואי האופייניות להם הן תגובות עירוי. מעכבי קינאז הם מולקולות קטנות החודרות לתא, ניתנות בכדור ומאופיינות בתופעות עוריות, שלשול ואינטראקציות תרופתיות."},
{t:"אונקולוגיה",q:"מטופל בכימותרפיה עם ספירת טסיות 15,000. אילו אמצעי זהירות נדרשים?",o:["הימנעות ממדידת חום רקטלית, מנרות ומחוקנים, ממתן תוך-שרירי ומאספירין ו-NSAIDs; שימוש במברשת שיניים רכה, גילוח במכונה חשמלית, מניעת עצירות ומאמץ, ומניעת נפילות וחבלות","מותר לתת זריקות תוך-שריריות בזהירות","יש להמליץ על גילוח בסכין גילוח רגילה","אין צורך בזהירות מיוחדת כל עוד הספירה מעל 10,000"],a:0,e:"מתחת ל-20,000 עולה הסיכון לדימום ספונטני, ומתחת ל-10,000 הסיכון לדימום מסכן חיים, כולל דימום מוחי. כל פעולה הפוגעת ברירית או בעור עלולה לגרום לדימום ממושך. סימני אזהרה לדיווח מיידי: כאב ראש חד, שינוי בהכרה, דם בשתן או בצואה ודימום שאינו נעצר."},
{t:"מערכת חיסון",q:"מטופלת בת 30 מפתחת אנפילקסיס. מהם המינון ודרך המתן הנכונים של אדרנלין למבוגר?",o:["1 מ״ג בריכוז 1:10,000 תוך ורידי בבולוס מהיר","0.3-0.5 מ״ג בריכוז 1:1000, בהזרקה תוך-שרירית בחלק הקדמי-צדי של הירך, וניתן לחזור כל 5-15 דקות לפי הצורך","0.5 מ״ג בהזרקה תת-עורית בזרוע","אין לתת אדרנלין לפני בירור הגורם המדויק"],a:1,e:"אדרנלין הוא הטיפול היחיד שמשנה את מהלך האנפילקסיס, וכל עיכוב במתן מעלה תמותה. הזרקה תוך-שרירית לירך מספקת ספיגה מהירה ואמינה יותר מתת-עורית או מהזרקה לזרוע. מתן תוך ורידי שמור לצוותים מיומנים במצבי דום לב או הלם עמיד, בשל סיכון להפרעות קצב."},
{t:"מערכת חיסון",q:"מטופלת עם סקלרודרמה מדווחת שאצבעותיה מלבינות ואז מכחילות בחשיפה לקור. מה כוללת ההדרכה?",o:["לשטוף את הידיים במים חמים מאוד בעת ההתקף","להפחית לסיגריה אחת ביום","להימנע מחשיפה לקור וללבוש כפפות — גם בהוצאת מזון מהמקפיא — להפסיק עישון לחלוטין, להימנע מקפאין וממתח נפשי, להגן על האצבעות מפציעות ולדווח על כיבים או נמק בקצות האצבעות","לעסות את האצבעות בקרח כדי לשפר את זרימת הדם"],a:2,e:"תופעת Raynaud נובעת מכיווץ כלי דם היקפיים, והשלישייה הקלאסית היא חיוורון, כחלון ואז אודם. ניקוטין הוא מכווץ כלי דם חזק, ולכן הפסקת עישון מוחלטת חיונית. חימום הדרגתי עדיף על מים חמים מאוד, שעלולים לגרום לכוויה בעור עם תחושה פגועה."},
{t:"מערכת חיסון",q:"מטופלת עם SLE מתחילה טיפול ב-Hydroxychloroquine. איזה מעקב חשוב במיוחד?",o:["בדיקת שמיעה חודשית","בדיקת צפיפות עצם כל חצי שנה","ספירת טסיות שבועית","בדיקת עיניים בסיסית ומעקב תקופתי אצל רופא עיניים, בשל סיכון לרעילות ברשתית"],a:3,e:"הידרוקסיכלורוקין הוא תרופת יסוד ב-SLE, בטוח יחסית ומפחית התלקחויות. הסיכון המשמעותי בשימוש ממושך הוא רטינופתיה, שעלולה להיות בלתי הפיכה אך ניתנת לגילוי מוקדם בבדיקות מעקב. בהדרכה חשוב גם להסביר שהשפעת התרופה מופיעה לאחר שבועות עד חודשים."},
{t:"מערכת חיסון",q:"בת 72 מתלוננת על כאב ונוקשות קשים בשעות הבוקר בחגורת הכתפיים ובאגן, הנמשכים מעל שעה. ESR 68, CK תקין וכוח השרירים בבדיקה תקין. מה האבחנה הסבירה?",o:["פולימיאלגיה רבמטיקה — המאופיינת בתגובה מהירה ומרשימה למינון נמוך של סטרואידים; יש לעקוב אחר תסמינים של דלקת עורק הרקה","פולימיוזיטיס","פיברומיאלגיה","דלקת מפרקים שגרונית"],a:0,e:"ב-PMR הכאב והנוקשות הם בחגורות הכתפיים והאגן, ה-ESR גבוה מאוד והכוח ורמות ה-CK תקינים — בשונה מפולימיוזיטיס, שבה יש חולשה אמיתית ו-CK מוגבר. PMR ו-Giant Cell Arteritis קשורות זו בזו, ולכן כל כאב ראש חדש, רגישות בקרקפת, צליעת לסת או שינוי בראייה מחייבים דיווח מיידי."},
{t:"מערכת חיסון",q:"איזו דוגמה מתאימה לרגישות יתר מסוג III (קומפלקסים חיסוניים)?",o:["אנפילקסיס לבוטנים","מחלת נסיוב (Serum Sickness), SLE וגלומרולונפריטיס לאחר זיהום סטרפטוקוקלי","דרמטיטיס מגע לניקל","תגובת עירוי המוליטית מסוג ABO"],a:1,e:"בסוג III נוצרים קומפלקסים של אנטיגן ונוגדן המשקעים בכלי דם קטנים, במפרקים ובכליות ומפעילים משלים ודלקת. סוג I הוא מיידי בתיווך IgE (אנפילקסיס), סוג II ציטוטוקסי בתיווך נוגדנים כנגד תאים (תגובת ABO), וסוג IV מושהה בתיווך תאי T (דרמטיטיס מגע, מבחן טוברקולין)."},
{t:"מערכת חיסון",q:"מה כוללת ההדרכה למטופל הנוטל קורטיקוסטרואידים לאורך זמן?",o:["ניתן להפסיק את התרופה בבת אחת כשמרגישים טוב","אין לתרופה השפעה על רמות הסוכר בדם","אין לתרופה השפעה על צפיפות העצם","אין להפסיק בפתאומיות אלא להפחית בהדרגה בשל סיכון לאי ספיקת אדרנל; לנטר סוכר, לחץ דם ומשקל, לזכור שהסטרואיד מסווה חום וסימני זיהום, לצרוך סידן וויטמין D, ולשקול הגנה על הקיבה"],a:3,e:"טיפול ממושך מדכא את ציר ההיפותלמוס-היפופיזה-אדרנל, ולכן הפסקה פתאומית עלולה לגרום למשבר אדרנלי. בנוסף עולה הסיכון להיפרגליקמיה, ליתר לחץ דם, לאוסטאופורוזיס, לקטרקט ולכיב קיבה, והדיכוי החיסוני מסתיר זיהומים — כך שגם חום נמוך מחייב התייחסות."},
{t:"עור וכוויות",q:"בן 40 הגיע עם כוויות בכל החלק הקדמי של הגו, בכל היד הימנית (הגפה כולה) ובכל הראש והצוואר. מהו אחוז שטח הגוף הכווי לפי ׳כלל התשיעיות׳?",o:["18%","27%","36%","45%"],a:2,e:"לפי כלל התשיעיות במבוגר: ראש וצוואר 9%, כל גפה עליונה 9%, חזה ובטן (גו קדמי) 18%, גב 18%, כל גפה תחתונה 18% ואזור הפרינאום 1%. כאן: 18 ועוד 9 ועוד 9 שווה 36%. החישוב קובע את נפח הנוזלים בהחייאה ואת ההחלטה על העברה למרכז כוויות."},
{t:"עור וכוויות",q:"מטופל עם כוויה בעובי מלא המקיפה את כל היקף האמה. כעת: האצבעות קרות וחיוורות, מילוי קפילרי איטי, ירידה בתחושה ודופק רדיאלי שאינו נשמע בדופלר. מה הטיפול הצפוי?",o:["הרמת הגפה בלבד והמשך מעקב","אסכרוטומיה — חיתוך האסכר בדחיפות לשחרור הלחץ והחזרת הזילוח לגפה","הנחת חבישה לוחצת על האמה","הפניה לפיזיותרפיה לתרגול טווחי תנועה"],a:1,e:"אסכר בעובי מלא הוא רקמה נוקשה שאינה מתרחבת. כשהוא מקיף גפה, הבצקת המתפתחת מתחתיו יוצרת לחץ החוסם את זרימת הדם — תמונה דמוית תסמונת מדור. אסכרוטומיה היא חיתוך האסכר עד לרקמה גמישה. באסכר מקיף בבית החזה הפגיעה היא בהתרחבות הנשימתית."},
{t:"עור וכוויות",q:"מטופל ביום הרביעי לאחר כוויה נרחבת. מה נכון לגבי התזונה?",o:["מצב היפר-מטבולי עם פירוק מוגבר — נדרשת תזונה עתירת קלוריות וחלבון, לרוב בתמיכת האכלה אנטרלית מוקדמת, עם מעקב משקל, אלבומין ומאזן חנקן","יש להגביל קלוריות וחלבון כדי להפחית עומס כלייתי","יש להתחיל האכלה רק לאחר סגירת כל הפצעים","תזונה פראנטרלית היא קו ראשון בכל מטופל כווי"],a:0,e:"כוויה נרחבת מייצרת את התגובה ההיפר-מטבולית הקיצונית ביותר ברפואה — קצב חילוף חומרים שעשוי להכפיל את עצמו, עם פירוק שריר וצריכת חלבון עצומה. תמיכה תזונתית מוקדמת דרך מערכת העיכול משמרת את שלמות רירית המעי ומפחיתה זיהומים; TPN שמור למצבים שבהם המעי אינו תקין."},
{t:"עור וכוויות",q:"מטופל לאחר השתלת עור עצמית בעובי חלקי (STSG) על הירך, כאשר האזור התורם נמצא בירך הנגדית. מה נכון?",o:["לעודד תנועה מלאה של האזור המושתל כבר ביום הראשון","קיבוע ומנוחה של אזור השתל ומניעת לחץ וגזירה בימים הראשונים עד ההיקלטות; האזור התורם כואב לרוב יותר ומטופל כפצע שטחי בחבישה שומרת לחות עד לאפיתליזציה","האזור התורם אינו דורש טיפול כלל","יש להחליף את החבישה מעל השתל כל שעתיים"],a:1,e:"בימים הראשונים השתל ניזון בדיפוזיה ורק לאחר מכן נוצרת אספקת דם חדשה; תנועה, גזירה או המטומה מתחתיו מונעות היקלטות. האזור התורם הוא פצע בעובי חלקי עם קצות עצבים חשופים ולכן כואב מאוד, ומחלים מעצמו תוך כשבועיים בחבישה מתאימה."},
{t:"עור וכוויות",q:"אילו שינויים אלקטרוליטריים אופייניים לשלב החירום (24-48 השעות הראשונות) בכוויות נרחבות?",o:["היפוקלמיה והיפרנתרמיה","אין שינויים אלקטרוליטריים משמעותיים בשלב זה","היפרקלצמיה והיפופוספטמיה","היפרקלמיה — מאשלגן המשתחרר מתאים שניזוקו — והיפונתרמיה, עקב מעבר נתרן לחלל הבין-תאי יחד עם הנוזלים; בשלב הדיורזה שלאחר מכן מתפתחת דווקא היפוקלמיה"],a:3,e:"בשלב החירום עולה חדירות הנימים ונוזל עשיר בחלבון ובנתרן דולף לרקמות, בעוד אשלגן תוך-תאי משתחרר למחזור הדם מתאים הרוסים ומהמוליזה. כשהנוזל חוזר למחזור הדם בשלב הדיורזה, האשלגן מופרש בשתן ונוצרת היפוקלמיה — ולכן הניטור משתנה לפי שלב הכוויה."},
{t:"עור וכוויות",q:"מה ההבדל בין מבחן דקירה (Prick Test) למבחן טלאי (Patch Test)?",o:["שניהם בודקים רגישות מיידית","Prick בודק רגישות מושהית ו-Patch רגישות מיידית","Prick בודק רגישות מיידית מסוג I בתיווך IgE והתוצאה נקראת תוך כ-15-20 דקות; Patch בודק רגישות מושהית מסוג IV — דרמטיטיס מגע אלרגית — והטלאים נשארים על העור כ-48 שעות ונקראים גם לאחר 72-96 שעות","שניהם מבוצעים בהזרקה תוך-ורידית"],a:2,e:"מבחן דקירה מיועד לאלרגנים נשאפים ולמזון, ומחייב זמינות של ערכת חירום ואדרנלין בשל סיכון — נדיר — לתגובה מערכתית. יש להפסיק אנטיהיסטמינים מספר ימים לפניו. מבחן הטלאי מיועד לאיתור חומרים הגורמים לדרמטיטיס מגע, והמטופל מודרך לשמור על האזור יבש ולהימנע מהזעה."},
{t:"אף אוזן גרון",q:"בן 25 נחבל באף לפני יומיים. כעת הוא מתלונן על חסימה מלאה בשני הנחיריים, ובבדיקה נראית נפיחות כחלחלה דו-צדדית על מחיצת האף. מה נכון?",o:["מדובר בבצקת צפויה שתחלוף תוך שבוע","יש לתת מכווצי כלי דם ולשחרר לביתו","יש להמתין 5 ימים ולבצע רדוקציה של השבר","חשד להמטומה ספטלית — מצב המחייב ניקוז דחוף; עיכוב עלול לגרום לנמק איסכמי של הסחוס, לנקב במחיצה ולזיהום, כולל התפשטות למנינגיטיס"],a:3,e:"הסחוס ניזון בדיפוזיה דרך המוקו-פריכונדריום. דם שנאגר בין השכבות מנתק את אספקת החומרים ועלול לגרום לנמק תוך פחות מ-24 שעות, עם התמוטטות גשר האף. בנוסף, הדם הוא מצע מצוין לחיידקים. הטיפול הוא חתך, ניקוז ותמפון."},
{t:"אף אוזן גרון",q:"בן 78 עם סוכרת מגיע עם כאב עז ומתמשך באוזן, הפרשה ורקמת גרנולציה בתעלת השמע, לאחר שבוע של טיפות ללא שיפור. מה נכון?",o:["דלקת אוזן חיצונית רגילה — יש להמשיך בטיפות עוד שבוע","חשד לאוטיטיס אקסטרנה נמקית (ממאירה), לרוב מחיידק Pseudomonas — מצב חמור העלול לפשוט לבסיס הגולגולת ולעצבי הגולגולת; מחייב הפניה דחופה לאא״ג, הדמיה וטיפול אנטיביוטי סיסטמי ממושך","יש לשטוף את האוזן במים בלחץ","מדובר בצרומן — יש לבצע שטיפה"],a:1,e:"אוטיטיס אקסטרנה נמקית מופיעה בעיקר בקשישים סוכרתיים ובמדוכאי חיסון. הרמזים הם כאב עז שאינו פרופורציונלי לממצא, כאב לילי, גרנולציות ברצפת התעלה וכישלון טיפול מקומי. הסיבוכים כוללים אוסטאומיאליטיס של בסיס הגולגולת ושיתוק עצב הפנים."},
{t:"אף אוזן גרון",q:"בבדיקת Weber הצליל נשמע חזק יותר באוזן ימין. בבדיקת Rinne באוזן ימין הולכת העצם טובה מהולכת האוויר. מה המסקנה?",o:["ירידת שמיעה תחושתית-עצבית באוזן ימין","שמיעה תקינה בשתי האוזניים","ירידת שמיעה הולכתית (Conductive) באוזן ימין — למשל צרומן, נוזל באוזן התיכונה, נקב בעור התוף או אוטוסקלרוזיס","ירידת שמיעה תחושתית-עצבית באוזן שמאל"],a:2,e:"בירידה הולכתית הצליל ב-Weber מוסט אל האוזן הפגועה, כיוון שהיא ׳מוגנת׳ מרעשי הרקע וקולטת טוב יותר דרך העצם, ובבדיקת Rinne הולכת העצם עולה על הולכת האוויר. בירידה תחושתית-עצבית, לעומת זאת, Weber מוסט אל האוזן הבריאה ו-Rinne נשאר תקין — הולכת אוויר טובה מהולכת עצם."},
{t:"אף אוזן גרון",q:"מה נכון לגבי עיתוי הטיפול בשבר בעצמות האף?",o:["רדוקציה סגורה אפשרית רק כחודש לאחר החבלה","יש לבצע צילום לכל חבלת אף כדי לאשר את האבחנה","אין כל אפשרות לתקן שבר בעצמות האף","האבחנה היא קלינית; רדוקציה סגורה אפשרית בימים הראשונים (בערך עד 5 ימים) ורק כשאין נפיחות המטשטשת את מראה האף. לאחר מכן יש להמתין ולשקול רינופלסטיקה, לרוב כחצי שנה לאחר השבר"],a:3,e:"שבר בעצמות האף הוא בעיקרו בעיה אסתטית, והאבחנה נשענת על הסיפור ועל הבדיקה — הדמיה אינה נדרשת לאישורה, ומבוצעת רק בחשד לפגיעה נלווית. לאחר מספר ימים מתחיל איחוי והרדוקציה הסגורה כבר אינה אפשרית. נפיחות מונעת הערכה של התוצאה הסופית."},
{t:"עיניים",q:"מטופל עם גלאוקומה קיבל מרשם לשני סוגי טיפות עיניים. מה ההדרכה הנכונה?",o:["יש להמתין כ-5 דקות בין טיפה לטיפה, להזליף לשק הלחמית התחתון מבלי לגעת בקצה הבקבוקון בעין או בריסים, וללחוץ בעדינות על פינת העין הפנימית (סתימת הפונקטום) כדקה — להפחתת ספיגה סיסטמית","ניתן לטפטף את שתי הטיפות ברצף מיידי","יש להזליף ישירות על הקרנית ולמצמץ בחוזקה","אם ׳נשכחה׳ טיפה ניתן להפסיק את הטיפול עד לביקורת הבאה"],a:0,e:"נפח שק הלחמית קטן, ולכן טיפה שנייה מיד אחרי הראשונה שוטפת את הקודמת החוצה. מגע בקצה הבקבוקון מזהם את התכשיר. סתימת הפונקטום מפחיתה ניקוז לדרכי הדמע ומקטינה תופעות לוואי מערכתיות — חשוב במיוחד בחוסמי בטא. גלאוקומה דורשת טיפול רציף לכל החיים גם כשאין תסמינים."},
{t:"עיניים",q:"מטופל בן 72 מיועד לניתוח קטרקט. באנמנזה: נטל Tamsulosin ל-BPH והפסיק אותו לפני חודשיים. מה נכון?",o:["אין לכך חשיבות — התרופה כבר הופסקה","יש לדווח לצוות הניתוח: חוסמי אלפא קשורים ל-Intraoperative Floppy Iris Syndrome, וקושי בהרחבת האישון עלול להופיע גם לאחר הפסקת התרופה","יש להפסיק לצמיתות את כל תרופות הפרוסטטה","יש לדחות את הניתוח בשנה"],a:1,e:"חוסמי אלפא משפיעים על שריר המרחיב של הקשתית, וההשפעה עשויה להישאר גם זמן רב לאחר ההפסקה. קשתית ׳רפויה׳ המתנפנפת ואישון שאינו נפתח מסבכים את הניתוח ומעלים סיכון לקרע בקופסית. לכן תפקיד האחות באנמנזה הוא לתשאל במפורש על תרופות אלה גם אם הופסקו."},
{t:"עיניים",q:"עובד מפעל הגיע לאחר התזת חומר בסיסי לעין. מה הפעולה הראשונה?",o:["לכסות את העין בתחבושת ולהעביר לרופא עיניים","לטפטף טיפות אנטיביוטיות ולהמתין להערכה","לשטוף מיד ובשפע במים או בסליין למשך זמן ממושך — לפחות 15-20 דקות — עוד לפני כל פעולה אחרת, ורק לאחר מכן להמשיך בהערכה ובהפניה","לנסות לנטרל את החומר באמצעות חומצה חלשה"],a:2,e:"כוויה כימית היא מצב החירום העיני הדחוף ביותר, וכוויות בסיס חמורות מכוויות חומצה משום שהבסיס ממשיך לחדור לעומק. שטיפה מיידית ומתמשכת היא הגורם המשפיע ביותר על התוצאה, וקודמת אפילו לבדיקת חדות ראייה. ניסיון ׳לנטרל׳ מסוכן ויוצר חום ונזק נוסף."},
{t:"עיניים",q:"מה כוללת ההדרכה סביב אנגיוגרפיה פלואורסצאינית?",o:["הבדיקה אינה פולשנית ואינה כוללת הזרקה","יש להגביל שתייה לאחר הבדיקה","הצבע נותר בעור כשבועיים","מדובר בהזרקת צבע לווריד; לפני הבדיקה — הערכת תפקודי כליה והידרציה; יש להסביר על תחושת חום חולפת ועל טעם מתכתי בפה, ולאחר הבדיקה צפויים גוון צהבהב בעור ושתן כתום-צהוב החולפים תוך כ-24 שעות. מומלץ לעודד שתייה"],a:3,e:"הצבע מוזרק לווריד ומגיע לכלי הדם ברשתית תוך שניות, כשמצלמים סדרת תמונות. ההדרכה מפחיתה חרדה מתופעות צפויות ובלתי מזיקות. יש לעקוב אחר אתר ההזרקה ולזכור שבבדיקה עם Indocyanine Green קיימת התוויית נגד ברגישות ליוד."},
{t:"שד",q:"מטופלת בת 44 עם סרטן שד חיובי לקולטנים הורמונליים החלה טיפול בטמוקסיפן. על מה חשוב שתדווח?",o:["על דימום או הפרשה וגינלית חריגים, בשל סיכון מוגבר לסרטן רירית הרחם, וכן על נפיחות, כאב או אודם בשוק או על קוצר נשימה, בשל סיכון לאירוע תרומבואמבולי; גלי חום הם תופעה שכיחה וצפויה","כל גל חום מחייב הפסקה מיידית של הטיפול","נשירת שיער מלאה היא תופעת הלוואי העיקרית","יש להימנע מכל פעילות גופנית לאורך הטיפול"],a:0,e:"טמוקסיפן חוסם קולטני אסטרוגן בשד אך פועל כאגוניסט ברירית הרחם ומעלה את הסיכון לקרצינומה של האנדומטריום ולאירועים תרומבואמבוליים. מנגד, הוא אינו פוגע בצפיפות העצם. הטיפול ניתן לאורך 5-10 שנים, ולכן ההיענות וההדרכה על דגלים אדומים הן קריטיות."},
{t:"שד",q:"מטופלת מתחילה סדרת הקרנות לשד לאחר ניתוח משמר. מה כוללת ההדרכה לשמירה על שלמות העור?",o:["שימוש בסבון עדין וייבוש עדין של העור, הימנעות מדאודורנט ומבושם לפני הטיפול, שימוש בתכשירי לחות על בסיס מים וללא אלכוהול ורק לפי הנחיית מכון הקרינה, הימנעות מבגדים ומחזייה לוחצים ומחשיפה לשמש באזור המוקרן","למרוח שמן מינרלי עבה לפני כל טיפול","להימנע מרחצה לחלוטין לאורך כל סדרת ההקרנות","לחשוף את האזור לשמש כדי לזרז את הריפוי"],a:0,e:"הנזק מהקרינה הוא מקומי-אזורי ומתבטא ברדיודרמטיטיס: אודם, יובש, רגישות ולעיתים קילוף. הבעיה הסיעודית הצפויה היא פגיעה בשלמות העור, ולכן הדגש הוא מניעתי. חומרים עם מתכות או אלכוהול והתחככות מכנית מחמירים את התגובה, וכל מריחה נעשית לפי הנחיית המכון ולא לפני הטיפול."},
{t:"שד",q:"מה מאפיין סרטן שד מסוג Triple Negative?",o:["חיובי לאסטרוגן, לפרוגסטרון ול-HER2","שלילי לקולטני אסטרוגן ופרוגסטרון וגם ל-HER2; לכן לא יינתן טיפול אנטי-הורמונלי ולא טיפול ביולוגי מכוון HER2, והטיפול המערכתי מתבסס בעיקר על כימותרפיה, ולעיתים גם על אימונותרפיה","מגיב היטב במיוחד לטמוקסיפן","מטופל בהרצפטין בלבד"],a:1,e:"הפתולוגיה קובעת את הטיפול. בהיעדר שלושת הקולטנים אין מטרה לטיפול ההורמונלי או לנוגדן כנגד HER2, ולכן הכימותרפיה היא עמוד השדרה של הטיפול — ולרוב תינתן גם בגידולים קטנים יחסית. סוג זה שכיח יותר בנשים צעירות ובנשאיות BRCA1 ונוטה להיות אגרסיבי יותר."}
];
const KEYS = ["א","ב","ג","ד"];
const state = {};           // idx -> chosen option index
const quiz = document.getElementById('quiz');

function render(){
  quiz.innerHTML = '';
  const f = document.getElementById('filter').value;
  DATA.forEach((item, i) => {
    if (f && item.t !== f) return;
    const card = document.createElement('div');
    card.className = 'q';
    card.dataset.i = i;
    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = '<span class="num">שאלה ' + (i+1) + '</span><span class="chip">' + item.t + '</span>';
    card.appendChild(head);
    const qt = document.createElement('p');
    qt.className = 'qtext';
    qt.textContent = item.q;
    card.appendChild(qt);
    const ul = document.createElement('ul');
    ul.className = 'opts';
    item.o.forEach((txt, j) => {
      const li = document.createElement('li');
      li.className = 'opt';
      li.dataset.j = j;
      li.innerHTML = '<span class="k">' + KEYS[j] + '.</span><span></span>';
      li.lastChild.textContent = txt;
      li.addEventListener('click', () => choose(i, j));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const v = document.createElement('div'); v.className = 'verdict'; card.appendChild(v);
    const ex = document.createElement('div');
    ex.className = 'exp';
    ex.innerHTML = '<b>הסבר</b>';
    const p = document.createElement('span'); p.textContent = item.e; ex.appendChild(p);
    card.appendChild(ex);
    quiz.appendChild(card);
    if (state[i] !== undefined) paint(card, i);
  });
  stats();
}

function choose(i, j){
  if (state[i] !== undefined) return;      // one attempt per question
  state[i] = j;
  const card = quiz.querySelector('.q[data-i="'+i+'"]');
  paint(card, i);
  stats();
}

function paint(card, i){
  const item = DATA[i], pick = state[i];
  card.querySelectorAll('.opt').forEach(li => {
    const j = +li.dataset.j;
    li.classList.add('lock');
    if (j === item.a) li.classList.add('right');
    else if (j === pick) li.classList.add('wrong');
  });
  const v = card.querySelector('.verdict');
  const ok = pick === item.a;
  v.className = 'verdict show ' + (ok ? 'y' : 'n');
  v.textContent = ok ? '✓ תשובה נכונה' : '✗ תשובה שגויה — הנכונה: ' + KEYS[item.a];
  card.querySelector('.exp').classList.add('show');
}

function stats(){
  const done = Object.keys(state).length;
  let ok = 0;
  for (const k in state) if (state[k] === DATA[k].a) ok++;
  const bad = done - ok;
  document.getElementById('rPos').textContent = done + '/' + DATA.length;
  document.getElementById('rOk').textContent = ok;
  document.getElementById('rBad').textContent = bad;
  document.getElementById('rPct').textContent = done ? Math.round(ok/done*100) : '—';
  document.getElementById('rBar').style.width = (done/DATA.length*100) + '%';
}

function summary(){
  const box = document.getElementById('sumbox');
  const by = {};
  DATA.forEach((item, i) => {
    const b = by[item.t] || (by[item.t] = {n:0, done:0, ok:0});
    b.n++;
    if (state[i] !== undefined){ b.done++; if (state[i] === item.a) b.ok++; }
  });
  const done = Object.keys(state).length;
  let ok = 0; for (const k in state) if (state[k] === DATA[k].a) ok++;
  const pct = DATA.length ? Math.round(ok/DATA.length*100) : 0;
  const cls = pct >= 80 ? 'g' : (pct >= 60 ? 'a' : 'r');
  let h = '<h2>סיכום ביצועים</h2>';
  h += '<div class="score"><span class="pill '+cls+'">' + pct + '</span></div>';
  h += '<p style="color:var(--dim);font-size:.88rem;margin:10px 0 16px">' +
       ok + ' תשובות נכונות מתוך ' + DATA.length + ' · נענו ' + done +
       ' · ציון עובר בקורס: 60</p>';
  h += '<table><tr><th>נושא</th><th>נענו</th><th>נכונות</th><th>אחוז</th></tr>';
  Object.keys(by).forEach(t => {
    const b = by[t];
    const p = b.done ? Math.round(b.ok/b.done*100) : null;
    const c = p === null ? '' : (p >= 80 ? 'g' : (p >= 60 ? 'a' : 'r'));
    h += '<tr><td>' + t + '</td><td class="n">' + b.done + '/' + b.n + '</td>' +
         '<td class="n">' + b.ok + '</td><td class="n">' +
         (p === null ? '<span style="color:var(--dim)">—</span>'
                     : '<span class="pill ' + c + '">' + p + '%</span>') + '</td></tr>';
  });
  h += '</table>';
  box.innerHTML = h;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btnSum').addEventListener('click', summary);
document.getElementById('btnReset').addEventListener('click', () => {
  for (const k in state) delete state[k];
  document.getElementById('sumbox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('btnReveal').addEventListener('click', () => {
  quiz.querySelectorAll('.q').forEach(card => {
    const i = +card.dataset.i;
    if (state[i] === undefined){
      card.querySelectorAll('.opt').forEach(li => {
        li.classList.add('lock');
        if (+li.dataset.j === DATA[i].a) li.classList.add('right');
      });
      card.querySelector('.exp').classList.add('show');
    }
  });
});
document.getElementById('filter').addEventListener('change', render);

(function init(){
  const sel = document.getElementById('filter');
  const counts = {};
  DATA.forEach(d => counts[d.t] = (counts[d.t] || 0) + 1);
  Object.keys(counts).forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t + ' (' + counts[t] + ')';
    sel.appendChild(o);
  });
  render();
})();
</script>
</body>
</html>
