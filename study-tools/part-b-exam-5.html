<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבחן תרגול 5 - סיעוד המבוגר חלק ב</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>%F0%9F%A9%BA</text></svg>">
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:#182234; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --teal:#2dd4bf; --teal-d:#0d9488;
  --coral:#fb7185; --amber:#fbbf24; --ok:#34d399;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Rubik,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:16px}
header{background:linear-gradient(180deg,#132033,#0f172a);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:.9rem}
.tagline{font-family:var(--mono);color:var(--teal);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-family:var(--mono);font-size:.8rem;color:var(--dim);min-width:92px}
.cell b{display:block;color:var(--txt);font-size:1.15rem;line-height:1.25;letter-spacing:-.02em}
.cell.ok b{color:var(--ok)} .cell.bad b{color:var(--coral)} .cell.t b{color:var(--teal)}
.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
select,button{font-family:inherit;font-size:.88rem;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--teal-d)}
button.primary{background:var(--teal-d);border-color:var(--teal-d);color:#04201c;font-weight:700}
button.primary:hover{background:var(--teal)}
.grow{flex:1}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--mono);color:var(--teal);font-size:.82rem;font-weight:700}
.chip{font-size:.72rem;background:#0b3b38;color:var(--teal);border:1px solid #115e59;border-radius:99px;padding:2px 10px;white-space:nowrap}
.qtext{font-size:1.02rem;margin:0 0 14px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#141d2e;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-d);background:#16233a}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;min-width:1.4em}
.opt.sel{border-color:var(--teal);background:#122c2b}
.opt.right{border-color:var(--ok);background:#0d2a20}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--coral);background:#2c1420}
.opt.wrong .k{color:var(--coral)}
.opt.lock{cursor:default}
.exp{margin-top:12px;border-inline-start:3px solid var(--teal-d);background:#101a2b;border-radius:0 10px 10px 0;padding:11px 14px;font-size:.92rem;color:#cbd5e1;display:none}
.exp.show{display:block}
.exp b{color:var(--teal);font-family:var(--mono);font-size:.78rem;display:block;margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
.verdict{font-family:var(--mono);font-size:.8rem;margin-top:10px;display:none}
.verdict.show{display:block}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--coral)}
.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;display:none}
.sumbox.show{display:block}
.sumbox h2{margin:0 0 12px;font-size:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:.8rem;font-family:var(--mono)}
td.n{font-family:var(--mono)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-family:var(--mono);font-size:.8rem}
.pill.g{background:#0d2a20;color:var(--ok)} .pill.a{background:#2e2410;color:var(--amber)}
.pill.r{background:#2c1420;color:var(--coral)}
.score{font-family:var(--mono);font-size:2.4rem;line-height:1;letter-spacing:-.03em}
footer{color:var(--dim);font-size:.8rem;text-align:center;padding:22px 0 34px}
@media(max-width:520px){.wrap{padding:12px}.cell{min-width:74px}h1{font-size:1.15rem}}
@media print{body{background:#fff;color:#000}.toolbar,.bar{display:none}
  .q,.sumbox,header{border-color:#bbb;background:#fff;color:#000}
  .exp{display:block!important;background:#f5f5f5;color:#000}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="tagline">סיעוד המבוגר · חלק ב' · מבחן תרגול</div>
  <h1>מבחן תרגול 5 — מעורב</h1>
  <div class="sub">80 שאלות חדשות מבוססות ברונר, בלי חפיפה למבחנים 1-4 ולמחסן השאלות: כ-70% תרחישים קליניים וכ-30% ידע ישיר.</div>
  <div class="readout">
    <div class="cell t">שאלה<b id="rPos">0/80</b></div>
    <div class="cell ok">נכונות<b id="rOk">0</b></div>
    <div class="cell bad">שגויות<b id="rBad">0</b></div>
    <div class="cell">ציון<b id="rPct">—</b></div>
  </div>
  <div class="bar"><i id="rBar"></i></div>
</header>

  <select id="filter"><option value="">כל הנושאים</option></select>

  <button id="btnReveal">הצג את כל התשובות</button>
  <button id="btnReset">התחל מחדש</button>
  <button id="btnSum" class="primary">סיכום ביצועים</button>
</div>

<div class="sumbox" id="sumbox"></div>

<footer>סיעוד המבוגר חלק ב' · מבחן תרגול 5 · מבוסס על Brunner &amp; Suddarth</footer>

<script>
const DATA = [{"t":"נוירולוגיה","q":"בן 32 עם פגיעת חוט שדרה ברמת T4 לפני 4 חודשים יושב בכיסא גלגלים. לפתע הוא מתלונן על כאב ראש פועם עז; פניו סמוקות ומזיעות, ל״ד 210/115, דופק 48. מה הפעולה הראשונה?","o":["לתת אטרופין IV בשל הברדיקרדיה ולהמשיך לנטר באותה תנוחה עד שהדופק יעלה","להשכיב אותו שטוח ולהרים את רגליו כדי לשפר את זרימת הדם למוח","לתת בולוס נוזלים IV בשל הדופק האיטי","להושיב זקוף ולהוריד רגליים, ואז לבדוק אם השלפוחית מלאה או שהקטטר מקופל"],"a":3,"e":"זוהי דיסרפלקסיה אוטונומית — מצב חירום בפגיעות ברמת T6 ומעלה. גירוי מתחת לרמת הפגיעה (שלפוחית מלאה, צואה במעי, לחץ על העור) מעורר תגובה סימפתטית לא מבוקרת עם עלייה חדה בל״ד, והגוף מגיב בברדיקרדיה ובהרחבת כלי דם מעל רמת הפגיעה. הושבה מורידה את הל״ד, ולאחר מכן מאתרים ומסירים את הגירוי. אם הל״ד נשאר גבוה, ניתנת תרופה להורדת ל״ד לפי הוראה. השכבה שטוחה תחמיר את המצב."},
{"t":"נוירולוגיה","q":"מטופל עם שבר בחוליה צווארית מקובע בהאלו-וסט (Halo vest). מה נכון בטיפול הסיעודי?","o":["המפתח לפתיחת הברגים מוצמד לווסט תמיד, לצורך הסרה מהירה בהחייאה","אפשר לאחוז בטבעת ההאלו כידית כדי להרים או לסובב את המטופל במיטה","כשפין מתרופף, האחות מהדקת אותו בעצמה כדי לשמור על הקיבוע","מסירים את הווסט בלילה כדי להקל על העור שמתחתיו"],"a":0,"e":"ההאלו מקבע את עמוד השדרה הצווארי באמצעות פינים בגולגולת ומוטות המחוברים לווסט. בדום לב חייבים לפתוח את החלק הקדמי במהירות, ולכן המפתח צמוד לווסט תמיד. אסור להרים את המטופל בעזרת הטבעת, ואסור להדק פינים או להסיר את הווסט ללא הוראה, כי הדבר עלול לגרום לתזוזת השבר ולפגיעה בחוט השדרה. האחות מטפלת באתרי הפינים, בודקת את העור מתחת לווסט ועוקבת אחר סימנים נוירולוגיים."},
{"t":"נוירולוגיה","q":"מטופל לאחר פציעת דקירה בגב. בבדיקה: שיתוק ואובדן תחושת מנח (פרופריוספציה) ברגל ימין, ואובדן תחושת כאב וחום ברגל שמאל. איזו תסמונת מתאימה?","o":["Central cord syndrome — חולשה בולטת בגפיים העליונות","פגיעה שלמה בחוט השדרה","Brown-Séquard — פגיעה בחצי הימני של חוט השדרה","Anterior cord syndrome — אובדן תנועה וכאב משני הצדדים עם שימור תחושת מנח"],"a":2,"e":"בתסמונת Brown-Séquard נפגע חצי מחוט השדרה, לרוב מפציעה חודרת. המסלולים המוטוריים ומסלולי תחושת המנח והרטט חוצים את קו האמצע רק בגזע המוח, ולכן הפגיעה בהם מופיעה באותו צד. סיבי הכאב והחום חוצים לצד השני כבר בחוט השדרה, ולכן אובדן תחושתם מופיע בצד הנגדי."},
{"t":"נוירולוגיה","q":"מטופל התקבל לפני 12 שעות עם פגיעה בחוט השדרה ברמת C5. קולו נחלש, השיעול חלש, והקיבולת החיונית ירדה מ-2.8 ל-1.6 ליטר. מה המשמעות?","o":["ביטוי של הלם עמוד שדרה שיחלוף מעצמו, ולכן אין צורך בהתערבות","ירידה צפויה לאחר פגיעה צווארית שאינה מחייבת דיווח","חרדה ממצבו החדש — להרגיע, לתת חמצן במשקפיים ולחזור על ההערכה מחר בבוקר","החמרה נשימתית מבצקת שעולה לעבר C3-C5; לדווח מיד ולהיערך לתמיכה נשימתית"],"a":3,"e":"שורשי C3-C5 מעצבבים את הסרעפת. בפגיעה ב-C5 שרירי הנשימה הבין-צלעיים והבטניים משותקים, והסרעפת היא שמחזיקה את הנשימה. בצקת בחוט השדרה, שמגיעה לשיאה בימים הראשונים, עלולה לעלות לרמות גבוהות יותר ולגרום לכשל נשימתי. ירידה בקיבולת החיונית ושיעול חלש הם סימני אזהרה מוקדמים לפני שהסטורציה יורדת."},
{"t":"נוירולוגיה","q":"מטופל בשבוע השלישי לאחר פגיעה בחוט השדרה ברמת T10. עד עכשיו הגפיים התחתונות היו רפויות וללא רפלקסים. איזה ממצא מעיד על סיום שלב הלם עמוד השדרה (Spinal shock)?","o":["הפסקת הצורך בצנתור השלפוחית ובתוכנית מעיים קבועה","חזרה של רפלקסים מתחת לרמת הפגיעה, כולל ספסטיות","חזרה מלאה של התחושה בגפיים התחתונות","עלייה של הדופק מעל 100 בדקה"],"a":1,"e":"הלם עמוד שדרה הוא דיכוי זמני של כל הפעילות הרפלקסיבית מתחת לרמת הפגיעה: שיתוק רפוי, היעדר רפלקסים ושלפוחית ומעי רפויים. הוא נמשך ימים עד שבועות, וסיומו מסומן בחזרת רפלקסים — בפגיעת UMN לרוב כספסטיות והיפררפלקסיה. חזרת הרפלקסים אינה אומרת שהתנועה הרצונית או התחושה חזרו."},
{"t":"נוירולוגיה","q":"בן 48 עם פריצת דיסק מותנית ידועה מגיע עם החמרה בכאב הגב, חולשה בשתי הרגליים, חוסר תחושה בפרינאום ובפנים הירכיים ('אוכף'), ולא הטיל שתן 10 שעות. מה נכון?","o":["אצירת שתן בגלל משככי הכאבים — להכניס קטטר ולהמשיך טיפול שמרני בבית","החמרה צפויה של פריצת הדיסק — מנוחה, משככי כאבים ומעקב במרפאה","בעיה אורולוגית נפרדת — להפנות לייעוץ אורולוגי","חשד לתסמונת זנב הסוס — מצב חירום שמחייב הדמיה דחופה ולרוב ניתוח"],"a":3,"e":"לחץ על שורשי העצבים בתחתית התעלה גורם לחוסר תחושה באזור 'האוכף', להפרעה בתפקוד השלפוחית והמעי (אצירה או אי-שליטה) ולחולשה בגפיים התחתונות. זה מצב חירום נוירוכירורגי: עיכוב בשחרור הלחץ עלול להשאיר נזק קבוע לשליטה בסוגרים ולתפקוד המיני."},
{"t":"נוירולוגיה","q":"למטופל נקז חדרי חיצוני (EVD). הוא מבקש שירימו את ראש המיטה לארוחה. מה נכון?","o":["להוריד את מכל האיסוף לרצפה כדי שהניקוז יימשך גם כשהמטופל יושב זקוף","אין צורך בפעולה מיוחדת, כי גובה הנקז אינו משפיע על כמות הניקוז","לסגור את הנקז, לשנות תנוחה, לכייל את נקודת האפס לגובה הטרגוס ורק אז לפתוח","לשטוף את הנקז בסליין לפני שמשנים את התנוחה"],"a":2,"e":"הניקוז ב-EVD נקבע לפי הפרש הגובה בין החדר (Foramen of Monro, שגובהו מקביל לטרגוס) לבין תא הטפטוף. שינוי תנוחה בלי לסגור ולכייל מחדש עלול לגרום לניקוז-יתר מהיר, עם קריסת חדרים או דימום, או לניקוז חסר ולעליית ICP. אין לשטוף את הנקז בלי הוראה, בגלל סיכון לזיהום ולעליית ICP."},
{"t":"נוירולוגיה","q":"מטופל עם פגיעת ראש: ל״ד 110/65 (MAP 80) ו-ICP של 30 מ״מ כספית. מה נכון לגבי לחץ הפרפוזיה המוחי (CPP)?","o":["ה-CPP הוא 50 מ״מ כספית — נמוך מהרצוי, עם סיכון לאיסכמיה מוחית","ה-CPP הוא 50 מ״מ כספית, וזה ערך תקין שאינו מחייב דיווח או התערבות","ה-CPP הוא 80 מ״מ כספית, כי ה-ICP אינו משפיע על הפרפוזיה","ה-CPP הוא 110 מ״מ כספית, ולכן הפרפוזיה המוחית תקינה"],"a":0,"e":"CPP = MAP פחות ICP, כלומר 80 פחות 30 = 50. ה-ICP התקין הוא כ-10-20 מ״מ כספית, וה-CPP התקין הוא כ-70-100. ירידה של ה-CPP אל 50 ומטה קשורה באיסכמיה ובנזק מוחי. לכן מטפלים גם בהורדת ה-ICP וגם בשמירה על MAP מספק."},
{"t":"נוירולוגיה","q":"בת 38 התעוררה עם צניחה של זווית הפה מימין. היא אינה מצליחה לסגור את העין הימנית או להרים את הגבה מימין. אין חולשה בגפיים ואין הפרעת דיבור. מה ההתערבות הסיעודית החשובה?","o":["הפעלת צוות שבץ ומתן tPA בדחיפות","הגנה על העין מפני יובש ופגיעה בקרנית, וסטרואידים לפי הוראה","אין צורך בהתערבות מיוחדת, כי העין תיסגר מעצמה תוך יום-יומיים","עיסוי חזק של שרירי הפנים כבר בשלב החריף"],"a":1,"e":"זהו שיתוק פנים היקפי (Bell's palsy) — פגיעה בעצב הפנים (VII). מעורבות המצח מבדילה אותו משבץ, שבו המצח נחסך כי הוא מעוצבב משתי ההמיספרות. כשהעין אינה נסגרת, הקרנית מתייבשת ועלולה להיפגע, ולכן ההגנה על העין היא המוקד הסיעודי. רוב המטופלים מחלימים בתוך שבועות עד חודשים, וסטרואידים שניתנים מוקדם משפרים את הסיכוי."},
{"t":"נוירולוגיה","q":"מטופל בסטטוס אפילפטיקוס שהפרכוס שלו נעצר לאחר לורזפאם. הוחלט לתת Phenytoin IV. מה נכון לגבי המתן?","o":["בסליין בלבד, עד 50 מ״ג לדקה, תחת ניטור לב ולחץ דם","למהול ב-D5W ולהזריק בדחיפה מהירה כדי להשיג רמה טיפולית","לתת בזריקה לשריר, כי הספיגה מהירה יותר","לחבר לאותו קו של כל עירוי שכבר רץ, כדי לחסוך בדקירות"],"a":0,"e":"פניטואין שוקע בתמיסות גלוקוז, ולכן נותנים אותו רק בסליין ושוטפים את הקו בסליין לפני ואחרי. מתן מהיר גורם לתת לחץ דם ולהפרעות קצב, ולכן הקצב מוגבל ל-50 מ״ג לדקה בליווי ניטור. התרופה מגרה מאוד את הווריד, ויש לעקוב אחר האתר בגלל סיכון לנזק רקמתי בדליפה. במתן לשריר הספיגה איטית ולא צפויה."},
{"t":"נוירולוגיה","q":"בן 58 עם מיגרנות ומחלת לב כלילית ידועה (עבר צנתור עם תומכן לפני שנה) קיבל מרשם ל-Sumatriptan. מה תגובת האחות?","o":["להדריך ליטול את התרופה בתחילת כל התקף, בלי מגבלות","להדריך ליטול את התרופה מדי יום כטיפול מונע","לפנות לרופא — טריפטנים מכווצים כלי דם ואסורים במחלת לב כלילית","להמליץ ליטול אותה יחד עם ארגוטמין באותו התקף כדי להגביר את היעילות"],"a":2,"e":"טריפטנים הם אגוניסטים לקולטני סרוטונין, והם מכווצים את כלי הדם המורחבים במוח — אבל גם את העורקים הכליליים. לכן הם אסורים במחלת לב כלילית, לאחר שבץ ובל״ד לא מאוזן. הם מיועדים להתקף חריף, לא לטיפול מונע. שילוב עם ארגוטמין באותן 24 שעות אסור, כי שתי התרופות מכווצות כלי דם."},
{"t":"נוירולוגיה","q":"בן 74 הולך לאט ובבסיס רחב, כאילו רגליו 'דבוקות לרצפה'. בחודשים האחרונים יש לו גם בריחת שתן ובלבול שהולך ומחמיר. ב-CT: הרחבה של חדרי המוח. מה החשד ומה הטיפול?","o":["שבץ לקונרי; טיפול באספירין בלבד","מחלת אלצהיימר מתקדמת; טיפול במעכבי כולין-אסטראז בלבד","מחלת פרקינסון; טיפול ב-Levodopa","הידרוצפלוס בלחץ תקין (NPH); ניקוז CSF והשתלת שאנט"],"a":3,"e":"השילוב של הפרעת הליכה ('מגנטית'), בריחת שתן ודמנציה, יחד עם הרחבת חדרים בהדמיה, הוא התמונה הקלאסית של NPH. חשוב לזהות אותו כי זו אחת הסיבות ההפיכות לדמנציה: ניקוז CSF (ניסיון בניקור מותני) ואחריו השתלת שאנט משפרים לעיתים קרובות את ההליכה ואת השליטה בסוגרים."},
{"t":"נוירולוגיה","q":"מטופל חזר מחדר הניתוח לאחר כריתת גידול בפוסה האחורית (infratentorial). מה התנוחה המקובלת?","o":["ראש המיטה ב-60 עד 90 מעלות לאורך כל היממה לשיפור הניקוז","על הצד, שטוח או בהגבהה קלה, בלי לכופף את הצוואר","שכיבה על הבטן כדי למנוע אספירציה","תנוחת טרנדלנבורג לשיפור הפרפוזיה המוחית"],"a":1,"e":"לאחר ניתוח מעל האוהל (supratentorial) מקובל להרים את ראש המיטה ל-30 מעלות כדי לשפר ניקוז ורידי. לאחר ניתוח בפוסה האחורית משכיבים לרוב שטוח או בהגבהה קלה, על הצד, עם ראש וצוואר בקו ישר. כך נמנעים לחץ על אזור התפרים בעורף ולחץ על גזע המוח, ומופחת הסיכון לאספירציה אם הרפלקסים של הבליעה נפגעו."},
{"t":"נוירולוגיה","q":"מטופלת עם טרשת נפוצה מסוג RRMS התחילה זריקות Interferon beta. אחרי כל זריקה היא מרגישה כמו בשפעת — חום וכאבי שרירים. מה ההדרכה?","o":["להזריק תמיד באותו מקום כדי שהגוף יתרגל","זה סימן להתלקחות של המחלה, ויש להפסיק את הטיפול מיד ולדווח","זו תגובה אלרגית, ויש להפסיק את הטיפול ולהשתמש באדרנלין","תופעה שכיחה: להזריק לפני השינה, פרצטמול לפי הוראה והחלפת אתרים"],"a":3,"e":"תסמינים דמויי שפעת הם תופעת הלוואי השכיחה של אינטרפרון, והם נחלשים לרוב בחודשים הראשונים. הזרקה לפני השינה וטיפול מקדים במשככי חום מקלים עליהם. יש להחליף אתרי הזרקה כדי למנוע תגובות עוריות. במעקב בודקים גם ספירת דם ותפקודי כבד, ושמים לב לסימנים של דיכאון."},
{"t":"נוירולוגיה","q":"מטופלת עם מיאסטניה גרביס אושפזה עם דלקת ריאות. איזו הוראה מחייבת בירור עם הרופא לפני ביצוע?","o":["Gentamicin IV","פיזיותרפיה נשימתית פעמיים ביום","Paracetamol לפי צורך לחום","Pyridostigmine במועדים הקבועים"],"a":0,"e":"אמינוגליקוזידים פוגעים בהעברה בצומת העצב-שריר ועלולים להחמיר את החולשה עד משבר מיאסתני. גם פלואורוקווינולונים, מגנזיום, חלק מחוסמי הביתא ותרופות נוספות מסוכנים במחלה. זיהום כשלעצמו הוא טריגר שכיח למשבר, ולכן יש לנטר קיבולת חיונית ובליעה. חשוב להקפיד על מתן הפירידוסטיגמין בזמן."},
{"t":"נוירולוגיה","q":"מטופלת עם דימום תת-עכבישי ממפרצת שעדיין לא טופלה (לפני קליפס או סליל). מה כוללים אמצעי הזהירות (Aneurysm precautions)?","o":["הפסקת הניטור הנוירולוגי בלילה כדי לאפשר שינה רציפה","שקט, הגבלת מבקרים, מרככי צואה והימנעות ממאמץ ומ-Valsalva","חוקן בשל עצירות, והנחיה ללחוץ בזמן יציאה","עידוד הליכה מוקדמת במסדרון כמה פעמים ביום כדי למנוע DVT"],"a":1,"e":"לפני שהמפרצת מטופלת, דימום חוזר הוא סיבוך מסכן חיים. המטרה היא למנוע קפיצות בלחץ הדם ובלחץ התוך-גולגולתי: לצמצם גירויים, למנוע מאמץ ו-Valsalva (לכן מרככי צואה ולא חוקן), לשלוט בכאב ובל״ד לפי הוראה ולהמשיך בניטור נוירולוגי צמוד."},
{"t":"אורולוגיה","q":"בת 70 הטילה 150 מ״ל לאחר הוצאת קטטר. סריקת שלפוחית (Bladder scan) מיד אחר כך מראה שארית של 400 מ״ל. מה המשמעות?","o":["ממצא תקין לאחר הוצאת קטטר שאינו מחייב פעולה","סימן לפוליאוריה אחרי הוצאת הקטטר — יש להגביל את השתייה בערב","סימן לבריחת שתן במאמץ — יש להתחיל תרגילי רצפת אגן","התרוקנות לא מלאה — לדווח, ולרוב צנתור לסירוגין לפי הוראה"],"a":3,"e":"שארית תקינה אחרי הטלת שתן היא עד כ-50 מ״ל, ושארית של יותר מ-100 מ״ל מעידה על התרוקנות לא מלאה. שארית של 400 מ״ל פירושה שרוב השתן נשאר בשלפוחית. מצב כזה מגביר את הסיכון לזיהום, למתיחת יתר של השלפוחית ולהידרונפרוזיס, ולכן נדרש ניקוז ובירור הסיבה."},
{"t":"אורולוגיה","q":"מטופל עבר ניתוח ליצירת Indiana pouch — שלפוחית פנימית מקטע מעי עם סטומה נשלטת. מה ההדרכה?","o":["יידרש קטטר קבוע דרך השופכה לכל החיים, עם החלפה חודשית","השתן יופרש דרך פי הטבעת יחד עם הצואה","אין שקית; המטופל מצנתר את המאגר דרך הסטומה כל כמה שעות","השתן יזרום ברציפות לשקית שמודבקת על הבטן"],"a":2,"e":"ב-Indiana pouch השופכנים מושתלים למאגר שנבנה מהמעי, ומנגנון שסתום מונע דליפה דרך הסטומה. לכן אין צורך בשקית: המטופל מצנתר את המאגר בעצמו, בתחילה בתדירות גבוהה ובהמשך כל 4-6 שעות. רירית המעי מייצרת ריר, ולכן שוטפים את המאגר כדי למנוע חסימה. זה שונה מ-Ileal conduit, שבו השתן זורם ברציפות לשקית."},
{"t":"אורולוגיה","q":"בן 65 עם BPH התחיל טיפול ב-Finasteride. מה נכון?","o":["התרופה אינה משפיעה על ערכי ה-PSA","ההשפעה מופיעה אחרי חודשים, וה-PSA יורד בכחצי","ההקלה בתסמינים מתחילה תוך שעות, כמו בחוסמי אלפא","תופעת הלוואי העיקרית היא ירידת ל״ד תנוחתית כבר מהמנה הראשונה"],"a":1,"e":"Finasteride מעכב את האנזים 5-alpha reductase ומפחית את הפיכת הטסטוסטרון ל-DHT. כך הערמונית מתכווצת בהדרגה, בתוך חודשים. מכיוון שה-PSA יורד בכחצי, יש להביא זאת בחשבון במעקב. החומר עלול לפגוע בהתפתחות איברי המין בעובר זכר, ולכן אישה בהיריון לא תיגע בטבליות שבורות. ירידת ל״ד תנוחתית אופיינית דווקא לחוסמי אלפא."},
{"t":"אורולוגיה","q":"בן 62 לאחר כריתה רדיקלית של הערמונית שואל, לפני הוצאת הקטטר, למה לצפות. מה ההדרכה?","o":["השליטה בשתן תהיה מלאה מיד אחרי הוצאת הקטטר","אפשר להרים משאות כבדים ולנהוג כבר בשבוע הראשון","דליפת שתן שכיחה ומשתפרת בהדרגה; לתרגל כיווץ רצפת האגן","יש להגביל את השתייה ל-500 מ״ל ביום כדי שלא תהיה דליפה"],"a":2,"e":"בכריתה רדיקלית מוסרת הערמונית כולה, והשופכה מחוברת מחדש לצוואר השלפוחית. לכן בריחת שתן שכיחה בשבועות-חודשים הראשונים, ותרגול רצפת האגן מאיץ את החזרה לשליטה. הפרעה בזקפה תלויה במידה שבה נשמרו העצבים. הגבלת שתייה אינה מומלצת, כי היא מרכזת את השתן ומגרה את השלפוחית. מאמץ והרמת משאות נמנעים בשבועות הראשונים."},
{"t":"אורולוגיה","q":"בן 45 עם נפיחות לא כואבת בשק האשכים שהתפתחה בהדרגה. כשמאירים עליה בפנס (Transillumination) האור עובר דרכה. מה הסביר?","o":["פיתול אשך","גידול באשך","וריקוצלה — הרחבה של ורידי חבל הזרע","הידרוצלה — הצטברות נוזל סביב האשך"],"a":3,"e":"נוזל מעביר אור, ולכן הידרוצלה 'מוארת' בפנס. גוש מוצק, כמו גידול באשך, אינו מעביר אור, ולכן כל גוש כזה מחייב אולטרסאונד. וריקוצלה מורגשת כ'שק תולעים' שמתבלט בעמידה. פיתול אשך מתבטא בכאב פתאומי וחד ומהווה מצב חירום."},
{"t":"אורולוגיה","q":"בן 24 שואל איך לבצע בדיקה עצמית של האשכים. מה ההדרכה הנכונה?","o":["רק כשיש כאב או נפיחות","כל יום, בלחיצה חזקה כדי לא לפספס גוש","פעם בחודש אחרי מקלחת חמה, בגלגול כל אשך בין האצבעות","פעם בשנה, במים קרים, כשהאשכים מכווצים וקל יותר למשש אותם"],"a":2,"e":"סרטן האשך שכיח בגברים צעירים (בערך בגילי 15-35), ומתבטא לרוב בגוש קשה ולא כואב. מים חמים מרפים את שק האשכים ומקלים על המישוש. חשוב להכיר את האפידידימיס — מבנה רך דמוי חבל מאחורי האשך — כדי לא לחשוב בטעות שהוא גוש. כל ממצא חדש מחייב פנייה לרופא."},
{"t":"אורולוגיה","q":"בת 66 עם בריחת שתן מסוג דחיפות (Urge) מתחילה אימון שלפוחית. מה נכון?","o":["להטיל שתן רק כשהשלפוחית מרגישה מלאה לגמרי","לוח זמנים קבוע, דחיית הדחף והארכה הדרגתית של המרווחים","להגביל שתייה לפחות מליטר ביום","ללכת לשירותים מיד בכל פעם שמופיע דחף, כדי לא להתאמץ"],"a":1,"e":"אימון שלפוחית 'מלמד' מחדש את השלפוחית להחזיק נפחים גדולים יותר. מתחילים בלוח זמנים קבוע ומאריכים את המרווחים בהדרגה, ובזמן דחף משתמשים בכיווץ רצפת האגן ובהסחת דעת. הגבלת שתייה מרכזת את השתן ומגרה את השלפוחית, ולכן מעדיפים להפחית קפאין ואלכוהול. היענות מיידית לכל דחף מקבעת את הבעיה."},
{"t":"אורולוגיה","q":"בת 84 עם דמנציה בינונית ודלקת מפרקים קשה מאושפזת במחלקה. מוצאים אותה לעיתים קרובות רטובה בדרך לשירותים. בדיקת השתן ובדיקת השארית תקינות. מה הסוג ומה ההתערבות?","o":["קטטר קבוע כפתרון ראשון","בריחת שתן מגלישה (Overflow) — צנתור לסירוגין כל 6 שעות","תפקודית — ליווי לשירותים לפי שעון והתאמת הסביבה","בריחת שתן במאמץ — הפניה לניתוח"],"a":2,"e":"בבריחת שתן תפקודית דרכי השתן תקינות, אבל מגבלה קוגניטיבית או תנועתית מונעת מהמטופלת להגיע לשירותים בזמן. הטיפול מתמקד בסביבה ובשגרה: הזמנה לשירותים לפי שעון (prompted voiding), סיר או כיסא שירותים ליד המיטה, תאורה ובגדים נוחים. קטטר קבוע מעלה מאוד את הסיכון לזיהום ואינו פתרון לבעיה זו."},
{"t":"אורולוגיה","q":"בן 86 מבית אבות, בדרך כלל צלול, מבולבל מאתמול. אין לו חום ואין תלונות על מתן שתן. השתן עכור וריחו חזק. מה נכון?","o":["אין זיהום בדרכי השתן בלי חום, ולכן אין צורך בבדיקות נוספות","בקשישים זיהום עלול להתבטא בבלבול בלי חום; לשלוח בדיקת שתן ותרבית","בלבול בגיל 86 הוא חלק מההזדקנות ואינו מצריך בירור","יש להתחיל תרופה אנטי-פסיכוטית כדי להרגיע אותו"],"a":1,"e":"בגיל מבוגר תגובת החום והדלקת מוחלשת, וזיהומים מתבטאים לא פעם בשינוי במצב ההכרה, בנפילות או בירידה בתפקוד. בלבול חדש הוא דליריום עד שיוכח אחרת, ויש לחפש סיבה הפיכה — זיהום בדרכי השתן הוא אחת השכיחות. עם זאת, האבחנה נקבעת לפי התמונה הכוללת והתרבית, ולא לפי ריח או מראה השתן בלבד."},
{"t":"אורתופדיה","q":"מטופל מקבל קביים בפעם הראשונה. מה נכון לגבי ההתאמה והשימוש?","o":["רווח של 2-3 אצבעות מתחת לבית השחי, והמשקל על כפות הידיים","אורך הקביים שווה לגובה המטופל","המרפקים ישרים לגמרי בזמן ההליכה","כרית הקב צמודה היטב לבית השחי, והמשקל נישא עליה"],"a":0,"e":"כשהמשקל נישא על בית השחי נוצר לחץ על עצבי המקלעת הזרועית, ועלול להיגרם שיתוק (crutch palsy). לכן משאירים רווח מתחת לבית השחי, והמטופל נשען על ידיות האחיזה כשמרפקיו בכיפוף של כ-20-30 מעלות. גובה הידית נקבע בערך בגובה מפרק כף היד כשהזרוע משוחררת."},
{"t":"אורתופדיה","q":"בת 72 עם אוסטאוארתריטיס בברך שמאל מתחילה ללכת עם מקל. מה ההדרכה?","o":["להחזיק את המקל ביד שמאל ולקדם אותו יחד עם הרגל השמאלית","ביד ימין, ולקדם אותו יחד עם הרגל השמאלית","להחזיק את המקל ביד הדומיננטית, בלי קשר לצד הפגוע","להחזיק את המקל ביד שמאל ולקדם אותו יחד עם הרגל הימנית"],"a":1,"e":"מקל ביד הנגדית מחקה את דפוס ההליכה הטבעי, שבו היד והרגל הנגדית נעות יחד. כך הוא מרחיב את בסיס התמיכה ומוריד עומס מהמפרק הפגוע. המקל והרגל הפגועה מתקדמים יחד, ואחריהם הרגל הבריאה. אחיזה באותו צד גורמת להטיית הגוף ולעומס גדול יותר על הברך."},
{"t":"אורתופדיה","q":"בת 83 עם שבר בצוואר הירך ממתינה לניתוח. בלילה היא מבולבלת ומנסה לרדת מהמיטה. מה הצעד הראשון?","o":["לקשור אותה למיטה מיד כדי למנוע נפילה","לתת הלופרידול כצעד ראשון כדי להרגיע אותה, ורק אחר כך להעריך","להניח שמדובר בדמנציה שלא אובחנה ולתעד בלבד","לחפש סיבות הפיכות לדליריום (סטורציה, כאב, אצירה, תרופות) ולדווח"],"a":3,"e":"דליריום שכיח מאוד בקשישים עם שבר בירך, והוא קשור לתמותה ולסיבוכים. הסיבות השכיחות — היפוקסיה, כאב שלא טופל, אצירת שתן, עצירות, תרופות (כמו אופיואידים ואנטי-כולינרגיות) והפרעות אלקטרוליטים — ניתנות לתיקון. קשירה מגבירה את הבלבול ואת הסיכון לפגיעה, ותרופות אנטי-פסיכוטיות אינן צעד ראשון. גם ניתוח בתוך 24-48 שעות מפחית סיבוכים."},
{"t":"אורתופדיה","q":"בת 55 עם כאבי עצמות מפושטים, חולשה בשרירים הקרובים לגוף והליכה מתנדנדת. בבדיקות: סידן נמוך-תקין, זרחן נמוך, ALP מוגבר וויטמין D נמוך. מה האבחנה?","o":["אוסטאופורוזיס — ירידה בצפיפות העצם עם בדיקות דם שאינן תקינות","אוסטאומלציה — מינרליזציה לקויה של העצם מחוסר בוויטמין D","שיגדון (Gout)","מחלת פאג'ט של העצם"],"a":1,"e":"באוסטאומלציה מטריקס העצם אינו עובר מינרליזציה תקינה, והעצם רכה ועלולה להתעוות ולהישבר. חוסר בוויטמין D מוריד את ספיגת הסידן והזרחן, ה-ALP עולה ומופיעים כאבי עצמות וחולשת שרירים. באוסטאופורוזיס, לעומת זאת, בדיקות הדם תקינות לרוב. הטיפול כולל ויטמין D, סידן וטיפול בגורם."},
{"t":"אורתופדיה","q":"בת 76 עם שבר דחיסה אוסטאופורוטי בחוליה מותנית וכאב קשה. הוצע לה Kyphoplasty. מה ההסבר הנכון?","o":["החלפת החוליה השבורה בתותב מתכת","קיבוע של כל עמוד השדרה המותני בברגים ובמוטות","פעולה שמרפאת את האוסטאופורוזיס ומייתרת טיפול תרופתי","הזרקת צמנט עצם לגוף החוליה לייצוב השבר ולהקלה בכאב"],"a":3,"e":"ב-Kyphoplasty (וב-Vertebroplasty הדומה לה) מזריקים צמנט עצם לתוך גוף החוליה, והכאב פוחת לרוב תוך שעות. דליפת צמנט עלולה ללחוץ על חוט השדרה או על שורשי העצבים, ולכן עוקבים אחרי סימנים נוירולוגיים. הפעולה מטפלת בשבר, לא במחלה, ולכן הטיפול באוסטאופורוזיס ממשיך."},
{"t":"אורתופדיה","q":"מטופל לאחר החלפת מפרק ברך מחובר למכשיר CPM (Continuous Passive Motion). מה נכון?","o":["להתחיל בכיפוף מקסימלי כבר ביום הראשון","ברך מיושרת עם ציר המכשיר, וטווח כיפוף שמוגדל בהדרגה לפי הוראה","להשתמש במכשיר רק אם המטופל אינו מסוגל לפיזיותרפיה אקטיבית","להפעיל את המכשיר 24 שעות ברציפות, גם בזמן ארוחות ושינה"],"a":1,"e":"ה-CPM מכופף ומיישר את הברך באופן סביל, כדי לשמור על טווח תנועה ולהפחית הידבקויות. ציר המכשיר צריך להתאים לציר הברך, והטווח מוגדל בהדרגה לפי ההוראה ולפי הכאב. הוא מופסק בארוחות ובפעולות אחרות, ואינו מחליף פיזיותרפיה ותרגול פעיל. משככי כאבים לפני השימוש משפרים את ההיענות."},
{"t":"אורתופדיה","q":"מטופל לאחר החלפת מפרק ירך ישוחרר עם זריקות Enoxaparin. מה ההדרכה להזרקה?","o":["לעסות את מקום ההזרקה אחרי הזריקה כדי לשפר את הפיזור","תת-עורית בבטן, בלי להוציא את בועת האוויר ובלי לשפשף","להזריק לשריר הירך, כי הספיגה שם טובה יותר","לרוקן את בועת האוויר מהמזרק לפני ההזרקה"],"a":1,"e":"Enoxaparin (הפרין בעל משקל מולקולרי נמוך) ניתן תת-עורית כדי למנוע DVT אחרי החלפת מפרק. בועת האוויר במזרק המוכן 'נועלת' את התרופה ברקמה ומונעת דליפה, ושפשוף מגביר שטפי דם. מדריכים גם להחליף צדדים ולדווח על דימום — צואה שחורה, שתן דמי או חבורות נרחבות. זריקה לשריר גורמת להמטומה."},
{"t":"אורתופדיה","q":"בן 58, צבע במקצועו, מתלונן על כאב בכתף שמחמיר בלילה ובהרמת היד מעל הראש. במבחן Drop arm הוא אינו מצליח להוריד את היד לאט מהרמה לצד. מה החשד?","o":["קרע בשרוול המסובבים (Rotator cuff)","תסמונת התעלה הקרפלית עם כאב מוקרן לכתף","שבר בעצם הבריח","פריקת כתף"],"a":0,"e":"שרוול המסובבים מייצב את ראש ההומרוס ומאפשר הרחקה וסיבוב של הזרוע. קרע בו שכיח אחרי גיל 40, בעיקר בעבודה חוזרת מעל הראש, ומתבטא בכאב לילי, בחולשה ובקושי להרים את היד. במבחן Drop arm הזרוע 'נופלת' כי השריר אינו מחזיק אותה. הטיפול: פיזיותרפיה ומשככים, ובקרע משמעותי — תיקון ניתוחי."},
{"t":"אורתופדיה","q":"רוכב אופנוע מגיע למיון עם שבר פתוח בשוק, וקצה עצם בולט דרך העור. מה הטיפול הראשוני הנכון?","o":["לשטוף באלכוהול ולתפור את הפצע במיון","לתת אנטיביוטיקה רק אם יופיעו סימני זיהום","חבישה סטרילית בלי להחזיר את העצם, קיבוע, אנטיביוטיקה IV וטטנוס","להחזיר את קצה העצם אל מתחת לעור, לחבוש בלחץ ולקבע"],"a":2,"e":"בשבר פתוח הסיכון העיקרי הוא זיהום עמוק של העצם (אוסטאומיאליטיס). לכן מכסים בחבישה סטרילית, לא מחזירים את העצם (כדי לא להכניס מזהמים), מקבעים ובודקים את חיות הגפה. אנטיביוטיקה ניתנת מוקדם ככל האפשר, ומוודאים חיסון נגד טטנוס. בהמשך מבצעים בחדר ניתוח שטיפה והטריה, ולעיתים קיבוע חיצוני. לא סוגרים את הפצע במיון."},
{"t":"נפרולוגיה","q":"מטופל עם אשלגן 7.1 וגלי T מחודדים ב-ECG קיבל Calcium gluconate IV. מה מטרת התרופה?","o":["להכניס את האשלגן לתוך התאים","לייצב את קרום שריר הלב, בלי להוריד את רמת האשלגן","להגביר את הפרשת האשלגן בשתן","לקשור את האשלגן במעי ולהוציא אותו בצואה בתוך שעות"],"a":1,"e":"בהיפרקלמיה עם שינויים ב-ECG, הסידן ניתן ראשון כי הוא מגן על הלב תוך דקות, אבל אינו משנה את רמת האשלגן. לכן משלבים אותו עם טיפולים שמורידים את האשלגן: אינסולין עם גלוקוז ואגוניסט בטא מעבירים אותו לתאים, משתנים ושרפים קושרים מוציאים אותו מהגוף, ובמצבים קשים — דיאליזה."},
{"t":"נפרולוגיה","q":"מטופל בהמודיאליזה מגיע לטיפול של הבוקר. ברשימת התרופות שלו יש תרופה להורדת ל״ד שנלקחת בבוקר. מה נכון?","o":["לתת את התרופה כרגיל, שעה לפני תחילת הטיפול","לתת מנה כפולה כדי למנוע עליית ל״ד בזמן הדיאליזה","לרוב דוחים אותה לאחר הטיפול לפי הוראה, בגלל סיכון לתת ל״ד","להפסיק לצמיתות את כל התרופות של מטופלי דיאליזה"],"a":2,"e":"בזמן ההמודיאליזה מוצאים נוזלים, ולחץ הדם יורד. תרופה להורדת ל״ד שניתנת לפני הטיפול מגבירה את הסיכון לתת לחץ דם, להתכווצויות ולהפסקת הטיפול. בנוסף, חלק מהתרופות (כמו ויטמינים מסיסים במים וחלק מהאנטיביוטיקות) מתפנות בדיאליזה, ולכן נותנים אותן אחריה. ההחלטה נעשית לפי הוראה רפואית ולפי ערכי הל״ד."},
{"t":"נפרולוגיה","q":"מטופל בטיפול נמרץ בהלם ספטי מקבל נוראדרנלין, ויש לו AKI, עומס נוזלים וחמצת. מדוע יועדף טיפול כלייתי חלופי רציף (CRRT)?","o":["הוצאת נוזלים איטית ורציפה, שנסבלת טוב יותר במטופל לא יציב","כי אינו דורש גישה לכלי דם","כי אפשר לבצע אותו בבית המטופל","כי הוא מהיר יותר מהמודיאליזה רגילה ומסתיים בתוך שעה"],"a":0,"e":"בהמודיאליזה רגילה מוציאים כמות גדולה של נוזלים בכמה שעות, וזה עלול לגרום לקריסת ל״ד במטופל בהלם. CRRT פועל 24 שעות ביממה בקצב איטי, ולכן השינויים בנפח ובאלקטרוליטים הדרגתיים. הוא דורש צנתר דיאליזה מרכזי ונוגד קרישה למערכת, ומתבצע רק ביחידה לטיפול נמרץ."},
{"t":"נפרולוגיה","q":"מטופל בהמודיאליזה (שלוש פעמים בשבוע) עלה 3.5 ק״ג מאז הטיפול הקודם לפני יומיים. הוא מתלונן על קוצר נשימה קל בשכיבה. מה נכון?","o":["זו עלייה צפויה במסת השריר ואינה מחייבת התייחסות","יש לדלג על הטיפול הבא כדי לאפשר לגוף לאזן את עצמו","העלייה נובעת מתזונה עשירה בחלבון, שיש להפסיק","בעיקר נוזלים עודפים; לנטר ריאות, לדווח ולחזק הגבלת נוזלים ומלח"],"a":3,"e":"במטופל עם תפוקת שתן מועטה, כמעט כל הנוזלים שנשתים נשארים בגוף עד הטיפול הבא. היעד הוא עלייה קטנה בין טיפולים (בדרך כלל עד כ-1-1.5 ק״ג ליום). עלייה גדולה מגבירה את הסיכון לבצקת ריאות וליתר ל״ד, ומחייבת הוצאת נוזלים מהירה שגורמת לתת ל״ד ולהתכווצויות. ההדרכה: הגבלת נוזלים לפי תפוקת השתן, הפחתת מלח (שמגביר צמא) ושקילה יומית."},
{"t":"נפרולוגיה","q":"מטופל עם CKD ואשלגן גבוה מבקש חטיף בין הארוחות. מה הבחירה המתאימה ביותר?","o":["תפוז","פירות יבשים (תמרים, צימוקים)","תפוח","בננה"],"a":2,"e":"בננות, הדרים, פירות יבשים, תפוחי אדמה, עגבניות ומיצים מרוכזים עשירים באשלגן. תפוחים, אגסים, ענבים ופירות יער דלים יחסית באשלגן ומתאימים יותר. גם תחליפי מלח מכילים לרוב אשלגן ואסורים. ההדרכה נעשית יחד עם דיאטנית, בהתאם לשלב המחלה ולערכי המעבדה."},
{"t":"נפרולוגיה","q":"מטופל בדיאליזה פריטוניאלית עלה 5 ק״ג בחצי שנה, וערכי הסוכר ושומני הדם שלו עולים. מה ההסבר?","o":["ספיגת דקסטרוז מתמיסת הדיאליזה, שמוסיפה קלוריות","זו תופעה שאין לה קשר לדיאליזה","איבוד חלבון בתמיסת הדיאליזה, שגורם להשמנה ולעליית הסוכר","דליפה של תמיסת הדיאליזה לתוך הריאות"],"a":0,"e":"הדקסטרוז בתמיסה יוצר את המפל האוסמוטי שמוציא נוזלים, אבל חלק ממנו נספג דרך הצפק. הספיגה המתמשכת מוסיפה מאות קלוריות ביום, ועלולה לגרום לעלייה במשקל, להיפרגליקמיה ולהיפרטריגליצרידמיה. לכן עוקבים אחר משקל, סוכר ושומנים, ומתאימים את התמיסות ואת התזונה."},
{"t":"נפרולוגיה","q":"מטופל עם מחלת כליות סופנית שמפספס טיפולי דיאליזה מתלונן על כאב בחזה שמחמיר בשכיבה ומוקל כשהוא מתכופף קדימה. בהאזנה ללב נשמע רעש חיכוך. מה החשד?","o":["ריפלוקס קיבתי-ושטי, שמטופל בנוגדי חומצה","דלקת ריאות, שמטופלת באנטיביוטיקה בלבד","פריקרדיטיס אורמית — לדווח; לרוב נדרשת דיאליזה דחופה","אוטם שריר הלב, שמטופל בצנתור דחוף בלבד"],"a":2,"e":"רמות גבוהות של פסולת חנקנית מגרות את קרום הלב וגורמות לפריקרדיטיס. כאב שמשתנה עם התנוחה, יחד עם רעש חיכוך, אופייני לה. זו אחת האינדיקציות לדיאליזה דחופה. הסכנה היא הצטברות נוזל בקרום הלב עד טמפונדה, ולכן עוקבים אחר ל״ד, גודש ורידי צוואר וקולות לב מעומעמים."},
{"t":"נפרולוגיה","q":"בת 42 עם מחלת כליות פוליציסטית (PKD) מתלוננת על כאב ראש פתאומי ועז, 'החזק ביותר בחייה'. מה נכון?","o":["זה ביטוי לזיהום בציסטות בכליות","כאב ראש הוא תופעה שכיחה ב-PKD בגלל יתר לחץ דם, ומספיק לתת משככי כאבים","חשד לדימום ממפרצת מוחית, השכיחה יותר ב-PKD — לדווח מיד","כאב הראש נגרם מאורמיה, ויש להקדים את הדיאליזה"],"a":2,"e":"מחלת כליות פוליציסטית היא מחלה מערכתית: מלבד ציסטות בכליות ובכבד, יש סיכון מוגבר למפרצות בעורקי המוח. כאב ראש פתאומי ועז הוא סימן אזהרה לדימום ממפרצת. במעקב שגרתי חשוב לאזן את לחץ הדם, וקרובי משפחה עם היסטוריה של מפרצות עשויים להיות מופנים לסקר."},
{"t":"המטולוגיה","q":"מטופל התחיל טיפול ב-Warfarin (Coumadin) לאחר DVT. מה ההדרכה התזונתית?","o":["להימנע לחלוטין מכל ירק ירוק לאורך כל תקופת הטיפול","לשמור על צריכה קבועה של ירקות עליים, בלי שינויים חדים","לאכול כמה שיותר ירקות ירוקים כדי לחזק את כלי הדם","ליטול תוסף ויטמין K יומי כדי למנוע דימומים"],"a":1,"e":"וורפרין פועל נגד ויטמין K ומפחית את ייצור גורמי הקרישה התלויים בו. שינוי חד בכמות הוויטמין בתזונה משנה את ה-INR: עלייה בצריכה מחלישה את ההשפעה, וירידה פתאומית מגבירה את סכנת הדימום. היעד המקובל ברוב ההתוויות הוא INR של 2-3. ויטמין K עצמו הוא הנוגדן במקרה של דימום או INR גבוה מאוד."},
{"t":"המטולוגיה","q":"לפני עירוי של מנת דם, באיזו תמיסה ממלאים את סט העירוי?","o":["NaCl 0.9% (סליין)","D5W — גלוקוז 5%","גלוקוז 5% בסליין חצי-מרוכז","רינגר לקטט"],"a":0,"e":"סליין 0.9% הוא התמיסה היחידה שמותר להעביר עם מוצרי דם. תמיסות גלוקוז גורמות לכדוריות האדומות להתנפח ולהתפרק (המוליזה). רינגר לקטט מכיל סידן, שמנטרל את נוגד הקרישה (ציטרט) שבמנה ועלול לגרום להיווצרות קרישים בסט. גם תרופות אין להוסיף למנת הדם או לקו שבו היא עוברת."},
{"t":"המטולוגיה","q":"מטופל עם אנמיה חרמשית ומשברים תכופים מתחיל טיפול ב-Hydroxyurea. מה נכון?","o":["מעלה המוגלובין עוברי ומפחית משברים; דורש מעקב ספירות דם","התרופה מרפאת את המחלה ומאפשרת להפסיק את המעקב","התרופה פועלת כנוגד קרישה ומונעת אוטמים","התרופה ניתנת בזמן משבר חריף במקום נוזלים ושיכוך כאב"],"a":0,"e":"המוגלובין עוברי אינו עובר 'סיקול', ולכן עלייה ברמתו מפחיתה את עיוות הכדוריות, את משברי הכאב ואת תסמונת החזה החריפה. Hydroxyurea היא תרופה ציטוטוקסית, ולכן עוקבים אחר ספירות הדם ומדריכים על מניעת היריון. היא אינה מחליפה את הטיפול במשבר — נוזלים, שיכוך כאב וחמצן."},
{"t":"המטולוגיה","q":"מטופלת עם אנמיה מחוסר ברזל שאינה סובלת ברזל פומי אמורה לקבל ברזל תוך-ורידי. מה חשוב במתן?","o":["מתן בדחיפה מהירה כדי לקצר את זמן האשפוז","אין צורך בהשגחה, כי מתן תוך-ורידי בטוח יותר ממתן פומי","השגחה צמודה על סימני אנפילקסיס, עם ציוד החייאה זמין","מתן יחד עם ארוחה כדי לשפר את הספיגה"],"a":2,"e":"תכשירי ברזל תוך-ורידיים, ובמיוחד Iron dextran, עלולים לגרום לתגובה אלרגית קשה. לכן עוקבים אחר המטופלת בתחילת העירוי ולאחריו, ומוכנים לטיפול באנפילקסיס. במתן לשריר משתמשים בשיטת Z-track כדי למנוע כתמים בעור. בסיום הטיפול בודקים מדדי ברזל כדי להעריך את התגובה."},
{"t":"המטולוגיה","q":"מטופל עם CML (כרומוזום פילדלפיה חיובי) מתחיל טיפול ב-Imatinib. מה נכון?","o":["זה נוגדן חד-שבטי שניתן בעירוי פעם בחודש","זו כימותרפיה תוך-ורידית שניתנת רק באשפוז, במחזורים","תרופה פומית שחוסמת את BCR-ABL; דורשת היענות יומית","זה טיפול קצר של שבוע, ואחריו המחלה נרפאת"],"a":2,"e":"כרומוזום פילדלפיה יוצר את הגן המאוחה BCR-ABL, שמקודד לאנזים טירוזין-קינאז פעיל תמיד ומניע חלוקה בלתי מבוקרת של תאים. Imatinib חוסם את האנזים והפך את CML ממחלה קטלנית למחלה כרונית שמאוזנת לאורך שנים. הטיפול נמשך זמן רב, ודילוג על מנות עלול לגרום לעמידות. תופעות לוואי שכיחות: בצקות, בחילה והתכווצויות שרירים."},
{"t":"המטולוגיה","q":"מטופל לאחר השתלת תאי גזע קיבל הוראה לקבל רק מנות דם מוקרנות (Irradiated). מה מטרת ההקרנה?","o":["למנוע GVHD שקשור לעירוי, בנטרול לימפוציטים של התורם","להאריך את חיי המדף של המנה","להפחית תגובות חום שאינן המוליטיות ותגובות אלרגיות","לעקר חיידקים במנת הדם"],"a":0,"e":"במטופל עם דיכוי חיסוני קשה, לימפוציטים של התורם שנמצאים במנה עלולים להתרבות ולתקוף את רקמות המקבל — מצב נדיר אך כמעט תמיד קטלני. ההקרנה מונעת מהם להתחלק. הפחתת תגובות חום היא מטרה של סינון לויקוציטים (Leukoreduction), שהוא טיפול אחר. ההקרנה אינה מעקרת חיידקים."},
{"t":"המטולוגיה","q":"מטופלת עם Pernicious anemia קיבלה זריקות B12 חודשיים, והערכים השתפרו. היא שואלת מתי תוכל להפסיק. מה נכון?","o":["הטיפול לכל החיים, כי החסר ב-Intrinsic factor אינו חולף","אפשר לעבור לתזונה עשירה בבשר במקום הזריקות","אפשר להפסיק ברגע שספירת הדם חוזרת לתקין","אפשר להחליף לתוסף פומי במינון רגיל, שייספג כמו מהמזון"],"a":0,"e":"ב-Pernicious anemia הגוף אינו מייצר Intrinsic factor, ובלעדיו B12 מהמזון אינו נספג במעי הדק. לכן תזונה או תוסף במינון רגיל לא יספיקו. הטיפול הוא זריקות קבועות לכל החיים (או תכשירים במינון גבוה מאוד לפי החלטה רפואית). הנזק הנוירולוגי עלול להפוך לבלתי הפיך אם החסר חוזר."},
{"t":"המטולוגיה","q":"מטופל מקבל עירוי הפרין רגיל (Unfractionated heparin) לטיפול בתסחיף ריאתי. מה נכון לגבי הניטור והנוגדן?","o":["הניטור הוא באמצעות INR, והנוגדן הוא ויטמין K","הניטור הוא באמצעות ספירת טסיות בלבד, ואין נוגדן","הניטור הוא באמצעות רמת פיברינוגן, והנוגדן הוא סידן","aPTT, והנוגדן הוא Protamine sulfate"],"a":3,"e":"הפרין מגביר את פעילות האנטי-תרומבין ומאריך את ה-aPTT, ולכן מתאימים את קצב העירוי לפי בדיקות aPTT חוזרות. Protamine sulfate נקשר להפרין ומנטרל אותו במקרה של דימום. ה-INR וויטמין K שייכים לוורפרין. במקביל עוקבים אחר ספירת הטסיות בגלל הסיכון ל-HIT."},
{"t":"אונקולוגיה","q":"מטופלת לפני מחזור הכימותרפיה הרביעי מתחילה להקיא כבר בחניון של בית החולים, לפני קבלת הטיפול. מה נכון?","o":["בחילה מקדימה (מותנית) — הרפיה, הסחת דעת ולעיתים בנזודיאזפין","זה סימן לחסימת מעיים שמחייבת הדמיה דחופה","זה סימן לכך שהמחלה מתקדמת","התרופות נגד הבחילה הפסיקו לפעול, ויש להכפיל את המינון"],"a":0,"e":"בחילה מקדימה מתפתחת אצל מטופלים שחוו בחילות והקאות קשות במחזורים קודמים: המראות, הריחות והמקום עצמו הופכים לטריגר. תרופות נגד הקאה פחות יעילות בה. טכניקות התנהגותיות ובנזודיאזפינים (כמו לורזפאם) לפני הטיפול עוזרים. הדרך הטובה ביותר למנוע אותה היא טיפול יעיל בבחילות כבר מהמחזור הראשון."},
{"t":"אונקולוגיה","q":"מטופל עם גרורות בעצמות מקבל מורפין רק לפי דרישה. הכאב חוזר לפני כל מנה, ויש לו גם עצירות. מה ההמלצה?","o":["מתן סביב השעון עם מנות הצלה, ומשלשלים באופן קבוע","להחליף את המורפין בפלצבו כדי לבדוק אם הכאב אמיתי","להפסיק את המורפין בגלל העצירות","להמשיך רק לפי דרישה כדי למנוע התמכרות"],"a":0,"e":"בכאב סרטני מתמשך, מתן לפי דרישה משאיר את המטופל בפערים של כאב. מתן סביב השעון שומר על רמה קבועה, ומנות הצלה מטפלות בכאב פורץ. לעצירות מאופיואידים הגוף אינו מפתח סבילות, ולכן נותנים מרכך צואה ומשלשל מגרה באופן קבוע ומונע. החשש מהתמכרות אינו סיבה לטיפול חסר בכאב בסרטן."},
{"t":"אונקולוגיה","q":"מטופל בכימותרפיה מתלונן על טעם מתכתי בפה ועל רתיעה מבשר אדום. מה ההדרכה?","o":["להימנע מחלבון לגמרי עד סוף הטיפול","לצום בימי הטיפול כדי למנוע את הטעם","לאכול מזון חם מאוד ומתובל כדי להבליט את הטעם","סכו״ם פלסטיק, תיבול חמוץ ומקורות חלבון חלופיים"],"a":3,"e":"כימותרפיה פוגעת בתאי הטעם, שמתחלקים מהר, ולכן שינויי טעם ורתיעה מבשר שכיחים. סכו״ם פלסטיק מפחית את הטעם המתכתי, ותיבול חמוץ או מתוק מסתיר אותו. מזון קר או בטמפרטורת החדר מדיף פחות ריח ולכן נסבל יותר. החלבון חיוני להחלמה ולתפקוד מערכת החיסון, ולכן מחליפים את מקורו ולא מוותרים עליו."},
{"t":"אונקולוגיה","q":"מטופלת שמקבלת Capecitabine מדווחת על אודם, נפיחות, כאב וקילוף בכפות הידיים והרגליים. מה נכון?","o":["יש לשפשף את העור המתקלף באבן ספוג כדי להאיץ את ההתחדשות","זה זיהום פטרייתי שמטופל במשחה אנטי-פטרייתית בלבד","תסמונת כף יד-כף רגל — לדווח, להימנע מחום ומחיכוך ולמרוח לחות","תגובה אלרגית לתרופה — נותנים אנטיהיסטמין וממשיכים כרגיל"],"a":2,"e":"Capecitabine ו-5-FU עלולים לדלוף מנימים קטנים בכפות הידיים והרגליים, שם יש לחץ וחיכוך, ולגרום לדלקת בעור. בדרגות קשות מופיעים שלפוחיות וכאב שמגביל תפקוד, ולכן נדרש שינוי מינון או הפסקה זמנית. ההדרכה: מים פושרים ולא חמים, נעליים נוחות, הימנעות מלחץ ומחיכוך ולחות קבועה."},
{"t":"אונקולוגיה","q":"מטופל עם סרטן ריאה מתקדם: קוצר נשימה, ל״ד 82/60, דופק 124, גודש ורידי צוואר וקולות לב מעומעמים. בשאיפה הל״ד הסיסטולי יורד ב-15 מ״מ כספית. מה החשד?","o":["תסחיף ריאתי","תסמונת הווריד הנבוב העליון (SVC syndrome) — להושיב ולתת סטרואידים","טמפונדה לבבית — לדווח מיד ולהיערך לפריקרדיוצנטזה","תגובה צפויה לכימותרפיה"],"a":2,"e":"נוזל שמצטבר בקרום הלב לוחץ על הלב ומונע ממנו להתמלא. שלישיית בק (Beck) — תת לחץ דם, גודש ורידי צוואר וקולות לב מעומעמים — יחד עם דופק פרדוקסלי (ירידה של יותר מ-10 מ״מ כספית בל״ד הסיסטולי בשאיפה) אופיינית לטמפונדה. זה מצב חירום אונקולוגי, והטיפול הוא ניקוז הנוזל. ב-SVC syndrome, לעומת זאת, בולטות בצקת בפנים ובזרועות, בלי קולות לב מעומעמים."},
{"t":"אונקולוגיה","q":"מטופל לאחר כריתת גידול במעי הגס שואל למה בודקים לו CEA כל כמה חודשים. מה נכון?","o":["סמן למעקב אחר תגובה לטיפול ולזיהוי חזרה, לא לאבחון","זו בדיקת סקר לגילוי סרטן המעי הגס באוכלוסייה הכללית","זו בדיקה של תפקודי כבד לפני הכימותרפיה","ערך מוגבר מאבחן סרטן בוודאות, בלי צורך בביופסיה"],"a":0,"e":"CEA יכול לעלות גם במצבים שאינם סרטניים, כמו עישון, מחלות מעי דלקתיות ומחלות כבד. בנוסף, הוא תקין אצל חלק מהחולים. לכן הוא אינו מתאים לסקר או לאבחון. הערך שלו הוא במעקב: רמה שיורדת אחרי ניתוח ועולה שוב עשויה לרמז על חזרה ולהוביל לבירור בהדמיה. האבחנה הוודאית נקבעת בביופסיה."},
{"t":"אונקולוגיה","q":"מטופל בימיו האחרונים. בני המשפחה מבוהלים מנשימה רועשת עם קולות גרגור. מה ההתערבות המתאימה?","o":["לבצע שאיבה עמוקה ותכופה של דרכי הנשימה","להסביר שזה שכיח ואינו מעיד על מצוקה; מיצוב ואנטי-כולינרגי לפי הוראה","להגדיל את כמות הנוזלים התוך-ורידיים כדי לדלל את ההפרשות בגרון","להזמין צוות להנשמה ולאינטובציה"],"a":1,"e":"הנשימה הרועשת נגרמת מהפרשות שמצטברות בגרון כשהמטופל כבר אינו בולע ואינו משתעל. היא מטרידה בעיקר את המשפחה, והסבר עליה הוא חלק מרכזי מהטיפול. שינוי תנוחה, הפחתת נוזלים ותרופות שמייבשות הפרשות (כמו Scopolamine או Glycopyrrolate) עוזרים. שאיבה עמוקה מכאיבה ומגרה הפרשות נוספות, ולא מתאימה ברוב המקרים."},
{"t":"מערכת חיסון","q":"לאחות יש אלרגיה ללטקס. לאילו מזונות היא עלולה להגיב ברגישות צולבת?","o":["חלב, ביצים, חיטה וסויה","דגים ופירות ים","בוטנים ושומשום","בננה, אבוקדו, קיווי וערמונים"],"a":3,"e":"החלבונים בגומי הטבעי דומים במבנה לחלבונים בחלק מהפירות, ולכן חלק מהאלרגיים ללטקס מגיבים גם אליהם (Latex-fruit syndrome). בתחום הבריאות מאתרים את האלרגיה בשאלון, משתמשים בכפפות ובציוד ללא לטקס ומסמנים את המטופל. תגובה ללטקס יכולה לנוע מדרמטיטיס מגע ועד אנפילקסיס."},
{"t":"מערכת חיסון","q":"בן 60 שנוטל Enalapril מגיע עם נפיחות בשפתיים ובלשון, בלי אורטיקריה ובלי גרד. מה נכון?","o":["אלרגיה למזון בלבד — ממשיכים את התרופה","תופעה קלה שחולפת — אפשר לשחרר את המטופל הביתה ללא מעקב","מחליפים למעכב ACE אחר מאותה קבוצה","אנגיואדמה ממעכב ACE — לאבטח נתיב אוויר ולהפסיק את התרופה"],"a":3,"e":"מעכבי ACE מעכבים גם את פירוק הברדיקינין, והצטברותו גורמת לאנגיואדמה. היא עלולה להופיע גם אחרי שנים של טיפול. מאחר שהיא אינה מתווכת היסטמין, לרוב אין אורטיקריה או גרד, ותגובה לאנטיהיסטמינים ולסטרואידים חלשה. בצקת בלשון ובגרון מסכנת את נתיב האוויר. התרופה וכל התרופות מאותה קבוצה אסורות מעתה."},
{"t":"מערכת חיסון","q":"בת 45 אובחנה בפיברומיאלגיה: כאבים מפושטים בשרירים כבר שנה, עייפות ושינה שאינה מרעננת. בדיקות הדם ומדדי הדלקת תקינים. מה נכון לגבי הטיפול?","o":["Methotrexate כדי לעצור את הנזק למפרקים","פעילות אירובית מדורגת, היגיינת שינה ולעיתים Duloxetine","סטרואידים במינון גבוה ונוגדי דלקת עד שהכאבים חולפים","מנוחה מוחלטת במיטה עד שהכאבים חולפים"],"a":1,"e":"פיברומיאלגיה היא הפרעה בעיבוד הכאב במערכת העצבים המרכזית, ללא דלקת וללא נזק למפרקים. לכן סטרואידים ותרופות נגד דלקת מפרקים אינם יעילים. הטיפול היעיל ביותר הוא פעילות גופנית מתונה שמתגברת בהדרגה, לצד שיפור השינה, טיפול קוגניטיבי-התנהגותי ותרופות שמווסתות את עיבוד הכאב. מנוחה ממושכת מחמירה עייפות וכאב."},
{"t":"מערכת חיסון","q":"מטופל מקבל במרפאה זריקות חיסון לאלרגיה (אימונותרפיה) בגלל נזלת אלרגית. מה נכון?","o":["את הזריקה הראשונה הוא יכול להזריק בעצמו בבית","אפשר לשחרר אותו מיד אחרי הזריקה","השגחה כ-30 דקות אחרי כל זריקה, עם אדרנלין זמין","נותנים את הזריקות רק בזמן התקף אלרגי חריף"],"a":2,"e":"באימונותרפיה חושפים את המטופל למינונים עולים של האלרגן, כדי שמערכת החיסון תפתח סבילות. רוב התגובות הסיסטמיות, כולל אנפילקסיס, מופיעות בדקות הראשונות אחרי הזריקה. לכן הזריקות ניתנות במרפאה עם השגחה וציוד החייאה. הטיפול נמשך שנים וניתן כשהמטופל יציב, לא בזמן התקף."},
{"t":"מערכת חיסון","q":"מטופל עם HIV שהתחיל טיפול אנטי-רטרו-ויראלי (ART) מספר שהוא מדלג על מנות בסופי שבוע. מה ההסבר?","o":["אין לכך משמעות, כל עוד הוא לוקח את התרופות ברוב ימי השבוע","דרושה היענות של מעל 95% כדי למנוע עמידות של הנגיף","הפסקות קצרות משפרות את תגובת מערכת החיסון","מספיק לקחת את התרופות רק כשמופיעים תסמינים"],"a":1,"e":"כשרמת התרופה בדם יורדת, הנגיף מתרבה מחדש, ובכל מחזור שכפול עלולות להיווצר מוטציות עמידות, שחלקן חוצות קבוצות תרופות. עומס נגיפי שאינו ניתן למדידה שומר על ספירת ה-CD4 ומונע הדבקה בקשר מיני (U=U). לכן ההדרכה מתמקדת בהתאמת הטיפול לשגרת החיים ובזיהוי חסמים להיענות."},
{"t":"מערכת חיסון","q":"מטופל עם כשל חיסוני ראשוני (חסר בנוגדנים) מקבל עירוי IVIG. במהלך השעה הראשונה הוא מתלונן על כאב ראש, צמרמורת וכאב גב. מה הפעולה הנכונה?","o":["להגביר את הקצב כדי לסיים את העירוי מהר יותר","לנתק את הקו ולשטוף אותו בגלוקוז 5%","להאט או לעצור את העירוי, להעריך סימנים חיוניים ולדווח","להמשיך כרגיל, כי התופעות אינן קשורות לעירוי"],"a":2,"e":"IVIG הוא נוגדנים מרוכזים שנאספים מתורמים רבים. תגובות עירוי — כאב ראש, צמרמורת, חום, כאב גב ובחילה — שכיחות, בעיקר בעירוי הראשון ובקצב מהיר. לכן מתחילים לאט, מעלים את הקצב בהדרגה ועוקבים אחר סימנים חיוניים. לעיתים ניתן טיפול מקדים. נדירות מופיעות תגובה אנפילקטית, פגיעה כלייתית או אירוע תרומבוטי."},
{"t":"עור וכוויות","q":"מטופל עם כוויות נרחבות מטופל בחבישות של Silver sulfadiazine. בספירת הדם ביום השלישי נמצאה ירידה בכדוריות הלבנות. מה נכון?","o":["זה סימן ודאי לאלח דם שמחייב הפסקה מיידית של כל החבישות","תופעת לוואי מוכרת וחולפת; לדווח ולעקוב אחר ספירות","זה מעיד שהכוויה החלימה ואפשר להפסיק את החבישות","זו תופעה שאינה קשורה לתכשיר ואינה מחייבת מעקב"],"a":1,"e":"Silver sulfadiazine הוא תכשיר אנטי-מיקרוביאלי מקומי נפוץ בכוויות. תופעת הלוואי המוכרת שלו היא ירידה חולפת בכדוריות הלבנות, שחוזרות לרוב לתקין גם בלי להפסיק את הטיפול. ההחלטה נעשית לפי הוראה רפואית. מכיוון שהוא שייך לקבוצת הסולפונמידים, יש לברר רגישות לסולפה. אותה ירידה עלולה לנבוע גם מזיהום, ולכן מעריכים את כל התמונה."},
{"t":"עור וכוויות","q":"מטופל ביום השלישי לאחר כוויות נרחבות. תפוקת השתן עלתה פתאום ל-250 מ״ל בשעה, נשמעים חרחורים בבסיס הריאות, והוא עדיין מקבל עירוי בקצב גבוה. מה ההסבר?","o":["שלב חזרת הנוזלים לכלי הדם — סיכון לעומס; להתאים עירוי","המשך שלב הדליפה הנימית, שמחייב הגברה של קצב העירוי","אי ספיקת כליות חריפה בשלב האוליגורי","סימן להלם כוויה שמחייב בולוס נוזלים"],"a":0,"e":"ב-24-48 השעות הראשונות הנימים דולפים ונוזלים עוברים לרקמות, ולכן נדרשת החייאת נוזלים. בהמשך הנימים מתאחים, הנוזלים חוזרים לכלי הדם ומופיעה דיורזה. אם העירוי נמשך בקצב גבוה, או אם יש מחלת לב או כליה, עלולה להתפתח בצקת ריאות. בשלב זה צפויות גם היפוקלמיה והיפונתרמיה מדילול. לכן מפחיתים את העירוי לפי הוראה ומנטרים נשימה ומאזן נוזלים."},
{"t":"עור וכוויות","q":"בת 19 מתחילה טיפול ב-Isotretinoin (Roaccutane) לאקנה קשה. מה ההדרכה החשובה ביותר?","o":["התרופה בטוחה בהיריון, אך יש להימנע מחשיפה לשמש","סיכון למומים בעובר: שתי שיטות מניעה ובדיקות היריון","אין צורך בבדיקות דם במהלך הטיפול","יש ליטול את התרופה רק בזמן התפרצות, לסירוגין"],"a":1,"e":"איזוטרטינואין, נגזרת של ויטמין A, הוא אחד החומרים הטרטוגניים החזקים. לכן הטיפול בנשים בגיל הפוריות מותנה בתוכנית מניעת היריון מחייבת ובבדיקות חוזרות. תופעות לוואי נוספות: יובש בשפתיים, בעור ובעיניים, רגישות לשמש, עלייה בשומני הדם ובאנזימי הכבד (ולכן יש בדיקות דם), ויש לעקוב אחר שינויים במצב הרוח."},
{"t":"עור וכוויות","q":"מטופל עם דרמטיטיס קיבל משחת סטרואידים חזקה. מה ההדרכה הנכונה?","o":["שכבה דקה, לזמן מוגבל, ולהימנע משימוש ממושך בפנים","למרוח שכבה עבה ככל האפשר כדי להאיץ את הריפוי","להשתמש במשחה ברציפות גם אחרי שהעור החלים, כדי למנוע התלקחות","להתחיל דווקא במריחה על הפנים, כי שם העור עבה יותר"],"a":0,"e":"סטרואידים מקומיים חזקים נספגים לעור ובשימוש ממושך גורמים להידקקות העור, לסימני מתיחה, להרחבת נימים ולנטייה לחבורות. בפנים, בקפלי העור ובאזור איברי המין העור דק והספיגה גבוהה, ולכן משתמשים שם בתכשירים חלשים. כיסוי אטום מעל המשחה מגביר מאוד את הספיגה ונעשה רק לפי הוראה. בסיום טיפול ממושך מפחיתים בהדרגה."},
{"t":"עור וכוויות","q":"בן 70, חקלאי לשעבר, עם כתמים מחוספסים וקשקשיים על הקרקפת ועל גב כפות הידיים. אחד מהם הפך לגוש מוגבה עם כיב במרכזו. מה החשש?","o":["נגעים שפירים של הזדקנות העור שאינם מחייבים בירור","SCC שהתפתחה מקרטוזיס אקטינית; נדרשת ביופסיה","פסוריאזיס שמטופלת במשחת סטרואידים בלבד","זיהום פטרייתי בעור"],"a":1,"e":"קרטוזיס אקטינית — כתמים קשקשיים מחוספסים באזורים חשופים לשמש — היא נגע טרום-סרטני, וחלק מהנגעים הופכים ל-SCC. שינוי בנגע (התעבות, גוש, כיב או דימום) מחייב ביופסיה. SCC שולח גרורות לעיתים קרובות יותר מ-BCC, בייחוד בשפתיים ובאוזניים. המניעה היא הגנה מהשמש ובדיקות עור תקופתיות."},
{"t":"עור וכוויות","q":"מטופל עם כוויות נרחבות בשלב החירום (היום הראשון) סובל מכאבים קשים. כיצד יינתן לו משכך כאבים אופיואידי?","o":["תוך-ורידית במנות קטנות, ומנה מקדימה לפני חבישה","רק אחרי שכל החבישות הוחלפו, כדי לא להסתיר תסמינים","בזריקה לשריר, כי היא נספגת מהר יותר","בדרך פומית בלבד, כדי להימנע מסיבוכים של עירוי"],"a":0,"e":"בשלב החירום של כוויה נרחבת יש ירידה בזרימת הדם לרקמות ולמערכת העיכול. לכן ספיגה מזריקה לשריר או מבליעה אינה צפויה, ומנות שנצברו עלולות להיספג בבת אחת כשהזרימה חוזרת ולגרום לדיכוי נשימתי. מתן תוך-ורידי מאפשר שליטה מדויקת. החלפות חבישה והטריה הן מהפעולות הכואבות ביותר, ולכן נותנים משכך כאבים לפניהן."},
{"t":"אף אוזן גרון","q":"מטופל מקבל Gentamicin IV ו-Furosemide בעירוי. ביום הרביעי הוא מתלונן על צלצולים באוזניים ועל תחושת חוסר יציבות. מה נכון?","o":["תופעות צפויות של טיפול בעירוי, שאינן מחייבות דיווח","סימן לדלקת אוזן תיכונה שמחייבת טיפות אוזניים","תוצאה של שכיבה ממושכת, שתחלוף עם ניעות","סימני אוטוטוקסיות — לדווח מיד, כי הנזק עלול להיות קבוע"],"a":3,"e":"אמינוגליקוזידים ומשתני לולאה (בייחוד במינון גבוה ובמתן מהיר) פוגעים בתאי השיער בשבלול ובמערכת שיווי המשקל, והשילוב ביניהם מגביר את הסיכון. גם Cisplatin ומינונים גבוהים של אספירין הם אוטוטוקסיים. טנטון, ירידה בשמיעה וסחרחורת הם סימני אזהרה. עוקבים אחר רמות התרופה ותפקודי הכליות, ומדווחים מוקדם כדי לשקול שינוי טיפול."},
{"t":"אף אוזן גרון","q":"מטופלת עברה ניתוח Stapedectomy בגלל אוטוסקלרוזיס. מה ההדרכה לאחר הניתוח?","o":["לקנח את האף בחוזקה כמה פעמים ביום כדי לפתוח את החצוצרה","השמיעה צפויה להיות מושלמת מיד בסיום הניתוח","לא לקנח חזק, להתעטש בפה פתוח ולהימנע מטיסות","להתחיל לשחות כבר בשבוע הראשון"],"a":2,"e":"באוטוסקלרוזיס עצם הארכובה (Stapes) מתקבעת, ובניתוח מחליפים אותה בתותב. שינויי לחץ באוזן התיכונה (קינוח אף, עיטוש בפה סגור, מאמץ, טיסה) עלולים להזיז את התותב או לגרום לדליפה מהאוזן הפנימית. סחרחורת קלה בימים הראשונים שכיחה. השמיעה עשויה להיות מוחלשת בתחילה בגלל הטמפון והבצקת, ומשתפרת בהדרגה."},
{"t":"אף אוזן גרון","q":"האחות משוחחת עם מטופל קשיש עם ירידה בשמיעה. מה הדרך הנכונה לתקשר איתו?","o":["לעמוד מולו, לדבר ברור ובטון נמוך בלי לצעוק","לדבר מאחוריו, כדי לא להביך אותו","לצעוק לתוך האוזן הטובה יותר כדי שישמע היטב","לחזור על אותו משפט בדיוק שוב ושוב עד שיבין"],"a":0,"e":"רבים מבעלי ירידת שמיעה נעזרים בקריאת שפתיים ובהבעות פנים, ולכן קשר עין ותאורה טובה חשובים. בירידת שמיעה שקשורה לגיל, התדרים הגבוהים נפגעים ראשונים, ולכן טון נמוך מובן יותר. צעקה מעוותת את הצלילים ואינה משפרת את ההבנה. ניסוח מחדש במילים אחרות עוזר כשמילה מסוימת אינה נשמעת. כדאי גם לצמצם רעשי רקע ולוודא שמכשיר השמיעה פועל."},
{"t":"אף אוזן גרון","q":"מטופל לאחר כריתת גרון מלאה (Total laryngectomy) עם טרכאוסטומה קבועה משתחרר הביתה. מה ההדרכה?","o":["להימנע מכל אמצעי לחות כדי למנוע הפרשות","לשחות כרגיל, כי אחרי הניתוח הריאות מופרדות מהפה","להגן על הפתח מפני מים, להשתמש בלחות ובמסנן","לסגור את הפתח בפלסטר אטום בלילה"],"a":2,"e":"אחרי כריתת גרון מלאה, קנה הנשימה מחובר ישירות לפתח בצוואר, והאף והפה כבר אינם מחממים, מלחלחים ומסננים את האוויר. מים שחודרים לפתח מגיעים ישר לריאות, ולכן אסור לשחות ויש להגן על הפתח במקלחת. אוויר יבש גורם להפרשות סמיכות ולפקקים, ולכן נדרשים אמצעי לחות. סגירת הפתח מונעת נשימה."},
{"t":"עיניים","q":"מטופל עם גלאוקומה ואסתמה מקבל טיפות Timolol. מה ההדרכה כדי להפחית ספיגה של התרופה לגוף?","o":["להטות את הראש קדימה מיד אחרי ההזלפה","להזליף שתי טיפות במקום אחת כדי להבטיח שהתרופה תגיע","למצמץ מהר כמה פעמים אחרי ההזלפה כדי לפזר את התרופה","ללחוץ על הזווית הפנימית של העין דקה-שתיים אחרי ההזלפה"],"a":3,"e":"טיפות עיניים מתנקזות דרך תעלת הדמעות לאף, ומשם נספגות לדם. חוסמי ביתא בטיפות עלולים לגרום להיצרות סמפונות, לברדיקרדיה ולתת לחץ דם. לחיצה על הזווית הפנימית (Punctal occlusion) ועצימת העין משאירות את התרופה בעין ומפחיתות את הספיגה. מצמוץ שואב את הטיפה לתעלה, וטיפה נוספת רק זולגת החוצה."},
{"t":"עיניים","q":"בן 52 עם סוכרת מסוג 2 כבר 8 שנים מרגיש שהוא 'רואה טוב' ושואל אם הוא באמת צריך בדיקת עיניים. מה נכון?","o":["אין צורך בבדיקה כל עוד הראייה תקינה","בדיקת עיניים נדרשת רק למטופלים שמקבלים אינסולין","מספיקה בדיקת חדות ראייה אצל אופטומטריסט פעם בכמה שנים","רטינופתיה עלולה להתקדם בלי תסמינים; בדיקה שנתית עם הרחבת אישונים"],"a":3,"e":"בשלבים מוקדמים הרטינופתיה הסוכרתית אינה כואבת ואינה פוגעת בחדות הראייה, ולכן הבדיקה חיונית גם בלי תלונות. גילוי מוקדם מאפשר טיפול בלייזר או בזריקות נגד VEGF לפני אובדן ראייה. איזון הסוכר, לחץ הדם והשומנים מאט את ההתקדמות. היא אחת הסיבות העיקריות לעיוורון במבוגרים בגיל העבודה."},
{"t":"עיניים","q":"בן 17 נפגע בעין מכדור טניס. בבדיקה נראית שכבת דם בחלק התחתון של הלשכה הקדמית (Hyphema). מה ההדרכה?","o":["טיפות אספירין מקומיות להמסת הדם","שכיבה שטוחה ועיסוי העין כדי לפזר את הדם","אפשר לחזור לספורט כבר מחר, כי הדם ייספג מעצמו","מנוחה עם ראש מוגבה, מגן עין והימנעות מאספירין"],"a":3,"e":"הרמת הראש גורמת לדם לשקוע בתחתית הלשכה, כך שהוא אינו מסתיר את מרכז הראייה וקל יותר לעקוב אחריו. אספירין ו-NSAIDs מגבירים את הסיכון לדימום חוזר, שקורה לרוב בימים הראשונים ומסוכן יותר מהדימום הראשון. דם עלול לחסום את ניקוז הנוזל מהעין ולהעלות את הלחץ התוך-עיני, ולכן עוקבים אחריו. מגן העין מונע לחץ וחבלה נוספת."},
{"t":"עיניים","q":"עובד מגיע למיון אחרי שרסיס מתכת חדר לעינו, והרסיס עדיין בולט ממנה. מה הטיפול הראשוני הנכון?","o":["להוציא את הרסיס בעדינות בפינצטה סטרילית ולחבוש","לשטוף את העין בלחץ חזק כדי להוציא את הרסיס","לחבוש את העין בחבישה לוחצת ולשחרר הביתה","לא להוציא את הרסיס, מגן קשיח בלי לחץ והפניה דחופה"],"a":3,"e":"בפציעה חודרת, הוצאת גוף זר או לחץ על העין עלולים להוציא את תוכן העין ולגרום לאובדן ראייה קבוע. לכן מקבעים את המצב: מגן קשיח (כמו כוס) בלי לחץ, הימנעות מפעולות שמעלות את הלחץ התוך-עיני (התכופפות, מאמץ, הקאות) וטיפול נגד בחילות לפי הוראה. בנוסף מוודאים חיסון נגד טטנוס, נותנים אנטיביוטיקה לפי הוראה ומשאירים את המטופל בצום לקראת ניתוח."},
{"t":"שד","q":"מטופלת שנה לאחר כריתת שד ובלוטות בית השחי. זרועה הימנית נפוחה וכבדה, והבצקת אינה חולפת בלילה. מה נכון לגבי הטיפול?","o":["חימום הזרוע בכרית חימום כדי לשפר את הזרימה","ניקוז לימפתי ידני, חבישות ושרוול לחץ ותרגילים","מנוחה מוחלטת של הזרוע ואי-הזזתה","משתנים במינון גבוה הם הטיפול העיקרי, והם פותרים את הבצקת"],"a":1,"e":"בבצקת לימפתית מצטבר ברקמות נוזל עשיר בחלבון, ולכן משתנים כמעט אינם יעילים. הטיפול המקובל (Complete decongestive therapy) כולל ניקוז לימפתי ידני, חבישות לחץ, שרוול לחץ קבוע, תרגילים שמפעילים את 'משאבת השריר' וטיפוח העור למניעת זיהום. חום מרחיב כלי דם ומגביר את הבצקת. כל אודם או חום מקומי בזרוע עלול להעיד על צלוליטיס ומחייב פנייה."},
{"t":"שד","q":"בן 66 מגיע עם גוש קשה ולא כואב מתחת לפטמה ועם שקיעה של הפטמה. מה נכון?","o":["חשד לסרטן שד — להפנות לבירור הדמיה וביופסיה","סרטן שד אינו מופיע בגברים, ולכן אין צורך בבירור","זו מורסה, שמטופלת באנטיביוטיקה ובמעקב בלבד","זו גינקומסטיה שפירה שאינה מחייבת בירור"],"a":0,"e":"סרטן שד בגברים נדיר (כאחוז אחד מהמקרים), אבל הוא קיים. הוא מתבטא לרוב בגוש קשה, לא כואב, מתחת לאזור הפטמה, לעיתים עם שקיעה של הפטמה או הפרשה דמית. בגלל המודעות הנמוכה הוא מאובחן בדרך כלל בשלב מתקדם יותר. גורמי סיכון: נשאות BRCA2, היסטוריה משפחתית וחשיפה לקרינה. גינקומסטיה, לעומת זאת, רכה יותר ונמצאת במרכז, מאחורי הפטמה."},
{"t":"שד","q":"מטופלת משתחררת יומיים אחרי כריתת שד עם נקז ואקום (כמו Jackson-Pratt). מה ההדרכה על הנקז?","o":["לפתוח את המיכל ולהשאיר אותו פתוח לאוויר כדי לשפר את הניקוז","להשאיר את המיכל מלא עד הביקור הבא במרפאה","להוציא את הנקז בעצמה כשהכמות יורדת","לרוקן, למדוד ולדחוס את המיכל, ולדווח על דם טרי או עלייה בכמות"],"a":3,"e":"הנקז מונע הצטברות נוזל לימפתי ודם (סרומה) מתחת לעור. הוואקום נוצר כשלוחצים על המיכל וסוגרים אותו, ומיכל מלא מפסיק לשאוב. מתעדים את הכמות ואת אופי הנוזל, שהופך בהדרגה לצהבהב-שקוף. הנקז מוצא במרפאה, בדרך כלל כשהכמות יורדת לפחות מכ-25-30 מ״ל ביממה. דם טרי, עלייה חדה בכמות, חום או אודם מחייבים פנייה."}];
const KEYS = ["א","ב","ג","ד"];
const state = {};
const quiz = document.getElementById('quiz');
function render(){
  quiz.innerHTML = '';
  const f = document.getElementById('filter').value;
  DATA.forEach((item, i) => {
    if (f && item.t !== f) return;
    const card = document.createElement('div'); card.className = 'q'; card.dataset.i = i;
    const head = document.createElement('div'); head.className = 'qhead';
    head.innerHTML = '<span class="num">שאלה ' + (i+1) + '</span><span class="chip">' + item.t + '</span>';
    card.appendChild(head);
    const qt = document.createElement('p'); qt.className = 'qtext'; qt.textContent = item.q; card.appendChild(qt);
    const ul = document.createElement('ul'); ul.className = 'opts';
    item.o.forEach((txt, j) => {
      const li = document.createElement('li'); li.className = 'opt'; li.dataset.j = j;
      li.innerHTML = '<span class="k">' + KEYS[j] + '.</span><span></span>';
      li.lastChild.textContent = txt;
      li.addEventListener('click', () => choose(i, j));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const v = document.createElement('div'); v.className = 'verdict'; card.appendChild(v);
    const ex = document.createElement('div'); ex.className = 'exp'; ex.innerHTML = '<b>הסבר</b>';
    const p = document.createElement('span'); p.textContent = item.e; ex.appendChild(p);
    card.appendChild(ex);
    quiz.appendChild(card);
    if (state[i] !== undefined) paint(card, i);
  });
  stats();
}
function choose(i, j){
  if (state[i] !== undefined) return;
  state[i] = j;
  paint(quiz.querySelector('.q[data-i="'+i+'"]'), i);
  stats();
}
function paint(card, i){
  const item = DATA[i], pick = state[i];
  card.querySelectorAll('.opt').forEach(li => {
    const j = +li.dataset.j; li.classList.add('lock');
    if (j === item.a) li.classList.add('right'); else if (j === pick) li.classList.add('wrong');
  });
  const v = card.querySelector('.verdict'); const ok = pick === item.a;
  v.className = 'verdict show ' + (ok ? 'y' : 'n');
  v.textContent = ok ? '✓ תשובה נכונה' : '✗ תשובה שגויה — הנכונה: ' + KEYS[item.a];
  card.querySelector('.exp').classList.add('show');
}
function stats(){
  const done = Object.keys(state).length; let ok = 0;
  for (const k in state) if (state[k] === DATA[k].a) ok++;
  document.getElementById('rPos').textContent = done + '/' + DATA.length;
  document.getElementById('rOk').textContent = ok;
  document.getElementById('rBad').textContent = done - ok;
  document.getElementById('rPct').textContent = done ? Math.round(ok/done*100) : '—';
  document.getElementById('rBar').style.width = (done/DATA.length*100) + '%';
}
function summary(){
  const box = document.getElementById('sumbox'); const by = {};
  DATA.forEach((item, i) => {
    const b = by[item.t] || (by[item.t] = {n:0, done:0, ok:0}); b.n++;
    if (state[i] !== undefined){ b.done++; if (state[i] === item.a) b.ok++; }
  });
  const done = Object.keys(state).length; let ok = 0;
  for (const k in state) if (state[k] === DATA[k].a) ok++;
  const pct = DATA.length ? Math.round(ok/DATA.length*100) : 0;
  const cls = pct >= 80 ? 'g' : (pct >= 60 ? 'a' : 'r');
  let h = '<h2>סיכום ביצועים</h2><div class="score"><span class="pill '+cls+'">' + pct + '</span></div>';
  h += '<p style="color:var(--dim);font-size:.88rem;margin:10px 0 16px">' + ok + ' תשובות נכונות מתוך ' + DATA.length + ' · נענו ' + done + ' · ציון עובר בקורס: 60</p>';
  h += '<table><tr><th>נושא</th><th>נענו</th><th>נכונות</th><th>אחוז</th></tr>';
  Object.keys(by).forEach(t => {
    const b = by[t]; const p = b.done ? Math.round(b.ok/b.done*100) : null;
    const c = p === null ? '' : (p >= 80 ? 'g' : (p >= 60 ? 'a' : 'r'));
    h += '<tr><td>' + t + '</td><td class="n">' + b.done + '/' + b.n + '</td><td class="n">' + b.ok + '</td><td class="n">' +
      (p === null ? '<span style="color:var(--dim)">—</span>' : '<span class="pill ' + c + '">' + p + '%</span>') + '</td></tr>';
  });
  box.innerHTML = h + '</table>'; box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
document.getElementById('btnSum').addEventListener('click', summary);
document.getElementById('btnReset').addEventListener('click', () => {
  for (const k in state) delete state[k];
  document.getElementById('sumbox').classList.remove('show');
  render(); window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('btnReveal').addEventListener('click', () => {
  quiz.querySelectorAll('.q').forEach(card => {
    const i = +card.dataset.i;
    if (state[i] === undefined){
      card.querySelectorAll('.opt').forEach(li => { li.classList.add('lock'); if (+li.dataset.j === DATA[i].a) li.classList.add('right'); });
      card.querySelector('.exp').classList.add('show');
    }
  });
});
document.getElementById('filter').addEventListener('change', render);
(function init(){
  const sel = document.getElementById('filter'); const counts = {};
  DATA.forEach(d => counts[d.t] = (counts[d.t] || 0) + 1);
  Object.keys(counts).forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t + ' (' + counts[t] + ')'; sel.appendChild(o); });
  render();
})();
</script>
</body>
</html>
