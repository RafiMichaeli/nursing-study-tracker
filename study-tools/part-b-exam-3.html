<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבחן תרגול 3 - סיעוד המבוגר חלק ב</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>%F0%9F%93%97</text></svg>">
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:#182234; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --teal:#2dd4bf; --teal-d:#0d9488;
  --coral:#fb7185; --amber:#fbbf24; --ok:#34d399;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Rubik,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65;
     -webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:16px}

header{background:linear-gradient(180deg,#132033,#0f172a);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:.9rem}
.tagline{font-family:var(--mono);color:var(--teal);font-size:.78rem;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:6px}

.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-family:var(--mono);font-size:.8rem;color:var(--dim);min-width:92px}
.cell b{display:block;color:var(--txt);font-size:1.15rem;line-height:1.25;letter-spacing:-.02em}
.cell.ok b{color:var(--ok)} .cell.bad b{color:var(--coral)} .cell.t b{color:var(--teal)}

.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal));
  width:0;transition:width .3s ease}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
select,button{font-family:inherit;font-size:.88rem;background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--teal-d)}
button.primary{background:var(--teal-d);border-color:var(--teal-d);color:#04201c;font-weight:700}
button.primary:hover{background:var(--teal)}
.grow{flex:1}

.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;
   padding:18px 20px;margin-bottom:14px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--mono);color:var(--teal);font-size:.82rem;font-weight:700}
.chip{font-size:.72rem;background:#0b3b38;color:var(--teal);border:1px solid #115e59;
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.qtext{font-size:1.02rem;margin:0 0 14px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#141d2e;border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-d);background:#16233a}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;min-width:1.4em}
.opt.sel{border-color:var(--teal);background:#122c2b}
.opt.right{border-color:var(--ok);background:#0d2a20}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--coral);background:#2c1420}
.opt.wrong .k{color:var(--coral)}
.opt.lock{cursor:default}
.exp{margin-top:12px;border-inline-start:3px solid var(--teal-d);background:#101a2b;
  border-radius:0 10px 10px 0;padding:11px 14px;font-size:.92rem;color:#cbd5e1;display:none}
.exp.show{display:block}
.exp b{color:var(--teal);font-family:var(--mono);font-size:.78rem;display:block;margin-bottom:4px;
  letter-spacing:.05em;text-transform:uppercase}
.verdict{font-family:var(--mono);font-size:.8rem;margin-top:10px;display:none}
.verdict.show{display:block}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--coral)}

.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  margin-bottom:16px;display:none}
.sumbox.show{display:block}
.sumbox h2{margin:0 0 12px;font-size:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:.8rem;font-family:var(--mono)}
td.n{font-family:var(--mono)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-family:var(--mono);font-size:.8rem}
.pill.g{background:#0d2a20;color:var(--ok)} .pill.a{background:#2e2410;color:var(--amber)}
.pill.r{background:#2c1420;color:var(--coral)}
.score{font-family:var(--mono);font-size:2.4rem;line-height:1;letter-spacing:-.03em}

footer{color:var(--dim);font-size:.8rem;text-align:center;padding:22px 0 34px}
@media(max-width:520px){.wrap{padding:12px}.cell{min-width:74px}h1{font-size:1.15rem}}
@media print{body{background:#fff;color:#000}.toolbar,.bar{display:none}
  .q,.sumbox,header{border-color:#bbb;background:#fff;color:#000}
  .exp{display:block!important;background:#f5f5f5;color:#000}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="tagline">סיעוד המבוגר · חלק ב' · מבחן תרגול</div>
  <h1>מבחן תרגול 3 — ידע ישיר</h1>
  <div class="sub">80 שאלות ידע נוספות, ללא חפיפה למבחן 2: אנטומיה ופיזיולוגיה, מנגנונים, בדיקות, סמנים וטיפולים.</div>
  <div class="readout">
    <div class="cell t">שאלה<b id="rPos">0/80</b></div>
    <div class="cell ok">נכונות<b id="rOk">0</b></div>
    <div class="cell bad">שגויות<b id="rBad">0</b></div>
    <div class="cell">ציון<b id="rPct">—</b></div>
  </div>
  <div class="bar"><i id="rBar"></i></div>
</header>

<div class="toolbar">
  <select id="filter"><option value="">כל הנושאים (80 שאלות)</option></select>
  <span class="grow"></span>
  <button id="btnSum" class="primary">סיכום וציון</button>
  <button id="btnReveal">הצג את כל התשובות</button>
  <button id="btnReset">איפוס</button>
</div>

<div class="sumbox" id="sumbox"></div>
<div id="quiz"></div>

<footer>נבנה מהסילבוס ומהמצגות של הקורס · ברונר וסודארת' מהדורה 15 · 80 שאלות</footer>
</div>

<script>
const DATA = [{"t":"נוירולוגיה","q":"אילו תאים יוצרים את מעטפת המיאלין במערכת העצבים המרכזית?","o":["אוליגודנדרוציטים","אסטרוציטים","תאי אפנדימה","מיקרוגליה"],"a":0,"e":"אוליגודנדרוציטים יוצרים את מעטפת המיאלין ב-CNS ומבודדים את האקסונים חשמלית, ובכך מאיצים העברת אותות - ולכן פגיעתם ב-MS משבשת את ההולכה. אסטרוציטים הם תאים בצורת כוכב המווסתים את הסביבה הכימית ומסלקים פסולת מטבולית. תאי אפנדימה מצפים את חדרי המוח ומייצרים נוזל שדרה."},{"t":"נוירולוגיה","q":"איזה נוירוטרנסמיטר משפיע על התנהגות, רגשות ותנועות עדינות, וחסרו קשור למחלת פרקינסון?","o":["אצטילכולין","GABA","דופמין","גלוטמט"],"a":2,"e":"דופמין משפיע על התנהגות, רגשות ותנועות עדינות; המוח האמצעי מכיל גרעינים דופמינרגיים החשובים לשליטה מוטורית ולמערכת החיזוק. אצטילכולין הוא הנוירוטרנסמיטר בצומת הנוירו-שרירית - ופגיעה בקולטניו גורמת למיאסטניה גרביס. נוראפינפרין הוא נוירוטרנסמיטר מעורר."},{"t":"נוירולוגיה","q":"מהו מעגל וויליס, ומדוע חשוב להכירו קלינית?","o":["מעגל עורקי המספק דם למוח; אתר שכיח להיווצרות מפרצות בהסתעפויות","רשת ורידית המנקזת את המוח; אתר שכיח לפקקת","מערכת החדרים המייצרת CSF; אתר להידרוצפלוס","צרור סיבים המחבר בין ההמיספרות"],"a":0,"e":"מעגל וויליס הוא מעגל עורקי בבסיס המוח המספק דם למוח ומאפשר זרימה קולטרלית. ההסתעפויות של העורקים הגדולים במעגל הן האתר השכיח להיווצרות מפרצות, ולכן זהו המקור הקלאסי לדימום תת-עכבישי. זרימת הדם למוח היא כ-750 מ\"ל/דקה - כ-15% מתפוקת הלב."},{"t":"נוירולוגיה","q":"מהי השכבה החיצונית והקשיחה של קרומי המוח?","o":["פיה מאטר","דורה מאטר","ארכנואיד","האפנדימה"],"a":1,"e":"דורה מאטר היא השכבה החיצונית הקשיחה וההגנתית, הארכנואיד היא השכבה האמצעית הדמוית קורי עכביש, והפיה מאטר היא השכבה הפנימית הדקה והעדינה הצמודה לרקמת המוח. ה-CSF זורם בחלל התת-עכבישי, בין הארכנואיד לפיה - ומכאן שדימום תת-עכבישי מתפשט בחלל זה."},{"t":"נוירולוגיה","q":"מטופל מבין את הנאמר לו אך מתקשה להוציא מילים ולהרכיב משפטים. איזו אפזיה ואיזה אזור נפגע?","o":["אגנוזיה חזותית; אונה אוקסיפיטלית","אפזיה רצפטיבית (ורניקה); אונה טמפורלית","אפזיה אקספרסיבית (ברוקה); אזורים פרונטליים תחתונים","דיסארתריה; מוחון"],"a":2,"e":"אפזיה אקספרסיבית (ברוקה) פוגעת בהפקת הדיבור עם הבנה שמורה יחסית, ומקורה באזורים פרונטליים תחתונים. אפזיה רצפטיבית (ורניקה) פוגעת בהבנה - הדיבור שוטף אך חסר משמעות - ומקורה באזור טמפורלי אחורי. דיסארתריה היא הפרעה בהיגוי מפגיעה מוטורית ולא הפרעת שפה."},{"t":"נוירולוגיה","q":"מה משמעות דירוג רפלקס גידי עמוק של +1?","o":["היעדר רפלקס מוחלט","רפלקס מופחת (היפואקטיבי)","רפלקס תקין","רפלקס היפראקטיבי עם קלונוס"],"a":1,"e":"רפלקסים גידיים עמוקים מדורגים בסולם 0-4: 0 = היעדר, +1 = מופחת (היפואקטיבי), +2 = תקין, +3 = מוגבר, +4 = היפראקטיבי עם קלונוס. רפלקסים פתולוגיים - כמו סימן בבינסקי (התפשטות האצבעות ומשיכתן לאחור בגירוי כף הרגל), רפלקס יניקה ורפלקס כף יד - מופיעים במחלה נוירולוגית ומייצגים חזרה של רפלקסים פרימיטיביים."},{"t":"נוירולוגיה","q":"כיצד מבוצעת בדיקת רומברג ומה היא בודקת?","o":["המטופל עומד עם רגליים צמודות, תחילה בעיניים פקוחות ואז עצומות; בודקת איזון","המטופל מרים את הרגל הישרה בשכיבה; בודקת לחץ על שורש עצב","המטופל נוגע באף עם אצבע לסירוגין; בודקת תפקוד מוחון בלבד","הבודק מכופף את צוואר המטופל; בודקת גירוי מנינגיאלי"],"a":0,"e":"בבדיקת רומברג המטופל עומד עם רגליים צמודות, תחילה בעיניים פקוחות ולאחר מכן בעיניים עצומות למשך כ-20 שניות. תנודה קלה תקינה, אך אובדן איזון מעיד על הפרעה בתחושה עמוקה או במערכת הווסטיבולרית. הרמת רגל ישרה היא מבחן Lasegue לבדיקת לחץ על שורש עצב, וכיפוף הצוואר הוא סימן ברודזינסקי."},{"t":"נוירולוגיה","q":"מהי אגנוזיה?","o":["אובדן היכולת להפיק דיבור","אובדן זיכרון לאירועים שקדמו לפגיעה","אובדן היכולת לזהות עצמים דרך מערכת חושית מסוימת","חולשה בחצי הגוף"],"a":2,"e":"אגנוזיה היא אובדן כללי של היכולת לזהות עצמים דרך מערכת חושית מסוימת, למרות שהחוש עצמו תקין. אגנוזיה חזותית קשורה לאונה האוקסיפיטלית, אגנוזיה שמיעתית לאונה הטמפורלית. אפזיה היא הפרעת שפה, אמנזיה היא הפרעת זיכרון, והמיפרזיס הוא חולשה בחצי הגוף."},{"t":"נוירולוגיה","q":"איזו בדיקה מודדת את הפעילות החשמלית של השרירים?","o":["EEG - אלקטרואנצפלוגרפיה","TCD - דופלר טרנס-קרניאלי","MRA - אנגיוגרפיה בתהודה מגנטית","EMG - אלקטרומיוגרפיה"],"a":3,"e":"EMG מודדת את הפעילות החשמלית של השרירים ומסייעת באבחון מחלות נוירומוסקולריות. EEG מודדת פעילות חשמלית מוחית ומספקת ראיות אבחנתיות בסיווג סוגי התקפים. MRA מדגימה את כלי הדם המוחיים, ו-TCD מעריך את זרימת הדם העורקית המוחית באולטרסאונד דופלר. Evoked Potentials בודקים מסלולים שמיעתיים, חזותיים וסומטו-סנסוריים."},{"t":"נוירולוגיה","q":"מהי ההגדרה של TIA?","o":["גירעון נוירולוגי קבוע בהיקף מצומצם","דימום קטן שנספג תוך שבוע","גירעון נוירולוגי שנפתר תוך 24 שעות ללא מוות של רקמת עצב","אירוע פרכוסי חולף"],"a":2,"e":"TIA מוגדר כגירעון נוירולוגי שנפתר תוך 24 שעות ללא מוות של רקמת עצב; רוב המקרים נמשכים דקות בלבד. חשיבותו היא כסימן אזהרה לשבץ מתקרב, בעיקר ב-90 הימים הראשונים, ולכן הוא מחייב בירור מלא ומניעה משנית - איזון לחץ דם, סטטינים, נוגדי טסיות או נוגדי קרישה בפרפור פרוזדורים, ולעיתים התערבות בעורק התרדמה."},{"t":"נוירולוגיה","q":"מהו יעד לחץ הדם בשעות שלאחר מתן tPA?","o":["מתחת ל-180/105 מ\"מ כספית","מתחת ל-120/70 מ\"מ כספית","מעל 200/110 מ\"מ כספית","אין צורך בניטור לחץ דם"],"a":0,"e":"לאחר מתן tPA יש לשמור על לחץ דם מתחת ל-180/105 מ\"מ כספית ולנטר אותו בתדירות גבוהה, בשל הסיכון לדימום תוך מוחי. יעד ה-CT הראשוני הוא ביצוע ופענוח תוך כ-20 דקות מההגעה. המינון ניתן כבולוס ולאחריו יתרת המנה בעירוי לאורך שעה, עם ניטור נוירולוגי צמוד."},{"t":"נוירולוגיה","q":"מהו חלון הזמן המקובל לטיפול אנדווסקולרי (טרומבקטומיה) בשבץ איסכמי?","o":["עד שעתיים בלבד","עד 48 שעות","עד 6-8 שעות (ובמקרים נבחרים אף מעבר לכך)","עד שבוע מהאירוע"],"a":2,"e":"טיפול אנדווסקולרי ניתן לרוב עד 6-8 שעות מתחילת התסמינים (ובמקרים נבחרים עם הדמיה מתאימה - מעבר לכך), וניתן לשלבו עם tPA תוך ורידי או להשתמש בו כחלופה כשיש התווית נגד לתרומבוליזה. הוא מיועד בעיקר לחסימת כלי דם גדול."},{"t":"נוירולוגיה","q":"מהו הליקוי המתמשך השכיח ביותר בקרב ניצולי דלקת קרום המוח חיידקית?","o":["עיוורון מוחלט","שיתוק גפיים תחתונות","ירידה בשמיעה","אובדן חוש ריח"],"a":2,"e":"כ-50% מהניצולים חווים ליקויים נוירולוגיים מתמשכים, כשאובדן שמיעה הוא מהשכיחים ומחייב הערכה. ליקויים נוספים: בעיות בזיכרון, בקשב ובריכוז הדורשות שיקום קוגניטיבי. שיעורי התמותה 10-37% במדינות מפותחות ועד 54% במדינות בעלות הכנסה נמוכה. חיסון הוא ההגנה הטובה ביותר, וכל שעת עיכוב בטיפול מגבירה תמותה וסיבוכים."},{"t":"נוירולוגיה","q":"מהי דרך המניעה העיקרית של אנצפליטיס ארבו-ויראלית (כמו נגיף הנילוס המערבי)?","o":["חיסון שגרתי לכלל האוכלוסייה","הימנעות מעקיצות יתושים - בגדים מכסים, דוחה חרקים, והישארות בפנים בשחר ובשקיעה","טיפול אנטי-ויראלי מונע","הימנעות ממגע עם חולים"],"a":1,"e":"אין טיפול ספציפי ואין חיסון לאנצפליטיס ארבו-ויראלית, ולכן המניעה היא הימנעות מעקיצות יתושים: לבוש מכסה, דוחה חרקים, והישארות בפנים בשעות שיא פעילות היתושים (שחר ושקיעה). הווקטור העיקרי בצפון אמריקה הוא היתוש; בני אדם נחשבים מארח ללא מוצא. תקופת הדגירה 2-14 ימים, ורוב הנדבקים אינם מפתחים תסמינים. הטיפול תומך."},{"t":"נוירולוגיה","q":"איזו תרופה משמשת לטיפול בספסטיות במטופלים עם טרשת נפוצה?","o":["תרופה אנטי-ספסטית כמו בקלופן","נוגד דיכאון בלבד","נוגד פרכוסים בלבד","משכך כאבים אופיואידי"],"a":0,"e":"ניהול התסמינים ב-MS הוא סימפטומטי ומותאם אישית: תרופות אנטי-ספסטיות (בקלופן) לספסטיות - העלולות לגרום לנמנום, SSRI/SNRI לדיכאון ולחרדה, משככי כאבים, ומרככי צואה לעצירות. במקביל ניתנים DMTs להאטת התקדמות המחלה: מאינטרפרון בטא וגלטירמר אצטט ועד נוגדנים חד-שבטיים כמו נטליזומאב ואוקרליזומאב. אין תרופה מרפאה ל-MS."},{"t":"נוירולוגיה","q":"מהי אמנזיה רטרוגרדית?","o":["אובדן זיכרון של מה שקרה לאחר הפגיעה","חוסר יכולת לקודד מידע חדש","אובדן זיכרון של אירועים שקדמו לפגיעה","אובדן זיכרון של כישורים מוטוריים בלבד"],"a":2,"e":"אמנזיה רטרוגרדית היא אובדן זיכרון של אירועים שקדמו לפגיעה, ואילו אמנזיה אנטרוגרדית היא אובדן הזיכרון למה שקרה לאחריה - חוסר יכולת לקודד מידע חדש, הקשור לאזור האונות הטמפורליות. הסיבות: פגיעות מוח מתאונות, ניתוחים, שבץ, דלקת והלם חשמלי. במקרים אלה הכישורים התפיסתיים והמוטוריים לרוב נשמרים."},{"t":"אורולוגיה","q":"מהו האורך המשוער של השופכה הנשית, ומה משמעותו הקלינית?","o":["כ-1 ס\"מ; אינה בעלת משמעות קלינית","כ-20 ס\"מ; מגנה מפני זיהומים","כ-10 ס\"מ; זהה לגבר","כ-3-4 ס\"מ; מסבירה את השכיחות הגבוהה של UTI בנשים"],"a":3,"e":"אורך השופכה הנשית הוא כ-3-4 ס\"מ, לעומת כ-20 ס\"מ בגבר. השופכה הקצרה והקרבה האנטומית לפי הטבעת ולנרתיק מסבירות מדוע כ-60% מזיהומי דרכי השתן מופיעים בנשים, ומדוע הם שכיחים לאחר קיום יחסי מין. ההדרכה נגזרת מכך: מתן שתן לאחר יחסי מין וניגוב מקדימה לאחור."},{"t":"אורולוגיה","q":"מטופל מציג שתן בצבע כהה מאוד, כמעט חום. מה עשוי להסביר זאת?","o":["צריכת מים מרובה","זיהום בפסאודומונס בלבד","תאי דם אדומים ישנים, מלנין או התייבשות","שימוש במשתנים בלבד"],"a":2,"e":"שתן כהה עשוי לנבוע מתאי דם אדומים ישנים, ממלנין או מהתייבשות. שתן ירקרק עשוי להעיד על חיידק פסאודומונס או על תרופות וחומרי ניגוד, ושתן לבנבן כמו חלב על פיאוריה. תיעוד צבע השתן, צלילותו וריחו הוא חלק מהאומדן הסיעודי הבסיסי של מערכת השתן."},{"t":"אורולוגיה","q":"מה חשוב בהדרכה לאיסוף שתן ל-24 שעות לבדיקת פינוי קריאטינין?","o":["לאסוף את השתן הראשון של הבוקר ולהתחיל ממנו","להשליך את השתן הראשון של הבוקר, ולאסוף מהמנה השנייה למשך 24 שעות; נדרשת גם דגימת דם","לאסוף רק שתן של שעות היום","לאסוף רק את המנה האחרונה של היום"],"a":1,"e":"באיסוף 24 שעות אין להשתמש בשתן הראשון של הבוקר - משליכים אותו ומתחילים לאסוף מהמנה הבאה, עד אותה שעה למחרת. נדרשת גם דגימת דם לקריאטינין, שכן החישוב משווה בין רמת הקריאטינין בשתן לרמתו בדם. איבוד מנה אחת פוסל את האיסוף. תפוקת שתן תקינה היא כ-500-1000 מ\"ל ל-24 שעות ומעלה, בהתאם למאזן הנוזלים."},{"t":"אורולוגיה","q":"מהו המחולל השכיח ביותר של זיהומים בדרכי השתן?","o":["Candida albicans","Staphylococcus aureus","Escherichia coli","Pseudomonas aeruginosa"],"a":2,"e":"E. coli הוא המחולל השכיח ביותר של UTI, ומגיע לרוב בעלייה ממערכת השתן התחתונה לעליונה. מזהמים נוספים: פרוטאוס, סטפילוקוק, קלבסיאלה, קנדידה ופרזיטים. UTI לא מסובך מופיע במערכת שתן תקינה מבנית; UTI מסובך מופיע על רקע חסימה, אבנים, קטטר או פגם אנטומי, ומצריך טיפול ממושך יותר."},{"t":"אורולוגיה","q":"מהו הסף המקובל בתרבית שתן המעיד על זיהום משמעותי?","o":["מעל 100 מושבות","מעל 1,000 מושבות","מעל 100,000 מושבות","כל צמיחה כלשהי"],"a":2,"e":"תרבית שתן נחשבת חיובית מעל 100,000 מושבות. בבדיקת שתן לכללית מחפשים ניטריטים, לויקוציטים ותאי דם אדומים. חשוב לזכור שבקטריוריה אסימפטומטית - למשל בקטטר קבוע - אינה מחייבת טיפול אנטיביוטי, וטיפול מיותר בה מקדם עמידות."},{"t":"אורולוגיה","q":"במטופל עם בריחת שתן מסוג Overflow, מה כוללת ההדרכה להתרוקנות מלאה יותר?","o":["הגבלת נוזלים קיצונית","הימנעות ממתן שתן בלילה","החזקת שתן זמן ממושך ככל האפשר","השתנה תוך העלאת הלחץ התוך בטני (ולסלבה), ולעיתים צנטור עצמי לסירוגין"],"a":3,"e":"ב-Overflow incontinence השלפוחית אינה מתרוקנת במלואה ויש דליפה מגלישה. ההדרכה כוללת השתנה תוך העלאת הלחץ התוך בטני (מנוור ולסלבה) ולעיתים צנטור עצמי לסירוגין בטכניקה נכונה. חשוב: תרופות אנטיכולינרגיות (המשמשות ל-urge) אסורות במטופלים עם גלאוקומה בשל העלאת הלחץ התוך עיני."},{"t":"אורולוגיה","q":"מה כוללת ההדרכה הסיעודית במטופל עם פרוסטטיטיס?","o":["הימנעות מוחלטת משתייה","אמבטיות ישיבה, הפחתת קפאין ואלכוהול ומעקב אחר התפתחות UTI","עיסוי הערמונית עצמי מדי יום","הימנעות ממשככי כאבים"],"a":1,"e":"בפרוסטטיטיס ההדרכה כוללת ביצוע אמבטיות ישיבה להקלה, הפחתת חומרים מגרים (קפאין, אלכוהול, קולה), מנוחה, ומעקב אחר התפתחות UTI. דלקת אקוטית עשויה לחייב אשפוז וטיפול IV, בעוד הצורה הכרונית מאופיינת בתסמינים מתמשכים ובפגיעה בתפקוד המיני ובאיכות החיים."},{"t":"אורולוגיה","q":"מהו הסיבוך האפשרי של אורכיטיס דו צדדית?","o":["אצירת שתן קבועה","עקרות","יתר לחץ דם","אבנים בדרכי השתן"],"a":1,"e":"אורכיטיס דו צדדית עלולה לגרום לעקרות עקב פגיעה ברקמה המייצרת זרע. אפידידימיטיס נגרמת לרוב מגונוריאה או כלמידיה בגברים צעירים ומתבטאת בתחושת כובד, רגישות ונפיחות, ולעיתים בחום ובתסמינים במתן שתן. הטיפול: אנטיביוטיקה - הכוללת גם את בת הזוג ב-STD - אמבטיות ישיבה, והימנעות מהחדרת קטטר."},{"t":"אורולוגיה","q":"מהו סוג התאים ממנו מתפתחים רוב גידולי שלפוחית השתן, ומהו גורם סיכון תעסוקתי מרכזי?","o":["תאי קשקש; חשיפה לשמש","תאי מעבר (אורותל); חשיפה לכימיקלים כמו דלק ובנזין","תאי בלוטה; תזונה עתירת סוכר","מלנוציטים; חשיפה לקרינה"],"a":1,"e":"רוב גידולי שלפוחית השתן מקורם באפיתל המעבר (אורותל). גורמי הסיכון: עישון - המשמעותי ביותר - וחשיפה תעסוקתית לכימיקלים כגון דלק, בנזין וצבעים. רוב הגידולים שטחיים ומוגדרים כ-Low Grade, ומטופלים בכריתה דרך השופכה בשילוב הזלפה תוך-שלפוחיתית; בגידול חודר מוקוזה משלבים כריתה עם טיפול, ובמחלה גרורתית ניתנת כימותרפיה סיסטמית."},{"t":"אורתופדיה","q":"מהו המבנה של עצם ארוכה טיפוסית?","o":["עצם ספוגית בלבד ללא שכבה חיצונית","שכבה חיצונית של עצם קומפקטית ובתוכה עצם ספוגית (טרבקולרית) ומח עצם","סחוס בלבד לאורך כל העצם","רקמת חיבור רכה בלבד"],"a":1,"e":"עצם ארוכה מורכבת משכבה חיצונית צפופה של עצם קומפקטית, ובתוכה עצם ספוגית (טרבקולרית) ומח עצם צהוב או אדום. סוגי עצמות נוספים: עצמות קצרות (עצם ספוגית מכוסה בשכבה דקה של קומפקטית), עצמות שטוחות (עצם ספוגית בין שתי שכבות), ועצמות לא סדירות. הבנת המבנה חיונית להבנת שברים, ריפויים ותהליכי אוסטאופורוזיס."},{"t":"אורתופדיה","q":"מה מאפיין נקע (Sprain) בדרגה III?","o":["חוסר יכולת דריכה או נשיאת משקל וטווחי תנועה ירודים מאוד","נפיחות בינונית עם ירידה מסוימת בטווח התנועה","רגישות מקומית עם נפיחות מינימלית וללא תנועה פתולוגית","כאב בלבד ללא ממצא בבדיקה"],"a":0,"e":"בנקע דרגה I יש רגישות מקומית, נפיחות מינימלית וללא תנועה פתולוגית; בדרגה II נפיחות וירידה משמעותית בטווחי התנועה; בדרגה III חוסר יכולת דריכה או נשיאת משקל וטווחי תנועה ירודים מאוד. הטיפול הראשוני בכל הדרגות: מנוחה, קירור, חבישה אלסטית והרמת הגפה, לצד NSAIDs לשיכוך כאב."},{"t":"אורתופדיה","q":"מה היתרון של מסמר תוך-מדולרי (IMN) על פני בורג דינמי (DHS) בשבר בצוואר הירך?","o":["מאפשר ניתוח בגישה קטנה יותר ושימוש בבורג דיסטלי נוסף","אינו דורש הרדמה","מתאים רק לשברים ללא תזוזה","מונע לחלוטין סיכון לזיהום"],"a":0,"e":"מערכת IMN מאפשרת ניתוח בגישה קטנה יותר ושימוש בבורג דיסטלי נוסף לייצוב. מערכת DHS עשויה להיות עדיפה בסוגי שברים מסוימים. שברי צוואר הירך במבוגרים יכולים להיגרם מנפילה פשוטה על רקע אוסטאופורוזיס, ולעיתים מטופלים בהחלפת מפרק חלקית (החלפת ראש הפמור) או מלאה, בהתאם לסוג השבר ולמצב האצטבולום."},{"t":"אורתופדיה","q":"איזה מבחן בודק קרע ברצועה הצולבת הקדמית (ACL)?","o":["מבחן רומברג","מבחן מגירה אחורי","מבחן Lasegue","מבחן מגירה קדמי, עם הברך בכיפוף 90 מעלות"],"a":3,"e":"מבחן המגירה הקדמי - משיכת הטיביה קדימה כשהברך בכיפוף 90 מעלות - בודק את ה-ACL, ומבחן המגירה האחורי בודק את ה-PCL. קרע ב-ACL הוא הטראומה השכיחה ביותר מבין רצועות הברך, והתיקון מבוצע בארתרוסקופיה, לעיתים בהשתלת שתל מגיד ההמסטרינג של המטופל עצמו. מבחן Lasegue בודק לחץ על שורש עצב."},{"t":"אורתופדיה","q":"מהו הטיפול המקובל בקרע במניסקוס?","o":["ארתרוסקופיה - לרוב תיקון או הסרה חלקית של הקרע","גבס למשך 3 חודשים","החלפת ברך מלאה בכל מקרה","מנוחה מוחלטת ללא כל התערבות"],"a":0,"e":"קרע במניסקוס מטופל לרוב בארתרוסקופיה - התערבות ניתוחית זעירה שבה מתקנים או מסירים את החלק הקרוע, כדי למנוע המשך העמקת הקרע. גורמי סיכון: ספורט הכרוך בסיבובים ועודף משקל. החלפת ברך מלאה שמורה למקרים של נזק נרחב, שברים קודמים ואוסטאוארתריטיס מתקדמת."},{"t":"אורתופדיה","q":"מהי האוכלוסייה האופיינית לקרע בגיד אכילס?","o":["נשים מעל גיל 70 עם אוסטאופורוזיס","מטופלים מרותקים למיטה","ילדים בגיל בית ספר","גברים סביב גיל 40 בפעילות ספורטיבית"],"a":3,"e":"קרע בגיד אכילס אופייני לגברים סביב גיל 40 בפעילות ספורטיבית מתפרצת (כדורסל, כדורגל), ומתבטא בתחושת קרע ובנפיחות כמעט מיידית. התיקון הוא ניתוחי ולאחריו קיבוע ושיקום ממושך. פאסייטיס פלנטרית, לעומת זאת, גורמת לכאב בחלק התחתון של כף הרגל שמחמיר לאחר מנוחה ובצעדים הראשונים."},{"t":"אורתופדיה","q":"מה מאפיין את הכאב בפאסייטיס פלנטרית?","o":["כאב שמחמיר לאחר מנוחה ובצעדים הראשונים בבוקר","כאב שמופיע רק בשכיבה","כאב שמחמיר ככל שהולכים יותר לאורך היום","כאב לילי בלבד ללא קשר לדריכה"],"a":0,"e":"בפאסייטיס פלנטרית הכאב ממוקד בחלק התחתון של כף הרגל ומחמיר דווקא לאחר מנוחה ובצעדים הראשונים, ומשתפר מעט עם ההליכה. כשליש מאוכלוסיית העולם יחוו את התופעה. גורם תורם שכיח הוא נעליים עם רפידה שטוחה, והטיפול כולל מתיחות, התאמת הנעלה ומדרסים, קירור ו-NSAIDs."},{"t":"אורתופדיה","q":"מה כולל הטיפול המומלץ באוסטאוארתריטיס?","o":["מנוחה מוחלטת והימנעות מכל פעילות","ירידה במשקל, חיזוק ופעילות אירובית בעלת השפעה נמוכה, ומשככי כאבים","הפעלת המפרק הפגוע תחת עומס מרבי","ניתוח החלפת מפרק בכל מטופל בכל שלב"],"a":1,"e":"באוסטאוארתריטיס יש פירוק סחוס במפרקים סינוביאליים; גורמי הסיכון כוללים גיל, השמנת יתר ופציעה קודמת. הטיפול: ירידה במשקל (מפחיתה את העומס על המפרקים), חיזוק שרירים ופעילות אירובית בעלת השפעה נמוכה, אצטמינופן ו-NSAIDs, ולעיתים הזרקת סטרואידים למפרק. יש להימנע מהפעלת המפרקים הפגועים לאורך זמן או תחת עומס."},{"t":"אורתופדיה","q":"מהי הסיבה השכיחה ביותר לקטיעת גפה?","o":["גידולי עצם","תאונות עבודה","מחלת כלי דם פריפריים","פציעות ספורט"],"a":2,"e":"מחלת כלי דם פריפריים - לרוב על רקע סוכרת - היא הסיבה השכיחה ביותר לקטיעה. סיבות נוספות: טראומה (מעיכה, פציעות קרב, התחשמלות במתח גבוה) וגידולים. חשוב שהמטופל יהיה שותף בהחלטה, ושתוכנית השיקום תתחיל עוד לפני הניתוח. החלמת הפצע הניתוחי היא תנאי קריטי לתחילת השיקום."},{"t":"נפרולוגיה","q":"היכן נספגת מרבית כמות המים והמומסים בנפרון?","o":["בלולאת הנלה","בצינורית הדיסטלית","בצינורית הפרוקסימלית - כ-80% מהמים","בצינור המאסף בלבד"],"a":2,"e":"בצינורית הפרוקסימלית נספגים מחדש כ-80% מהמים ורוב המומסים החיוניים - גלוקוז, אלקטרוליטים וחומצות אמינו. בלולאת הנלה נספג כרבע מהנתרן, מהכלור ומהאשלגן שבתסנין. שתנן, יוני מימן ויוני אשלגן מופרשים בהובלה אקטיבית. ADH פועל בעיקר על הצינורית הדיסטלית והצינור המאסף ומעלה את חדירותם למים."},{"t":"נפרולוגיה","q":"מה מפעילה מערכת רנין-אנגיוטנסין-אלדוסטרון (RAAS)?","o":["עודף נוזלים בגוף","עלייה חדה בלחץ הדם","ירידה בלחץ הדם או בזרימת הדם לכליה","היפרקלמיה בלבד"],"a":2,"e":"ירידה בלחץ הדם או בפרפוזיה הכלייתית מפעילה הפרשת רנין, שמובילה ליצירת אנגיוטנסין II - מכווץ כלי דם חזק - ולהפרשת אלדוסטרון האוגר נתרן ומים ומפריש אשלגן. התוצאה: העלאת לחץ הדם ושימור נוזלים. מעכבי ACE חוסמים את האנזים המהפך, ולכן מגנים על הכליה - אך בהיצרות עורקי הכליה עלולים דווקא להחמיר את התפקוד הכלייתי, ויש להיזהר מהיפרקלמיה."},{"t":"נפרולוגיה","q":"מהו תפקידו של ANP (Atrial Natriuretic Peptide)?","o":["הגברת הפרשת אלדוסטרון","חסימת הפרשת אלדוסטרון וקידום הפרשת נתרן ומים","העלאת ייצור אריתרופויאטין","הפעלת ויטמין D"],"a":1,"e":"ANP מופרש מהעליות בתגובה למתיחה מעודף נפח, וחוסם את הפרשת האלדוסטרון ובכך מקדם הפרשת נתרן ומים - מנגנון נגדי ל-RAAS. אריתרופויאטין והפעלת ויטמין D הם תפקידים אנדוקריניים של הכליה עצמה."},{"t":"נפרולוגיה","q":"אילו ביטויים אופייניים לאורמיה במחלת כליות סופנית?","o":["ריח מתקתק מהפה ותיאבון מוגבר","שיפור ברמות ההמוגלובין","עלייה בתיאבון ובמשקל","טעם מר בפה, גירוד עז, בחילות, נשימת קוסמאול ואנצפלופתיה"],"a":3,"e":"אורמיה מתבטאת בטעם מר בפה ובריח אצטון, חוסר תיאבון, בחילות והקאות, גירוד עז, חולשה כללית, אנצפלופתיה אורמית ונשימת קוסמאול (נשימה עמוקה כפיצוי על חמצת מטבולית). ממצאים נוספים: אוליגוריה, ירידת משקל, אנמיה, היפרקלמיה, יתר לחץ דם, פריקרדיטיס וקלציפילקסיס."},{"t":"נפרולוגיה","q":"מה מאפיין את שלב הדיורזה ב-AKI?","o":["תפוקת שתן יורדת לאפס","הקריאטינין עולה בחדות","תפוקת השתן עולה ל-2-3 ליטר ליממה, עם סיכון להיפוקלמיה","מתחיל מיד עם הפגיעה"],"a":2,"e":"שלב הדיורזה מתחיל לאחר תקופת האוליגוריה, כאשר נפח השתן עולה ל-2-3 ליטר ליממה ואף יותר. בשלב זה הסכנה היא איבוד נוזלים ואלקטרוליטים - היפוקלמיה, חוסר מגנזיום, נתרן נמוך וירידה בלחץ הדם - בניגוד להיפרקלמיה של השלב האוליגורי. לאחריו מגיע שלב ההחלמה; מטופלים מבוגרים עשויים להישאר עם אי ספיקת כליות קלה."},{"t":"נפרולוגיה","q":"מהו המנגנון שבו רבדומיוליזה גורמת לפגיעה כלייתית?","o":["חסימה מכנית של השופכנים","זיהום חיידקי ישיר","עלייה בלחץ הדם בלבד","שחרור מיוגלובין הרעיל לצינוריות הכליה"],"a":3,"e":"ברבדומיוליזה מתפרק שריר השלד ומשתחרר מיוגלובין, שהוא טוקסי לצינוריות הכליה וגורם לנמק צינורי חריף. סמן מעבדתי מרכזי הוא קראטין קינאז מוגבר, בדרך כלל מעל 5,000 יחידות לליטר. הטיפול: שמירה על נפח מחזור דם מספק להבטחת תפוקת שתן גבוהה, ובתסמונת מדור - פאסיוטומיה להורדת הלחץ. טוקסינים נוספים לצינוריות: המוגלובין וחומר ניגוד."},{"t":"נפרולוגיה","q":"מהו היתרון של פיסטולה עורקית-ורידית על פני צנתר מרכזי לדיאליזה?","o":["ניתן להשתמש בה מיד לאחר היצירה","שיעורי זיהום נמוכים יותר ואורך חיים ארוך יותר","אינה דורשת ניתוח","אינה דורשת דקירות"],"a":1,"e":"פיסטולה היא הגישה המועדפת - שיעורי זיהום נמוכים יותר ואורך חיים ארוך יותר - אך דורשת תקופת הבשלה ואינה זמינה מיד, וכן דקירות חוזרות. גרפט מחייב חיבור בשיטת רוטציה כדי לא לדקור באותו מקום. צנתר מרכזי זמין מיידית אך מועד לזיהומים; זיהום מוקדם מוגדר עד 5 ימים מההכנסה ומאוחר מעבר לכך, ובחום נלקחות שתי תרביות דם."},{"t":"נפרולוגיה","q":"מהו הרכב נוזל הדיאליזה (דיאליזאט)?","o":["מים מזוקקים בלבד","דם מתורם","תמיסת גלוקוז מרוכזת בלבד","תמיסה שהרכב האלקטרוליטים והמים בה דומה לפלסמה"],"a":3,"e":"הדיאליזאט הוא נוזל שהרכבו מבחינת אלקטרוליטים ומים דומה להרכב הפלסמה, ומיוצר מתרכיז אלקטרוליטים וביקרבונט עם מים מטוהרים לדיאליזה. הדמיון בהרכב הוא שמאפשר לשלוט במה יעבור בדיפוזיה ומה יישאר: חומרים שריכוזם בדם גבוה מדי (כמו אשלגן ואוריאה) עוברים לדיאליזאט, בעוד רכיבים רצויים נשמרים."},{"t":"המטולוגיה","q":"מה ההבדל בין פלסמה לסרום?","o":["אין הבדל ביניהם","פלסמה היא סרום ללא תאים","סרום מכיל תאי דם אדומים","סרום הוא פלסמה ללא גורמי קרישה"],"a":3,"e":"פלסמה היא החלק הנוזלי של הדם הכולל גורמי קרישה; סרום הוא פלסמה לאחר שהקרישה התרחשה - כלומר ללא גורמי הקרישה. הדם מהווה כ-7% ממשקל הגוף ומשמש להעברת חמצן, הורמונים, נוירוטרנסמיטרים, אנזימים, תרופות ובילירובין, וכן לוויסות חומציות ולתפקודי הקרישה והחיסון."},{"t":"המטולוגיה","q":"אילו תאי דם לבנים מעורבים בעיקר בתגובות אלרגיות ובזיהומים טפיליים?","o":["נויטרופילים","לימפוציטים מסוג B","מונוציטים","אאוזינופילים"],"a":3,"e":"אאוזינופילים מעורבים בתגובות אלרגיות ודלקתיות (בתיווך IgE) ובפירוק חלבונים זרים, ובזיהומים טפיליים. בזופילים מפרישים היסטמין והפרין; תא מאסט הוא בזופיל היושב ברקמות (עור, ריריות, דרכי נשימה) ומרכזי בתגובה אלרגית. נויטרופילים הם המגיבים הראשונים בפגוציטוזיס, ומונוציטים הופכים ברקמות למקרופאגים."},{"t":"המטולוגיה","q":"מהו השלב הראשון בהמוסטזיס לאחר פגיעה בכלי דם?","o":["יצירת רשת פיברין","המסת הקריש בפלסמין","כיווץ כלי הדם (Vasoconstriction) עם הפרשת אנדותלין וסרוטונין","הפעלת המסלול האינטרינזי"],"a":2,"e":"ההמוסטזיס מתחיל בכיווץ כלי הדם עם הפרשת אנדותלין וסרוטונין, לאחר מכן היצמדות והצטברות טסיות ליצירת פקק ראשוני, ולבסוף הפעלת קסקדת הקרישה ליצירת רשת פיברין (המוסטזיס משני) - תהליך שנמשך כ-10 דקות. הפיברינוליזה מפרקת את הקריש בפלסמין. המסלול האינטרינזי איטי יותר מהאקסטרינזי."},{"t":"המטולוגיה","q":"מה משמעות ערך D-dimer מוגבר?","o":["מעיד בוודאות על DVT","הוא תוצר פירוק של פיברין; ערך תקין מסייע בעיקר לשלול פקקת","מעיד על חוסר בוויטמין K","מעיד על עודף טסיות"],"a":1,"e":"D-dimer הוא תוצר פירוק של פיברין על ידי פלסמין. ערכו עולה בכל מצב של יצירת קריש ופירוקו, אך גם בזיהום, בהריון, בגיל מבוגר ולאחר ניתוח - ולכן הוא אינו ספציפי. הערך שלו הוא בעיקר בשלילה: D-dimer תקין בסבירות קלינית נמוכה מסייע לשלול DVT או PE."},{"t":"המטולוגיה","q":"מה מאפיין אנמיה אפלסטית?","o":["MCV נמוך מאוד","עלייה בכדוריות אדומות בלבד","ירידה בטסיות בלבד","פנציטופניה - ירידה בכל שורות הדם"],"a":3,"e":"אנמיה אפלסטית מתאפיינת בפנציטופניה - ירידה בכדוריות אדומות, בלבנות ובטסיות - עקב כשל מח העצם. הסיבות: אידיופתית, תרופות וחומרים רעילים (בנזן), קרינה, וזיהומים כמו Parvovirus, EBV, HCV ו-HIV. הביטויים: חיוורון, עייפות, קוצר נשימה, נטייה לדימומים וזיהומים. הטיפול: מדכאי חיסון, גורמי גדילה ולעיתים השתלת תאי גזע."},{"t":"המטולוגיה","q":"מהו הטיפול המרכזי בפוליציטמיה ורה?","o":["מתן ברזל במינון גבוה","הגבלת נוזלים","עירוי כדוריות אדומות","הקזת דם (Therapeutic Phlebotomy)"],"a":3,"e":"בפוליציטמיה ורה יש ייצור עודף של כדוריות אדומות עם עלייה בהמטוקריט מעל 50-55%, קרישיות יתר וסיכון לתרומבוזה. הטיפול המרכזי הוא הקזת דם להורדת ההמטוקריט, לצד מניעת תרומבוזה - הפסקת עישון, הורדת משקל ופעילות פיזית מתונה. יש להבדיל מפוליציטמיה יחסית הנובעת מהתייבשות בלבד."},{"t":"המטולוגיה","q":"מה מבדיל לימפומה ע\"ש הודג'קין מלימפומה שאינה הודג'קין?","o":["הודג'קין מופיעה רק בקשישים","היעדר תסמינים סיסטמיים בהודג'קין","נוכחות תאי Reed-Sternberg והתפשטות מסודרת בהודג'קין","אין הבדל היסטולוגי"],"a":2,"e":"לימפומה ע\"ש הודג'קין מאופיינת בנוכחות תאי Reed-Sternberg ובהתפשטות מסודרת בין קבוצות בלוטות סמוכות, עם שני שיאי גילאים - צעירים בגילאי 15-30 ומבוגרים מעל 60. בלימפומה שאינה הודג'קין הפיזור לא סדיר ואין תאי Reed-Sternberg. תסמיני B - חום, הזעות לילה וירידה במשקל - מופיעים בשתיהן ומשפיעים על ה-Staging."},{"t":"המטולוגיה","q":"מהי מגבלת הזמן למתן מנת דם דחוסה (PC) מרגע הוצאתה מהמקרר?","o":["עד 24 שעות","עד 12 שעות","עד 4 שעות","אין מגבלת זמן"],"a":2,"e":"מנת דם דחוסה יש להזליף תוך 4 שעות מרגע הוצאתה מהקירור הייעודי. שאר עקרונות הבטיחות: זיהוי על ידי שני מורשי חתימה ליד מיטת המטופל, מילוי טופס מלווה מנה, לקיחת מדדים סמוך להזלפה והשגחה צמודה ב-15-30 הדקות הראשונות - שבהן מתרחשות רוב התגובות החריפות. FFP ו-PC ניתנים לפי סוג דם."},{"t":"אונקולוגיה","q":"איזה נגיף קשור להתפתחות לימפומה ע\"ש ברקיט ולקרצינומה נזופרינגיאלית?","o":["Epstein-Barr virus (EBV)","Influenza","Rotavirus","HSV-1"],"a":0,"e":"EBV מעלה סיכון ללימפומה ע\"ש ברקיט ולקרצינומה נזופרינגיאלית. נגיפים אונקוגניים נוספים: HPV (צוואר הרחם, ראש-צוואר), הפטיטיס B ו-C (סרטן כבד) ו-HHV-8 (סרקומה ע\"ש קפושי). חשוב לזכור שמרבית הגורמים לסרטן הם סביבתיים - עישון, תזונה, זיהום אוויר, קרינת שמש וחומרים כימיים כמו אמינים ארומטיים."},{"t":"אונקולוגיה","q":"מהו תפקידם של גנים מדכאי סרטן (Tumor suppressor genes)?","o":["לבלום חלוקת תאים לא תקינה; פגיעה בהם מאפשרת התפתחות ממאירות","להאיץ את חלוקת התא","לייצר כלי דם חדשים לגידול","להוביל גרורות לאיברים מרוחקים"],"a":0,"e":"גנים מדכאי סרטן בולמים חלוקת תאים לא תקינה ומכוונים תאים פגומים לאפופטוזיס; פגיעה בהם מסירה את הבלם ומאפשרת התפתחות ממאירות. במקביל, תאי סרטן מפתחים מנגנוני התחמקות ממערכת החיסון - למשל הסתרת קומפלקסים של אנטיגן-נוגדן ושחרור ציטוקינים - וכשל בזיהוי תאים טרום-ממאירים מאפשר את התפתחות המחלה."},{"t":"אונקולוגיה","q":"אילו בדיקות סקר מומלצות לגילוי מוקדם של סרטן צוואר הרחם?","o":["ממוגרפיה","בדיקת PSA","קולונוסקופיה","משטח פאפ (Pap) ובדיקת HPV"],"a":3,"e":"סקר לסרטן צוואר הרחם מתבצע במשטח פאפ ובבדיקת HPV; בנשאיות HIV מומלץ משטח כל 6 חודשים. ממוגרפיה היא סקר לסרטן שד, קולונוסקופיה ובדיקות דם סמוי בצואה לסרטן המעי הגס והחלחולת, ו-PSA עם בדיקה רקטלית לסרטן הערמונית. עיקרון מנחה: ככל שהמחלה מתגלה מוקדם יותר, סיכויי הריפוי טובים יותר."},{"t":"אונקולוגיה","q":"איזה מהבאים נחשב סימן אזהרה המחייב בירור לגילוי מוקדם של סרטן?","o":["כאב ראש חולף לאחר מאמץ","נזלת עונתית","עייפות ליום אחד","שיעול טורדני או צרידות מתמשכת"],"a":3,"e":"שיעול טורדני או צרידות מתמשכת הם מסימני האזהרה המחייבים בירור. סימנים נוספים: שינוי בהרגלי מעיים או שלפוחית, פצע שאינו מחלים, דימום או הפרשה חריגים, גוש בשד או במקום אחר, קושי בבליעה או עיכול, ושינוי בשומה או ביבלת. אלה אינם מאבחנים סרטן, אך מחייבים הערכה רפואית ולא המתנה."},{"t":"אונקולוגיה","q":"מהו ה-Nadir בהקשר של טיפול כימותרפי?","o":["נקודת השפל בספירות הדם לאחר הטיפול","המינון המרבי של התרופה","תחילת מתן הטיפול","סיום סדרת הטיפולים"],"a":0,"e":"ה-Nadir הוא נקודת השפל בספירות הדם לאחר מחזור כימותרפיה - השלב שבו הסיכון לזיהום ולדימום הוא הגבוה ביותר, ולכן מתוזמנות סביבו בדיקות דם והדרכה למטופל. ספירת נויטרופילים מתחת ל-1000 מהווה סיכון משמעותי לזיהום. גורמי גדילה כמו Pegfilgrastim מקצרים את משך הנויטרופניה."},{"t":"אונקולוגיה","q":"כיצד מונעים ציסטיטיס דימומית במטופל המקבל כימותרפיה המסכנת את השלפוחית?","o":["מתן נוזלים IV בכמות גבוהה, השתנה תכופה ולעיתים משתנים","הגבלת נוזלים והחזקת שתן","החדרת קטטר קבוע לכל המטופלים","מתן אנטיביוטיקה מניעתית"],"a":0,"e":"ההגנה על השלפוחית מבוססת על מתן נוזלים IV בכמות גבוהה, השתנה תכופה ולעיתים מתן משתנים, כדי לדלל ולפנות במהירות את המטבוליטים הרעילים. בנוסף עוקבים אחר שתן וצואה לזיהוי דימום. תרופות נפרוטוקסיות שכיחות בטיפול האונקולוגי: Cisplatin, Methotrexate ו-Mitomycin."},{"t":"אונקולוגיה","q":"מהו 'צוואה בחיים' (Living Will) בהקשר של הנחיות מקדימות?","o":["מסמך המעביר את הרכוש ליורשים","מסמך שבו אדם כשיר מביע מראש את רצונותיו לגבי טיפול רפואי עתידי","הוראת רופא שאינה ניתנת לשינוי","טופס הסכמה לניתוח"],"a":1,"e":"צוואה בחיים היא חלק מטופס הנחיות מקדימות (AD), שבו אדם כשיר מביע מראש את רצונותיו לגבי טיפול רפואי עתידי, למקרה שלא יוכל להביע אותם. חלק נוסף הוא מינוי מיופה כוח לצורך טיפול רפואי (DPOAHC). המסמך תקף לכל זמן שנדרש, ורק המטופל או בא כוחו רשאים לשנותו. בישראל, חוק החולה הנוטה למות מסדיר את הנושא."},{"t":"מערכת חיסון","q":"מה ההבדל בין כשל חיסוני ראשוני למשני?","o":["ראשוני נובע ממחלה או טיפול שפגעו במערכת חיסון קיימת","שניהם נרכשים בבגרות","שניהם מולדים","ראשוני הוא מולד/גנטי; משני נובע ממחלה, תרופות או גורמים חיצוניים שפגעו במערכת קיימת"],"a":3,"e":"כשל חיסוני ראשוני הוא מולד וגנטי, ומופיע לרוב בגיל צעיר עם זיהומים חוזרים, מזהמים אטיפיים ועיכוב בהתפתחות. כשל חיסוני משני נובע מגורמים שפגעו במערכת חיסון שהייתה תקינה - מחלות (כמו HIV), תרופות מדכאות חיסון, ממאירות ותת-תזונה. חשוב: בכשל חיסוני יש לוודא שלא ניתנים חיסונים חיים, כמו MMR ו-BCG."},{"t":"מערכת חיסון","q":"באילו נוזלי גוף מועבר נגיף ה-HIV?","o":["רוק, דמעות וזיעה","אוויר ונשימה","הזעה ומגע יומיומי","דם, נוזל זרע, הפרשות נרתיקיות וחלב אם"],"a":3,"e":"HIV מועבר בדם, בנוזל זרע, בהפרשות נרתיקיות ובחלב אם - ולא ברוק, בדמעות, בזיעה או במגע יומיומי. הנגיף אינו שורד בדם יבש. הוא שייך למשפחת הלנטי-וירוסים (Lenti = איטי בלטינית), ונשאים עשויים להיות א-סימפטומטיים מעל 10 שנים. עדיין אין חיסון, אך טיפול ARV יעיל מאפשר הגעה לעומס נגיפי בלתי מדיד."},{"t":"מערכת חיסון","q":"מהו PrEP?","o":["טיפול מונע לפני חשיפה ל-HIV, הניתן פומית או בזריקה כל חודשיים","טיפול לאחר חשיפה בלבד","חיסון נגד HIV","בדיקת סקר לנוגדנים"],"a":0,"e":"PrEP הוא טיפול מונע לפני חשיפה, המיועד לאוכלוסיות בסיכון - למשל בני זוג של נשאים או אנשים עם ריבוי פרטנרים. הוא ניתן פומית או בזריקות של Cabotegravir הניתנות על ידי אחות כל חודשיים, מה שנוח יותר לחלק מהמטופלים. PEP, לעומתו, הוא טיפול לאחר חשיפה שיש להתחילו בהקדם ולא יאוחר מ-72 שעות."},{"t":"מערכת חיסון","q":"איזה זיהום אופורטוניסטי אופייני ב-CD4 מתחת ל-50 תאים למ\"מ מעוקב?","o":["דלקת ריאות חיידקית רגילה","דלקת גרון סטרפטוקוקלית","נזלת אלרגית","CMV Retinitis - העלול לגרום לעיוורון"],"a":3,"e":"בדיכוי חיסוני קשה במיוחד (CD4 מתחת ל-50, ובחלק מהמקורות מתחת ל-100) עולה הסיכון ל-CMV, כולל רטיניטיס העלול לגרום לעיוורון, וכן לזיהומים קשים נוספים. מתחת ל-200 מוגדר שלב AIDS עם סיכון ל-PCP, המטופל למשך כ-21 יום. ממאירויות נלוות: סרקומה ע\"ש קפושי ולימפומות."},{"t":"מערכת חיסון","q":"מהי תסמונת השיקום החיסוני (IRIS)?","o":["החמרה פרדוקסלית של זיהום אופורטוניסטי בעקבות שיקום מהיר של מערכת החיסון","כשל בטיפול האנטי-רטרוויראלי","תגובה אלרגית לתרופה","ירידה נוספת ב-CD4"],"a":0,"e":"IRIS היא החמרה פרדוקסלית הקשורה לשיקום מואץ של מערכת החיסון ולתגובתה המוגברת לזיהומים אופורטוניסטיים שכבר היו בגוף, לאחר תחילת טיפול ARV. הסימנים: חום, תסמינים בטניים ונשימתיים והחמרה של זיהום אופורטוניסטי קיים. חשוב לזהות את התופעה ולא לפרשה בטעות ככשל טיפולי."},{"t":"מערכת חיסון","q":"איזו בדיקה חובה לבצע לפני התחלת טיפול ביולוגי ב-RA?","o":["בדיקת שמיעה","בדיקת שדה ראייה","בדיקת צפיפות עצם","שלילת שחפת לטנטית"],"a":3,"e":"לפני התחלת טיפול ביולוגי ב-RA יש לשלול שחפת לטנטית, שכן דיכוי החיסון עלול להביא להתפרצותה. הטיפולים הביולוגיים - נוגדנים חד-שבטיים ומעכבי JAK כמו baricitinib - יעילים אך יקרים, וניתנים בזריקה או בעירוי, לרוב בשילוב עם DMARDs אחרים. נדרש מעקב מעבדה קבוע: CBC ותפקודי כבד."},{"t":"עור וכוויות","q":"אילו מחלות סיסטמיות עלולות לגרום לגרד ללא נגעים עוריים ברורים?","o":["יתר לחץ דם וסוכרת בלבד","דלקת ריאות ואסתמה","אי ספיקת כליות כרונית, מחלות כבד והפרעות בבלוטת התריס","שברים ואוסטאופורוזיס"],"a":2,"e":"גרד ללא נגעים עוריים ברורים מחייב בירור סיסטמי: אי ספיקת כליות כרונית (Uremic pruritus), מחלות כבד עם כולסטזיס, תת או יתר פעילות של בלוטת התריס, ממאירויות המטולוגיות, וכן גורמים פסיכוגניים כמו סטרס וחרדה. הבירור כולל תפקודי כבד וכליות, בדיקת בלוטת התריס וספירת דם. הגרד מגביר גירוד שמחמיר את הגרד - 'מעגל הגירוד'."},{"t":"עור וכוויות","q":"מה מבדיל אנגיואדמה מאורטיקריה?","o":["אנגיואדמה מערבת רקמות עמוקות יותר, עם פחות גרד ויותר נפיחות","אנגיואדמה מלווה בגרד עז יותר","אורטיקריה מסוכנת יותר תמיד","אין הבדל ביניהן"],"a":0,"e":"אורטיקריה (חרלת) מתבטאת בנגעים שטחיים מהרחבת כלי דם ועלייה בחדירותם, עם גרד עז. אנגיואדמה מערבת רקמות עמוקות יותר - שפתיים, עפעפיים, לשון או גרון - ומלווה בפחות גרד ויותר נפיחות. מעורבות הלשון או הגרון מסכנת את נתיב האוויר ומחייבת טיפול דחוף. אורטיקריה חריפה היא לרוב אידיופתית (כ-80%), ולעיתים קשורה לתרופות כמו סולפונאמידים, NSAIDs ואספירין."},{"t":"עור וכוויות","q":"מה ההבדל בין דרמטיטיס מגע מגרה (Irritant) לאלרגית (Allergic)?","o":["המגרה היא תגובה חיסונית; האלרגית היא נזק ישיר","המגרה היא נזק ישיר מהחומר ותופיע ברוב האנשים שנחשפו; האלרגית היא רגישות יתר מסוג IV הדורשת חשיפה חוזרת","שתיהן מתווכות IgE","האלרגית מופיעה תוך שניות מהמגע"],"a":1,"e":"דרמטיטיס מגע מגרה היא תגובה דלקתית מקומית מנזק ישיר של החומר (סבונים, דטרגנטים, ממסים, חומצות), ותופיע ברוב האנשים שנחשפו. דרמטיטיס מגע אלרגית היא רגישות יתר מסוג IV המתווכת תאי T, דורשת חשיפה קודמת ומופיעה באיחור. לכן Patch Test - הנקרא לאחר 48-96 שעות - הוא הבדיקה המתאימה לאבחונה."},{"t":"עור וכוויות","q":"מה מטרת חיסון Shingrix במבוגרים?","o":["מניעת אבעבועות רוח בילדים","מניעת שלבקת חוגרת והפחתת סיבוכים ואשפוזים","טיפול בשלבקת חוגרת פעילה","מניעת הרפס סימפלקס"],"a":1,"e":"Shingrix הוא חיסון למניעת שלבקת חוגרת במבוגרים, עם יעילות מעל 90% הנשמרת לפחות 10 שנים, ומפחית סיבוכים ואשפוזים - ובעיקר נוירלגיה פוסט-הרפטית. הוא אינו טיפול במחלה פעילה. יש להבחין בינו לבין חיסון האבעבועות בילדות; לאחר אבעבועות רוח נשאר נגיף ה-VZV רדום בגנגליונים ועלול להתעורר בהמשך החיים."},{"t":"עור וכוויות","q":"מהו המנגנון הפתופיזיולוגי המרכזי בכוויה נרחבת (מעל 20-25% TBSA)?","o":["כיווץ כלי דם המונע כל אובדן נוזלים","עלייה בחדירות הנימים בכל הגוף עם דליפת נוזלים וחלבון לחלל הבין-תאי","עלייה בנפח הדם התוך-וסקולרי","ירידה בקצב חילוף החומרים"],"a":1,"e":"בכוויה נרחבת נגרם נזק לאנדותל ומופרשים מדיאטורים (היסטמין, פרוסטגלנדינים, תרומבוקסן, קטכולאמינים) הגורמים לעלייה בחדירות הנימים בכל הגוף - לא רק באזור הכוויה. התוצאה: דליפת נוזלים, נתרן וחלבון לחלל הבין-תאי, היפוולמיה חמורה ו'הלם כוויות'. אובדן שלמות הנימים נמשך כ-24-36 שעות, ולאחר מכן מתחיל שלב הדיורזה עם סכנה להיפוקלמיה."},{"t":"עור וכוויות","q":"מהו Curling's Ulcer בנפגעי כוויות?","o":["כיב לחץ באזור העקב","כיב פפטי על רקע סטרס המחייב ניטור סימני דימום","זיהום פטרייתי בפצע הכוויה","כיווץ של הצלקת המגביל תנועה"],"a":1,"e":"Curling's Ulcer הוא כיב פפטי המתפתח על רקע הסטרס הפיזיולוגי בכוויות, ומחייב ניטור סימני דימום ומתן טיפול מונע. סיבוכים נוספים במערכת העיכול: שיתוק מעיים (Paralytic ileus) המחייב זונדה מנקזת ומתן נוזלים IV, עלייה בחדירות הרירית המאפשרת חדירת חיידקים וספסיס, ותסמונת מדור בטנית בכוויות נרחבות (לחץ בשלפוחית מעל 30 מצביע על ACS)."},{"t":"אף אוזן גרון","q":"איזה מהבאים גורם לירידת שמיעה תחושתית-עצבית?","o":["חסימת צרומן בתעלה","נקב בעור התוף","פגיעה בשבלול או בעצב השמיעה","נוזל באוזן התיכונה"],"a":2,"e":"ירידת שמיעה תחושתית-עצבית נובעת מפגיעה בשבלול או בעצב השמיעה - למשל מנוירינומה אקוסטית, חשיפה לרעש, גיל או תרופות אוטוטוקסיות. ירידה הולכתית נובעת מהפרעה במעבר הקול: צרומן, נקב בעור התוף, נוזל באוזן התיכונה או פגיעה בעצמות השמע. שמיעה תקינה מוגדרת כיכולת להבחין בתדרים בעוצמה נמוכה, והבדיקה מבוצעת באודיומטריה."},{"t":"אף אוזן גרון","q":"מהו Trismus, ולאיזה מצב הוא אופייני?","o":["צרידות; אופייני לסרטן הגרון","סחרחורת; אופיינית ל-BPPV","מגבלה בפתיחת הפה; אופייני לאבצס פרי-טונסילרי","טיניטוס; אופייני למחלת מנייר"],"a":2,"e":"Trismus הוא מגבלה בפתיחת הפה, סימן אופייני לאבצס פרי-טונסילרי (אך גם למצבים אחרים), והוא עלול לגרום לקושי בבליעה ולמנוע מהמטופל לאכול ולשתות - ובכך להעלות סיכון להתייבשות. האבצס הוא סיבוך של פרינגיטיס או פריטונסיליטיס, והטיפול מתחיל בניקור וניקוז האבצס לצד אנטיביוטיקה."},{"t":"אף אוזן גרון","q":"מדוע דימום אף אחורי מסוכן יותר מדימום קדמי?","o":["קשה יותר לשלוט בו בלחץ מקומי, והוא מסכן בשאיפת דם ובאיבוד דם משמעותי","הוא כואב יותר","הוא תמיד נגרם משבר באף","הוא מופיע רק בילדים"],"a":0,"e":"דימום אחורי אינו נשלט בלחץ מקומי על החוטם, ולכן מסכן באיבוד דם משמעותי ובשאיפת דם לדרכי הנשימה, ומחייב לרוב טמפונדה אחורית והערכה רפואית עם ניטור נתיב אוויר ויציבות המודינמית. יש להעריך גם את הרקע: ניתוח אף לאחרונה, מחלות קרישה או שימוש במדללי דם המאטים את הקרישה. בטמפונדה יש לעקוב אחר החלקה שלה ופגיעה בשחלוף גזים."},{"t":"אף אוזן גרון","q":"מהו התסמין המוקדם והאופייני ביותר לסרטן הגרון?","o":["כאב אוזניים בלבד","צרידות מתמשכת","ירידת שמיעה","דימום מהאף"],"a":1,"e":"צרידות מתמשכת היא התסמין המוקדם והאופייני ביותר לסרטן הגרון, שכן הגידול פוגע במיתרי הקול; כל צרידות הנמשכת מעבר לשבועיים-שלושה מחייבת בירור. גורמי הסיכון המרכזיים: עישון ואלכוהול. תסמינים מאוחרים יותר: דיספגיה, כאב מוקרן לאוזן וקושי נשימתי. הטיפול עשוי לכלול ניתוח, קרינה וכימותרפיה, ומחייב שיקום בליעה ודיבור בליווי קלינאית תקשורת."},{"t":"עיניים","q":"מה מאפיין קטרקט?","o":["עלייה בלחץ התוך עיני עם אובדן שדה ראייה היקפי","עכירות של העדשה הטבעית עם טשטוש ראייה הדרגתי וסנוור","היפרדות של הרשתית עם הבזקי אור","דלקת של הלחמית עם הפרשה"],"a":1,"e":"קטרקט הוא עכירות של העדשה הטבעית, המתבטאת בטשטוש ראייה הדרגתי, סנוור ורגישות לאור, והוא מהסיבות המובילות לעיוורון בעולם. ההחלטה על ניתוח מתבססת על מצב הראייה והתפקוד של המטופל ולא על דרגת העכירות בלבד. בניתוח מנפצים את גרעין העדשה באולטרסאונד ומחליפים אותה בעדשה מושתלת."},{"t":"עיניים","q":"מה ההבדל המרכזי בין גלאוקומה פתוחת זווית לסגורת זווית?","o":["בפתוחת זווית הניקוז נפגע בהדרגה והמחלה שקטה; בסגורת זווית יש חסימה פתאומית עם כאב עז","שתיהן מתפתחות באופן חריף וכואב","בפתוחת זווית יש חסימה פתאומית של הניקוז; בסגורת זווית הניקוז איטי","אין הבדל במנגנון"],"a":0,"e":"ההבדל הוא במנגנון הפגיעה בניקוז ה-Aqueous humor: בגלאוקומה פתוחת זווית הניקוז נפגע בהדרגה והמחלה שקטה - ולכן כ-50% מהחולים אינם מאובחנים ומאבדים שדה ראייה היקפי בלי לחוש. בסגורת זווית יש חסימה פתאומית עם כאב עז, ראיית הילות, בחילות והקאות - מצב חירום. הלחץ הגבוה לוחץ על כלי הדם בראש עצב הראייה. המחלה נוטה להיות משפחתית, ולכן מומלץ סקר לקרובי משפחה מדרגה ראשונה."},{"t":"עיניים","q":"מהו הממצא האופייני בבדיקת קרקעית העין בחסימת עורק הרשתית המרכזי?","o":["גודש ורידי בלבד","דימומים מפושטים בזגוגית בלבד","עדשה עכורה","רשתית חיוורת עם כתם אדום-דובדבן"],"a":3,"e":"בחסימת עורק הרשתית המרכזי נצפית רשתית חיוורת (איסכמית) עם כתם אדום-דובדבן במקולה, שבה הכורואיד נראה דרך הרשתית הדקה. זהו מצב חירום עיני עם אובדן ראייה פתאומי וללא כאב. חסימות ורידיות (כמו BRVO) מתבטאות בדימומים ובבצקת. גורמי סיכון נלווים: סוכרת, גלאוקומה וגיל מתקדם."},{"t":"עיניים","q":"מה נכון לגבי טיפול בגוף זר בעין?","o":["יש להסירו מיד בכוח באמצעות מלקחיים","יש לקבוע את הרכבו, גודלו ומיקומו ואת המבנים המעורבים לפני כל התערבות","יש לשטוף בכל מקרה במים מהברז בלחץ גבוה","אין צורך בטיפול אנטיביוטי כלל"],"a":1,"e":"בגוף זר בעין יש לקבוע תחילה את הרכבו, גודלו ומיקומו ואילו מבנים עיניים מעורבים, שכן חלק מהגופים הזרים מחייבים הסרה ניתוחית. כל תרופה עינית מקומית - כולל חומרי הרדמה וטיפות - חייבת להיות סטרילית. בפגיעות חודרות נלקחות תרביות וניתן טיפול אנטיביוטי מניעתי, תחילה IV ובהמשך פומי; רוב הפגיעות החודרות גורמות לאובדן ראייה משמעותי."},{"t":"שד","q":"באיזה רביע של השד מופיעים רוב גידולי השד?","o":["רביע חיצוני עליון","רביע פנימי תחתון","רביע פנימי עליון","מרכז השד בלבד"],"a":0,"e":"רוב גידולי השד מופיעים ברביע החיצוני העליון, שבו נמצאת רוב רקמת השד והניקוז הלימפטי לבית השחי. הניקוז הלימפטי העיקרי הוא לבלוטות האקסילריות - ומכאן חשיבות בדיקתן ב-Staging. השד בנוי מאונות ומאונתיות המנקזות דרך צינוריות אל הפטמה."},{"t":"שד","q":"על איזה כרומוזום ממוקמים הגנים BRCA1 ו-BRCA2, ומה שיעור מקרי סרטן השד המיוחסים למוטציות גנטיות?","o":["כרומוזום 17; כ-5-10% מהמקרים","כרומוזום 21; כ-50% מהמקרים","כרומוזום 7; כ-30% מהמקרים","כרומוזום X; כ-80% מהמקרים"],"a":0,"e":"מוטציות ב-BRCA1 ו-BRCA2 (כרומוזום 17) אחראיות לכ-5-10% ממקרי סרטן השד. נשאות מעלה סיכון משמעותי, ולעיתים נשקלים כריתת שד מניעתית דו-צדדית או טיפול תרופתי מניעתי (Chemoprevention). חשוב לזכור שגם נשים עם היסטוריה משפחתית ללא נשאות גנטית נמצאות בסיכון מוגבר, ושכ-1% מחולי סרטן השד הם גברים."},{"t":"שד","q":"מטופלת מניקה מגיעה עם אודם, כאב וחום מקומי בשד וחום גוף. מה נכון?","o":["מדובר תמיד בסרטן שד דלקתי","אין צורך בבירור - התופעה חולפת מעצמה","יש להפסיק לחלוטין את ההנקה לצמיתות","חשד לדלקת בשד (מסטיטיס), שעלולה להתפתח לאבצס; נדרש ייעוץ אחות מתאמת הנקה וטיפול"],"a":3,"e":"בתקופת ההנקה, אודם, כאב וחום מקומי בשד עם חום גוף מחשידים למסטיטיס, שעלולה להתפתח לקולקציה ולאבצס המחייב ניקוז. הטיפול כולל אנטיביוטיקה, המשך ריקון השד וייעוץ אחות מתאמת הנקה. עם זאת, בכל מקרה של אודם בשד יש לשקול גם סרטן שד דלקתי (IBC) באבחנה המבדלת - במיוחד כשאין תגובה לטיפול."}];

function render(){
  quiz.innerHTML = '';
  const f = document.getElementById('filter').value;
  DATA.forEach((item, i) => {
    if (f && item.t !== f) return;
    const card = document.createElement('div');
    card.className = 'q';

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = '<span class="num">שאלה ' + (i+1) + '</span><span class="chip">' + item.t + '</span>';
    card.appendChild(head);
    const qt = document.createElement('p');
    qt.className = 'qtext';
    qt.textContent = item.q;
    card.appendChild(qt);
    const ul = document.createElement('ul');
    ul.className = 'opts';
    item.o.forEach((txt, j) => {
      const li = document.createElement('li');
      li.className = 'opt';
      li.dataset.j = j;
      li.innerHTML = '<span class="k">' + KEYS[j] + '.</span><span></span>';
      li.lastChild.textContent = txt;
      li.addEventListener('click', () => choose(i, j));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const v = document.createElement('div'); v.className = 'verdict'; card.appendChild(v);
    const ex = document.createElement('div');
    ex.className = 'exp';
    ex.innerHTML = '<b>הסבר</b>';
    const p = document.createElement('span'); p.textContent = item.e; ex.appendChild(p);
    card.appendChild(ex);
    quiz.appendChild(card);
    if (state[i] !== undefined) paint(card, i);
  });
  stats();
}

function choose(i, j){
  if (state[i] !== undefined) return;      // one attempt per question
  state[i] = j;
  const card = quiz.querySelector('.q[data-i="'+i+'"]');
  paint(card, i);
  stats();
}

function paint(card, i){
  const item = DATA[i], pick = state[i];
  card.querySelectorAll('.opt').forEach(li => {
    const j = +li.dataset.j;
    li.classList.add('lock');
    if (j === item.a) li.classList.add('right');
    else if (j === pick) li.classList.add('wrong');
  });
  const v = card.querySelector('.verdict');
  const ok = pick === item.a;
  v.className = 'verdict show ' + (ok ? 'y' : 'n');
  v.textContent = ok ? '✓ תשובה נכונה' : '✗ תשובה שגויה — הנכונה: ' + KEYS[item.a];
  card.querySelector('.exp').classList.add('show');
}

function stats(){
  const done = Object.keys(state).length;
  let ok = 0;
  for (const k in state) if (state[k] === DATA[k].a) ok++;
  const bad = done - ok;
  document.getElementById('rPos').textContent = done + '/' + DATA.length;
  document.getElementById('rOk').textContent = ok;
  document.getElementById('rBad').textContent = bad;
  document.getElementById('rPct').textContent = done ? Math.round(ok/done*100) : '—';
  document.getElementById('rBar').style.width = (done/DATA.length*100) + '%';
}

function summary(){
  const box = document.getElementById('sumbox');
  const by = {};
  DATA.forEach((item, i) => {
    const b = by[item.t] || (by[item.t] = {n:0, done:0, ok:0});
    b.n++;
    if (state[i] !== undefined){ b.done++; if (state[i] === item.a) b.ok++; }
  });
  const done = Object.keys(state).length;
  let ok = 0; for (const k in state) if (state[k] === DATA[k].a) ok++;
  const pct = DATA.length ? Math.round(ok/DATA.length*100) : 0;
  const cls = pct >= 80 ? 'g' : (pct >= 60 ? 'a' : 'r');
  let h = '<h2>סיכום ביצועים</h2>';
  h += '<div class="score"><span class="pill '+cls+'">' + pct + '</span></div>';
  h += '<p style="color:var(--dim);font-size:.88rem;margin:10px 0 16px">' +
       ok + ' תשובות נכונות מתוך ' + DATA.length + ' · נענו ' + done +
       ' · ציון עובר בקורס: 60</p>';
  h += '<table><tr><th>נושא</th><th>נענו</th><th>נכונות</th><th>אחוז</th></tr>';
  Object.keys(by).forEach(t => {
    const b = by[t];
    const p = b.done ? Math.round(b.ok/b.done*100) : null;
    const c = p === null ? '' : (p >= 80 ? 'g' : (p >= 60 ? 'a' : 'r'));
    h += '<tr><td>' + t + '</td><td class="n">' + b.done + '/' + b.n + '</td>' +
         '<td class="n">' + b.ok + '</td><td class="n">' +
         (p === null ? '<span style="color:var(--dim)">—</span>'
                     : '<span class="pill ' + c + '">' + p + '%</span>') + '</td></tr>';
  });
  h += '</table>';
  box.innerHTML = h;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btnSum').addEventListener('click', summary);
document.getElementById('btnReset').addEventListener('click', () => {
  for (const k in state) delete state[k];
  document.getElementById('sumbox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('btnReveal').addEventListener('click', () => {
  quiz.querySelectorAll('.q').forEach(card => {
    const i = +card.dataset.i;
    if (state[i] === undefined){
      card.querySelectorAll('.opt').forEach(li => {
        li.classList.add('lock');
        if (+li.dataset.j === DATA[i].a) li.classList.add('right');
      });
      card.querySelector('.exp').classList.add('show');
    }
  });
});
document.getElementById('filter').addEventListener('change', render);

(function init(){
  const sel = document.getElementById('filter');
  const counts = {};
  DATA.forEach(d => counts[d.t] = (counts[d.t] || 0) + 1);
  Object.keys(counts).forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t + ' (' + counts[t] + ')';
    sel.appendChild(o);
  });
  render();
})();
</script>
</body>
</html>
